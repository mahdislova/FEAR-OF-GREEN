ber. She put her hand on it and every lamp on Tyburn Road leaned toward her.\" Eldgard's hand comes to rest on Nixon's shoulder, exactly where every painted father's hand rests in the long gallery. Down the corridor Nathaniel, holding his first real job, sees it. Eldgard goes very quiet. \"Then she'll come back to it.\" He owes, and now he's owned. Therefore the real son is arming the hunt, the spare is leading it, and neither of them knows the girl Alice is hiding is its target.","loc":"Harding Works","when":"Eldgard gives Nathaniel his first real job: re-equip the Guard with leap-rigs and flash-gauntlets, and refit its lantern rifles, for the Frost Killer hunt.","th":"guard","also":["white","harding"],"ch":["eldgard","nixon","nathaniel"],"turn":"","w":192,"ed":"Revised Nov 15: the replacement son","fl":[],"html":"\u003cp>Eldgard gives Nathaniel his first real job: re-equip the Guard with leap-rigs and flash-gauntlets, and refit its lantern rifles, for the Frost Killer hunt. Nathaniel glows. Nixon is at the door for his own orders, and in the corridor, where his son can't hear, Eldgard gives them quietly: find the frost girl and bring her to the Works alive. Tell no one, not the Yard and not my son. Nixon: &quot;Yes, sir.&quot; Then, because it's the only thing he has to give: &quot;I've seen her, sir. At our own gate, five nights ago. I've seen frost like hers before, in the Essex reeds in October. She put her hand on it and every lamp on Tyburn Road leaned toward her.&quot; Eldgard's hand comes to rest on Nixon's shoulder, exactly where every painted father's hand rests in the long gallery. Down the corridor Nathaniel, holding his first real job, sees it. Eldgard goes very quiet. &quot;Then she'll come back to it.&quot; He owes, and now he's owned. \u003cem>Therefore\u003c/em> the real son is arming the hunt, the spare is leading it, and neither of them knows the girl Alice is hiding is its target.\u003c/p>"},{"oref":"Scene 3","id":45,"seq":3,"title":"Gin Lane, a pigeon loft","added":false,"act":"Act One","kind":"scene","sum":"Alice finds the Lost One on a rooftop having a serious conversation with pigeons. They write house rules in chalk: mittens on, no touching, cocoa allowed. Then the Lost One holds out an orange, peeled badly, in one long ruined spiral. \"It was your birthday. On the bridge day. I forgot.\" A piece of Miriam's regret, surfacing in a creature who doesn't know why her hands wanted to do this. Alice stares at it. \"You've never once remembered.\" \"I know.\" Alice eats the whole thing, pith and all. The Lost One: \"The light is crying. Can't you hear it?\" Alice can't.","loc":"Gin Lane","when":"Alice finds the Lost One on a rooftop having a serious conversation with pigeons.","th":"sisters","also":["white"],"ch":["alice","lostone"],"turn":"","w":101,"ed":"","fl":[],"html":"\u003cp>Alice finds the Lost One on a rooftop having a serious conversation with pigeons. They write house rules in chalk: mittens on, no touching, cocoa allowed. Then the Lost One holds out an orange, peeled badly, in one long ruined spiral. &quot;It was your birthday. On the bridge day. I forgot.&quot; A piece of Miriam's regret, surfacing in a creature who doesn't know why her hands wanted to do this. Alice stares at it. &quot;You've never once remembered.&quot; &quot;I know.&quot; Alice eats the whole thing, pith and all. The Lost One: &quot;The light is crying. Can't you hear it?&quot; Alice can't.\u003c/p>"},{"oref":"Scene 4","id":47,"seq":4,"title":"Lambrick House, night","added":false,"act":"Act One","kind":"scene","sum":"Tamara opens her father's cipher safe in ninety seconds, holding a candle in her teeth. She copies the whole ledger page, not just the line: six months of payments to A.F., ending on the night Jamie died. On the stairs, AJAX FINK is eating an apple in the dark. \"Evening, miss.\" He lets her pass.","loc":"Lambrick House","when":"Tamara opens her father's cipher safe in ninety seconds, holding a candle in her teeth.","th":"lambrick","also":[],"ch":["tamara","ajax"],"turn":"","w":55,"ed":"","fl":[],"html":"\u003cp>Tamara opens her father's cipher safe in ninety seconds, holding a candle in her teeth. She copies the whole ledger page, not just the line: six months of payments to A.F., ending on the night Jamie died. On the stairs, AJAX FINK is eating an apple in the dark. &quot;Evening, miss.&quot; He lets her pass.\u003c/p>"},{"oref":"Scene 5","id":48,"seq":5,"title":"Guard tower roof","added":false,"act":"Act One","kind":"scene","sum":"Whimsy. Nixon trains Wicks on Nathaniel's new boosters. Cole fires his too early, sails off the roof into the laundry lines across the alley and dangles in someone's bloomers. Nixon laughs for the first time since the core, then remembers, and stops.","loc":"Guard tower roof","when":"Whimsy.","th":"guard","also":[],"ch":["nixon","cole"],"turn":"","w":42,"ed":"","fl":[],"html":"\u003cp>Whimsy. Nixon trains Wicks on Nathaniel's new boosters. Cole fires his too early, sails off the roof into the laundry lines across the alley and dangles in someone's bloomers. Nixon laughs for the first time since the core, then remembers, and stops.\u003c/p>"},{"oref":"Scene 6","id":49,"seq":6,"title":"Vykra laundry","added":false,"act":"Act Two","kind":"scene","sum":"Grise asks for Alice's report on the Harding son. Alice says he knows nothing. Grise: \"Three days. Bring me something real, or the frost girl on Gin Lane becomes my business.\" Therefore Alice has to use Nathaniel.","loc":"Vykra laundry","when":"Grise asks for Alice's report on the Harding son.","th":"vykra","also":["sisters"],"ch":["grise","alice"],"turn":"","w":37,"ed":"","fl":[],"html":"\u003cp>Grise asks for Alice's report on the Harding son. Alice says he knows nothing. Grise: &quot;Three days. Bring me something real, or the frost girl on Gin Lane becomes my business.&quot; \u003cem>Therefore\u003c/em> Alice has to use Nathaniel.\u003c/p>"},{"oref":"Scene 7","id":50,"seq":7,"title":"Harding Works, the shop","added":false,"act":"Act Two","kind":"scene","sum":"Alice visits Nathaniel \"to return the handkerchief\" and lets him show off the boosters, which he does with puppyish joy: one jump across the foundry, kshhh-THOOM, and into the coal bin again, for an audience of one. Nobody has ever wanted so badly to be watched by her. She reads the sweep roster upside down while he's brushing off soot: Gin Lane, tonight. She feels sick at how easy it was, and sicker at how much she liked watching. She leaves without returning the handkerchief.","loc":"Harding Works","when":"Alice visits Nathaniel \"to return the handkerchief\" and lets him show off the boosters, which he does with puppyish joy: one jump across the foundry, kshhh-THOOM, and into the coal bin again, for an audience of one.","th":"investigation","also":["sisters"],"ch":["alice","nathaniel"],"turn":"","w":85,"ed":"","fl":[],"html":"\u003cp>Alice visits Nathaniel &quot;to return the handkerchief&quot; and lets him show off the boosters, which he does with puppyish joy: one jump across the foundry, \u003cem>kshhh-THOOM\u003c/em>, and into the coal bin again, for an audience of one. Nobody has ever wanted so badly to be watched by her. She reads the sweep roster upside down while he's brushing off soot: Gin Lane, tonight. She feels sick at how easy it was, and sicker at how much she liked watching. She leaves without returning the handkerchief.\u003c/p>"},{"oref":"Scene 8","id":51,"seq":8,"title":"Scotland Yard","added":false,"act":"Act Two","kind":"scene","sum":"Felix, frostbitten hand in a sling, corners Nixon. The frost girl is Miriam Bounds, who was dead. Nixon thinks he's mad, until Felix adds that the Harding boy didn't die in a fall: \"There was a bullet hole in his coat, Captain. Somebody burned the coat.\" He slides a Newgate visitor's slip across the desk: Jamie Harding, every Sunday for two years, prisoner 1417. \"Someone ought to ask why.\" Both of Nixon's secrets are walking toward each other.","loc":"Scotland Yard","when":"Felix, frostbitten hand in a sling, corners Nixon.","th":"investigation","also":["guard"],"ch":["felix","nixon"],"turn":"","w":78,"ed":"","fl":[],"html":"\u003cp>Felix, frostbitten hand in a sling, corners Nixon. The frost girl is Miriam Bounds, who was dead. Nixon thinks he's mad, until Felix adds that the Harding boy didn't die in a fall: &quot;There was a bullet hole in his coat, Captain. Somebody burned the coat.&quot; He slides a Newgate visitor's slip across the desk: Jamie Harding, every Sunday for two years, prisoner 1417. &quot;Someone ought to ask why.&quot; Both of Nixon's secrets are walking toward each other.\u003c/p>"},{"oref":"Scene 9","id":52,"seq":9,"title":"The Serpentine, frozen pond","added":false,"act":"Act Two","kind":"scene","sum":"Tamara takes Nathaniel skating, a promised couple doing what's expected. Whimsy: he's terrible at it. She slips him the ledger copy. A.F. is Ajax Fink, paid on the night Jamie died. Therefore Nathaniel now has a suspect, and it's the wrong one.","loc":"The Serpentine","when":"Tamara takes Nathaniel skating, a promised couple doing what's expected.","th":"lambrick","also":["investigation"],"ch":["tamara","nathaniel"],"turn":"","w":42,"ed":"Revised Nov 14: the Exhibition","fl":[],"html":"\u003cp>Tamara takes Nathaniel skating, a promised couple doing what's expected. Whimsy: he's terrible at it. She slips him the ledger copy. \u003cem>A.F.\u003c/em> is Ajax Fink, paid on the night Jamie died. \u003cem>Therefore\u003c/em> Nathaniel now has a suspect, and it's the wrong one.\u003c/p>"},{"oref":"Scene 10","id":53,"seq":10,"title":"Christmas crystal market, dusk","added":false,"act":"Act Two","kind":"scene","sum":"Alice moves the Lost One out of Gin Lane through the market crowds. The Lost One sees a hundred crystal lanterns and, enchanted, reaches out. Every crystal in the market flares at once. A Lantern lookout sees it.","loc":"Christmas crystal market","when":"Alice moves the Lost One out of Gin Lane through the market crowds.","th":"white","also":["sisters"],"ch":["alice","lostone"],"turn":"","w":38,"ed":"","fl":[],"html":"\u003cp>Alice moves the Lost One out of Gin Lane through the market crowds. The Lost One sees a hundred crystal lanterns and, enchanted, reaches out. Every crystal in the market flares at once. A Lantern lookout sees it.\u003c/p>"},{"oref":"Scene 11","id":54,"seq":11,"title":"The crystal market, set piece","added":false,"act":"Act Three","kind":"scene","sum":"Nixon's leapers launch, kshhh-THOOM, kshhh-THOOM, over the stalls. Flash-bursts strobe the crowd. Alice runs the roofs on her ghostlight, and it coughs and sputters. Below, trapped and terrified, the Lost One screams. Every crystal in the market shatters, glass rains on the crowd, and a chestnut-seller freezes mid-shout. Four dead. At first light Felix walks through the glass and counts them, one by one.","loc":"The crystal market","when":"Nixon's leapers launch, kshhh-THOOM, kshhh-THOOM, over the stalls.","th":"guard","also":["white","city"],"ch":["nixon","alice","lostone"],"turn":"","w":64,"ed":"","fl":[],"html":"\u003cp>Nixon's leapers launch, \u003cem>kshhh-THOOM, kshhh-THOOM\u003c/em>, over the stalls. Flash-bursts strobe the crowd. Alice runs the roofs on her ghostlight, and it coughs and sputters. Below, trapped and terrified, the Lost One screams. Every crystal in the market shatters, glass rains on the crowd, and a chestnut-seller freezes mid-shout. Four dead. At first light Felix walks through the glass and counts them, one by one.\u003c/p>"},{"oref":"Scene 12","id":56,"seq":12,"title":"Bell tower, set piece","added":false,"act":"Act Three","kind":"scene","sum":"Cole corners her alone. She reaches for him, please, and he freezes from the hand up. Nixon lands and fires a flash; she drops, stunned. Cole is turning blue. Nixon can take the girl to Eldgard, or carry Cole to the furnace room before his heart stops. He takes Cole. Alice drags the Lost One away.","loc":"Bell tower","when":"Cole corners her alone.","th":"guard","also":["white"],"ch":["cole","lostone","nixon","alice"],"turn":"","w":56,"ed":"","fl":[],"html":"\u003cp>Cole corners her alone. She reaches for him, \u003cem>please\u003c/em>, and he freezes from the hand up. Nixon lands and fires a flash; she drops, stunned. Cole is turning blue. Nixon can take the girl to Eldgard, or carry Cole to the furnace room before his heart stops. He takes Cole. Alice drags the Lost One away.\u003c/p>"},{"oref":"Scene 13","id":57,"seq":13,"title":"Harding House, morning","added":false,"act":"Act Three","kind":"scene","sum":"The papers scream FOUR DEAD AT CRYSTAL MARKET. The servants say the Frost Killer was helped by a dark-haired girl with a ghostlight rig. Nathaniel remembers a girl counting under her breath in his brother's wardrobe, and his schematic gone from his coat. Byron, pouring tea: \"You're your mother's son, sir. You notice.\"","loc":"Harding House","when":"The papers scream FOUR DEAD AT CRYSTAL MARKET.","th":"investigation","also":["city","harding"],"ch":["felix","nathaniel","byron"],"turn":"","w":53,"ed":"Revised Nov 14: the new pilot","fl":[],"html":"\u003cp>The papers scream FOUR DEAD AT CRYSTAL MARKET. The servants say the Frost Killer was helped by a dark-haired girl with a ghostlight rig. Nathaniel remembers a girl counting under her breath in his brother's wardrobe, and his schematic gone from his coat. Byron, pouring tea: &quot;You're your mother's son, sir. You notice.&quot;\u003c/p>"},{"oref":"Scene 14","id":59,"seq":14,"title":"Under the Works, an old lamp-tunnel","added":false,"act":"Act Three","kind":"scene","sum":"Alice hides the Lost One where nobody would look: right under the Hardings. Four people are dead in the market. Alice, holding her with gloves on, says the thing you say: \"You didn't mean it.\" It's the wrong sentence. It's what Miriam used to whisper under the bed about him, and it unlocks something in the body. Something runs down the Lost One's face and freezes. Tink. A bead of ice on the stone. Another. She catches one and stares at it. \"What is this?\" Alice, very quietly: \"You're crying, Mim. You always cried. Under the bed, you cried for both of us.\" And the Lost One is suddenly full of a memory she has never lived: a buckle, a small girl's back, her own body not moving. \"Ali. The belt. I should have—\" Alice goes hard as iron. \"We don't talk about him. That's behind the fence.\" The Lost One doesn't know what the fence is. She knows she has just been shut out of something that hurts, and that she wants in, to make it stop hurting. She remembers a woman in chains crying, too, and says nothing about that one. Alice holds her until the ice stops.","loc":"Under the Works","when":"Alice hides the Lost One where nobody would look: right under the Hardings.","th":"sisters","also":["white"],"ch":["alice","lostone"],"turn":"","w":200,"ed":"","fl":[],"html":"\u003cp>Alice hides the Lost One where nobody would look: right under the Hardings. Four people are dead in the market. Alice, holding her with gloves on, says the thing you say: &quot;You didn't mean it.&quot; It's the wrong sentence. It's what Miriam used to whisper under the bed about \u003cem>him\u003c/em>, and it unlocks something in the body. Something runs down the Lost One's face and freezes. \u003cem>Tink.\u003c/em> A bead of ice on the stone. Another. She catches one and stares at it. &quot;What is this?&quot; Alice, very quietly: &quot;You're crying, Mim. You always cried. Under the bed, you cried for both of us.&quot; And the Lost One is suddenly full of a memory she has never lived: a buckle, a small girl's back, her own body not moving. &quot;Ali. The belt. I should have—&quot; Alice goes hard as iron. &quot;We don't talk about him. That's behind the fence.&quot; The Lost One doesn't know what the fence is. She knows she has just been shut out of something that hurts, and that she wants in, to make it stop hurting. She remembers a woman in chains crying, too, and says nothing about that one. Alice holds her until the ice stops.\u003c/p>"},{"oref":"Scene 15","id":60,"seq":15,"title":"Guy's Hospital","added":false,"act":"Act Three","kind":"scene","sum":"Cole lives but loses two fingers. \"Did I do good, sir?\" \"You did good.\" Eldgard is in the doorway. In the corridor: \"You had her and you let her go.\" Then, softly: \"I know what your Wick did at the core, Captain. So do you. Keep it that way.\" His hand settles on Nixon's sleeve, and for one cut Nixon is thirteen again: a line of boys at the Southwark charity school, Eldgard pricking each finger and touching the blood to a sliver of gallowglass. Most slivers stay dark. Nixon's glows faintly green. A pat on the head: \"Still good.\" It played as kindness then, and it is something else (paid off in Episodes 8 and 9).","loc":"Guy's Hospital","when":"Cole lives but loses two fingers.","th":"guard","also":["harding"],"ch":["cole","nixon","eldgard"],"turn":"","w":117,"ed":"Revised Nov 15: Nixon","fl":[],"html":"\u003cp>Cole lives but loses two fingers. &quot;Did I do good, sir?&quot; &quot;You did good.&quot; Eldgard is in the doorway. In the corridor: &quot;You had her and you let her go.&quot; Then, softly: &quot;I know what your Wick did at the core, Captain. So do you. Keep it that way.&quot; His hand settles on Nixon's sleeve, and for one cut Nixon is thirteen again: a line of boys at the Southwark charity school, Eldgard pricking each finger and touching the blood to a sliver of gallowglass. Most slivers stay dark. Nixon's glows faintly green. A pat on the head: &quot;Still good.&quot; It played as kindness then, and it is something else (paid off in Episodes 8 and 9).\u003c/p>"},{"oref":"Scene 16","id":61,"seq":16,"title":"The tunnel mouth","added":false,"act":"Act Three","kind":"scene","sum":"Nathaniel is waiting. He found it the way an engineer would: her ghostlight runs on his design and whines at his pitch, and he spent the night walking the lamp-tunnels under his own family's Works with a listening horn until he heard it. It's built from the schematic that left his coat in his brother's wardrobe. Alice tells him the truth as she believes it: her sister nearly froze to death and came back wrong, and she's hiding her until she gets better. The Lost One steps out and, before Alice can stop her, takes Nathaniel's bare hand. Nothing happens. No frost. All three of them stare. He could take the Frost Killer to his father tonight: four dead in the market, his father's hunt, the first real job he has ever been given, and the one thing that would finally make him the useful son. He looks at the girl holding his hand, and at Alice. He doesn't. It's the first time in his life he acts against his own lie, and it's a crime.","loc":"The tunnel mouth","when":"Nathaniel is waiting.","th":"white","also":["sisters"],"ch":["nathaniel","alice","lostone"],"turn":"","w":176,"ed":"Revised Nov 14: the new pilot","fl":[],"html":"\u003cp>Nathaniel is waiting. He found it the way an engineer would: her ghostlight runs on his design and whines at his pitch, and he spent the night walking the lamp-tunnels under his own family's Works with a listening horn until he heard it. It's built from the schematic that left his coat in his brother's wardrobe. Alice tells him the truth as she believes it: her sister nearly froze to death and came back wrong, and she's hiding her until she gets better. The Lost One steps out and, before Alice can stop her, takes Nathaniel's bare hand. Nothing happens. No frost. All three of them stare. He could take the Frost Killer to his father tonight: four dead in the market, his father's hunt, the first real job he has ever been given, and the one thing that would finally make him the useful son. He looks at the girl holding his hand, and at Alice. He doesn't. It's the first time in his life he acts against his own lie, and it's a crime.\u003c/p>"},{"oref":"Scene 17","id":62,"seq":17,"title":"Tamara's bedroom","added":false,"act":"Act Three","kind":"scene","sum":"Ajax is sitting on her bed. \"Your father sends his love. Stay out of his safe.\" He leaves the apple core on her pillow.","loc":"Tamara's bedroom","when":"Ajax is sitting on her bed.","th":"lambrick","also":[],"ch":["tamara","ajax"],"turn":"","w":24,"ed":"","fl":[],"html":"\u003cp>Ajax is sitting on her bed. &quot;Your father sends his love. Stay out of his safe.&quot; He leaves the apple core on her pillow.\u003c/p>"},{"oref":"Scene 18","id":63,"seq":18,"title":"The tunnel mouth","added":false,"act":"Tag","kind":"scene","sum":"Nathaniel turns to go. The Lost One, sniffing the air like an animal: \"You smell like the man who keeps my mother.\" Cut to black.","loc":"The tunnel mouth","when":"Nathaniel turns to go.","th":"white","also":["harding"],"ch":["nathaniel","lostone"],"turn":"","w":25,"ed":"","fl":[],"html":"\u003cp>Nathaniel turns to go. The Lost One, sniffing the air like an animal: &quot;You smell like the man who keeps my mother.&quot; Cut to black.\u003c/p>"}]},{"n":4,"title":"The Hearing","time":"38 DAYS TO FIRST SNOW","clock":"38 DAYS TO FIRST SNOW","act":"I","log":"Nathaniel and Alice hang Lambrick's enforcer over the Thames for Jamie's murder and learn Jamie paid him. Then Felix Hawke dies on the witness stand with frost on his lips, and all of London blames the girl hiding in the Harding glasshouse. Nixon, alone, finds the madman in Newgate whom Jamie visited every Sunday, and leaves with a nursery rhyme.","sum":"Josephine washes frost off her fingers","turn":"Ajax: \"Your brother paid me.\" Felix dies, and the Lost One is framed. Nixon meets Marsh","focus":"the Crown's hearing on the Harding Charter, and who killed Jamie.","piece":"the coal-docks fight with Ajax; a murder on the witness stand.","threads":["lambrick","sisters","harding","guard","investigation","vykra","city"],"frame":"\u003cp>\u003cstrong>38 DAYS TO FIRST SNOW.\u003c/strong> \u003cstrong>Focus:\u003c/strong> the Crown's hearing on the Harding Charter, and who killed Jamie. \u003cstrong>Set pieces:\u003c/strong> the coal-docks fight with Ajax; a murder on the witness stand. \u003cstrong>Double twist:\u003c/strong> the man Nathaniel hunts was hired by his own brother, and the &quot;Frost Killer&quot; who kills Felix in public is Nathaniel's mother.\u003c/p>","scenes":[{"oref":"Scene 1","id":64,"seq":1,"title":"The Works gate, 2 November, before the Exhibition","added":false,"act":"Cold open","kind":"scene","sum":"2 November, after the Narrows raid and before the Exhibition. Ajax, cheek newly bandaged, meets Jamie at the Works gate. Lambrick has paid two hundred guineas for a stolen service key to the Blackwood return generator, an opening for future sabotage. Ajax keeps that key and sells Jamie a copy for four hundred. Official copies are signed out against a family name; Jamie cannot request one without leaving a trail for Eldgard. The price buys an unrecorded cabinet key and silence, not Ajax performing tonight's blackout. AJAX: His Lordship paid two hundred. JAMIE: Then keep his. I need a copy. AJAX: What's a Harding need his own bridge for? JAMIE: To leave it. AJAX: I could turn it for you. JAMIE: No. Ajax notices how quickly the answer comes. AJAX: You have somebody. JAMIE: You have your money. He leaves with the copy he will give Miriam in Episode 1. Lambrick's two hundred remains in his ledger; Jamie's private four hundred explains Ajax's accusation at the docks. The pilot shutdown is still Miriam's action. Ajax does not know about the chain, the lovers' rendezvous or the Xylon attack.","loc":"The Works gate","when":"2 November, after the Narrows raid and before the Exhibition.","th":"lambrick","also":["investigation"],"ch":["jamie","ajax"],"turn":"He leaves with the copy he will give Miriam in Episode 1. Lambrick's two hundred remains in his ledger; Jamie's private four hundred explains Ajax's accusation at the docks. The pilot shutdown is still Miriam's action. A","w":188,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>\u003cstrong>2 November, after the Narrows raid and before the Exhibition.\u003c/strong> Ajax, cheek newly bandaged, meets Jamie at the Works gate. Lambrick has paid two hundred guineas for a stolen service key to the Blackwood return generator, an opening for future sabotage. Ajax keeps that key and sells Jamie a copy for four hundred. Official copies are signed out against a family name; Jamie cannot request one without leaving a trail for Eldgard. The price buys an unrecorded cabinet key and silence, not Ajax performing tonight's blackout.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>AJAX:\u003c/strong> His Lordship paid two hundred.\n\u003cstrong>JAMIE:\u003c/strong> Then keep his. I need a copy.\n\u003cstrong>AJAX:\u003c/strong> What's a Harding need his own bridge for?\n\u003cstrong>JAMIE:\u003c/strong> To leave it.\n\u003cstrong>AJAX:\u003c/strong> I could turn it for you.\n\u003cstrong>JAMIE:\u003c/strong> No.\u003c/p>\u003c/blockquote>\n\u003cp>Ajax notices how quickly the answer comes.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>AJAX:\u003c/strong> You have somebody.\n\u003cstrong>JAMIE:\u003c/strong> You have your money.\u003c/p>\u003c/blockquote>\n\u003cp>He leaves with the copy he will give Miriam in Episode 1. Lambrick's two hundred remains in his ledger; Jamie's private four hundred explains Ajax's accusation at the docks. The pilot shutdown is still Miriam's action. Ajax does not know about the chain, the lovers' rendezvous or the Xylon attack.\u003c/p>"},{"oref":"Scene 2","id":65,"seq":2,"title":"Harding glasshouse","added":false,"act":"Act One","kind":"scene","sum":"Nathaniel moves Alice and the Lost One into the abandoned orangery on the estate, the last place his father would look. Whimsy: frozen butterflies on the panes, an orange tree. The Lost One makes snow for the first time, a little flurry over her palm, and laughs like a child. Alice and Nathaniel watch her and have their first real conversation, about everything except the thing between them. Alice gives him her theory, the one she's built to live inside: \"Something came back in her from the cold. It's got its own wants. But Mim's under it. Wren says the memories come back.\" Nathaniel has seen the girl touch his hand without freezing it. He looks at Alice with something like pity and doesn't argue. Later, the Lost One tries again, very carefully: \"Ali. Under the bed—\" Alice hands her an orange. \"Eat that.\" Behind the fence.","loc":"Harding glasshouse","when":"Nathaniel moves Alice and the Lost One into the abandoned orangery on the estate, the last place his father would look.","th":"sisters","also":["harding"],"ch":["nathaniel","alice","lostone"],"turn":"","w":147,"ed":"","fl":[],"html":"\u003cp>Nathaniel moves Alice and the Lost One into the abandoned orangery on the estate, the last place his father would look. Whimsy: frozen butterflies on the panes, an orange tree. The Lost One makes snow for the first time, a little flurry over her palm, and laughs like a child. Alice and Nathaniel watch her and have their first real conversation, about everything except the thing between them. Alice gives him her theory, the one she's built to live inside: &quot;Something came back in her from the cold. It's got its own wants. But Mim's under it. Wren says the memories come back.&quot; Nathaniel has seen the girl touch his hand without freezing it. He looks at Alice with something like pity and doesn't argue. Later, the Lost One tries again, very carefully: &quot;Ali. Under the bed—&quot; Alice hands her an orange. &quot;Eat that.&quot; Behind the fence.\u003c/p>"},{"oref":"Scene 3","id":66,"seq":3,"title":"Harding House, breakfast","added":false,"act":"Act One","kind":"scene","sum":"Eldgard: the Crown's Charter hearing is in three days, and Nathaniel will sit beside him as heir. Josephine: the Lambrick wedding moves up. Nathaniel: \"No.\" His first open defiance. Josephine reads the hearing's witness list and stops at one name: Insp. F. Hawke, on the death of James Harding. A bullet hole in front of the Crown means a Crown inquiry, and a Crown inquiry goes down the core stair and finds the Tithe waiting for her last son.","loc":"Harding House","when":"Eldgard: the Crown's Charter hearing is in three days, and Nathaniel will sit beside him as heir.","th":"harding","also":["lambrick"],"ch":["eldgard","josephine","nathaniel"],"turn":"","w":79,"ed":"Revised in the Oct 10 pass","fl":[],"html":"\u003cp>Eldgard: the Crown's Charter hearing is in three days, and Nathaniel will sit beside him as heir. Josephine: the Lambrick wedding moves up. Nathaniel: &quot;No.&quot; His first open defiance. Josephine reads the hearing's witness list and stops at one name: \u003cem>Insp. F. Hawke, on the death of James Harding.\u003c/em> A bullet hole in front of the Crown means a Crown inquiry, and a Crown inquiry goes down the core stair and finds the Tithe waiting for her last son.\u003c/p>"},{"oref":"Scene 4","id":67,"seq":4,"title":"Guard tower, the armoury","added":false,"act":"Act One","kind":"scene","sum":"A Crown order arrives from Vane after the market deaths: the Frost Killer is to be shot on sight. Cole is back, bandaged, two fingers short, desperate to be useful, and Nixon puts him on the duty roster to give him back his pride. Then Tamara comes to Nixon, the only man in London she trusts. Ajax was in her room, and her father paid Ajax the night Jamie died. She stands close. \"You were in Essex. What's out there?\" Nobody else has asked him. Before he answers she says, quietly, \"You've started standing like him. Like Lord Harding.\" He hadn't noticed. He tells her: the iced village, the tracks, the dull glass, the lamps that went out nearest the sea. She listens the way she reads a cipher, and believes every word. Nixon wants to say three more things and says none of them. \"I'll put a man on your door, miss.\" \"I'd rather you were the man.\" Silence.","loc":"Guard tower","when":"A Crown order arrives from Vane after the market deaths: the Frost Killer is to be shot on sight.","th":"guard","also":["city","lambrick"],"ch":["nixon","cole","tamara"],"turn":"","w":160,"ed":"Revised Nov 15: the replacement son","fl":[],"html":"\u003cp>A Crown order arrives from Vane after the market deaths: the Frost Killer is to be shot on sight. Cole is back, bandaged, two fingers short, desperate to be useful, and Nixon puts him on the duty roster to give him back his pride. Then Tamara comes to Nixon, the only man in London she trusts. Ajax was in her room, and her father paid Ajax the night Jamie died. She stands close. &quot;You were in Essex. What's out there?&quot; Nobody else has asked him. Before he answers she says, quietly, &quot;You've started standing like him. Like Lord Harding.&quot; He hadn't noticed. He tells her: the iced village, the tracks, the dull glass, the lamps that went out nearest the sea. She listens the way she reads a cipher, and believes every word. Nixon wants to say three more things and says none of them. &quot;I'll put a man on your door, miss.&quot; &quot;I'd rather you were the man.&quot; Silence.\u003c/p>"},{"oref":"Scene 5","id":69,"seq":5,"title":"Glasshouse workbench","added":false,"act":"Act One","kind":"scene","sum":"Alice's Vykra intelligence: Ajax collects from the coal docks on Thursday night. Nathaniel builds her a real gauntlet and fits it to her hand strap by strap. \"Hold still, Bounds.\" She does, which she has never done for anyone. A love scene with no kissing in it.","loc":"Glasshouse workbench","when":"Alice's Vykra intelligence: Ajax collects from the coal docks on Thursday night.","th":"investigation","also":["lambrick"],"ch":["alice","nathaniel"],"turn":"","w":47,"ed":"","fl":[],"html":"\u003cp>Alice's Vykra intelligence: Ajax collects from the coal docks on Thursday night. Nathaniel builds her a real gauntlet and fits it to her hand strap by strap. &quot;Hold still, Bounds.&quot; She does, which she has never done for anyone. A love scene with no kissing in it.\u003c/p>"},{"oref":"Scene 6","id":252,"seq":6,"title":"The glasshouse, late","added":true,"act":"Act One","kind":"scene","sum":"Alice is asleep at the workbench, the new gauntlet still strapped to her hand. The Lost One sits with Nathaniel by the stove, and out of nowhere, in Miriam's voice, gives him something of his brother's: \"He talked about you. In the first carriage, before the light went out. He said you'd fly before you ever learned to walk, and that you were the only one of them worth saving.\" Nathaniel has spent his whole life believing he was the spare. \"He said that?\" \"To me.\" She's careful not to say who me is. He doesn't think to ask. He sits with it until the stove goes out: the first time anyone has told him he was worth something without wanting something back, and it came out of a dead woman's mouth.","loc":"The glasshouse","when":"Alice is asleep at the workbench, the new gauntlet still strapped to her hand.","th":"harding","also":["sisters"],"ch":["lostone","nathaniel","alice","jamie"],"turn":"Alice is asleep at the workbench, the new gauntlet still strapped to her hand. The Lost One sits with Nathaniel by the stove, and out of nowhere, in Miriam's voice, gives him something of his brother's: \"He talked about ","w":132,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>Alice is asleep at the workbench, the new gauntlet still strapped to her hand. The Lost One sits with Nathaniel by the stove, and out of nowhere, in Miriam's voice, gives him something of his brother's: &quot;He talked about you. In the first carriage, before the light went out. He said you'd fly before you ever learned to walk, and that you were the only one of them worth saving.&quot; Nathaniel has spent his whole life believing he was the spare. &quot;He said that?&quot; &quot;To me.&quot; She's careful not to say who \u003cem>me\u003c/em> is. He doesn't think to ask. He sits with it until the stove goes out: the first time anyone has told him he was worth something without wanting something back, and it came out of a dead woman's mouth.\u003c/p>"},{"oref":"Scene 7","id":70,"seq":7,"title":"Vykra laundry","added":false,"act":"Act Two","kind":"scene","sum":"Grise: \"Bring me the frost girl.\" Alice: \"No.\" Grise cuts the Vykra knot out of Alice's glove with one snip. \"Then you're no one's.\" At the mangles the twins don't look up. Jennifer, under her breath, chewing: \"Bad luck, Bounds.\" Jennie says nothing. Jennie never says anything to Alice at all. Alice walks out into the rain with nowhere to belong. Under the awning, she takes his handkerchief out of her coat and folds it into the glove, where the knot used to be.","loc":"Vykra laundry","when":"Grise: \"Bring me the frost girl.\" Alice: \"No.\" Grise cuts the Vykra knot out of Alice's glove with one snip.","th":"vykra","also":["sisters"],"ch":["grise","alice","twins"],"turn":"","w":84,"ed":"Revised Nov 14: the twins","fl":[],"html":"\u003cp>Grise: &quot;Bring me the frost girl.&quot; Alice: &quot;No.&quot; Grise cuts the Vykra knot out of Alice's glove with one snip. &quot;Then you're no one's.&quot; At the mangles the twins don't look up. Jennifer, under her breath, chewing: &quot;Bad luck, Bounds.&quot; Jennie says nothing. Jennie never says anything to Alice at all. Alice walks out into the rain with nowhere to belong. Under the awning, she takes his handkerchief out of her coat and folds it into the glove, where the knot used to be.\u003c/p>"},{"oref":"Scene 8","id":71,"seq":8,"title":"Coal docks, Thursday night, set piece","added":false,"act":"Act Two","kind":"scene","sum":"Nathaniel and Alice ambush Ajax among the coal barges. The Black Gauntlet hits like a steam hammer, WHUNK, and Nathaniel recognises his own stolen prototype in it. Ajax sees who is with him and grins through the scar she gave him: \"Told you I'd remember you.\" He's losing. Alice blinds Ajax with a flash-burst from her new gauntlet, and together they hook him onto a crane and swing him out over the black river.","loc":"Coal docks","when":"Nathaniel and Alice ambush Ajax among the coal barges.","th":"lambrick","also":["investigation"],"ch":["nathaniel","alice","ajax"],"turn":"","w":74,"ed":"Revised Nov 14: the new pilot","fl":[],"html":"\u003cp>Nathaniel and Alice ambush Ajax among the coal barges. The Black Gauntlet hits like a steam hammer, \u003cem>WHUNK\u003c/em>, and Nathaniel recognises his own stolen prototype in it. Ajax sees who is with him and grins through the scar she gave him: &quot;Told you I'd remember you.&quot; He's losing. Alice blinds Ajax with a flash-burst from her new gauntlet, and together they hook him onto a crane and swing him out over the black river.\u003c/p>"},{"oref":"Scene 9","id":72,"seq":9,"title":"The crane","added":false,"act":"Act Two","kind":"scene","sum":"Ajax hangs over the Thames, laughing blood through the bandage. AJAX: Your brother paid me. Lambrick paid two hundred for the Blackwood key. Your brother paid four for a copy. NATHANIEL: You cut the grid. AJAX: I sold a key. Your brother was quite particular about whose hand turned it. Not mine. Alice's expression changes at Blackwood. Her sister died at the generator's bridge. ALICE: He had someone with him. AJAX: Then ask them. She cannot. Nathaniel sees why she has gone quiet. The discovery connects both their dead, instead of delivering only a clever reversal. NATHANIEL: Who shot him? AJAX: Ask the Guard. Your father went down after the alarm. I never went near that lock. Alice tells Nathaniel to pull him up: he is a living link between the ledger, the key and the Works. Nathaniel hears only another man who sold a piece of the night Jamie died. He lets the lever go. Ajax drops. Alice stares at Nathaniel, then at the empty hook. His grief has cost both of them a witness. The river keeps Ajax for now; his later return remains the consequence of this choice.","loc":"The crane.","when":"Ajax hangs over the Thames, laughing blood through the bandage.","th":"investigation","also":["lambrick","guard"],"ch":["ajax","nathaniel","alice"],"turn":"Ajax drops. Alice stares at Nathaniel, then at the empty hook. His grief has cost both of them a witness. The river keeps Ajax for now; his later return remains the consequence of this choice.","w":191,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>Ajax hangs over the Thames, laughing blood through the bandage.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>AJAX:\u003c/strong> Your brother paid me. Lambrick paid two hundred for the Blackwood key. Your brother paid four for a copy.\n\u003cstrong>NATHANIEL:\u003c/strong> You cut the grid.\n\u003cstrong>AJAX:\u003c/strong> I sold a key. Your brother was quite particular about whose hand turned it. Not mine.\u003c/p>\u003c/blockquote>\n\u003cp>Alice's expression changes at \u003cem>Blackwood\u003c/em>. Her sister died at the generator's bridge.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>ALICE:\u003c/strong> He had someone with him.\n\u003cstrong>AJAX:\u003c/strong> Then ask them.\u003c/p>\u003c/blockquote>\n\u003cp>She cannot. Nathaniel sees why she has gone quiet. The discovery connects both their dead, instead of delivering only a clever reversal.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>NATHANIEL:\u003c/strong> Who shot him?\n\u003cstrong>AJAX:\u003c/strong> Ask the Guard. Your father went down after the alarm. I never went near that lock.\u003c/p>\u003c/blockquote>\n\u003cp>Alice tells Nathaniel to pull him up: he is a living link between the ledger, the key and the Works. Nathaniel hears only another man who sold a piece of the night Jamie died. He lets the lever go.\u003c/p>\n\u003cp>Ajax drops. Alice stares at Nathaniel, then at the empty hook. His grief has cost both of them a witness. The river keeps Ajax for now; his later return remains the consequence of this choice.\u003c/p>"},{"oref":"Scene 10","id":73,"seq":10,"title":"Harding House, the study, then the back stairs","added":false,"act":"Act Two","kind":"scene","sum":"Nathaniel: \"Jamie paid Lambrick's man. Why?\" Eldgard: \"Your brother was ill. Melancholy. He wanted to destroy this house.\" It's half true, which is how Eldgard lies. Then the bait Nathaniel has wanted all his life: \"After the hearing I'll take you into the work. All of it.\" Nathaniel came in as Nixon was leaving, with his father's keys on his belt. On the back stairs afterwards, Josephine asks Byron where Nathaniel goes at night. Byron lies for the boy. It's the first time he has ever lied to her.","loc":"Harding House","when":"Nathaniel: \"Jamie paid Lambrick's man.","th":"harding","also":["investigation"],"ch":["nathaniel","eldgard","josephine","byron"],"turn":"","w":89,"ed":"Revised Nov 15: the replacement son","fl":[],"html":"\u003cp>Nathaniel: &quot;Jamie paid Lambrick's man. Why?&quot; Eldgard: &quot;Your brother was ill. Melancholy. He wanted to destroy this house.&quot; It's half true, which is how Eldgard lies. Then the bait Nathaniel has wanted all his life: &quot;After the hearing I'll take you into the work. All of it.&quot; Nathaniel came in as Nixon was leaving, with his father's keys on his belt. On the back stairs afterwards, Josephine asks Byron where Nathaniel goes at night. Byron lies for the boy. It's the first time he has ever lied to her.\u003c/p>"},{"oref":"Scene 11","id":75,"seq":11,"title":"Newgate, cell 1417","added":false,"act":"Act Two","kind":"scene","sum":"Nixon, alone, in civilian coat, with the slip. The prisoner is an old man, TOBIAS MARSH, seventy if a day, in the dark at the end of the debtors' wing, picking at a string he calls his harp. Nixon: \"Jamie Harding came here every Sunday. Why?\" The old man hums, then pinches Nixon's cheek through the bars and cackles. \"Marian's chin! Marian's chin!\" Nixon goes still. \"What did you say?\" \"Seven in the Orchard, ripe for the fall. One on the tree for the lantern's call. Thirteen steps down where the cold water drips, count the apples, kiss the stones' lips.\" Nixon grabs the bars: \"Enough. Why was Jamie Harding visiting you? Tell me, you old fool.\" Marsh only cocks his head and smiles. \"He cried too, you know. Same place in the song.\" Then he turns his back and goes back to his harp. Nixon leaves with a nursery rhyme and a cold feeling he can't name.","loc":"Newgate","when":"Nixon, alone, in civilian coat, with the slip.","th":"guard","also":["investigation"],"ch":["nixon","marsh"],"turn":"","w":158,"ed":"","fl":[],"html":"\u003cp>Nixon, alone, in civilian coat, with the slip. The prisoner is an old man, TOBIAS MARSH, seventy if a day, in the dark at the end of the debtors' wing, picking at a string he calls his harp. Nixon: &quot;Jamie Harding came here every Sunday. Why?&quot; The old man hums, then pinches Nixon's cheek through the bars and cackles. &quot;Marian's chin! Marian's chin!&quot; Nixon goes still. &quot;What did you say?&quot; &quot;Seven in the Orchard, ripe for the fall. One on the tree for the lantern's call. Thirteen steps down where the cold water drips, count the apples, kiss the stones' lips.&quot; Nixon grabs the bars: &quot;Enough. Why was Jamie Harding visiting you? Tell me, you old fool.&quot; Marsh only cocks his head and smiles. &quot;He cried too, you know. Same place in the song.&quot; Then he turns his back and goes back to his harp. Nixon leaves with a nursery rhyme and a cold feeling he can't name.\u003c/p>"},{"oref":"Scene 12","id":76,"seq":12,"title":"Glasshouse","added":false,"act":"Act Two","kind":"scene","sum":"Felix tracks Alice there. The Lost One offers him an orange and apologises for his hand, because she remembers. He sees a frightened girl. He was already listed to testify about the bullet hole in Jamie's coat. Now he'll say more: \"Someone tried to kill her before the river. I saw her fight it. There was no frost until afterward. I'll say that in front of the Crown, too.\" Therefore he's now the most dangerous man in London. Outside, under the garden wall, Josephine has heard every word. She has known for a week where her son goes at night, whatever Byron tells her. She says nothing to her husband. A Frost Killer dragged out of the Harding glasshouse takes her son to the dock beside her, so the girl will have to be caught somewhere else.","loc":"Glasshouse.","when":"Felix tracks Alice there.","th":"investigation","also":["sisters"],"ch":["felix","alice","lostone"],"turn":"Felix tracks Alice there. The Lost One offers him an orange and apologises for his hand, because she remembers. He sees a frightened girl. He was already listed to testify about the bullet hole in Jamie's coat. Now he'll","w":137,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>Felix tracks Alice there. The Lost One offers him an orange and apologises for his hand, because she remembers. He sees a frightened girl. He was already listed to testify about the bullet hole in Jamie's coat. Now he'll say more: &quot;Someone tried to kill her before the river. I saw her fight it. There was no frost until afterward. I'll say that in front of the Crown, too.&quot; \u003cem>Therefore\u003c/em> he's now the most dangerous man in London. Outside, under the garden wall, Josephine has heard every word. She has known for a week where her son goes at night, whatever Byron tells her. She says nothing to her husband. A Frost Killer dragged out of the Harding glasshouse takes her son to the dock beside her, so the girl will have to be caught somewhere else.\u003c/p>"},{"oref":"Scene 13","id":77,"seq":13,"title":"Parliament, committee room, the hearing","added":false,"act":"Act Three","kind":"scene","sum":"Lambrick argues that the Hardings are hiding something under the Works. Eldgard is calm. Vane presides, and never once asks what. Nathaniel sits beside his father. Tamara is in the gallery, Nixon's Lanterns are at the doors, and a veiled woman sits in the back row. At the recess she crosses to the stand with a glass of water: \"You look pale, Inspector.\" Felix drinks.","loc":"Parliament","when":"Lambrick argues that the Hardings are hiding something under the Works.","th":"city","also":["harding"],"ch":["lambrick","eldgard","vane","nathaniel","tamara","josephine","felix"],"turn":"","w":65,"ed":"","fl":[],"html":"\u003cp>Lambrick argues that the Hardings are hiding something under the Works. Eldgard is calm. Vane presides, and never once asks what. Nathaniel sits beside his father. Tamara is in the gallery, Nixon's Lanterns are at the doors, and a veiled woman sits in the back row. At the recess she crosses to the stand with a glass of water: &quot;You look pale, Inspector.&quot; Felix drinks.\u003c/p>"},{"oref":"Scene 14","id":78,"seq":14,"title":"The witness stand, set piece","added":false,"act":"Act Three","kind":"scene","sum":"Felix: \"At Blackwood, Miriam Bounds was trying to stop her own hands. There was pigment on her mouth, not frost. After the river—after the Works went dark—\" He coughs. Frost spreads across his lips and his eyes go white. He dies on the stand. The cry goes up: \"The Frost Killer is here!\" Doors slam. Nixon's Lanterns fire flash-bursts into the ceiling to stop the stampede. Vane orders the Frost Killer hunted \"with every lamp in London.\" The vote is postponed, and sympathy swings toward the Hardings. In the crush on the gallery stairs, Tamara sees the veiled woman's glove, with a Vykra knot stitched inside it. A needle drops on the stair. Tamara pockets it.","loc":"The witness stand","when":"Felix: \"At Blackwood, Miriam Bounds was trying to stop her own hands.","th":"vykra","also":["investigation","city","guard"],"ch":["felix","vane","tamara","josephine"],"turn":"Felix: \"At Blackwood, Miriam Bounds was trying to stop her own hands. There was pigment on her mouth, not frost. After the river—after the Works went dark—\" He coughs. Frost spreads across his lips and his eyes go white.","w":116,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>Felix: &quot;At Blackwood, Miriam Bounds was trying to stop her own hands. There was pigment on her mouth, not frost. After the river—after the Works went dark—&quot; He coughs. Frost spreads across his lips and his eyes go white. He dies on the stand. The cry goes up: &quot;The Frost Killer is here!&quot; Doors slam. Nixon's Lanterns fire flash-bursts into the ceiling to stop the stampede. Vane orders the Frost Killer hunted &quot;with every lamp in London.&quot; The vote is postponed, and sympathy swings toward the Hardings. In the crush on the gallery stairs, Tamara sees the veiled woman's glove, with a Vykra knot stitched inside it. A needle drops on the stair. Tamara pockets it.\u003c/p>"},{"oref":"Scene 15","id":81,"seq":15,"title":"Glasshouse","added":false,"act":"Act Three","kind":"scene","sum":"Nathaniel brings the news: Felix was killed by frost. Alice looks at the Lost One, who has been here with her all day. She knows the poison. \"Winter's kiss. That's Vykra. It makes frost without her.\" She keeps it separate from the dark pigment Felix described at Blackwood; the two methods do not become one interchangeable poison. Therefore somebody is framing her sister.","loc":"Glasshouse.","when":"Nathaniel brings the news: Felix was killed by frost.","th":"sisters","also":["vykra"],"ch":["nathaniel","alice","lostone"],"turn":"Nathaniel brings the news: Felix was killed by frost. Alice looks at the Lost One, who has been here with her all day. She knows the poison. \"Winter's kiss. That's Vykra. It makes frost without her.\" She keeps it separat","w":63,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>Nathaniel brings the news: Felix was killed by frost. Alice looks at the Lost One, who has been here with her all day. She knows the poison. &quot;Winter's kiss. That's Vykra. It makes frost without her.&quot; She keeps it separate from the dark pigment Felix described at Blackwood; the two methods do not become one interchangeable poison. \u003cem>Therefore\u003c/em> somebody is framing her sister.\u003c/p>"},{"oref":"Scene 16","id":82,"seq":16,"title":"Guard tower, the roof, then the armoury","added":false,"act":"Act Three","kind":"scene","sum":"Nathaniel tells Nixon what Ajax said: ask the Guard who fired. Nixon goes very still. \"Find me the name, Nix.\" \"I'll find it.\" The rifles came back from Nathaniel's shop this week with their logs bound into the cases, and that night he finds it: Cole's rifle in the discharge log, one round, 2 November. He already knew. He tears out the page and burns it in the stove, because Eldgard asked him to, and because sons keep the house's secrets. From the bunk-room door, Cole watches his Captain burn the proof of what Cole did, and later copies the page from memory into his diary.","loc":"Guard tower","when":"Nathaniel tells Nixon what Ajax said: ask the Guard who fired.","th":"guard","also":["investigation"],"ch":["nathaniel","nixon","cole"],"turn":"","w":106,"ed":"Revised Nov 15: the replacement son","fl":[],"html":"\u003cp>Nathaniel tells Nixon what Ajax said: ask the Guard who fired. Nixon goes very still. &quot;Find me the name, Nix.&quot; &quot;I'll find it.&quot; The rifles came back from Nathaniel's shop this week with their logs bound into the cases, and that night he finds it: Cole's rifle in the discharge log, one round, 2 November. He already knew. He tears out the page and burns it in the stove, because Eldgard asked him to, and because sons keep the house's secrets. From the bunk-room door, Cole watches his Captain burn the proof of what Cole did, and later copies the page from memory into his diary.\u003c/p>"},{"oref":"Scene 17","id":84,"seq":17,"title":"Vykra laundry","added":false,"act":"Act Three","kind":"scene","sum":"Tamara puts the needle on Grise's counting table. \"One of yours killed a policeman in front of the Crown. I want four separate plans on one festival night, ending with every lamp in London blazing white and bursting at once, and a crush on Westminster Bridge. (The city goes fully dark twice in this season: for an hour in the pilot, and for good in the finale. Lantern Night is the other thing light can do: it screams.)","threads":["white","harding","sisters","vykra","guard","lambrick","city"],"frame":"\u003cp>\u003cstrong>33 DAYS TO FIRST SNOW.\u003c/strong> The midseason turn. \u003cstrong>Focus:\u003c/strong> the heist into the core. \u003cstrong>Set piece:\u003c/strong> four separate plans on one festival night, ending with every lamp in London blazing white and bursting at once, and a crush on Westminster Bridge. (The city goes fully dark twice in this season: for an hour in the pilot, and for good in the finale. Lantern Night is the other thing light can do: it screams.) \u003cstrong>Sting:\u003c/strong> the light is a woman, the Tithe is Nathaniel, and the door is locked by his best friend.\u003c/p>","scenes":[{"oref":"Scene 1","id":86,"seq":1,"title":"Tyburn, the same winter, 1489","added":false,"act":"Cold open","kind":"scene","sum":"The Hargrave raid. Torches, young cousins of the Harding blood, and leading them the girl of nineteen from the treeline in the pilot, reaching the iron chain with a hammer. Alistair cuts her down at the lock. Somebody in the dark screams her name: \"Marian!\" By dawn the empty gallows field from the pilot is full: three thousand Hargraves on Harding timber, and their wives and children walked down thirteen steps into the dark. The heist we're about to watch has been tried before, and it failed.","loc":"Tyburn","when":"The Hargrave raid.","th":"white","also":["harding"],"ch":["alistair"],"turn":"","w":87,"ed":"","fl":[],"html":"\u003cp>The Hargrave raid. Torches, young cousins of the Harding blood, and leading them the girl of nineteen from the treeline in the pilot, reaching the iron chain with a hammer. Alistair cuts her down at the lock. loc":"Glasshouse","when":"Nathaniel: \"There's nothing down there but vats.\" The Lost One: \"He showed you a nice room.","th":"sisters","also":["harding"],"ch":["nathaniel","lostone","alice"],"turn":"","w":46,"ed":"","fl":[],"html":"\u003cp>Nathaniel: &quot;There's nothing down there but vats.&quot; The Lost One: &quot;He showed you a nice room. My mother isn't in a nice room.&quot; Nathaniel defends his father; Alice defends her sister. &quot;He's my father, Bounds.&quot; &quot;She's my sister, Harding.&quot; Their first fight, and it's about family.\u003c/p>"},{"oref":"Scene 4","id":89,"seq":4,"title":"Harding House, the silver pantry","added":false,"act":"Act One","kind":"scene","sum":"Byron gives Nathaniel his old Guard key on a black ribbon. Jamie borrowed it in October, had it copied, and gave it back with a note Byron has kept in his pocket ever since: If I don't come up, give it to Nat. Byron guarded the core thirty years ago: \"I heard her every night. I stopped hearing it when I stopped letting myself.\" He lights himself back down the servants' stair with a tallow candle. He hasn't carried a green lamp since the core, and nobody in the house has ever asked why. He keeps quiet about Josephine's hands. Not yet.","loc":"Harding House","when":"Byron gives Nathaniel his old Guard key on a black ribbon.","th":"harding","also":["white"],"ch":["byron","nathaniel"],"turn":"","w":102,"ed":"Revised in the Oct 10 pass","fl":[],"html":"\u003cp>Byron gives Nathaniel his old Guard key on a black ribbon. Jamie borrowed it in October, had it copied, and gave it back with a note Byron has kept in his pocket ever since: If I don't come up, give it to Nat. Byron guarded the core thirty years ago: &quot;I heard her every night. I stopped hearing it when I stopped letting myself.&quot; He lights himself back down the servants' stair with a tallow candle. He hasn't carried a green lamp since the core, and nobody in the house has ever asked why. He keeps quiet about Josephine's hands. Not yet.\u003c/p>"},{"oref":"Scene 5","id":90,"seq":5,"title":"Vykra laundry","added":false,"act":"Act One","kind":"scene","sum":"Grise tests her new girl: a Works lock cipher, solved in four minutes. Grise lets slip that the inner codes change on Lantern Night. Tamara is welcomed with tea and a knife. For the first time in her life she belongs somewhere because of her mind.","loc":"Vykra laundry","when":"Grise tests her new girl: a Works lock cipher, solved in four minutes.","th":"vykra","also":[],"ch":["grise","tamara"],"turn":"","w":46,"ed":"","fl":[],"html":"\u003cp>Grise tests her new girl: a Works lock cipher, solved in four minutes. Grise lets slip that the inner codes change on Lantern Night. Tamara is welcomed with tea and a knife. For the first time in her life she belongs somewhere because of her mind.\u003c/p>"},{"oref":"Scene 6","id":91,"seq":6,"title":"Guard tower","added":false,"act":"Act One","kind":"scene","sum":"Eldgard gives Nixon Lantern Night security for the Works, plus a private order. \"My son will come tonight. Let him through. Seal the core behind him. The girl doesn't leave.\" Nixon: \"And Nathaniel?\" \"He's my son, Captain. He'll be with me.\"","loc":"Guard tower","when":"Eldgard gives Nixon Lantern Night security for the Works, plus a private order.","th":"guard","also":["harding"],"ch":["eldgard","nixon"],"turn":"","w":41,"ed":"","fl":[],"html":"\u003cp>Eldgard gives Nixon Lantern Night security for the Works, plus a private order. &quot;My son will come tonight. Let him through. Seal the core behind him. The girl doesn't leave.&quot; Nixon: &quot;And Nathaniel?&quot; &quot;He's my son, Captain. He'll be with me.&quot;\u003c/p>"},{"oref":"Scene 7","id":92,"seq":7,"title":"Glasshouse, planning","added":false,"act":"Act One","kind":"scene","sum":"Whimsy. A model of the Works built out of teacups and oranges; the Lost One eats the core. Tamara arrives with the code, invited by Nathaniel. Alice and Tamara meet: the fiancée and the l of black water. The Lost One freezes it into a glass road and they walk inside the river. Jamie's key opens the first grate.","loc":"Thames outfall","when":"The pipe is full of black water.","th":"white","also":["investigation"],"ch":["lostone","alice","nathaniel","tamara"],"turn":"","w":28,"ed":"","fl":[],"html":"\u003cp>The pipe is full of black water. The Lost One freezes it into a glass road and they walk inside the river. Jamie's key opens the first grate.\u003c/p>"},{"oref":"Scene 10","id":95,"seq":10,"title":"The gantries","added":false,"act":"Act Two","kind":"scene","sum":"Nixon, on the high walk, sees them pass. Orders say let them through. He gives the whistle they invented at nine years old, turn back. Nathaniel hears it, smiles because it's Nix, and keeps going.","loc":"The gantries","when":"Nixon, on the high walk, sees them pass.","th":"guard","also":[],"ch":["nixon","nathaniel"],"turn":"","w":35,"ed":"","fl":[],"html":"\u003cp>Nixon, on the high walk, sees them pass. Orders say let them through. He gives the whistle they invented at nine years old, \u003cem>turn back\u003c/em>. Nathaniel hears it, smiles because it's Nix, and keeps going.\u003c/p>"},{"oref":"Scene 11","id":96,"seq":11,"title":"The Strand, finale","added":false,"act":"Act Two","kind":"scene","sum":"Ajax's crew cuts the outer grid. The East End goes dark in the middle of the fireworks. Inside the Works, every lock resets, and the heisters are trapped between two doors with the Guard alarm ringing.","loc":"The Strand","when":"Ajax's crew cuts the outer grid.","th":"lambrick","also":["city"],"ch":["ajax"],"turn":"","w":36,"ed":"","fl":[],"html":"\u003cp>Ajax's crew cuts the outer grid. The East End goes dark in the middle of the fireworks. Inside the Works, every lock resets, and the heisters are trapped between two doors with the Guard alarm ringing.\u003c/p>"},{"oref":"Scene 12","id":97,"seq":12,"title":"The shaft","added":false,"act":"Act Two","kind":"scene","sum":"Tamara recodes the inner door by ear, listening to the tumblers, while Alice holds her by the belt over a crystal shaft four hundred feet deep. Neither of them says thank you. Click. It opens.","loc":"The shaft","when":"Tamara recodes the inner door by ear, listening to the tumblers, while Alice holds her by the belt over a crystal shaft four hundred feet deep.","th":"vykra","also":[],"ch":["tamara","alice"],"turn":"","w":35,"ed":"","fl":[],"html":"\u003cp>Tamara recodes the inner door by ear, listening to the tumblers, while Alice holds her by the belt over a crystal shaft four hundred feet deep. Neither of them says thank you. \u003cem>Click.\u003c/em> It opens.\u003c/p>"},{"oref":"Scene 13","id":98,"seq":13,"title":"The core","added":false,"act":"Act Two","kind":"scene","sum":"They go down, and we see her whole for the first time. MORGANA: nine feet of ice and green fire, iron hooks through her shoulders and hips, her blood running green along channels into London. She is singing, and it's the Weeping: the Lantern Hymn's tune, with none of the words.","loc":"The core","when":"They go down, and we see her whole for the first time.","th":"white","also":[],"ch":["lostone","alice","nathaniel","tamara","morgana"],"turn":"","w":51,"ed":"","fl":[],"html":"\u003cp>They go down, and we see her whole for the first time. MORGANA: nine feet of ice and green fire, iron hooks through her shoulders and hips, her blood running green along channels into London. She is singing, and it's the Weeping: the Lantern Hymn's tune, with none of the words.\u003c/p>"},{"oref":"Scene 14","id":99,"seq":14,"title":"The chain","added":false,"act":"Act Three","kind":"scene","sum":"\"Little frost. You came.\" The Lost One grabs the chain, and for one second her whole face changes: every song Miriam ever knew comes back into her at once. Then it burns her mittens to smoke. Alice pulls her back. Morgana, to Alice: \"You have my daughter's hand. Give it back.\" Alice, holding tighter: \"She's my sister. Whatever came back in her, my sister's under it.\" Morgana tilts her great head and looks at Alice with something terribly like pity. She doesn't correct her. The Lost One doesn't either. Then, to Nathaniel, almost gently: \"You came down these stairs once, little Harding. And your brother is not dead. He is cold.\"","loc":"The chain","when":"\"Little frost.","th":"white","also":["sisters"],"ch":["morgana","lostone","alice","nathaniel"],"turn":"","w":111,"ed":"Revised in the Oct 10 pass","fl":[],"html":"\u003cp>&quot;Little frost. You came.&quot; The Lost One grabs the chain, and for one second her whole face changes: every song Miriam ever knew comes back into her at once. Then it burns her mittens to smoke. Alice pulls her back. Morgana, to Alice: &quot;You have my daughter's hand. Give it back.&quot; Alice, holding tighter: &quot;She's my sister. Whatever came back in her, my sister's under it.&quot; Morgana tilts her great head and looks at Alice with something terribly like pity. She doesn't correct her. The Lost One doesn't either. Then, to Nathaniel, almost gently: &quot;You came down these stairs once, little Harding. And your brother is not dead. He is cold.&quot;\u003c/p>"},{"oref":"Scene 15","id":100,"seq":15,"title":"The lock","added":false,"act":"Act Three","kind":"scene","sum":"Nathaniel touches the chain, and it tightens. Morgana screams, and across London the lamps surge brighter. His blood feeds it, and for one frame, in the surge, he sees snow, and a man standing very still in it. Then it's gone, and he'll tell himself it was the dream. Jamie's glass blade is still stuck in the lock where he left it, and his diagram suddenly makes sense.","loc":"The lock","when":"Nathaniel touches the chain, and it tightens.","th":"white","also":["investigation","harding"],"ch":["nathaniel","morgana","eldgard"],"turn":"","w":68,"ed":"Revised Oct 14: polish pass","fl":[],"html":"\u003cp>Nathaniel touches the chain, and it tightens. Morgana screams, and across London the lamps surge brighter. His blood feeds it, and for one frame, in the surge, he sees snow, and a man standing very still in it. Then it's gone, and he'll tell himself it was the dream. Jamie's glass blade is still stuck in the lock where he left it, and his diagram suddenly makes sense.\u003c/p>"},{"oref":"Scene 16","id":101,"seq":16,"title":"The core","added":false,"act":"Act Three","kind":"scene","sum":"Eldgard steps out of the dark; he's been waiting. \"Now you know what your brother knew.\" The Tithe: every fifty winters, at first snow, a Harding walks down to the chain of their own will, or it breaks. \"And if it breaks, the light dies for good, the White comes through until dawn, and it takes one of us with it.\" \"I raised Jamie for it. Jamie ran. Now it's you.\" Nathaniel: \"Why not you?\" Eldgard doesn't answer. The silence goes on a beat too long, and Nathaniel files it away.","loc":"The core","when":"Eldgard steps out of the dark; he's been waiting.","th":"harding","also":["white"],"ch":["eldgard","nathaniel"],"turn":"","w":91,"ed":"Revised Oct 13: four rules, new Ep 8","fl":[],"html":"\u003cp>Eldgard steps out of the dark; he's been waiting. &quot;Now you know what your brother knew.&quot; The Tithe: every fifty winters, at first snow, a Harding walks down to the chain of their own will, or it breaks. &quot;And if it breaks, the light dies for good, the White comes through until dawn, and it takes one of us with it.&quot; &quot;I raised Jamie for it. Jamie ran. Now it's you.&quot; Nathaniel: &quot;Why not you?&quot; Eldgard doesn't answer. The silence goes on a beat too long, and Nathaniel files it away.\u003c/p>"},{"oref":"Scene 17","id":102,"seq":17,"title":"The core door","added":false,"act":"Act Three","kind":"scene","sum":"It seals with a hiss, iron on glass. Behind the glass is Nixon, following orders, his lips moving on the oath he swore on the night he was made captain, Light the dark. Keep the flame, over and over, loud enough in his own head to drown out whatever Nathaniel is hearing. Nathaniel: \"Nix!\" Nixon doesn't look away, and that's worse.","loc":"The core door","when":"It seals with a hiss, iron on glass.","th":"guard","also":[],"ch":["nixon","nathaniel"],"turn":"","w":61,"ed":"Revised in the Oct 10 pass","fl":[],"html":"\u003cp>It seals with a hiss, iron on glass. Behind the glass is Nixon, following orders, his lips moving on the oath he swore on the night he was made captain, \u003cem>Light the dark. Keep the flame\u003c/em>, over and over, loud enough in his own head to drown out whatever Nathaniel is hearing. Nathaniel: &quot;Nix!&quot; Nixon doesn't look away, and that's worse.\u003c/p>"},{"oref":"Scene 18","id":103,"seq":18,"title":"The core, escape","added":false,"act":"Act Three","kind":"scene","sum":"The Lost One, desperate, lets go of the cold. The core freezes around her mother, and Morgana screams, the way she screamed when Nathaniel touched the chain, only worse. Her blood flares through every channel at once. Across London, on Lantern Night, every lamp blazes white for one heartbeat and bursts. Pop-pop-pop-pop, street after street, a wave of shattering glass under the fireworks. The Lost One flinches as if she heard every one. Alice blows the door with her gauntlet. Tamara drags the Lost One into the outfall. Alice reaches for Nathaniel. He stays: \"I need to hear the rest.\" She leaves him there.","loc":"The core","when":"The Lost One, desperate, lets go of the cold.","th":"white","also":["city"],"ch":["lostone","morgana","alice","tamara","nathaniel"],"turn":"","w":104,"ed":"","fl":[],"html":"\u003cp>The Lost One, desperate, lets go of the cold. The core freezes around her mother, and Morgana screams, the way she screamed when Nathaniel touched the chain, only worse. Her blood flares through every channel at once. Across London, on Lantern Night, every lamp blazes white for one heartbeat and bursts. \u003cem>Pop-pop-pop-pop\u003c/em>, street after street, a wave of shattering glass under the fireworks. The Lost One flinches as if she heard every one. Alice blows the door with her gauntlet. Tamara drags the Lost One into the outfall. Alice reaches for Nathaniel. He stays: &quot;I need to hear the rest.&quot; She leaves him there.\u003c/p>"},{"oref":"Scene 19","id":104,"seq":19,"title":"Westminster Bridge","added":false,"act":"Act Three","kind":"scene","sum":"Glass rains on the festival crowd from the bridge lamps, then only fireworks for light, then a panicking crowd and a crush. Cole's squad hold a barricade with flash-bursts; people still die against the railings. Lambrick, on a coal cart: \"Remember who kept you warm!\"","loc":"Westminster Bridge","when":"Glass rains on the festival crowd from the bridge lamps, then only fireworks for light, then a panicking crowd and a crush.","th":"city","also":["lambrick"],"ch":["cole","lambrick"],"turn":"","w":45,"ed":"","fl":[],"html":"\u003cp>Glass rains on the festival crowd from the bridge lamps, then only fireworks for light, then a panicking crowd and a crush. Cole's squad hold a barricade with flash-bursts; people still die against the railings. Lambrick, on a coal cart: &quot;Remember who kept you warm!&quot;\u003c/p>"},{"oref":"Scene 20","id":105,"seq":20,"title":"The core, after","added":false,"act":"Act Three","kind":"scene","sum":"Father and son, alone with the prisoner. Nathaniel: \"She said Jamie isn't dead. She said he's cold.\" Eldgard doesn't look at Morgana when he answers. \"She tells every Harding whatever will bring him to the lock. She told me my sister was still singing.\" He says it like a man pressing on an old scar. \"Thirty-three days. I won't lose two sons. Help me find another way.\" Nathaniel can't tell if any of it is a lie. He says yes. He chooses his father, and he puts the word cold away where he keeps the weeping in the floor.","loc":"The core","when":"Father and son, alone with the prisoner.","th":"harding","also":["white"],"ch":["nathaniel","eldgard","morgana","otty","jamie"],"turn":"","w":99,"ed":"","fl":[],"html":"\u003cp>Father and son, alone with the prisoner. Nathaniel: &quot;She said Jamie isn't dead. She said he's cold.&quot; Eldgard doesn't look at Morgana when he answers. &quot;She tells every Harding whatever will bring him to the lock. She told me my sister was still singing.&quot; He says it like a man pressing on an old scar. &quot;Thirty-three days. I won't lose two sons. Help me find another way.&quot; Nathaniel can't tell if any of it is a lie. He says yes. He chooses his father, and he puts the word \u003cem>cold\u003c/em> away where he keeps the weeping in the floor.\u003c/p>"},{"oref":"Scene 21","id":106,"seq":21,"title":"Gin Lane rooftop, the black city","added":false,"act":"Tag","kind":"scene","sum":"Alice and the Lost One, soaked and shaking. The Lost One: \"I'm going to free her. Even if all of them freeze.\" Alice takes her burned hand anyway. Below them, London is lit in patches, every third lamp a broken stump.","loc":"Gin Lane rooftop","when":"Alice and the Lost One, soaked and shaking.","th":"sisters","also":["white"],"ch":["alice","lostone"],"turn":"","w":41,"ed":"","fl":[],"html":"\u003cp>Alice and the Lost One, soaked and shaking. The Lost One: &quot;I'm going to free her. Even if all of them freeze.&quot; Alice takes her burned hand anyway. Below them, London is lit in patches, every third lamp a broken stump.\u003c/p>"}]},{"n":6,"title":"Coal","time":"28 DAYS TO FIRST SNOW","clock":"28 DAYS TO FIRST SNOW","act":"I","log":"With Harding light failing and Lambrick coal filling the streets, Alice and the Lost One try to reach the core through the gas tunnels on the night of the Charter vote. Ajax has rigged those tunnels, Nixon is waiting in them, Nathaniel runs in after them, and Byron runs in after him.","sum":"\"Then you know I love you.\"","turn":"The Crown seizes the Works. Byron dies telling the truth","focus":"a city in the cold, and Byron.","piece":"the Pimlico gasworks explosion, five plans meeting in one tunnel.","threads":["harding","city","sisters","guard","lambrick","investigation"],"frame":"\u003cp>\u003cstrong>28 DAYS TO FIRST SNOW.\u003c/strong> \u003cstrong>Focus:\u003c/strong> a city in the cold, and Byron. \u003cstrong>Set piece:\u003c/strong> the Pimlico gasworks explosion, five plans meeting in one tunnel. \u003cstrong>Sting:\u003c/strong> Byron dies before he can say what he came to say, and then he says it.\u003c/p>","scenes":[{"oref":"Scene 1","id":107,"seq":1,"title":"The core gate, thirty years ago","added":false,"act":"Cold open","kind":"scene","sum":"Young BYRON, a Lantern sergeant on night watch, catches a Vykra girl on her joining test, sent by a younger Grise with a knife to kill young Eldgard. It's JOSEPHINE, nineteen, and she's caught because she stopped: behind the core gate a woman is weeping, and she listened a breath too long. He lets her go. A year later she marries the man she was sent to kill. Byron serves at the wedding. In his tunic pocket is a faded blue ribbon, from a different night, fifty years gone.","loc":"The core gate","when":"Young BYRON, a Lantern sergeant on night watch, catches a Vykra girl on her joining test, sent by a younger Grise with a knife to kill young Eldgard.","th":"harding","also":["vykra"],"ch":["byron","josephine"],"turn":"","w":89,"ed":"Revised Nov 14: the sisters' past","fl":[],"html":"\u003cp>Young BYRON, a Lantern sergeant on night watch, catches a Vykra girl on her joining test, sent by a younger Grise with a knife to kill young Eldgard. It's JOSEPHINE, nineteen, and she's caught because she stopped: behind the core gate a woman is weeping, and she listened a breath too long. He lets her go. A year later she marries the man she was sent to kill. Byron serves at the wedding. In his tunic pocket is a faded blue ribbon, from a different night, fifty years gone.\u003c/p>"},{"oref":"Scene 2","id":108,"seq":2,"title":"London, the cold","added":false,"act":"Act One","kind":"scene","sum":"Since Lantern Night half the lamps in London are broken glass, and the rest come and go. Coal carts with LAMBRICK on the side. Prices chalked up: doubled, then tripled. A child asleep in a Gin Lane doorway, Alice's doorway, with frost in her eyelashes, and a constable looking away. By morning she isn't asleep. Grim and quiet.","loc":"London","when":"Since Lantern Night half the lamps in London are broken glass, and the rest come and go.","th":"city","also":["lambrick"],"ch":[],"turn":"","w":58,"ed":"Revised Oct 14: polish pass","fl":[],"html":"\u003cp>Since Lantern Night half the lamps in London are broken glass, and the rest come and go. Coal carts with LAMBRICK on the side. Prices chalked up: doubled, then tripled. A child asleep in a Gin Lane doorway, Alice's doorway, with frost in her eyelashes, and a constable looking away. By morning she isn't asleep. Grim and quiet.\u003c/p>"},{"oref":"Scene 3","id":109,"seq":3,"title":"Harding Works","added":false,"act":"Act One","kind":"scene","sum":"Eldgard and Nathaniel design the Heartglass, a resonance cage meant to hold the chain without a Harding death. Father and son at one bench, finishing each other's equations. It's everything Nathaniel ever wanted. Eldgard: \"We'll need something of her blood to tune it.\" Nathaniel assumes he means Morgana.","loc":"Harding Works","when":"Eldgard and Nathaniel design the Heartglass, a resonance cage meant to hold the chain without a Harding death.","th":"harding","also":["white"],"ch":["eldgard","nathaniel"],"turn":"","w":48,"ed":"","fl":[],"html":"\u003cp>Eldgard and Nathaniel design the \u003cstrong>Heartglass\u003c/strong>, a resonance cage meant to hold the chain without a Harding death. Father and son at one bench, finishing each other's equations. It's everything Nathaniel ever wanted. Eldgard: &quot;We'll need something of her blood to tune it.&quot; Nathaniel assumes he means Morgana.\u003c/p>"},{"oref":"Scene 4","id":110,"seq":4,"title":"Gin Lane, a borrowed room","added":false,"act":"Act One","kind":"scene","sum":"Wren said the memories would come back, and they are: more of Miriam every day, her laugh, her way of knotting a shawl, never in the order Alice would choose. Tonight the Lost One stops halfway through a story about the market and goes white. Something heavy has come up. She grabs Alice's sleeve: \"There's something I have to say to you. About him. About the river.\" Alice: \"After.\" \"I can't carry it till after.\" \"After, Mim.\" The fence holds, and the Lost One sits with the thing she needs to say, getting heavier. Then, harder, because she's frightened: \"If I free my mother, I'll be strong again.\" Alice: \"If you free her, the light goes out and people die.\" The Lost One: \"People die now. I watched one on your step.\" Then, quieter: \"At the chain it all came back at once. Every song. For one second I had all of her. If I could sit by her an hour, I'd give you Mim whole.\" It's the only offer anyone has made Alice since the bridge. \"You sit by her. You don't touch the lock.\" \"Yes, Ali.\" The second lie, and this time Alice half knows it.","loc":"Gin Lane","when":"Wren said the memories would come back, and they are: more of Miriam every day, her laugh, her way of knotting a shawl, never in the order Alice would choose.","th":"sisters","also":[],"ch":["alice","lostone"],"turn":"","w":198,"ed":"Revised Nov 14: the sisters' past","fl":[],"html":"\u003cp>Wren said the memories would come back, and they are: more of Miriam every day, her laugh, her way of knotting a shawl, never in the order Alice would choose. Tonight the Lost One stops halfway through a story about the market and goes white. Something heavy has come up. She grabs Alice's sleeve: &quot;There's something I have to say to you. About him. About the river.&quot; Alice: &quot;After.&quot; &quot;I can't carry it till after.&quot; &quot;\u003cem>After\u003c/em>, Mim.&quot; The fence holds, and the Lost One sits with the thing she needs to say, getting heavier. Then, harder, because she's frightened: &quot;If I free my mother, I'll be strong again.&quot; Alice: &quot;If you free her, the light goes out and people die.&quot; The Lost One: &quot;People die now. I watched one on your step.&quot; Then, quieter: &quot;At the chain it all came back at once. Every song. For one second I had all of her. If I could sit by her an hour, I'd give you Mim whole.&quot; It's the only offer anyone has made Alice since the bridge. &quot;You sit by her. You don't touch the lock.&quot; &quot;Yes, Ali.&quot; The second lie, and this time Alice half knows it.\u003c/p>"},{"oref":"Scene 5","id":128,"seq":5,"title":"Harding Works, the shop window, midnight","added":true,"act":"Act One","kind":"scene","sum":"Alice climbs the Works wall to tell the only person who would understand that her sister is coming back, and that she's frightened of what's coming back with her. Through the lit glass she sees Nathaniel and Eldgard still at one bench, finishing each other's equations, his father's hand on his shoulder, the Heartglass half-built between them. It's everything he has wanted his whole life, and she can see that it is. She doesn't knock. Her breath fogs the pane. She wipes it clean with her glove, the one with his handkerchief folded inside it, and goes back down the wall. A second later Nathaniel looks up, at a window with nobody in it.","loc":"Harding Works","when":"Alice climbs the Works wall to tell the only person who would understand that her sister is coming back, and that she's frightened of what's coming back with her.","th":"sisters","also":["investigation"],"ch":["alice","nathaniel","eldgard"],"turn":"","w":114,"ed":"Revised Nov 14: the sisters' past","fl":[],"html":"\u003cp>Alice climbs the Works wall to tell the only person who would understand that her sister is coming back, and that she's frightened of what's coming back with her. Through the lit glass she sees Nathaniel and Eldgard still at one bench, finishing each other's equations, his
