he East End outer feed during Lantern Night is a separate operation. The core has its own alarm, so disabling the street circuit does not make Jamie's attack undetectable.\u003c/p>\n\u003cp>\u003cstrong>Xylon.\u003c/strong> A fictional Vykra compulsion poison, distinct from winter's kiss. Jennie delivers it through the dark coating on a borrowed face's lips. Miriam recognises its taste, resists the first involuntary reach for her blades and throws both away; the compulsion redirects her body toward the river. It is murder, not a voluntary leap. The command ends with Miriam's first cardiac arrest; it is spent, not merely paused by the cold. The Lost One's later movements and eventual mortality therefore do not restart it. Xylon leaves no frost signature. Frost on the recovered body comes from the daughter of the White. Its existence does not give Grise remote control of anyone at will. An act compelled by Xylon cannot satisfy the Tithe's willingness or the release price's free gift.\u003c/p>\n\u003cp>\u003cstrong>Borrowed face.\u003c/strong> Jennie's face-veil is a prepared, short-lived gallowglass cosmetic fitted to one likeness. It alters visible features, not voice, height, memories, blood, cold immunity or the chain's eligibility. Jennie remains silent in the carriage; Miriam's own greeting and immediate kiss do the work of recognition. Close wet contact begins to spoil the veil at the mouth. It cannot sustain an open-ended replacement of Jamie or explain any other identity reveal without its own preparation and visible evidence.\u003c/p>\n\u003cp>\u003cstrong>The White.\u003c/strong> A world of snow, wind and wolves on the far side of the chain. Time stops there. Whatever this side sends into it is kept exactly as it went in, and doesn't come back.\u003c/p>\n\u003cp>\u003cstrong>Places.\u003c/strong> Harding House (Mayfair) and its glasshouse. The Harding Works over Tyburn, with the core deep below. Gin Lane tenements. Blackwood Bridge. The Shadwell laundry. Lambrick House and the Pimlico gasworks, where the Tyburn conduit (the old Works drain) runs under the city into the Thames. The Lantern Guard tower at Charing Cross. Parliament. Newgate.\u003c/p>\n\u003ch2>Lore: the past\u003c/h2>\n\u003cp>The Hardings did not find a monster. They took a mother, and four centuries of light run on that. Alistair's son paid the founding in 1489, a Harding sister paid in 1839, and 1889 is the second cycle.\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Year\u003c/th>\u003cth>What happened\u003c/th>\u003cth>Where we learn it\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1488–89\u003c/td>\u003ctd>A hard winter. The wall between London and the White thins at Tyburn, and Morgana's daughter wanders through. The Hardings are the Crown's hangmen at Tyburn.\u003c/td>\u003ctd>Ep 5 (Morgana), Ep 9\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1489\u003c/td>\u003ctd>Alistair Harding nets the frost child and uses her as bait. Morgana comes for her, and he chains her in cold iron. Her blood burns green on the gallows timber.\u003c/td>\u003ctd>Ep 1 cold open (in shadow), Ep 10 cold open\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1489\u003c/td>\u003ctd>The bargain. Morgana: &quot;Free me, and pay in light. Keep me, and pay in sons.&quot; The daughter goes free, the mother stays, and the chain is sealed with Alistair's blood, to be fed with a willing Harding life every fifty years. His firstborn, Edric, nine, is the founding payment.\u003c/td>\u003ctd>Ep 1 cold open (the boy with the lantern; Alistair steps aside for the child), Ep 10 cold open, Ep 9\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1489–90\u003c/td>\u003ctd>The blood hardens into gallowglass. The Hargraves, a Harding cadet branch, try to free her, led by a cousin of nineteen, Marian, who goes for the chain with a hammer. Alistair cuts her down at the lock, hangs the ringleaders, three thousand on the field, and keeps the rest alive underground, to breed the lives the chain will need. The Hardings call the place the Orchard. &quot;Hargrave&quot; becomes the punishment name, and their blood is still Harding blood.\u003c/td>\u003ctd>Ep 1 (the cousin at the treeline), Ep 5 cold open (the raid and the full field), Ep 3 blood test, Ep 4 (Marsh's rhyme), Ep 8 (the Orchard)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1539–1789\u003c/td>\u003ctd>Every fifty years a Hargrave from the Orchard, raised from birth to believe it holy, walks down the stair at first snow. The Hardings keep the Crown's gallows at Tyburn so nobody asks where the Hargraves went.\u003c/td>\u003ctd>Ep 4 (Marsh's rhyme), Ep 8 (the Orchard)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1689\u003c/td>\u003ctd>The Crown finds out anyway. It charters the Lantern Guard to protect the Ring and, in a sealed annex to the Harding Charter, is told what the light is. It signs. Every Lord Chancellor since has kept the annex locked in his desk.\u003c/td>\u003ctd>Ep 4 (Vane never asks), Ep 9 (Eldgard names it), Ep 10 (Westminster)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1839\u003c/td>\u003ctd>The Orchard's children stop believing. None of them will walk.\u003c/td>\u003ctd>Ep 9\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1839\u003c/td>\u003ctd>So a Harding walks instead. Ottoline &quot;Otty&quot; Harding, nineteen, Eldgard's older sister, goes down at first snow of her own will. The family says she died of fever in Switzerland. Eldgard is eight. Byron, fourteen, is her page and keeps her ribbon. First cycle.\u003c/td>\u003ctd>Ep 2 plaque, Ep 6 ribbon, Ep 9\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1860–72\u003c/td>\u003ctd>Eldgard marries Josephine, ex-Vykra. Jamie is born in 1864 and raised as the next payment. In 1867 Tobias Marsh, an Orchard man, escapes, is caught and is locked in Newgate as a madman, cell 1417; the last thing he saw below was Marian's baby boy. In 1872 Eldgard takes that boy, Nixon, six, out of the Orchard, tells him his mother Marian died of fever, and sends him to the charity school as the spare. The Orchard failed in 1839. Eldgard's wager is a Hargrave raised free, given a name, a rank and a family to love, who will one night walk down the stair for that family without being asked. An order would spoil him. He has to want to. Marian dies in the cells four years later.\u003c/td>\u003ctd>Ep 4 (Marsh), Ep 7 (the file), Ep 8 (Marian's name), Ep 9\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1889\u003c/td>\u003ctd>A Tithe year. Miriam trips the Blackwood return on 2 November. Jamie's blood cracks the lock; as Miriam is forced from the bridge, the daughter takes his bloody locket and is drawn toward its twin. The transfer in the Thames, rescue and resurrection are shown in the opening of Episode 2.\u003c/td>\u003ctd>Ep 1, Ep 9, Ep 10\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>Why now.\u003c/strong> 1839 plus fifty is 1889: a Tithe year, and the son raised to pay it dies seven weeks before it's due.\u003c/p>\n\u003cp>\u003cstrong>Otty, in the season.\u003c/strong> She is never seen. She appears four times: the brass on the chancel wall in Ep 2, Eldgard's &quot;She told me my sister was still singing&quot; in Ep 5, the blue ribbon in Byron's pocket in Ep 6, and Eldgard's confession in Ep 9. By then the audience knows what Eldgard's &quot;I raised Jamie for it&quot; is a copy of.\u003c/p>\n\u003cp>\u003cstrong>The Orchard.\u003c/strong> Under the Works, thirteen steps below the coal-hatch stair, is a gallery of bunks and iron rings where Hargraves were kept alive for four hundred years: fed well, kept healthy, and taught from the cradle that walking down the stair was holy. Every fifty years one of them did. They were the cattle in the contract. Hardings are taught never to say the word upstairs. The first name on its wall is Marian, who led the raid in 1489, and the last is Marian too, Nixon's mother: the Orchard named its girls after the first one who tried. The keepers counted the children in chalk tallies headed APPLES. By 1889 the herd is gone. Marsh's rhyme counts the seven who were left when he ran, and Nixon is the only Hargrave anyone ever brought out into the light.\u003c/p>\n\u003cp>\u003cstrong>Tobias Marsh.\u003c/strong> An Orchard man who ran in 1867 and was caught. The Crown holds him in Newgate as a madman, cell 1417, and nobody listens to what he sings. Jamie Harding visited him every Sunday for two years and learned the way down. The diagram in Jamie's boot-tree in Ep 2 shows the chain, and beside it the Orchard: a stair of thirteen steps going down from a hatch marked coal. That is why Jamie went to the Works with a plan in Ep 1, and why Nixon, tracing a dead boy's footsteps without knowing it, ends up in the Orchard in Ep 8.\u003c/p>\n\u003cp>\u003cstrong>How Nixon learns it.\u003c/strong>\u003c/p>\n\u003col>\u003cli>Ep 2: home from the eastern marshes, he is made Lantern-Captain, and Eldgard pins the lantern on him: &quot;My family looks after its own.&quot; At Jamie's grave Eldgard puts him at his right hand.\u003c/li>\u003cli>Ep 3: his blood test glows green, and Eldgard pats his head: &quot;Still good.&quot; Felix gives him the Newgate slip.\u003c/li>\u003cli>Ep 4: Marsh pinches his cheek, &quot;Marian's chin!&quot;, and sings the rhyme. Nixon walks away not understanding it.\u003c/li>\u003cli>Ep 7 and 8: Tamara gives him the file, and he carries it a week before he opens it on the morning of the wedding: &quot;Reserve. Blood suitable.&quot; He learns he is the spare, not what the spare is for.\u003c/li>\u003cli>Ep 8: he follows the rhyme down thirteen steps, and finds the Orchard and his mother's name. This is the scene that turns him.\u003c/li>\u003cli>Ep 9: he frees Marsh in the Newgate break-out. Hours later Eldgard confirms all of it in the Snow Confession, including what the spare was grown to do.\u003c/li>\u003cli>Ep 10: he offers himself with his eyes open. &quot;They grew me for this the way they grew my mother.&quot;\u003c/li>\u003c/ol>\n\u003ch2>The players\u003c/h2>\n\u003cp>Six young leads, each trying to prove they belong somewhere, and three adults who protect them by controlling them.\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Character\u003c/th>\u003cth>Who\u003c/th>\u003cth>Wants\u003c/th>\u003cth>The lie they believe\u003c/th>\u003cth>Secret\u003c/th>\u003cth>Arc\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Nathaniel Harding\u003c/strong>, 21\u003c/td>\u003ctd>Second son, gauntlet engineer at the Works\u003c/td>\u003ctd>A seat in &quot;the work&quot; and his father's respect\u003c/td>\u003ctd>Being useful is the same as being loved\u003c/td>\u003ctd>Buys contraband parts in the undercity; a childhood &quot;nightmare&quot; that is a real memory\u003c/td>\u003ctd>From wanting into the family business to switching off London's light and taking the city's hatred\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Alice Bounds\u003c/strong>, 20\u003c/td>\u003ctd>Undercity glim-runner and Vykra novice\u003c/td>\u003ctd>First, to make Miriam see she's grown, by joining the Vykra her sister wants her nowhere near. Then, to get her sister well, and keep her\u003c/td>\u003ctd>Love means keeping someone close by any means, because nobody ever stood in front of her\u003c/td>\u003ctd>Her first Vykra contract is to get close to Nathaniel. Until Ep 7 she believes her sister survived the bridge\u003c/td>\u003ctd>From holding on to letting go. The Lost One stays because Alice offers to let her leave\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>The Lost One\u003c/strong>, &quot;four hundred winters and nine days&quot;\u003c/td>\u003ctd>Morgana's daughter, wearing Miriam's body\u003c/td>\u003ctd>To free her mother\u003c/td>\u003ctd>Love is a weakness of the body she wears\u003c/td>\u003ctd>She lets Alice believe she's Miriam. Miriam was still alive when she came through, and asked her for something. And she inherited Miriam's guilt along with her memories\u003c/td>\u003ctd>From a mission to a sister. Chooses to stay, and becomes mortal\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Nixon Hargrave\u003c/strong>, 23\u003c/td>\u003ctd>Youngest Lantern-Captain, a charity-school boy, Nathaniel's best friend. Secretly taken from the Hargrave Orchard at six\u003c/td>\u003ctd>To belong in the officer class, and to the family that raised him\u003c/td>\u003ctd>Obedience is the price of belonging\u003c/td>\u003ctd>Since Jamie's funeral Eldgard has made him his right hand: taken him below the Works, given him the keys and the family's secrets, including whose shot hit Jamie. He keeps all of it from Nathaniel\u003c/td>\u003ctd>The replacement son. Comes home from the eastern marshes and is given everything Nathaniel ever wanted: the father's time, the keys, the stair. Loves it, can't refuse it, and loses his best friend for it. Then learns what he was chosen for: not an heir, a spare, fattened to walk down the stair so Nathaniel won't. Offers his life freely, is refused, and ends leading the Guard on his own terms\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Tamara Lambrick\u003c/strong>, 19\u003c/td>\u003ctd>The coal baron's daughter, engaged to Nathaniel, a codebreaker\u003c/td>\u003ctd>To be her father's heir, not his bargaining chip\u003c/td>\u003ctd>If she proves her worth, her father will finally see her\u003c/td>\u003ctd>Reads his ciphers; in love with Nixon\u003c/td>\u003ctd>From the chess piece to the player who holds both houses\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Cole Pruett\u003c/strong>, 17\u003c/td>\u003ctd>A Wick in Nixon's company\u003c/td>\u003ctd>To be a real Lantern\u003c/td>\u003ctd>Heroes don't get scared\u003c/td>\u003ctd>Fired the shot that hit Jamie, in the strobe, terrified; kept a copy of the log page his Captain burned to protect him\u003c/td>\u003ctd>Comic relief who becomes the conscience. Dies holding a flash-line in Episode 10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Eldgard Harding\u003c/strong>, 58\u003c/td>\u003ctd>Patriarch and Keeper of the chain\u003c/td>\u003ctd>To keep four million people warm\u003c/td>\u003ctd>The many outweigh my sons\u003c/td>\u003ctd>Let Jamie bleed into the chain; raised Nixon as a spare\u003c/td>\u003ctd>Dies telling the truth: &quot;Don't be me.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Josephine Harding\u003c/strong>, 50\u003c/td>\u003ctd>Matriarch, ex-Vykra\u003c/td>\u003ctd>To keep Nathaniel alive at any cost\u003c/td>\u003ctd>Control is protection\u003c/td>\u003ctd>Hired Alice; killed Inspector Hawke; allied with Lambrick\u003c/td>\u003ctd>Gives herself to the White so her son doesn't have to\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Byron\u003c/strong>, 64\u003c/td>\u003ctd>Butler, ex-Lantern sergeant who guarded the core\u003c/td>\u003ctd>To see Nathaniel safe\u003c/td>\u003ctd>Loyalty means silence\u003c/td>\u003ctd>Loved Josephine thirty years ago and let her escape a kill\u003c/td>\u003ctd>Dies speaking: &quot;You were always enough.&quot;\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>Supporting\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Lord Hector Lambrick\u003c/strong>, 55. A coal baron losing the light war. He wants London back on coal and owned by him. When he sees Morgana, his reaction is greed, and he wants her bled faster.\u003c/li>\u003cli>\u003cstrong>Ajax Fink\u003c/strong>, 35. Lambrick's enforcer, an ex-Guardsman drummed out of the corps, carrying the Black Gauntlet. He's funny, patient and terrifying, and he survives too long.\u003c/li>\u003cli>\u003cstrong>Mother Grise\u003c/strong>, 70. Runs the Vykra out of the Shadwell laundry. She sells to everyone and loves no one, except, briefly, girls who beat her.\u003c/li>\u003cli>\u003cstrong>Inspector Felix Hawke\u003c/strong>, 40. Met police. The only man who saw a corpse get up, and the first to die for saying so in public (Episode 4).\u003c/li>\u003cli>\u003cstrong>Lord Chancellor Vane\u003c/strong>, 60. The Crown. He doesn't want the truth, only the lights on, and the one thing the Crown must never be seen to have known kept in his desk: the 1689 annex, with the Crown's signature on the chain.\u003c/li>\u003cli>\u003cstrong>Morgana.\u003c/strong> Nine feet of ice and green fire in iron hooks. She speaks rarely, and every word costs someone.\u003c/li>\u003cli>\u003cstrong>Jamie Harding\u003c/strong>, 25 (Episode 1 and cold opens). The heir raised to die for the chain, who chose love and sabotage instead.\u003c/li>\u003cli>\u003cstrong>Miriam Bounds\u003c/strong>, 24 (Episode 1 and cold opens). Alice's older sister, carrying Jamie's child, and about to quit the Vykra and run with him, coming back for Alice the same night. Hard, quick and funny, a Vykra runner who can face a street fight yet cannot speak the shame of freezing as a child while Alice was hurt. She plans the escape, performs the Blackwood shutdown and fights the Xylon that murders her.\u003c/li>\u003cli>\u003cstrong>Jennie and Jennifer\u003c/strong>, 19. Twin sisters, Grise's finest, raised at the mangles since they could stand. They're identical down to the scar through the left eyebrow, which only Jennie has; Jennifer pins her hair to the right so people can tell them apart, and Jennie pins hers to the left so they can't be sure. Jennie is the knife: silent, patient, never the first to blink, and she wore Jamie's face to give Miriam the Xylon kiss. Jennifer is the ear: she follows Miriam's ticket purchase, buys the driver's rendezvous, chews mint, pours tea and remembers every word anyone says in front of her. They are the sisterhood Grise sells: two girls who will never leave each other, because neither of them will ever leave her. They are the mirror the Bounds sisters are held up to.\u003c/li>\u003cli>\u003cstrong>Old Wren\u003c/strong>, 60s. Gin Lane herb-woman who set Alice's arm when she was nine and never asked how it broke. She's the one who tells Alice her sister will get better.\u003c/li>\u003c/ul>\n\u003ch3>The wound under the sisters\u003c/h3>\n\u003cp>When Alice and Miriam were small, their stepfather drank and kept a belt. Miriam, four years older, made Alice a promise in the dark under their bed: \u003cem>nothing will ever touch you while I'm here.\u003c/em> Then the belt came out, and Miriam didn't move. She never once moved. What she did was teach Alice to count: the posts of the fence outside the window, one to eight, over and over, until it was over. &quot;Eight posts and he's done.&quot; That's the counting game. The sisters have played it as a joke for fifteen years, and neither of them has ever said where it came from. The stepfather went into the river one winter, drunk, and nobody looked for him. That's the story Alice was twelve for and still believes. The river gave him back a week later, and the parish buried him. Alice once saw Miriam crying at his grave and decided she was grieving him; she has never forgiven herself for not understanding why. The truth is Miriam's. At sixteen she held his head under at the Thames stairs, counting, because a younger Mother Grise had offered her the Vykra knot for &quot;one simple task.&quot; She told herself she did it for Alice. She never knew if that was true, and she never told anyone.\u003c/p>\n\u003cp>After the river Miriam turned cold, and let herself. She took Grise's work far outside the city, came home less, and loved Alice in ways Alice couldn't see: by keeping her out of the life. &quot;This life brings nothing but misery.&quot; Behind Miriam's back, Grise has spent three years telling Alice she has the hands for it. Alice wants in because it's the only way to stand where her sister stands and be seen. By November 1889 each sister is trying to save the other from the same woman, and neither knows it.\u003c/p>\n\u003cp>Alice keeps all of it \u003cstrong>behind the eightfold fence\u003c/strong>, her own phrase, the one she uses when anyone gets close: \u003cem>that's behind the fence.\u003c/em> It's the root of her lie. She learned that love is holding on, because nobody held the line for her.\u003c/p>\n\u003cp>Miriam carried it differently: guilt, all of it, never said. When the Lost One comes through in the river and puts Miriam on like a coat, it gets the guilt with the memories. A creature that has never felt anything human now has fifteen years of a sister's shame, and no idea what to do with it.\u003c/p>\n\u003cp>\u003cstrong>How the show handles it.\u003c/strong> The abuse is never shown. It lives in sound (a buckle, a floorboard), in Alice's flinch, and in the counting. It's about what it did to two girls, not about the man. The season's two flashbacks keep to this: under the bed we hear him and never see him (Ep 3 cold open), and at the river we see only the back of his head going under (Ep 7, scene 3).\u003c/p>\n\u003cp>\u003cstrong>The irony at the heart of the sisters' story.\u003c/strong> Miriam knew she owed Alice an apology, and a confession, and meant to give both on the night she came back for her. She never came back. The Lost One isn't Miriam, but she gives both, and that's how Alice knows her sister is dead.\u003c/p>\n\u003ch2>Season map\u003c/h2>\n\u003cp>First three episodes: the promise and the sisters. Episodes 4 and 5 prove the engine, with the midseason reveal in 5. Episodes 6 and 7 make everything worse, Episode 8 springs the trap, and the last two episodes run over one night.\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Ep\u003c/th>\u003cth>Clock\u003c/th>\u003cth>Title\u003c/th>\u003cth>Focus\u003c/th>\u003cth>Set piece\u003c/th>\u003cth>The turn\u003c/th>\u003cth>Tag\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>49 days\u003c/td>\u003ctd>The Exhibition\u003c/td>\u003ctd>One night, two houses and a shared escape plan\u003c/td>\u003ctd>Narrows; Miriam trips Blackwood; the core raid and false carriage\u003c/td>\u003ctd>A Wick shoots Jamie; Jennie uses his face and Xylon to murder Miriam\u003c/td>\u003ctd>Jamie left with Eldgard; Miriam forced over the rail. Rescue and resurrection open Episode 2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>48 → 47 days\u003c/td>\u003ctd>The Wake\u003c/td>\u003ctd>What came back?\u003c/td>\u003ctd>River transfer and rescue, then dawn resurrection and escape. The Frost Killer is born\u003c/td>\u003ctd>Alice takes the Lost One home. Nathaniel finds a Guard cartridge at the core\u003c/td>\u003ctd>Morgana lifts her head: &quot;My daughter is here.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>42 days\u003c/td>\u003ctd>Lanterns\u003c/td>\u003ctd>Nixon's hunt\u003c/td>\u003ctd>Leaper chase across the Christmas crystal market\u003c/td>\u003ctd>Nixon picks Cole over the capture. Nathaniel finds Alice and the Lost One\u003c/td>\u003ctd>&quot;You smell like the man who keeps my mother.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>38 days\u003c/td>\u003ctd>The Hearing\u003c/td>\u003ctd>The Charter hearing and Jamie's killer\u003c/td>\u003ctd>Docks fight with Ajax, then a murder on the witness stand\u003c/td>\u003ctd>Ajax: &quot;Your brother paid me.&quot; Felix dies, and the Lost One is framed. Nixon meets Marsh\u003c/td>\u003ctd>Josephine washes frost off her fingers\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>33 days\u003c/td>\u003ctd>Lantern Night\u003c/td>\u003ctd>The heist into the core\u003c/td>\u003ctd>Four plans on one festival night, then every lamp in London bursts at once, and the crush\u003c/td>\u003ctd>The light is a woman. Nathaniel is the next Tithe. Nixon locks the door\u003c/td>\u003ctd>The Lost One: &quot;I'm going to free her. Even if they all freeze.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>28 days\u003c/td>\u003ctd>Coal\u003c/td>\u003ctd>The cold city and Byron\u003c/td>\u003ctd>Pimlico gasworks explosion\u003c/td>\u003ctd>The Crown seizes the Works. Byron dies telling the truth\u003c/td>\u003ctd>&quot;Then you know I love you.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>21 days\u003c/td>\u003ctd>The Girl Who Isn't\u003c/td>\u003ctd>Two reveals: the sister and the best friend\u003c/td>\u003ctd>Wolves of the White in Whitechapel; the music-hall siege\u003c/td>\u003ctd>&quot;You're not her.&quot; Then Alice chooses her anyway. Nixon confesses\u003c/td>\u003ctd>Tamara kisses Nixon and gives him a folder with his name on it. He can't open it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>14 days\u003c/td>\u003ctd>The Wedding\u003c/td>\u003ctd>Every faction moves on the same morning\u003c/td>\u003ctd>The wedding, the taking and the mutiny\u003c/td>\u003ctd>Nathaniel marries Tamara to save her, and while Alice watches, the Vykra take her sister. Nixon finds the Orchard\u003c/td>\u003ctd>Morgana makes it snow, two weeks early\u003c/td>\u003c/tr>\u003ctr>\u003ctd>9\u003c/td>\u003ctd>First snow\u003c/td>\u003ctd>The Snow Confession\u003c/td>\u003ctd>Evening to midnight: the assault\u003c/td>\u003ctd>Newgate break-out, then storming the Works\u003c/td>\u003ctd>Eldgard dies and tells everything\u003c/td>\u003ctd>Josephine pulls the lever\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>The last night\u003c/td>\u003ctd>The Tithe\u003c/td>\u003ctd>Midnight to dawn\u003c/td>\u003ctd>London goes dark and the wolves come\u003c/td>\u003ctd>Nathaniel frees Morgana. Josephine goes into the White. The Lost One stays. At dawn, he says Alice's name\u003c/td>\u003ctd>The Record: every climax under Nathaniel's voice, a heartbeat, then Jamie, kept in the White. DAY ONE\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch3>How the season stays producible\u003c/h3>\n\u003cp>Morgana is a practical performer in prosthetics from the waist up, with CG for the ice and fire and the full nine feet saved for Eps 5, 8 and 10. The pilot shows only her hand. The wolves are shown the way the flash-bursts show everything: one strobe frame at a time, so we render frames, not sequences, and the audience's imagination does the rest. Ep 4 (a hearing room and a dock) and Ep 7's Pavilion (one interior, a hundred extras and a song) are the season's contained episodes, which pays for the Newgate break-out and Tyburn hill.\u003c/p>\n\u003ch3>The choices that shape the season\u003c/h3>\n\u003cp>Every episode turns on a decision where both options are right and both cost something. Nathaniel makes the heaviest ones, and nobody makes a choice that can be undone.\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Ep\u003c/th>\u003cth>Who\u003c/th>\u003cth>The choice\u003c/th>\u003cth>What it costs\u003c/th>\u003cth>What it changes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Nixon\u003c/td>\u003ctd>Capture the Lost One, or save Cole\u003c/td>\u003ctd>Duty. He lets her go\u003c/td>\u003ctd>Vane has a reason to break him later\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Nathaniel\u003c/td>\u003ctd>Take the Frost Killer to his father and finally be the useful son, or hide her\u003c/td>\u003ctd>His father's trust, and the law: four people are dead\u003c/td>\u003ctd>He becomes her accomplice, and Felix follows them to the glasshouse\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Nathaniel\u003c/td>\u003ctd>Pull Ajax up (the only witness against Lambrick) or let him drop (Jamie's grave)\u003c/td>\u003ctd>Justice for his brother, and the case against Lambrick\u003c/td>\u003ctd>The ledger now has to come from Tamara, and in Ep 9 Ajax comes back to kill his father\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Nathaniel\u003c/td>\u003ctd>Leave with Alice and the Lost One, or stay to hear the rest from his father\u003c/td>\u003ctd>Alice's trust, and the Lost One's safety\u003c/td>\u003ctd>He chooses his father, and Alice leaves without him\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>Alice\u003c/td>\u003ctd>The sister she lost, or the girl standing in front of her\u003c/td>\u003ctd>Her grief\u003c/td>\u003ctd>She chooses the Lost One anyway\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>Nixon\u003c/td>\u003ctd>Keep the father's confidence, or tell his best friend how far inside the house he has been taken\u003c/td>\u003ctd>The friendship, or the father\u003c/td>\u003ctd>He tells him, all of it, on their roof, and Nathaniel stops trusting him\u003c/td>\u003c/tr>\u003ctr>\u003ctd>9\u003c/td>\u003ctd>Nixon\u003c/td>\u003ctd>Turn his forty on every Harding for the Orchard, or take the hand of the brother who was raised to die for the same man\u003c/td>\u003ctd>His anger, the first thing that has ever been his\u003c/td>\u003ctd>He takes it: &quot;Then you're family. God help you.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>Alice\u003c/td>\u003ctd>Stay with her sister in the glasshouse, or go and watch him marry\u003c/td>\u003ctd>Her sister, alone when the Vykra come\u003c/td>\u003ctd>The Lost One is taken, and Nathaniel owes Alice a debt he can never repay\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>Nixon\u003c/td>\u003ctd>Say the word and take Tamara out of the church, or hand her the ring\u003c/td>\u003ctd>Her, maybe for good\u003c/td>\u003ctd>He hands it to her properly, and walks out of the chapel holding the empty box\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>Nixon\u003c/td>\u003ctd>Obey Vane and fire, or stand down\u003c/td>\u003ctd>His rank and his men\u003c/td>\u003ctd>Forty Lanterns follow him\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>Nathaniel\u003c/td>\u003ctd>Say &quot;I will&quot; with Alice watching from the gallery, or leave Tamara to her father\u003c/td>\u003ctd>His freedom, and the girl at the rail\u003c/td>\u003ctd>Tamara is untouchable, and he's married\u003c/td>\u003c/tr>\u003ctr>\u003ctd>9\u003c/td>\u003ctd>Alice\u003c/td>\u003ctd>Chase Ajax toward her sister, or stay with Nathaniel while his father dies\u003c/td>\u003ctd>Minutes her sister doesn't have\u003c/td>\u003ctd>His hand finds hers behind his back\u003c/td>\u003c/tr>\u003ctr>\u003ctd>9\u003c/td>\u003ctd>Josephine\u003c/td>\u003ctd>Believe Eldgard that the mother will never allow the trade, or bet that nobody in hooks refuses an open door\u003c/td>\u003ctd>Alice's sister, and any forgiveness from her son\u003c/td>\u003ctd>Morgana refuses the door, the Heartglass cracks, and the price falls back on a Harding\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>Morgana\u003c/td>\u003ctd>Walk out through the door her daughter holds open, or tear her own hooks deeper to shut it\u003c/td>\u003ctd>Four hundred years of wanting out\u003c/td>\u003ctd>The Heartglass cracks, and Josephine sees exactly what she herself will do on Tyburn hill\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>Alice\u003c/td>\u003ctd>Let Nathaniel walk into the White, as she just let her sister choose, or stand in front of him\u003c/td>\u003ctd>The lesson she has only just learned about letting go\u003c/td>\u003ctd>She learns the difference: you let go of someone choosing to live, and you stand in front of someone choosing to die. Josephine goes instead\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>Alice\u003c/td>\u003ctd>Burn her hand on the lock, knowing it puts out every light in London\u003c/td>\u003ctd>Her hand, and her share of a city's hatred\u003c/td>\u003ctd>&quot;Us.&quot; The light ends because both of them chose it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>Nathaniel\u003c/td>\u003ctd>Go to Alice on Gin Lane, or stay and watch his mother\u003c/td>\u003ctd>The girl he loves, alone in the dark\u003c/td>\u003ctd>He stays, and follows his mother up the hill\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>Nathaniel\u003c/td>\u003ctd>Walk into the White himself, or let his mother go in his place\u003c/td>\u003ctd>His life, or his mother's\u003c/td>\u003ctd>He says &quot;Go,&quot; then refuses the Crown's silence and puts every name on the record\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch3>The themes, argued from every side\u003c/h3>\n\u003cp>Protection as control is the spine, and five more themes run underneath it. Every storyline argues a position on several of them at once. The season never says which answer is right: the outcomes refuse to line up into a moral, some of the wrong people win, and the viewer decides.\u003c/p>\n\u003cp>\u003cstrong>1. Protection as control.\u003c/strong> Every adult in this show hurts someone to keep them safe.\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Position\u003c/th>\u003cth>Who takes it\u003c/th>\u003cth>What it costs, or wins\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Control that spends a child\u003c/td>\u003ctd>Alistair (Edric), Eldgard (Jamie)\u003c/td>\u003ctd>Four hundred years of light; Eldgard dies telling the truth\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Control that works\u003c/td>\u003ctd>Josephine's contract on Alice\u003c/td>\u003ctd>The one thing she ever bought that worked: her son is loved\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Control that keeps what it owns\u003c/td>\u003ctd>Lambrick (&quot;providing&quot;)\u003c/td>\u003ctd>He can't put the crystals down, and dies in the vault\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Mercy that destroys\u003c/td>\u003ctd>Byron lets the assassin go at the gate\u003c/td>\u003ctd>Thirty years later she sets the trap he dies in\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A kind lie\u003c/td>\u003ctd>Old Wren\u003c/td>\u003ctd>Five weeks of a sister, a child she called gone, then the bill\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Letting go that saves\u003c/td>\u003ctd>Morgana, then Alice, on Tyburn hill\u003c/td>\u003ctd>The daughter stays because she was free to leave\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Standing in front\u003c/td>\u003ctd>Miriam could not stop the childhood abuse; the Lost One and then Alice change the inherited pattern\u003c/td>\u003ctd>Miriam fights her murder and asks someone to go back for Alice\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Protecting no one\u003c/td>\u003ctd>Mother Grise\u003c/td>\u003ctd>She survives everything, and pours the tea\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Protecting an institution\u003c/td>\u003ctd>Vane and the 1689 annex\u003c/td>\u003ctd>The record stands, and so does the Crown\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Protecting by telling the truth\u003c/td>\u003ctd>Nathaniel's Record, Cole's diary\u003c/td>\u003ctd>The city hates him; the dead get their names\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>2. Bought, or given.\u003c/strong> Almost everything in this London has a price. The season keeps asking what is left that can only be given.\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Position\u003c/th>\u003cth>Who takes it\u003c/th>\u003cth>What it costs, or wins\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Love that started as a purchase\u003c/td>\u003ctd>Josephine buys Alice's attention for her son\u003c/td>\u003ctd>It turns real: &quot;I'd have done it for nothing&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Everything for sale\u003c/td>\u003ctd>Mother Grise sells Alice's contract, then Alice's sister\u003c/td>\u003ctd>She ends the season pouring tea for the girl who beat her\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Paying double for access\u003c/td>\u003ctd>Jamie pays Ajax four hundred for a copy of the Blackwood cabinet key Lambrick paid two hundred to acquire\u003c/td>\u003ctd>Miriam uses it to trip the generator; Jamie reaches the chain\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Silence for sale\u003c/td>\u003ctd>Vane offers Nixon a captain's lantern\u003c/td>\u003ctd>Nixon leaves it on the desk\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A gift nobody can price\u003c/td>\u003ctd>Tamara opens her father's coal depots for nothing\u003c/td>\u003ctd>She ends the season holding the city's heat\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Given, not taken\u003c/td>\u003ctd>The White's price, paid by Josephine walking into it; Nathaniel says &quot;Alice&quot; when nobody has paid for it\u003c/td>\u003ctd>The only payments the season treats as clean\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>3. Who pays for the light.\u003c/strong> London is warm because somebody is cold. The question is never whether someone pays, only who, and whether they know.\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Position\u003c/th>\u003cth>Who takes it\u003c/th>\u003cth>What it costs, or wins\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Paying without knowing\u003c/td>\u003ctd>London, every lamp-lit street\u003c/td>\u003ctd>Hears the bill in the Record\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Knowing, and keeping the lamps lit\u003c/td>\u003ctd>Eldgard; the Crown's 1689 annex\u003c/td>\u003ctd>Eldgard dies telling it; the Crown locks it back in the drawer\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hearing it and calling it the drug\u003c/td>\u003ctd>Glim-runners, who hear the Weeping and blame the batch\u003c/td>\u003ctd>Alice runs glim for years and never once listens\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Paying with your body\u003c/td>\u003ctd>Morgana in her hooks; the Hargraves of the Orchard\u003c/td>\u003ctd>One walks free; the others get their names read off a wall\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A new master, the same arithmetic\u003c/td>\u003ctd>Lambrick's coal: &quot;She could be bled faster&quot;\u003c/td>\u003ctd>Dies holding crystals gone dull as river stones\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Choosing the dark\u003c/td>\u003ctd>Nathaniel opens the lock\u003c/td>\u003ctd>The most hated man in London, and the first Harding nobody died for\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>4. What gets written down.\u003c/strong> Every lie in the season is a record: a brass plate, a burned page, a receipt, a sealed annex. The season ends by writing the true one.\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Position\u003c/th>\u003cth>Who takes it\u003c/th>\u003cth>What it costs, or wins\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>The official lie\u003c/td>\u003ctd>Otty's brass, DIED ABROAD; &quot;fever in Switzerland&quot;\u003c/td>\u003ctd>A chisel takes the words off, one letter at a time\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Destroying the record\u003c/td>\u003ctd>Nixon burns the discharge-log page\u003c/td>\u003ctd>Cole copies it from memory, and it puts the shot on the record anyway\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Keeping the record\u003c/td>\u003ctd>Cole's diary; the names on the Orchard wall; Marsh's rhyme\u003c/td>\u003ctd>Cole dies, and his diary convicts the living\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The record as a weapon\u003c/td>\u003ctd>Tamara's copy of her father's ledger\u003c/td>\u003ctd>She exposes him under her own name\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A name withheld\u003c/td>\u003ctd>&quot;Bounds&quot;; Nathaniel never says &quot;Alice&quot;\u003c/td>\u003ctd>The first time he sees her name it's on a bill; the first time he says it, nobody has paid\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The record sealed\u003c/td>\u003ctd>The Crown's 1689 annex\u003c/td>\u003ctd>Read out at Westminster, then locked away again\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>5. The spare and the heir.\u003c/strong> Nathaniel believes being useful is the same as being loved. Half the cast was raised as somebody's spare part.\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Position\u003c/th>\u003cth>Who takes it\u003c/th>\u003cth>What it costs, or wins\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>The heir raised to be spent\u003c/td>\u003ctd>Jamie\u003c/td>\u003ctd>Chooses love and sabotage, and ends up kept in the White: not living, not buried\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The son who believes he's the spare\u003c/td>\u003ctd>Nathaniel\u003c/td>\u003ctd>Stops trying to be useful in Ep 3, and becomes the one who ends it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The spare on paper\u003c/td>\u003ctd>Nixon: &quot;Reserve. Blood suitable.&quot;\u003c/td>\u003ctd>Offers himself on purpose, is refused, and leads the Guard on his own terms\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A wedding, not a ledger\u003c/td>\u003ctd>Tamara\u003c/td>\u003ctd>Becomes the ledger\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The child as a vessel\u003c/td>\u003ctd>The Lost One: \u003cem>Vessel: White-born\u003c/em>\u003c/td>\u003ctd>Chooses a sister, and a body that can be warm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The boy who holds the lantern\u003c/td>\u003ctd>Edric, nine, in 1489\u003c/td>\u003ctd>Still holding it in the White, four hundred years later\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>6. Where you belong.\u003c/strong> Six young leads, each trying to prove they belong somewhere. Every faction offers belonging, and every offer has a price.\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Position\u003c/th>\u003cth>Who takes it\u003c/th>\u003cth>What it costs, or wins\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Belonging bought by obedience\u003c/td>\u003ctd>Nixon in the officer class\u003c/td>\u003ctd>Forty men follow him the day he stops obeying\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Belonging earned by skill\u003c/td>\u003ctd>Tamara in the Vykra, for her mind\u003c/td>\u003ctd>She outgrows it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Belonging taken back\u003c/td>\u003ctd>Alice, cut from the Vykra, then winning it by Vykra law\u003c/td>\u003ctd>Stitches her own knot, a pattern nobody taught her\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Belonging to a uniform\u003c/td>\u003ctd>Cole, the Wick who wants to be a real Lantern\u003c/td>\u003ctd>Dies as one\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Belonging to a house\u003c/td>\u003ctd>Josephine, who chose the Harding name\u003c/td>\u003ctd>Pays the house's last debt with it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Belonging to a person\u003c/td>\u003ctd>Alice and the Lost One: chosen, not inherited\u003c/td>\u003ctd>The only belonging in the season nobody bought\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch3>The motifs, and how each one turns\u003c/h3>\n\u003cp>The theme map says what the season argues. This is what the audience holds in its hands while it argues. Every recurring object, sound and phrase means one thing when we first see it and something else by the end, and that change is the point. Numbers in the last column refer to the six themes above. The list is short on purpose: a motif earns a place here only if it turns at least twice and carries a theme. Anything else is a callback, and lives in the ledger. When a motif comes back, it should come back changed.\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Motif\u003c/th>\u003cth>First meaning\u003c/th>\u003cth>How it turns\u003c/th>\u003cth>Themes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>The lantern\u003c/strong>\u003c/td>\u003ctd>A child made useful: Edric holds it up for his father (Ep 1 cold open)\u003c/td>\u003ctd>Pinned to Nixon's collar on his return (Ep 2); swung before five-year-old Nathaniel's eyes to make a memory a dream (Ep 8 cold open); ripped off and dropped in the gutter by forty men (Ep 8); slid across Vane's desk as a bribe and left there (Ep 10); Cole's Wick lamp lit with a match (the Record); still burning in Edric's hand in the White (final scene)\u003c/td>\u003ctd>1, 5, 6\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>The Guard oath\u003c/strong>: &quot;Light the dark. Keep the flame.&quot;\u003c/td>\u003ctd>Pride, sworn on the glass the day he comes home a hero (Ep 2)\u003c/td>\u003ctd>Obedience, mouthed behind the core door as he seals in his best friend (Ep 5); defiance, &quot;Keep the flame, Captain.&quot; &quot;I am.&quot; (Ep 8); ownership, &quot;The Guard will keep its own flame&quot; (Ep 10). Five words, four meanings\u003c/td>\u003ctd>1, 6\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Green light, then tallow\u003c/strong>\u003c/td>\u003ctd>Wonder and progress: a thousand green chandeliers (Ep 1), light somebody else pays for\u003c/td>\u003ctd>Evidence: it's her blood, and every lamp bursts at once (Ep 5); Byron's tallow candle, no green lamp since the core (Ep 5); the green dies street by street and nothing comes back, and a mother on Gin Lane lights tallow (Ep 10); candle to candle through broken panes, a surgeon by tallow, a match on the Guard roof (the Record). The season trades a light someone else pays for for one you pay for yourself\u003c/td>\u003ctd>2, 3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>A flame held until it burns\u003c/strong>\u003c/td>\u003ctd>The match burns to Alice's fingers and she doesn't flinch (Ep 1)\u003c/td>\u003ctd>Nathaniel's candle burns to his fingers while he watches her lamp (Ep 8, scene 16); her palm held on the overloaded gauntlet until the ice lets go (Ep 10, scene 5). How these two say love before they can\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>The Lantern Hymn\u003c/strong>\u003c/td>\u003ctd>A church tune over London (Ep 2 funeral)\u003c/td>\u003ctd>It's Morgana's lullaby with words nailed over it (Ep 5); the Lost One hums it to the orange trees while she waits to be taken (Ep 8); sings it back in the old tongue (Ep 10); plays wordless under the Record\u003c/td>\u003ctd>3, 4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>The skipping rhyme\u003c/strong>: &quot;Green light, green light, who's in the cellar tonight?&quot;\u003c/td>\u003ctd>Background noise through a window on Gin Lane (Ep 1, scene 9)\u003c/td>\u003ctd>Horror: Nixon is standing in the cellar (Ep 8, scene 18); taken back: \u003cem>nobody's in the cellar tonight\u003c/em> (the Record)\u003c/td>\u003ctd>3, 4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Counting\u003c/strong>\u003c/td>\u003ctd>&quot;One post, two post&quot;: whispered in a dead man's wardrobe (Ep 2)\u003c/td>\u003ctd>What two girls did under a bed while a man was in the room (Ep 2–3); what Miriam did while she held him under the river (Ep 7); &quot;Nine is the one where we get up&quot; (Ep 7); Alice moves on nine and beats Grise (Ep 9); Nathaniel gets to nine on his own (Ep 10). Also the thirteen steps, and the card: \u003cem>49 DAYS\u003c/em>, \u003cem>0 DAYS\u003c/em>, \u003cem>DAY ONE\u003c/em>\u003c/td>\u003ctd>1, 6\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Oranges\u003c/strong>\u003c/td>\u003ctd>Stolen and tossed, instead of a birthday (Ep 1)\u003c/td>\u003ctd>The Lost One's apology (Ep 3); avoidance, &quot;Eat that&quot; (Ep 4); the orange trees where they rehearse &quot;I will&quot; (Ep 8); Alice peels one for her sister, badly, in one long ruined spiral (the Record)\u003c/td>\u003ctd>2, 6\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Gloves and the knot\u003c/strong>\u003c/td>\u003ctd>The Vykra mark of belonging (Ep 4)\u003c/td>\u003ctd>Cut out of Alice's glove (Ep 4); his handkerchief folded where the knot was (Ep 4); the knot inside Josephine's glove at the chapel door (Ep 8); Jennifer's glove at the tea shop (Ep 6) and Jennie's on Gin Lane (Ep 10); Alice stitches a pattern nobody taught her (the Record)\u003c/td>\u003ctd>2, 6\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>The handkerchief\u003c/strong>\u003c/td>\u003ctd>The one thing he did that day nobody told him to (Ep 2)\u003c/td>\u003ctd>Not returned (Ep 3); kept in the glove (Ep 4); it falls into the frost, &quot;You kept it&quot; (Ep 6); torn in two on Tyburn hill (Ep 10)\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Rings\u003c/strong>\u003c/td>\u003ctd>The wolf-crest ring: the pact, on Alistair's hand (Ep 1)\u003c/td>\u003ctd>the Harding lockets at Jamie's and Miriam's throats (Ep 1–2); the ring that makes Tamara a wife before the attendants reach the altar (Ep 8); a wedding ring handed over &quot;properly&quot; (Ep 8); the wolf ring opens the lock (Ep 10) and goes into a dead grate, the burned lockets beside it on the mantel (the Record)\u003c/td>\u003ctd>1, 2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Names on hard surfaces\u003c/strong>\u003c/td>\u003ctd>Otty's brass, DIED ABROAD (Ep 2)\u003c/td>\u003ctd>FROST KILLER bills (Ep 4); Alice's first name, seen first on a bill (Ep 8); DON'T FOLLOW ME in frost (Ep 8); MARIAN, first and last on the Orchard wall, and J.H. in chalk (Ep 8); the chisel, and the Crown's record (Ep 10)\u003c/td>\u003ctd>4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Marian, and the Orchard\u003c/strong>\u003c/td>\u003ctd>A cousin of nineteen at the treeline, never named (Ep 1); a madman's &quot;count the apples&quot; (Ep 4)\u003c/td>\u003ctd>&quot;Marian!&quot; as she falls at the lock (Ep 5); &quot;Marian's chin!&quot; (Ep 4); the first and last name on the wall, and the keepers' tallies headed APPLES: the children were the crop (Ep 8); Nixon's thumb stops on her name (the Record)\u003c/td>\u003ctd>3, 4, 5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>The stair\u003c/strong>s\u003c/td>\u003ctd>Three stairs in one house (the core stair, the Orchard's thirteen steps, Byron's Guard stair), and for four hundred years all of them went one way. Edric carries the lantern down the first, alone (Ep 10 cold open)\u003c/td>\u003ctd>Nathaniel, five, follows a lullaby down it (Ep 8); thirteen steps to the Orchard (Ep 8); Otty &quot;walked down the stair singing&quot; (Ep 9); the Guard stair Nixon clears so others can climb out (Ep 10). The way this house sends its children down, until somebody uses it to go up\u003c/td>\u003ctd>1, 5\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>The moments built to be quoted.\u003c/strong> Every season has five or six beats fans will use as shorthand for the whole show. These are ours. Each one gets room: no score under it, a held shot after it, and no other line stepping on it.\u003c/p>\n\u003cul>\u003cli>&quot;Hear what, sir?&quot; (Ep 2, St Bride's)\u003c/li>\u003cli>&quot;Nine is the one where we get up.&quot; (Ep 7)\u003c/li>\u003cli>&quot;Us.&quot; (Ep 10, the lock)\u003c/li>\u003cli>&quot;Not her.&quot; and then &quot;Not him.&quot; (Ep 10, two mothers at two doors)\u003c/li>\u003cli>&quot;A Harding chained me. A Harding comes with me.&quot; (Ep 10, Tyburn hill)\u003c/li>\u003cli>The chisel taking DIED ABROAD off the brass, one letter at a time (the Record)\u003c/li>\u003cli>The match on the Guard roof (the Record)\u003c/li>\u003c/ul>","craft":"\u003ch2>The craft rules this season obeys\u003c/h2>\n\u003cp>Eight rules, each taken from a writer you named, and each one checked against every episode below.\u003c/p>\n\u003col>\u003cli>\u003cstrong>Therefore and but, never &quot;and then.&quot;\u003c/strong> Each scene is caused by the last one or cuts across it. Parker and Stone's test: if the honest word between two beats is &quot;and then,&quot; one of them goes. (\u003ca href=\"https://perell.com/note/but-therefore-rule/\">Perell\u003c/a>)\u003c/li>\u003cli>\u003cstrong>Secrets with long fuses (Brent Weeks).\u003c/strong> Weeks plots the character arcs and the big external climaxes, then layers in secrets he pays off books later. Here each major secret has three layers: what the public believes, what the audience learns, and what the character learns last, when it stings most. Everything serves his one rule: keep people turning pages. (\u003ca href=\"https://reactormag.com/highlights-from-brent-weeks-r-fantasy-ama/\">Reactor, Weeks AMA\u003c/a>)\u003c/li>\u003cli>\u003cstrong>Plans collide.\u003c/strong> Most set pieces happen because three or four characters have separate plans for the same night. Nobody's plan works as drawn. The explosion, the heist and the wolves in the streets all come out of choices, never coincidence.\u003c/li>\u003cli>\u003cstrong>Sisters only trauma can split (Arcane).\u003c/strong> Alex Yee: the sisters had to be &quot;so emotionally entwined that only an event that traumatic&quot; could drive a wedge between them. Alice and the Lost One get three episodes of closeness before the first wound and four before the break. (\u003ca href=\"https://www.syfy.com/syfy-wire/arcane-co-creator-alex-yee-unpacks-the-act-i-twists?amp\">SYFY, Alex Yee\u003c/a>)\u003c/li>\u003cli>\u003cstrong>Power lives inside intimate relationships (Willimon).\u003c/strong> &quot;Politics itself doesn't interest me. It's power that interests me.&quot; Every marriage, friendship and parent-child pair here is also a power arrangement, shown through behaviour and hands more than speeches. (\u003ca href=\"https://script-consultant.co.uk/bfi-beau-willimon-interview-notes-pt1/\">BFI notes\u003c/a>)\u003c/li>\u003cli>\u003cstrong>One vision per episode.\u003c/strong> Each episode has one focus you could put on its poster (the ball, the morgue, the hunt, the hearing, the heist), 17 to 26 numbered scenes, with runtime to be checked against the actual action and pauses, and every scene turns something. The three tent-poles (Ep 5, the midseason heist; Ep 8, the wedding; Ep 10, the finale) run 21 to 22 so their set pieces have room. The pilot runs 26; the other non-tentpole episodes run 17 to 19. Scene count is not a timed script.\u003c/li>\u003cli>\u003cstrong>The grid.\u003c/strong> Your colleague's Want / Obstacle / Solution / Twist table runs for the four or five characters who carry each episode. The others rest and come back with their own stories later.\u003c/li>\u003cli>\u003cstrong>Whimsy earns the grim.\u003c/strong> Each episode alternates a light beat with a dark one, gives at least one feeling that goes unsaid, and gives one young character a chance to prove they belong. Every episode ends on a tag that changes the board: a reveal, an escalation, or a choice that can't be taken back.\u003c/li>\u003c/ol>"},"season":{"html":"\u003ch2>The pitch\u003c/h2>\n\u003cp>London, November 1889, and the whole city glows green. Every lamp, tram and furnace burns gallowglass, a crystal that only House Harding knows how to grow, at the Harding Works on the old gallows field at Tyburn. The Hardings say it grows from iron in the ground. In fact it grows from a woman. For four hundred years they have kept a creature from the frozen world beyond, the White, chained under the Works, and they bleed her for light. Every fifty years, at the first snow, the chain that holds her is fed with a Harding life. The last was Eldgard's own older sister. The next is due this winter, and the son raised to pay it is about to die.\u003c/p>\n\u003cp>\u003cstrong>Series engine.\u003c/strong> London runs on a secret. Every faction wants to own the secret, the girl at its centre or the boy who will inherit it. Every week, one plan for the light runs into another.\u003c/p>\n\u003cp>\u003cstrong>Season question.\u003c/strong> Can Nathaniel Harding end the bargain that lights London without becoming the father who kept it? Under it runs the sisters' question: will Alice Bounds let the thing wearing her dead sister's face choose its own life?\u003c/p>\n\u003cp>\u003cstrong>Theme.\u003c/strong> Protection as control. Every adult in this show hurts someone to keep them safe. The young ones have to learn whether love can let go. Five more themes run underneath it: bought or given, who pays for the light, what gets written down, the spare and the heir, and where you belong. The season argues every one of them from several sides and never says which side is right.\u003c/p>\n\u003cp>\u003cstrong>Tone.\u003c/strong> The dread of \u003cem>Chernobyl\u003c/em>, the sisters of \u003cem>Arcane\u003c/em>, \u003cem>House of Cards\u003c/em> in the drawing rooms. Whimsy breathes between the violence: a creature learning what an orange is, a recruit tangled in laundry lines, two promised friends who plan to be very polite to each other for forty years.\u003c/p>\n\u003cp>\u003cstrong>The clock.\u003c/strong> Every episode opens on a card: 49 DAYS TO FIRST SNOW. In four hundred years the first snow over Tyburn has always come on the longest night, 21 December, so that's the day everyone counts to. At the end of Episode 8 it comes two weeks early, because the prisoner makes it fall, and the last two episodes play out over one night.\u003c/p>\n\u003cp>\u003cstrong>Kept from your outline:\u003c/strong> the Harding legacy and the 1489 massacre at the Gallows; Miriam's death and the Lost One; the sister reveal (&quot;You're not her&quot;); Josephine's protection turning into control; Eldgard's Snow Confession; Nixon's Hargrave blood; Tamara the operative; the Vykra; Ajax; Miriam's red mittens.\u003c/p>\n\u003cp>\u003cstrong>Cut:\u003c/strong> Edmund, Virgil, the Chapel, the Duke, the Prime Minister, Trevane. Each one did a job someone else now does, or existed only to deliver information. Morgana moves from a nun's body in the Chapel to the chain under the Works, so the villain's secret and the light's secret become the same secret.\u003c/p>\n\u003cp>\u003cstrong>New:\u003c/strong> Mother Grise, who runs the Vykra; Lord Chancellor Vane, for the Crown; and the Royal Lantern Guard as a full corps with its own gear, ranks and oath.\u003c/p>\n\u003ch3>The clock, episode by episode\u003c/h3>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Ep\u003c/th>\u003cth>Clock\u003c/th>\u003cth>Title\u003c/th>\u003cth>Focus\u003c/th>\u003cth>Set piece\u003c/th>\u003cth>The turn\u003c/th>\u003cth>Tag\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>49 days\u003c/td>\u003ctd>The Exhibition\u003c/td>\u003ctd>One night, two houses and a shared escape plan\u003c/td>\u003ctd>Narrows; Miriam trips Blackwood; the core raid and false carriage\u003c/td>\u003ctd>A Wick shoots Jamie; Jennie uses his face and Xylon to murder Miriam\u003c/td>\u003ctd>Jamie left with Eldgard; Miriam forced over the rail. Rescue and resurrection open Episode 2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>48 → 47 days\u003c/td>\u003ctd>The Wake\u003c/td>\u003ctd>What came back?\u003c/td>\u003ctd>River transfer and rescue, then dawn resurrection and escape. The Frost Killer is born\u003c/td>\u003ctd>Alice takes the Lost One home. Nathaniel finds a Guard cartridge at the core\u003c/td>\u003ctd>Morgana lifts her head: &quot;My daughter is here.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>42 days\u003c/td>\u003ctd>Lanterns\u003c/td>\u003ctd>Nixon's hunt\u003c/td>\u003ctd>Leaper chase across the Christmas crystal market\u003c/td>\u003ctd>Nixon picks Cole over the capture. Nathaniel finds Alice and the Lost One\u003c/td>\u003ctd>&quot;You smell like the man who keeps my mother.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>38 days\u003c/td>\u003ctd>The Hearing\u003c/td>\u003ctd>The Charter hearing and Jamie's killer\u003c/td>\u003ctd>Docks fight with Ajax, then a murder on the witness stand\u003c/td>\u003ctd>Ajax: &quot;Your brother paid me.&quot; Felix dies, and the Lost One is framed. Nixon meets Marsh\u003c/td>\u003ctd>Josephine washes frost off her fingers\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>33 days\u003c/td>\u003ctd>Lantern Night\u003c/td>\u003ctd>The heist into the core\u003c/td>\u003ctd>Four plans on one festival night, then every lamp in London bursts at once, and the crush\u003c/td>\u003ctd>The light is a woman. Nathaniel is the next Tithe. Nixon locks the door\u003c/td>\u003ctd>The Lost One: &quot;I'm going to free her. Even if they all freeze.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>28 days\u003c/td>\u003ctd>Coal\u003c/td>\u003ctd>The cold city and Byron\u003c/td>\u003ctd>Pimlico gasworks explosion\u003c/td>\u003ctd>The Crown seizes the Works. Byron dies telling the truth\u003c/td>\u003ctd>&quot;Then you know I love you.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>21 days\u003c/td>\u003ctd>The Girl Who Isn't\u003c/td>\u003ctd>Two reveals: the sister and the best friend\u003c/td>\u003ctd>Wolves of the White in Whitechapel; the music-hall siege\u003c/td>\u003ctd>&quot;You're not her.&quot; Then Alice chooses her anyway. Nixon confesses\u003c/td>\u003ctd>Tamara kisses Nixon and gives him a folder with his name on it. He can't open it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>14 days\u003c/td>\u003ctd>The Wedding\u003c/td>\u003ctd>Every faction moves on the same morning\u003c/td>\u003ctd>The wedding, the taking and the mutiny\u003c/td>\u003ctd>Nathaniel marries Tamara to save her, and while Alice watches, the Vykra take her sister. Nixon finds the Orchard\u003c/td>\u003ctd>Morgana makes it snow, two weeks early\u003c/td>\u003c/tr>\u003ctr>\u003ctd>9\u003c/td>\u003ctd>First snow\u003c/td>\u003ctd>The Snow Confession\u003c/td>\u003ctd>Evening to midnight: the assault\u003c/td>\u003ctd>Newgate break-out, then storming the Works\u003c/td>\u003ctd>Eldgard dies and tells everything\u003c/td>\u003ctd>Josephine pulls the lever\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>The last night\u003c/td>\u003ctd>The Tithe\u003c/td>\u003ctd>Midnight to dawn\u003c/td>\u003ctd>London goes dark and the wolves come\u003c/td>\u003ctd>Nathaniel frees Morgana. Josephine goes into the White. The Lost One stays. At dawn, he says Alice's name\u003c/td>\u003ctd>The Record: every climax under Nathaniel's voice, a heartbeat, then Jamie, kept in the White. DAY ONE\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>","map":[{"clock":"Clock","title":"Title","focus":"Focus","piece":"Set piece","turn":"The turn","tag":"Tag"},{"clock":"49 days","title":"The Exhibition","focus":"One night, two houses and a shared escape plan","piece":"Narrows; Miriam trips Blackwood; the core raid and false carriage","turn":"A Wick shoots Jamie; Jennie uses his face and Xylon to murder Miriam","tag":"Jamie left with Eldgard; Miriam forced over the rail. Rescue and resurrection open Episode 2"},{"clock":"48 → 47 days","title":"The Wake","focus":"What came back?","piece":"River transfer and rescue, then dawn resurrection and escape. The Frost Killer is born","turn":"Alice takes the Lost One home. Nathaniel finds a Guard cartridge at the core","tag":"Morgana lifts her head: \"My daughter is here.\""},{"clock":"42 days","title":"Lanterns","focus":"Nixon's hunt","piece":"Leaper chase across the Christmas crystal market","turn":"Nixon picks Cole over the capture. Nathaniel finds Alice and the Lost One","tag":"\"You smell like the man who keeps my mother.\""},{"clock":"38 days","title":"The Hearing","focus":"The Charter hearing and Jamie's killer","piece":"Docks fight with Ajax, then a murder on the witness stand","turn":"Ajax: \"Your brother paid me.\" Felix dies, and the Lost One is framed. Nixon meets Marsh","tag":"Josephine washes frost off her fingers"},{"clock":"33 days","title":"Lantern Night","focus":"The heist into the core","piece":"Four plans on one festival night, then every lamp in London bursts at once, and the crush","turn":"The light is a woman. Nathaniel is the next Tithe. Nixon locks the door","tag":"The Lost One: \"I'm going to free her. Even if they all freeze.\""},{"clock":"28 days","title":"Coal","focus":"The cold city and Byron","piece":"Pimlico gasworks explosion","turn":"The Crown seizes the Works. Byron dies telling the truth","tag":"\"Then you know I love you.\""},{"clock":"21 days","title":"The Girl Who Isn't","focus":"Two reveals: the sister and the best friend","piece":"Wolves of the White in Whitechapel; the music-hall siege","turn":"\"You're not her.\" Then Alice chooses her anyway. Nixon confesses","tag":"Tamara kisses Nixon and gives him a folder with his name on it. He can't open it"},{"clock":"14 days","title":"The Wedding","focus":"Every faction moves on the same morning","piece":"The wedding, the taking and the mutiny","turn":"Nathaniel marries Tamara to save her, and while Alice watches, the Vykra take her sister. Nixon finds the Orchard","tag":"Morgana makes it snow, two weeks early"},{"clock":"First snow","title":"The Snow Confession","focus":"Evening to midnight: the assault","piece":"Newgate break-out, then storming the Works","turn":"Eldgard dies and tells everything","tag":"Josephine pulls the lever"},{"clock":"The last night","title":"The Tithe","focus":"Midnight to dawn","piece":"London goes dark and the wolves come","turn":"Nathaniel frees Morgana. Josephine goes into the White. The Lost One stays. At dawn, he says Alice's name","tag":"The Record: every climax under Nathaniel's voice, a heartbeat, then Jamie, kept in the White. DAY ONE"}]},"scene_aliases":{"13":258,"17":22,"18":22,"19":22,"21":22,"221":258}}</script>
<script>
(function(){
'use strict';
const D=JSON.parse(document.getElementById('data').textContent);
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TH=Object.fromEntries(D.threads.map(t=>[t[0],{id:t[0],name:t[1],desc:t[2]}]));
const CH=Object.fromEntries(D.chars);
const short=id=>{const n=CH[id]||id;if(id==='lostone')return 'Lost One';if(id==='duke')return 'Duke';if(id==='pm')return 'Prime Minister';if(id==='vane')return 'Vane';if(id==='lambrick')return 'Lambrick';if(id==='grise')return 'Grise';if(id==='wren')return 'Wren';if(id==='felix')return 'Felix';if(id==='eldgard')return 'Eldgard';if(id==='josephine')return 'Josephine';if(id==='nathaniel')return 'Nathaniel';if(id==='lostone')return 'Lost One';return n.replace(/^(The |Lord |Councilman )/,'').split(' ')[0]};
const tc=id=>`var(--t-${id})`;
const ALL=[];D.eps.forEach(e=>e.scenes.forEach(s=>{s.ep=e.n;ALL.push(s)}));
const byId=new Map(ALL.map(s=>[s.id,s]));
Object.entries(D.scene_aliases||{}).forEach(([oldId,newId])=>{const target=byId.get(Number(newId));if(target)byId.set(Number(oldId),target)});
const store={get(k){try{return localStorage.getItem('gg.'+k)}catch(e){return null}},set(k,v){try{localStorage.setItem('gg.'+k,v)}catch(e){}}};
let focus=new Set(), query='', charFilter='';
const PIN='<svg viewBox="0 0 11 13" aria-hidden="true"><path d="M5.5 12s4.2-4 4.2-7A4.2 4.2 0 0 0 1.3 5c0 3 4.2 7 4.2 7z"/><circle cx="5.5" cy="5" r="1.4"/></svg>';

/* theme */
const root=document.documentElement;
const savedTheme=store.get('theme'); if(savedTheme) root.dataset.theme=savedTheme;
$('#theme').onclick=()=>{const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;root.dataset.theme=dark?'light':'dark';store.set('theme',root.dataset.theme)};

/* legend */
function drawLegend(){
  const L=$('#legend');
  L.innerHTML='<span class="hint">Storylines</span>'+D.threads.map(t=>`<button class="tchip" type="button" data-t="${t[0]}" style="--c:${tc(t[0])}" aria-pressed="${focus.has(t[0])}" title="${esc(t[2])}"><i></i>${esc(t[1])}</button>`).join('')+(focus.size?'<button class="clear" type="button" id="clearf">Show all</button>':'');
  $$('.tchip',L).forEach(b=>b.onclick=()=>toggleFocus(b.dataset.t));
  const c=$('#clearf');if(c)c.onclick=()=>{focus.clear();applyFilters()};
}
function toggleFocus(t){focus.has(t)?focus.delete(t):focus.add(t);applyFilters()}
function matches(s){
  if(focus.size && !(focus.has(s.th)||s.also.some(a=>focus.has(a)))) return false;
  if(charFilter && !s.ch.includes(charFilter)) return false;
  if(query){if(!s._t)s._t=(s.title+' '+s.sum+' '+s.loc+' '+s.when+' '+s.turn+' '+s.ch.map(c=>CH[c]||c).join(' ')+' '+s.html.replace(/<[^>]+>/g,' ')).toLowerCase();const hay=s._t;if(!query.split(/\s+/).every(w=>hay.includes(w)))return false}
  return true;
}
function applyFilters(){
  drawLegend();
  $$('[data-sid]').forEach(el=>{const s=byId.get(+el.dataset.sid);el.classList.toggle('dim',!matches(s))});
  $$('.tcount button').forEach(b=>b.setAttribute('aria-pressed',focus.has(b.dataset.t)));
  const n=$('#vis-count');if(n){const ep=D.eps.find(e=>e.n===cur.ep);const sc=ep.scenes.filter(s=>s.kind==='scene');const v=sc.filter(matches).length;n.textContent=v===sc.length?`${sc.length} scenes`:`${v} of ${sc.length} scenes match`}
}

/* braid strip */
function braid(ep,big){
  return `<div class="braid${big?' big':''}" role="list">`+ep.scenes.filter(s=>s.kind==='scene').map(s=>`<button type="button" role="listitem" data-sid="${s.id}" data-go="${s.id}" style="--c:${tc(s.th)};--w:${Math.max(70,Math.min(s.w,900))}" title="${esc(s.seq+'. '+s.title+' ('+TH[s.th].name+')')}">${big?s.seq:''}</button>`).join('')+'</div>';
}

/* season */
function drawSeason(){
  const V=$('#v-season');
  const counts={};ALL.forEach(s=>{if(s.kind==='scene')counts[s.th]=(counts[s.th]||0)+1});
  V.innerHTML=`<div class="season-head"><div><h2>Ten episodes, from the engagement to the last night</h2><p>${esc(D.eps.length)} episodes, ${ALL.filter(s=>s.kind==='scene').length} scenes. Each strip is one episode in scene order. A segment's colour is the storyline that scene moves forward, and its width follows how much happens in it. Select an episode to open its scene board, or a segment to jump straight to that scene.</p></div>
  <div class="clock" aria-label="Season clock"><div class="acts"><span>Act I</span><span>Act II</span><span>Act III</span></div>${D.eps.map(e=>`<div class="cell${e.n>=9?' snow':''}"><b>${e.n}</b><span>${esc(e.time.split(',')[0])}</span></div>`).join('')}</div></div>
  <div class="loom">${D.eps.map(e=>`<a class="lrow" href="#ep${e.n}"><div class="ln">${e.n}</div><div><div class="lt">${esc(e.title)}</div><div class="lg">${esc(e.log)}</div></div><div class="bwrap">${braid(e,false)}<div class="bmeta">${e.scenes.filter(s=>s.kind==='scene').length} scenes, ${esc(e.time)}</div></div><div class="tn">${esc(e.turn)}</div></a>`).join('')}</div>
  <div class="thread-key">${D.threads.map(t=>`<div style="--c:${tc(t[0])}"><i></i><div><b>${esc(t[1])}</b><span>${esc(t[2])}</span> <em>${counts[t[0]]||0} scenes</em></div></div>`).join('')}</div>`;
  wireGo(V);
}

/* episode */
function card(s){
  const fl=s.fl.length?`<span class="badge flag" title="${esc(s.fl.map(f=>f.id).join(', '))}">${s.fl.length===1?s.fl[0].id:s.fl.length+' flags'}</span>`:'';
  const where=(s.loc||s.when)?`<div class="where">${PIN}<span>${esc(s.loc)}${s.loc&&s.when?', ':''}${s.when?`<span class="when">${esc(s.when)}</span>`:''}</span></div>`:'';
  return `<article class="card" id="s${s.id}" data-sid="${s.id}" style="--c:${tc(s.th)}">
   <div class="top"><span class="seq" aria-label="Scene ${s.seq}">${s.seq}</span><div><h4>${esc(s.title)}</h4>${s.oref?`<div class="oref">${esc(s.oref)}</div>`:''}${(s.added||fl||s.ed)?`<div class="badges" style="margin-top:.3rem">${s.added?'<span class="badge add" title="Added in a recent pass">Added</span>':''}${s.ed?`<span class="badge ed" title="${esc(s.ed)}">Edited</span>`:''}${fl}</div>`:''}</div></div>
   ${where}
   <p class="sum">${esc(s.sum)}</p>
   ${s.turn?`<p class="turn"><b>Changes:</b> ${esc(s.turn)}</p>`:''}
   <div class="foot">${s.ch.map(c=>`<button type="button" class="cchip" data-char="${c}" title="Show ${esc(CH[c]||c)}'s scenes">${esc(short(c))}</button>`).join('')}${s.also.length?`<span class="also" title="Also touches: ${esc(s.also.map(a=>TH[a]?TH[a].name:a).join(', '))}">${s.also.map(a=>`<i style="--c:${tc(a)}"></i>`).join('')}</span>`:''}<button type="button" class="readbtn" aria-expanded="false">Read the scene</button></div>
   <div class="full">${s.html}</div></article>`;
}
function drawEpisode(n,scrollTo){
  const e=D.eps.find(x=>x.n===n); const V=$('#v-episode');
  const sc=e.scenes.filter(s=>s.kind==='scene');
  const tcount={};sc.forEach(s=>tcount[s.th]=(tcount[s.th]||0)+1);
  const order=Object.keys(tcount).sort((a,b)=>tcount[b]-tcount[a]);
  const present=[...new Set(e.scenes.flatMap(s=>s.ch))].sort((a,b)=>D.chars.findIndex(c=>c[0]===a)-D.chars.findIndex(c=>c[0]===b));
  let body='',lastAct=null;
  e.scenes.forEach(s=>{
    if(s.kind==='ref')return;
    const act=s.act||'';
    if(act!==lastAct){lastAct=act;if(act)body+=`<div class="actdiv"><h3>${esc(act)}</h3></div>`}
    if(s.kind==='marker'){body+=`<div class="marker" data-sid="${s.id}" style="--c:${tc(s.th)}"><b>${esc(s.title)}</b>. ${esc(s.sum)}</div>`;return}
    body+=card(s);
  });
  const refs=e.scenes.filter(s=>s.kind==='ref');
  V.innerHTML=`<div class="epnav">${D.eps.map(x=>`<a href="#ep${x.n}" ${x.n===n?'aria-current="page"':''} title="${esc(x.title)}">${x.n}</a>`).join('')}<span class="sp"></span>${n>1?`<a class="step" href="#ep${n-1}">Previous</a>`:''}${n<D.eps.length?`<a class="step" href="#ep${n+1}">Next episode</a>`:''}</div>
  <div class="ephead"><div><div class="num">Episode ${n} of 10, Act ${e.act}. ${esc(e.time)}</div><h2>${esc(e.title)}</h2><p class="log">${esc(e.log)}</p><p class="story">${esc(e.sum)}</p></div>
  <aside><h3>By the end</h3><p>${esc(e.turn)}</p><h3>Storylines in this episode</h3><div class="tcount">${order.map(t=>`<button type="button" data-t="${t}" style="--c:${tc(t)}" aria-pressed="false"><i></i><span>${esc(TH[t].name)}</span><span>${tcount[t]}</span></button>`).join('')}</div></aside></div>
  <div class="stripwrap">${braid(e,true)}<div class="cap"><span>Opening</span><span>Scene order, coloured by storyline</span><span>Final image</span></div></div>
  <div class="filters"><label>Character <select id="charsel"><option value="">Everyone</option>${present.map(c=>`<option value="${c}" ${c===charFilter?'selected':''}>${esc(CH[c]||c)}</option>`).join('')}</select></label><button type="button" class="iconbtn" id="openall">Open every scene</button><span class="count" id="vis-count"></span></div>
  <div class="grid">${body}</div>
  ${refs.length||e.frame?`<div class="refs">${e.frame?`<details class="ref"><summary>Episode notes <span>from the top of the outline section</span></summary><div class="full">${e.frame}</div></details>`:''}${refs.map(s=>`<details class="ref"><summary>${esc(s.title)} <span>${esc(s.sum)}</span></summary><div class="full">${s.html}</div></details>`).join('')}</div>`:''}`;
  $$('.tcount button',V).forEach(b=>b.onclick=()=>toggleFocus(b.dataset.t));
  $('#charsel').onchange=ev=>{charFilter=ev.target.value;applyFilters()};
  $('#openall').onclick=ev=>{const open=ev.target.textContent.startsWith('Open');$$('.card',V).forEach(c=>setOpen(c,open));ev.target.textContent=open?'Close every scene':'Open every scene'};
  $$('.readbtn',V).forEach(b=>b.onclick=()=>{const c=b.closest('.card');setOpen(c,!c.classList.contains('open'));if(c.classList.contains('open'))c.scrollIntoView({block:'nearest',behavior:'smooth'})});
  $$('.cchip',V).forEach(b=>b.onclick=()=>{charFilter=charFilter===b.dataset.char?'':b.dataset.char;$('#charsel').value=charFilter;applyFilters()});
  wireGo(V);
  applyFilters();
  if(scrollTo){const el=$('#s'+scrollTo);if(el){setOpen(el,true);requestAnimationFrame(()=>{el.scrollIntoView({block:'start'});el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),1800)})}}
  else window.scrollTo(0,0);
}
function setOpen(c,open){c.classList.toggle('open',open);const b=$('.readbtn',c);if(b){b.textContent=open?'Close':'Read the scene';b.setAttribute('aria-expanded',open)}}
function wireGo(V){$$('[data-go]',V).forEach(b=>b.onclick=ev=>{ev.preventDefault();ev.stopPropagation();const s=byId.get(+b.dataset.go);go(`ep${s.ep}/s${s.id}`)})}

/* characters */
function drawCharacters(sel){
  const V=$('#v-characters');
  const list=D.chars.map(c=>c[0]).filter(id=>D.arcs[id]||ALL.some(s=>s.ch.includes(id)));
  const cnt=(id,n)=>D.eps[n-1].scenes.filter(s=>s.kind==='scene'&&s.ch.includes(id)).length;
  const max=Math.max(...list.flatMap(id=>D.eps.map(e=>cnt(id,e.n))));
  sel=sel&&list.includes(sel)?sel:(store.get('char')||'nathaniel');
  store.set('char',sel);
  const rows=list.map(id=>`<tr data-c="${id}" aria-selected="${id===sel}" tabindex="0"><th>${esc(CH[id]||id)}</th>${D.eps.map(e=>{const k=cnt(id,e.n);const a=D.arcs[id]&&D.arcs[id][e.n];return k||a?`<td title="${esc(a?a.line:'')}"><span class="pip" style="--v:${(k/max).toFixed(2)}"></span>${a?`<small>${esc(a.state)}</small>`:''}</td>`:'<td class="none">·</td>'}).join('')}</tr>`).join('');
  const arc=D.arcs[sel]||{};
  const journey=D.eps.map(e=>{const a=arc[e.n];const ss=e.scenes.filter(s=>s.kind==='scene'&&s.ch.includes(sel));
    return `<div class="jcard${!a&&!ss.length?' off':''}"><div class="h"><b>${e.n}. ${esc(e.title)}</b><span>${ss.length} scene${ss.length===1?'':'s'}</span></div>${a?`<div class="st">${esc(a.state)}</div><p>${esc(a.line)}</p>`:`<p style="color:var(--muted)">${ss.length?'In the episode, no arc note.':'Not in this episode.'}</p>`}${ss.length?`<div class="sc">${ss.map(s=>`<a href="#ep${e.n}/s${s.id}" style="--c:${tc(s.th)}" title="${esc(s.seq+'. '+s.title)}">${s.seq}</a>`).join('')}</div>`:''}</div>`}).join('');
  const total=ALL.filter(s=>s.kind==='scene'&&s.ch.includes(sel)).length;
  const eps=D.eps.filter(e=>arc[e.n]||cnt(sel,e.n)).map(e=>e.n);
  V.innerHTML=`<div class="chars-layout"><div class="journey"><h2>${esc(CH[sel]||sel)}</h2><p class="sub">${total} scenes across ${eps.length} episode${eps.length===1?'':'s'}${eps.length?` (${eps[0]} to ${eps[eps.length-1]})`:''}. Each episode shows where they end up, then the scenes they're in, coloured by storyline.</p><div class="jlist">${journey}</div></div>
  <div><h3 style="font-family:var(--display);font-size:1.5rem;margin:0 0 .5rem">Who is in which episode</h3><p class="sub" style="color:var(--muted);margin:0 0 .7rem;font-size:.88rem">Bar length is how many scenes they have. The note under it is where they end that episode. Select a name to open their journey.</p>
  <div class="matrix-wrap"><table class="matrix"><thead><tr><th style="text-align:left;font-family:var(--ui);font-size:.8rem;padding-left:.7rem">Character</th>${D.eps.map(e=>`<th title="${esc(e.title)}">${e.n}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div></div></div>`;
  $$('tbody tr',V).forEach(r=>{const open=()=>go('characters/'+r.dataset.c);r.onclick=open;r.onkeydown=ev=>{if(ev.key==='Enter')open()}});
  window.scrollTo(0,0);
}

/* notes */
function drawNotes(){
  const V=$('#v-notes');
  let out='',total=0;
  D.eps.forEach(e=>{const items=e.scenes.flatMap(s=>s.fl.map(f=>({f,s})));if(!items.length)return;total+=items.length;
    out+=`<h3>Episode ${e.n}: ${esc(e.title)}</h3>`+items.map(({f,s})=>`<div class="note"><div class="id ${f.type}">${esc(f.id)}</div><div><a href="#ep${e.n}/s${s.id}">${s.seq?s.seq+'. ':''}${esc(s.title)}</a><p>${esc(f.text)}</p></div></div>`).join('')});
  V.innerHTML=`<div class="notes"><h2>Flags and open decisions</h2><p class="sub">${total} items pulled from the outline: merge flags (C numbers) mark places where two documents disagree or a call was made that needs your eye. Open decisions (O numbers) are choices nobody has made yet.</p>${out}</div>`;
  window.scrollTo(0,0);
}


/* documents */
function docBlock(h){return '<div class="doc">'+(h||'')+'</div>'}
function drawWorld(){
  const V=$('#v-world');
  V.innerHTML='<div class="doc"><h2>The world, and the one rule under it</h2>'+
    '<p class="lede">'+esc(D.seasonIntro||'')+'</p>'+
    (D.world&&D.world.html||'')+
    '<h2>The craft rules this season obeys</h2><p class="lede">Eight rules, each taken from a writer you named, and each one checked against every episode.</p>'+
    (D.world&&D.world.craft||'')+
    '</div>';
  window.scrollTo(0,0);
}
function drawLedger(){
  const V=$('#v-ledger');
  const rows=(D.ledger&&D.ledger.rows)||[];
  const list=rows.length?('<h3>Every setup, in one place</h3><table><thead><tr><th>Setup</th><th>Planted</th><th>Paid off</th></tr></thead><tbody>'+
    rows.map(r=>'<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td></tr>').join('')+
    '</tbody></table>'):'';
  V.innerHTML='<div class="doc"><h2>Setup and payoff ledger</h2>'+
    '<p class="lede">'+rows.length+' setups, and where each one closes. Everything planted is paid off inside the season, except the handful left open on purpose for Season 2.</p>'+
    list+
    (D.ledger&&D.ledger.inherit||'')+
    '</div>';
  window.scrollTo(0,0);
}

/* router */
const cur={v:'season',ep:1};
function readHash(){try{return decodeURIComponent((location.hash||'').slice(1))}catch(e){return ''}}
function go(h){
  try{if(readHash()!==h)history.pushState(null,'','#'+h)}catch(e){}
  route(h);
}
function route(forced){
  const h=(typeof forced==='string'&&forced)||readHash()||store.get('hash')||'season';
  let m;
  ['season','episode','characters','notes','world','ledger'].forEach(v=>$('#v-'+v).hidden=true);
  if((m=h.match(/^ep(\d+)(?:\/s(\d+))?$/))){cur.v='episode';const n=Math.min(10,Math.max(1,+m[1]));if(n!==cur.ep)charFilter='';cur.ep=n;$('#v-episode').hidden=false;drawEpisode(n,m[2]?+m[2]:null)}
  else if((m=h.match(/^characters(?:\/(\w+))?$/))){cur.v='characters';$('#v-characters').hidden=false;drawCharacters(m[1])}
  else if(h==='notes'){cur.v='notes';$('#v-notes').hidden=false;drawNotes()}
  else if(h==='world'){cur.v='world';$('#v-world').hidden=false;drawWorld()}
  else if(h==='ledger'){cur.v='ledger';$('#v-ledger').hidden=false;drawLedger()}
  else {cur.v='season';$('#v-season').hidden=false;drawSeason();window.scrollTo(0,0)}
  $('#legend').hidden=!(cur.v==='season'||cur.v==='episode');
  $$('nav.tabs a').forEach(a=>{const on=a.dataset.v===cur.v;on?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current');if(a.dataset.v==='episode')a.href='#ep'+cur.ep});
  store.set('hash',h);
  applyFilters();
}
window.addEventListener('popstate',()=>route());
window.addEventListener('hashchange',()=>{if(readHash()!==store.get('hash'))route()});
/* every in-page link goes through go(), so navigation works even where the address bar can't change (previews, sandboxed frames) */
document.addEventListener('click',ev=>{const a=ev.target.closest('a[href^="#"]');if(!a||ev.defaultPrevented||ev.metaKey||ev.ctrlKey)return;ev.preventDefault();go(a.getAttribute('href').slice(1))});
$('#q').addEventListener('input',ev=>{query=ev.target.value.trim().toLowerCase();if(query&&cur.v!=='episode'&&cur.v!=='season'){go('ep'+cur.ep)}applyFilters()});
document.addEventListener('keydown',ev=>{if(cur.v!=='episode'||ev.target.closest('input,select,textarea'))return;if(ev.key==='ArrowRight'&&cur.ep<10)go('ep'+(cur.ep+1));if(ev.key==='ArrowLeft'&&cur.ep>1)go('ep'+(cur.ep-1))});
route();
})();
</script>
</body>
