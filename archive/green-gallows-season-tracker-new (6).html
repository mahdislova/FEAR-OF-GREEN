 small, I couldn't.' I said yes. Then I wanted to.\" Miriam fought for her own life until Xylon forced her over. In the river, while she still had a choice about one thing, she asked the child to go back for Alice. That request extends her love; it does not turn her murder into a voluntary sacrifice. Alice laughs and cries at once: her sister did love her. She just couldn't do it herself. The Lost One stays. Morgana, who tore her own hooks rather than let her daughter pay, lets her stay, which is harder, and doesn't leave her the cold to stay with. She lays one hand flat on her daughter's chest and draws the White out of her, the way you'd draw a splinter. The crystal goes out of the girl's skin. She will never make snow again, and she will never again hear her mother singing in a lamp. What's left is a girl, shivering for the first time. Then she names the price: \"A Harding chained me. A Harding comes with me.\" She waits. It has to be given, and she won't take it. Nathaniel steps forward, and Alice steps in front of him, into the place nobody ever stood for her, her fist in his coat. Her first word to him all night: \"Don't.\"","loc":"Tyburn hill.","when":"The Lost One tells her the last thing: \"I have all of her now.","th":"white","also":["sisters","harding"],"ch":["lostone","alice","morgana","nathaniel"],"turn":"The Lost One tells her the last thing: \"I have all of her now. The birthdays, the songs, the river. This came last, because it was the last thing she ever thought. In the river she was still alive. She asked me something","w":275,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>The Lost One tells her the last thing: &quot;I have all of her now. The birthdays, the songs, the river. This came last, because it was the last thing she ever thought. In the river she was still alive. She asked me something. 'Go back to Ali. Stand in front of her. When we were small, I couldn't.' I said yes. Then I wanted to.&quot; Miriam fought for her own life until Xylon forced her over. In the river, while she still had a choice about one thing, she asked the child to go back for Alice. That request extends her love; it does not turn her murder into a voluntary sacrifice. Alice laughs and cries at once: her sister did love her. She just couldn't do it herself. The Lost One stays. Morgana, who tore her own hooks rather than let her daughter pay, lets her stay, which is harder, and doesn't leave her the cold to stay with. She lays one hand flat on her daughter's chest and draws the White out of her, the way you'd draw a splinter. The crystal goes out of the girl's skin. She will never make snow again, and she will never again hear her mother singing in a lamp. What's left is a girl, shivering for the first time. Then she names the price: &quot;A Harding chained me. A Harding comes with me.&quot; She waits. It has to be given, and she won't take it. Nathaniel steps forward, and Alice steps in front of him, into the place nobody ever stood for her, her fist in his coat. Her first word to him all night: &quot;Don't.&quot;\u003c/p>"},{"oref":"Scene 17","id":245,"seq":17,"title":"Tyburn hill","added":false,"act":"Act Three","kind":"scene","sum":"Josephine steps past him and says to Morgana the words Morgana said at the lever: \"Not him.\" Morgana looks at her for a long moment and knows her. Then, to her son: \"I'm a Harding. I chose the name.\" He catches his mother's wrist. Alice is still in front of him, her fist still in his coat. Two women holding him, one from each side of his life, and both of them are right. The wolves shift their weight in the snow. Josephine, quietly, the only time all season she asks him for anything: \"They'll say I died of fever in Switzerland.\" Nathaniel: \"No. They'll say your name.\" A long beat. His hand opens. \"Go.\" She kisses his forehead. To Alice: \"Keep him out of the Works.\" It's the contract she paid for in Episode 2, now given as a blessing. Alice: \"You bought me for him. It's the only thing you ever bought that worked.\" Josephine almost laughs, and that's how she goes. She takes Morgana's hand and they walk into the white. The wolves follow, and the storm goes with them. Why this isn't Otty again: Otty went willingly too, and his grandfather let her. The difference between Nathaniel and every Harding before him isn't the choice. It's the lie. Otty got a brass plate that said DIED ABROAD. Josephine gets the record (scenes 19 and 20).","loc":"Tyburn hill","when":"Josephine steps past him and says to Morgana the words Morgana said at the lever: \"Not him.\" Morgana looks at her for a long moment and knows her.","th":"harding","also":["white"],"ch":["josephine","nathaniel","alice","morgana"],"turn":"","w":229,"ed":"Revised Oct 13: four rules, new Ep 8","fl":[],"html":"\u003cp>Josephine steps past him and says to Morgana the words Morgana said at the lever: &quot;Not him.&quot; Morgana looks at her for a long moment and knows her. Then, to her son: &quot;I'm a Harding. I chose the name.&quot; He catches his mother's wrist. Alice is still in front of him, her fist still in his coat. Two women holding him, one from each side of his life, and both of them are right. The wolves shift their weight in the snow. Josephine, quietly, the only time all season she asks him for anything: &quot;They'll say I died of fever in Switzerland.&quot; Nathaniel: &quot;No. They'll say your name.&quot; A long beat. His hand opens. &quot;Go.&quot; She kisses his forehead. To Alice: &quot;Keep him out of the Works.&quot; It's the contract she paid for in Episode 2, now given as a blessing. Alice: &quot;You bought me for him. It's the only thing you ever bought that worked.&quot; Josephine almost laughs, and that's how she goes. She takes Morgana's hand and they walk into the white. The wolves follow, and the storm goes with them.\u003c/p>\n\u003cp>\u003cem>Why this isn't Otty again:\u003c/em> Otty went willingly too, and his grandfather let her. The difference between Nathaniel and every Harding before him isn't the choice. It's the lie. Otty got a brass plate that said DIED ABROAD. Josephine gets the record (scenes 19 and 20).\u003c/p>"},{"oref":"Scene 18","id":213,"seq":18,"title":"Tyburn hill, dawn","added":true,"act":"Act Three","kind":"scene","sum":"The snow stops in the middle of falling. Nathaniel is on his knees where his mother was, and for a long time nothing happens. Alice doesn't touch him. She kneels in front of him in the snow and lets him have it, because nobody ever let her. When it comes it isn't crying. It's a sound with no word in it, hhh, hhh, a man trying to breathe around something too big for his chest. She stays where he can see her until it passes. Then she takes the handkerchief out of her glove, the one he gave her at his brother's grave, and tears it in two. Rrrip. Half goes round the palm he cut at the lock. He takes the other half out of her fingers without asking and binds the hand she burned for him. Neither of them is any good at it. She doesn't know what to say to a man who has just said \"Go\" to his mother, so she gives him the most private thing she owns. Under her breath, the way Miriam taught her under the bed, she counts for him. \"One post. Two post.\" He knows it. He heard it in his brother's wardrobe five weeks ago and never asked. He counts with her. At eight she stops, because eight is where it has always ended. He keeps going. \"Nine.\" Nobody told him about nine. He got there on his own. And then, for the first time in ten episodes, he says her name. \"Alice.\" She hears it. He has never once said it, and she knows which bill he read it on. He's saying it now, when nobody has paid for it. He kisses her, or she kisses him; for the rest of their lives they will disagree about which.","loc":"Tyburn hill","when":"The snow stops in the middle of falling.","th":"sisters","also":["harding"],"ch":["nathaniel","alice"],"turn":"","w":299,"ed":"Revised Nov 14: the new pilot","fl":[],"html":"\u003cp>The snow stops in the middle of falling. Nathaniel is on his knees where his mother was, and for a long time nothing happens. Alice doesn't touch him. She kneels in front of him in the snow and lets him have it, because nobody ever let her. When it comes it isn't crying. It's a sound with no word in it, \u003cem>hhh, hhh\u003c/em>, a man trying to breathe around something too big for his chest. She stays where he can see her until it passes. Then she takes the handkerchief out of her glove, the one he gave her at his brother's grave, and tears it in two. \u003cem>Rrrip.\u003c/em> Half goes round the palm he cut at the lock. He takes the other half out of her fingers without asking and binds the hand she burned for him. Neither of them is any good at it. She doesn't know what to say to a man who has just said &quot;Go&quot; to his mother, so she gives him the most private thing she owns. Under her breath, the way Miriam taught her under the bed, she counts for him. &quot;One post. Two post.&quot; He knows it. He heard it in his brother's wardrobe five weeks ago and never asked. He counts with her. At eight she stops, because eight is where it has always ended. He keeps going. &quot;Nine.&quot; Nobody told him about nine. He got there on his own. And then, for the first time in ten episodes, he says her name. &quot;Alice.&quot; She hears it. He has never once said it, and she knows which bill he read it on. He's saying it now, when nobody has paid for it. He kisses her, or she kisses him; for the rest of their lives they will disagree about which.\u003c/p>"},{"oref":"Scene 19","id":210,"seq":19,"title":"Westminster, first light","added":false,"act":"Act Three","kind":"scene","sum":"The first dawn of the episode, grey through the tall windows, coal smoke rising from Tamara's fires. Vane names Nathaniel \"the man who put out London\" and signs a warrant. Tamara, Lady Harding and heir to Lambrick, puts the Heartglass folio on his desk, with the Crown's seal on the binding order. Beside it she lays her father's ledger, open at the night of the Charter vote: A.F., Pimlico, 300 gns. The man the Crown put on the Works board blew in its windows, and his daughter says so with his name and hers. Last, a needle, Vykra issue, the one she picked up on the gallery stairs the day Felix Hawke died. Alice comes with them and lays the twins' signed Blackwood statements beside the folio. She will not build a new sisterhood by hiding the old one's murder. No pardon for Jennie, Jennifer or Grise is granted by this hearing. Their names and acts enter the record for investigation. Nixon lays Cole's diary beside the statements, taken from the dead boy's lap: the burned discharge-log page copied word for word, and under it, in a seventeen-year-old's careful hand, 2 Nov. I hit him in the shoulder. I didn't know it was Mr James. Mr Harding sent me to the gate. The man on the floor was still talking. The Capt. burned the page so I could sleep. It puts Cole's shot on the record, and the Captain's silence, and the man who stayed behind with a living boy. Nixon could burn that page a second time. He sets it down open. Across the desk Nathaniel looks at him, the first time he has looked straight at him since the lock. \"I haven't forgiven you.\" \"I know.\" \"Stand where I can see you.\" Nixon steps up beside him, the way he did at the altar, and it means the opposite now. Vane slides a captain's lantern across the desk to Nixon, the price of his silence. Nixon leaves it there: \"The Guard will keep its own flame.\" Vane, cornered, offers Nathaniel the pardon on one condition: the Crown seals what happened under Tyburn, for the public good. Nathaniel: \"No. Write it down.\" Vane: \"The Crown doesn't keep that kind of record.\" Nathaniel: \"It has kept one since 1689. It's in your desk, under your signature.\" Vane doesn't blink; an annex in a drawer has never frightened a Lord Chancellor. Then Tamara, who hasn't sat down: \"Lambrick depots are feeding every grate in London this morning, my lord. They close at noon, unless that record is read into Hansard, all of it, where anyone with a penny can buy it.\" Outside the tall windows the coal smoke is the only warmth in the city, and every chimney of it is hers. Vane looks at the smoke for a long time. \"The House sits at two.\" Nathaniel turns to the clerk, and the clerk dips his pen. \"Edric Harding—\"","loc":"Westminster","when":"The first dawn of the episode, grey through the tall windows, coal smoke rising from Tamara's fires.","th":"city","also":["harding"],"ch":["vane","tamara","nixon","nathaniel","cole","eldgard","alice"],"turn":"The first dawn of the episode, grey through the tall windows, coal smoke rising from Tamara's fires. Vane names Nathaniel \"the man who put out London\" and signs a warrant. Tamara, Lady Harding and heir to Lambrick, puts ","w":488,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>The first dawn of the episode, grey through the tall windows, coal smoke rising from Tamara's fires. Vane names Nathaniel &quot;the man who put out London&quot; and signs a warrant. Tamara, Lady Harding and heir to Lambrick, puts the Heartglass folio on his desk, with the Crown's seal on the binding order. Beside it she lays her father's ledger, open at the night of the Charter vote: \u003cem>A.F., Pimlico, 300 gns.\u003c/em> The man the Crown put on the Works board blew in its windows, and his daughter says so with his name and hers. Last, a needle, Vykra issue, the one she picked up on the gallery stairs the day Felix Hawke died. Alice comes with them and lays the twins' signed Blackwood statements beside the folio. She will not build a new sisterhood by hiding the old one's murder. No pardon for Jennie, Jennifer or Grise is granted by this hearing. Their names and acts enter the record for investigation. Nixon lays Cole's diary beside the statements, taken from the dead boy's lap: the burned discharge-log page copied word for word, and under it, in a seventeen-year-old's careful hand, \u003cem>2 Nov. I hit him in the shoulder. I didn't know it was Mr James. Mr Harding sent me to the gate. The man on the floor was still talking. The Capt. burned the page so I could sleep.\u003c/em> It puts Cole's shot on the record, and the Captain's silence, and the man who stayed behind with a living boy. Nixon could burn that page a second time. He sets it down open. Across the desk Nathaniel looks at him, the first time he has looked straight at him since the lock. &quot;I haven't forgiven you.&quot; &quot;I know.&quot; &quot;Stand where I can see you.&quot; Nixon steps up beside him, the way he did at the altar, and it means the opposite now. Vane slides a captain's lantern across the desk to Nixon, the price of his silence. Nixon leaves it there: &quot;The Guard will keep its own flame.&quot; Vane, cornered, offers Nathaniel the pardon on one condition: the Crown seals what happened under Tyburn, for the public good. Nathaniel: &quot;No. Write it down.&quot; Vane: &quot;The Crown doesn't keep that kind of record.&quot; Nathaniel: &quot;It has kept one since 1689. It's in your desk, under your signature.&quot; Vane doesn't blink; an annex in a drawer has never frightened a Lord Chancellor. Then Tamara, who hasn't sat down: &quot;Lambrick depots are feeding every grate in London this morning, my lord. They close at noon, unless that record is read into Hansard, all of it, where anyone with a penny can buy it.&quot; Outside the tall windows the coal smoke is the only warmth in the city, and every chimney of it is hers. Vane looks at the smoke for a long time. &quot;The House sits at two.&quot; Nathaniel turns to the clerk, and the clerk dips his pen. &quot;Edric Harding—&quot;\u003c/p>"},{"oref":"Scene 20","id":211,"seq":20,"title":"The Record, final montage","added":false,"act":"Act Three","kind":"scene","sum":"Nathaniel's dictation carries over everything that follows. It starts as testimony, read flat and exact like a ledger, and somewhere in the middle it stops being for the clerk. No score until line 7, then the Lantern Hymn, the tune only, the way Morgana sang it. Every image is a climax from the season, seen in the days after: the dictation takes one morning, and the pictures run on across the weeks it sets moving. Nathaniel (V.O.) | On screen | --- | --- | \"Edric Harding. Nine years old. The year of our Lord fourteen hundred and eighty-nine. He carried the lantern down the stair himself, because his father asked him to.\" | The Works, dead. Snow falls through the broken roof onto empty iron hooks. The channels where her blood ran into London are dry and grey. | \"The Hargraves of the Orchard. Their names are scratched on a wall under Tyburn. I will read every one of them, if the clerk has ink.\" | The Orchard. Old Marsh holds the candle and reads the names off the wall, perfectly lucid now. Nixon writes them into Cole's diary. His thumb stops on MARIAN. | \"Ottoline Harding. Nineteen. Eighteen thirty-nine. She did not die abroad.\" | St Bride's. A mason's chisel takes DIED ABROAD off a brass plate, one letter at a time. Byron's blue ribbon is tied through the bracket. | \"James Harding. My brother. He tried to end it so I would never have to, and we said he was ill. We buried a coffin of slag and called it him. There was no body. I don't know where he is.\" | The long gallery. Jamie's portrait, laughing at something outside the frame. | \"Miriam Bounds. She cut the Blackwood return for my brother. The Vykra sent his face back to her with Xylon on its mouth. Jennie wore it; Jennifer found the driver; Mother Grise gave the order. She did not choose the river. Their own statements are part of this record.\" | Blackwood Bridge. The repaired generator cabinet stands open for the investigation. At a public desk the twins sign their statements under their own names; Alice waits without taking either sister's hand. | \"Inspector Felix Hawke, of Scotland Yard. He stood up in front of the Crown to say that someone had made the Frost Killer, and he was poisoned on the stand for it. My mother did it, for me. London blamed a frightened girl.\" | Scotland Yard. Felix's sling still hangs on his chair. A constable takes the FROST KILLER bills down off the wall, one by one. | \"Josephine Harding. My mother. She walked into the White on the night the snow came early, so the debt would end. She will have no brass that lies.\" | The music room. The piano lid closed. On it, a Vykra knife and a pair of gloves with the knot stitched inside. | \"For four hundred years this city was warm because somebody was cold. We called it light. We wrote a hymn over her crying so we'd never have to hear it.\" | Gin Lane. The mother from the night before lights a second tallow candle off her first and passes it through a broken pane to her neighbour. Window to window, the flame travels down the lane. Under it the Gin Lane children skip rope in the snow to the old rhyme, with a new last line: nobody's in the cellar tonight. | \"Every one of us lived on it. Most of us never knew the price. Some of us knew, and kept the lamps lit anyway.\" | The Works vault. A satchel half-buried in a drift, Lambrick's glove still on the strap. The crystals spilling out of it have gone dull as river stones. | \"I can't give you the light back. I won't. What I can give you is the bill, and the names of the people who paid it.\" | A Lambrick depot, gates thrown open. Tamara, in her father's greatcoat over a ruined wedding dress, signs the ledger as heir while the coal goes out to the queue for nothing. Alice stands beside her at the depot gate. Tamara holds out her hand, wrist up, the way the laundry closes a contract: his name on her paper, until the coal runs out. Alice takes it. Tamara looks up from the book, and she's the one deciding now. | \"So write them down. Keep them where your children can read them. And the next time somebody offers you a light that never goes out, ask who is paying for it.\" | The Guard tower roof. Forty Lanterns with no lanterns. Nixon hangs Cole's battered Wick lamp on the rail and lights it with a match, a plain candle-flame, nothing else. Tamara steps out onto the roof. She doesn't take his hand. She stands beside him, close enough that it doesn't matter. | \"We will be cold for a while.\" | St Thomas's Hospital, a ward by tallow. A surgeon works by six candles a nurse holds close. His hands are shaking with the cold. He breathes on them, hhh, and goes on. | \"We'll build something that doesn't need a girl in chains or a boy on the stair. It may be worse. It will be ours.\" | The Shadwell laundry. Alice stitches a new knot inside her own glove, a pattern nobody taught her. At the mangles Jennie and Jennifer are stitching the same pattern into theirs. Mother Grise, without being asked, pours her a cup of tea. | \"That is the record. Let it stand.\" | Whitehall, the Lord Chancellor's office. The record is read into Hansard that afternoon, and by evening it's on every newsstand in London. When his door closes, Vane takes the 1689 annex out of his desk, reads one line of it, locks it back in the drawer, and puts the key in his waistcoat. The record stands. So does the Crown. | (The hymn plays on, without words.) | Harding House, cold and dark. Nathaniel drops the wolf-crest ring into the dead grate. Alice sets the Harding lockets, two hearts burned dull, on the mantel beside it. His bound hand comes to rest over her bound hand: two halves of one handkerchief. There is no inch between them now. | (The hymn ends. Silence. Then, very faint, a heartbeat.) | Gin Lane, morning. The Lost One, warm for the first time, sneezes, astonished. Then she's sick in a basin, exactly like Miriam in Episode 7's cold open. Alice laughs, and peels her an orange, badly, in one long ruined spiral, and hands it over. Then she stops, and puts her hand on her sister's belly. The heartbeat swells under everything. The cold that held Miriam frozen has gone out of her, and what it was holding has started again. Jamie's child. The Lost One: \"Is that me?\" Alice: \"No. That's someone else.\" |","loc":"The Record","when":"Nathaniel's dictation carries over everything that follows.","th":"city","also":["harding","sisters"],"ch":["nathaniel","alice","lostone","nixon","tamara","marsh","morgana","josephine","grise","twins"],"turn":"Final scene","w":1161,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>Nathaniel's dictation carries over everything that follows. It starts as testimony, read flat and exact like a ledger, and somewhere in the middle it stops being for the clerk. No score until line 7, then the Lantern Hymn, the tune only, the way Morgana sang it. Every image is a climax from the season, seen in the days after: the dictation takes one morning, and the pictures run on across the weeks it sets moving.\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Nathaniel (V.O.)\u003c/th>\u003cth>On screen\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>&quot;Edric Harding. Nine years old. The year of our Lord fourteen hundred and eighty-nine. He carried the lantern down the stair himself, because his father asked him to.&quot;\u003c/td>\u003ctd>\u003cstrong>The Works, dead.\u003c/strong> Snow falls through the broken roof onto empty iron hooks. The channels where her blood ran into London are dry and grey.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>&quot;The Hargraves of the Orchard. Their names are scratched on a wall under Tyburn. I will read every one of them, if the clerk has ink.&quot;\u003c/td>\u003ctd>\u003cstrong>The Orchard.\u003c/strong> Old Marsh holds the candle and reads the names off the wall, perfectly lucid now. Nixon writes them into Cole's diary. His thumb stops on MARIAN.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>&quot;Ottoline Harding. Nineteen. Eighteen thirty-nine. She did not die abroad.&quot;\u003c/td>\u003ctd>\u003cstrong>St Bride's.\u0 r. Then she stops, and puts her hand on her sister's belly. The heartbeat swells under everything. The cold that held Miriam frozen has gone out of her, and what it was holding has started again. Jamie's child. The Lost One: &quot;Is that me?&quot; Alice: &quot;No. That's someone else.&quot;\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>"},{"oref":"Scene 21","id":212,"seq":21,"title":"The White","added":false,"act":"Final scene","kind":"scene","sum":"Hard cut on the heartbeat. Wind, and nothing else. Endless snow. Josephine walks beside Morgana through the drifts, where the chain's dead went, and stops. A man is standing in the snow with frost in his hair: JAMIE HARDING, exactly as he went down, one hand still half-raised the way it was on the lock. His breath doesn't smoke. His eyes are open and don't move. Josephine touches his face, and it's cold all the way through. Morgana, beside her: \"The White keeps what it's given. It doesn't give it back.\" Josephine doesn't let go of him. Far behind him, small in the white, a boy of nine stands with a lantern raised, the flame still burning after four hundred years and the boy as still as the snow. Josephine sits down in the drift beside her son. Cut to black. The card that opened every episode comes up one last time. It doesn't count down. DAY ONE.","loc":"The White","when":"Hard cut on the heartbeat.","th":"white","also":["harding"],"ch":["josephine","morgana","jamie"],"turn":"","w":158,"ed":"Revised Oct 13: four rules, new Ep 8","fl":[],"html":"\u003cp>Hard cut on the heartbeat. Wind, and nothing else. Endless snow. Josephine walks beside Morgana through the drifts, where the chain's dead went, and stops. A man is standing in the snow with frost in his hair: JAMIE HARDING, exactly as he went down, one hand still half-raised the way it was on the lock. His breath doesn't smoke. His eyes are open and don't move. Josephine touches his face, and it's cold all the way through. Morgana, beside her: &quot;The White keeps what it's given. It doesn't give it back.&quot; Josephine doesn't let go of him. Far behind him, small in the white, a boy of nine stands with a lantern raised, the flame still burning after four hundred years and the boy as still as the snow. Josephine sits down in the drift beside her son. Cut to black.\u003c/p>\n\u003cp>The card that opened every episode comes up one last time. It doesn't count down. \u003cstrong>DAY ONE.\u003c/strong>\u003c/p>"}]}],"threads":[["harding","The Harding House","Eldgard, Josephine, Byron, Jamie and Nathaniel: the Works, the pact, the Tithe, and the family that keeps it."],["sisters","The Sisters","Alice and Miriam, then the Lost One: Gin Lane, the Vykra, the counting game, and the apology nobody ever gave."],["investigation","Nathaniel’s Investigation","Nathaniel digging into his brother’s death, the chain under the Works, and the Heartglass he builds to hold it."],["guard","The Lantern Guard","Nixon, the corps, the Orchard, the Hargrave blood, and the mutiny that tears the Guard in two."],["lambrick","House Lambrick","Lambrick, Ajax, coal and Tamara: the light war, the ciphers, and a wedding used as a weapon."],["vykra","The Vykra","Mother Grise, the laundry, Xylon, winter’s kiss, limited borrowed faces and the contracts that turn belonging into control."],["city","The City and the Crown","Vane, Parliament, the Charter, the cold streets, and a London that pays for its light."],["white","The White","Morgana, the chain, the wolves, the frost and 1489: the thing the city is built on."]],"chars":[["nathaniel","Nathaniel Harding"],["alice","Alice Bounds"],["lostone","The Lost One"],["nixon","Nixon Hargrave"],["tamara","Tamara Lambrick"],["cole","Cole Pruett"],["eldgard","Eldgard Harding"],["josephine","Josephine Harding"],["byron","Byron"],["lambrick","Lord Hector Lambrick"],["ajax","Ajax Fink"],["grise","Mother Grise"],["twins","Jennie and Jennifer"],["felix","Inspector Felix Hawke"],["vane","Lord Chancellor Vane"],["morgana","Morgana"],["jamie","Jamie Harding"],["miriam","Miriam Bounds"],["wren","Old Wren"],["marsh","Tobias Marsh"],["alistair","Alistair Harding"],["otty","Ottoline “Otty” Harding"]],"arcs":{"nathaniel":{"1":{"line":"Invents for Byron, is placed behind Jamie in the portrait and hears the weeping. Jamie’s advice ends in public humiliation; then the Chancellor’s men finally ask about his equipment, and he stays while Jamie leaves. He does not learn the death before the pilot ends.","state":"approval chosen; loss not yet known"},"2":{"line":"At dawn on 3 November Eldgard calls Jamie’s death an accident; Nathaniel breaks in the stables with Byron. On 4 November he is refused the coffin, discovers a cartridge and asks Nixon to find the rifleman. Refused the coffin, he forces the core level and finds a spent Guard cartridge; at the graveside his father puts Nixon at his right hand and Nathaniel at the edge of the frame; he hands the cartridge to his best friend, who already knows the answer.","state":"hunting, betrayed unknowingly"},"3":{"line":"Arms the Frost Killer hunt for his father, skates with Tamara and gets the wrong suspect, walks the lamp-tunnels with a listening horn until he hears his own design whining in the dark, then finds Alice's secret at the tunnel mouth and, for the first time, chooses not to be the useful son: he hides the Frost Killer from his father. He sees his father's hand settle on Nixon's shoulder.","state":"armed the hunt, knows"},"4":{"line":"Ambushes Ajax with Alice at the coal docks, hears that Jamie paid him double, drops him into the Thames, and accepts his father's post-hearing promise. By the stove, the Lost One tells him Jamie called him the only one worth saving.","state":"deceived, still hunting"},"5":{"line":"Descends into the core with Alice and Tamara, touches the chain, learns he is the next Tithe, hears Morgana say Jamie is cold, not dead, and stays when Nixon seals the door.","state":"chooses his father"},"6":{"line":"Builds the Heartglass with his father, kisses Alice at the frozen canal when her glove gives up the handkerchief she kept, runs into the rigged tunnel, and hears Byron name his mother as Hawke's killer.","state":"knows the killer"},"7":{"line":"Watches his father call Nixon \"my son\" at the medal ceremony and confronts him on their roof (\"He gave you the stair\"), learns one of Nixon's Wicks shot Jamie and that Nixon kept it, threatens to name his mother in Parliament, fights beside Nixon at the Pavilion anyway, opens Jamie's coffin and finds slag, hears from Alice what his Heartglass is for, and agrees to marry Tamara.","state":"Agrees to marry"},"8":{"line":"Rehearses the vows with Alice the night before, learns her name from his mother's receipt in the morning, and when the Bethlem attendants come up the aisle says \"I will\" with Alice watching from the gallery. While they say it, the Vykra take her sister.","state":"Married, and the price"},"9":{"line":"Has the whole fight with Alice and follows her plan, breaks Eldgard out of Newgate, watches Ajax, the man he let drop, kill his father, and holds him through the Snow Confession.","state":"Fatherless, determined"},"10":{"line":"Opens the lock with Alice's burned hand on the blade, lets his mother go into the White and refuses to let anyone call it fever, says \"Alice\" at dawn, tells Nixon he hasn't forgiven him and keeps him close anyway, and dictates the Record.","state":"Most hated man, and hers"}},"alice":{"1":{"line":"Saves Miriam, sees the stolen purse and wants the Vykra recognition her sister refuses. Miriam admits needing her and asks, rather than orders, her to stay. Alice chooses trust, leaves half an orange on Miriam’s pillow and waits through the blackout. She does not reach the morgue in this episode.","state":"waiting for tomorrow"},"2":{"line":"At dawn on 3 November she is brought to the morgue by Felix’s constable, grieves, sees Miriam’s body return and follows it into daylight. Chases the thing in Miriam's body across the roofs and chooses to believe Wren; takes Grise's contract on the second Harding son the next morning, because Mim needs medicine and can't remember why she always said no; meets Nathaniel at his brother's funeral (\"Hear what, sir?\"), keeps his handkerchief, finds J.H. on Mim's locket, and in Jamie's wardrobe counts under her breath, lifts his schematic, and gives him \"Bounds\".","state":"lying and grieving"},"3":{"line":"As a child under the bed she is dragged out by the ankle while her sister counts fence posts through the slats. In 1889 she moves the Lost One through the crystal market, watches four die, hides her under the Works, and tells Nathaniel a truth she believes.","state":"cornered, exposed"},"4":{"line":"Hides her sister in the orangery, refuses Grise and is cut from the Vykra, then learns the poison that killed Felix was winter's kiss.","state":"expelled, still guarding"},"5":{"line":"Goes into the Works beside her sister, holds her back from the burning chain, blows the core door, and is left behind when Nathaniel stays.","state":"sister slipping away"},"6":{"line":"Climbs the Works wall and doesn't knock on Nathaniel's happiness, begs Tamara for a route into the core, kisses Nathaniel at the canal, fights Nixon in the tunnel, and hears her sister remember, unprompted, the arm Alice broke at nine. She believes completely, for the last time.","state":"believes completely"},"7":{"line":"Finds the letter (*Tonight, after the bridge, I'm coming for you. Whatever Grise offers, say no.*) and says nothing all evening, then hears the apology and the confession under it: Miriam drowned their stepfather for Grise's knot, and the grave Alice saw her crying at was guilt, not grief. Miriam would have taken that to her grave, so: \"You're not her.\" Her \"Get out\" cracks Blackwood Bridge open. Runs into the wolves for her anyway, tells Nathaniel what his Heartglass is for, and tells him to marry Tamara.","state":"Chosen sister"},"8":{"line":"Leaves her sister in the glasshouse to watch Nathaniel marry, nods him through the vows from the gallery, and runs back to an empty room and DON'T FOLLOW ME in frost.","state":"Nodded, sister taken"},"9":{"line":"Tells Nathaniel all of it, stops at Old Wren's door (\"I knew you couldn't hear it yet\"), challenges Mother Grise and wins on the count of nine, hears from the floor that Grise sets every girl the same test (her sister passed it, Josephine failed it, she never took it, and Grise gave her the envelope the night Miriam ran, to keep one of them), then stays kneeling at Nathaniel's back while his father dies.","state":"Commands the Vykra"},"10":{"line":"Burns her hand on the lock (\"Us\"), holds Gin Lane, carries her sister up Tyburn Road past the barricade Cole held, stands in front of Nathaniel on the hill, tells Josephine she was the one purchase that worked, hears her name at dawn, takes Tamara's terms at the depot gate, and peels her sister an orange.","state":"Let her go; held him"}},"jamie":{"1":{"line":"Leaves his watch with Eldgard, encourages Nathaniel’s demonstration, buys a Blackwood service-key copy and gives it to Miriam with the plan and paired locket. He reaches the core during her shutdown, is shot, and is left alive with Eldgard; the daughter takes his bloody locket in the closing cross-cut.","state":"shot; exact repair-death withheld"},"2":{"line":"Is officially mourned in a closed coffin at Harding House; Felix's Newgate slip reveals he visited prisoner 1417 every Sunday for two years.","state":"dead, still asking"},"4":{"line":"The key purchase is reconstructed: Jamie pays four hundred for a copy of the Blackwood cabinet key; Lambrick’s two hundred bought Ajax the original access. Miriam performs the midnight operation herself.","state":"a plan reconstructed"},"9":{"line":"In the cold open, five years old on the Serpentine, he promises his father he'll be brave.","state":"Frozen memory"},"10":{"line":"In the White, standing in the snow exactly as he went down, eyes open, breath that doesn't smoke. His mother sits down beside him.","state":"Kept, not living"}},"miriam":{"1":{"line":"Takes the Narrows strongbox, hides the Lambrick purse, buys three berths and agrees to shut down Blackwood for Jamie. She performs the generator trip herself. At midnight Jennie wears Jamie’s face to deliver Xylon. Miriam throws away both blades and fights the involuntary movement toward the bridge; the leap is forced.","state":"forced from the bridge"},"2":{"line":"In the river she asks the frost child something unheard. Felix retrieves her without a pulse. Her body opens its eyes to Alice in the morgue at dawn on 3 November; the Xylon command has ended, and the returning agency belongs to the Lost One.","state":"dead; memories carried by the Lost One"},"3":{"line":"Cold open: at nine she promises Alice nothing will touch her, then lies still and teaches her to count the fence posts. At sixteen she takes a knife without flinching, and a younger Grise offers her the Vykra knot for one simple task.","state":"promise broken, knot offered"},"7":{"line":"In the cold open she scores out \"Ali, about him\", writes three lines (*I'm coming for you*), sews them into her coat lining to give by hand, and stands at Alice's door a long time before she goes. In the Lost One's confession we finally see the task: at the Thames stairs she held their stepfather under, counting to eight.","state":"Already gone; the river told"}},"lostone":{"1":{"line":"The frost child escapes Alistair in 1489. In 1889 she moves through Jamie’s crack and takes his bloody locket during the final cross-cut, drawn toward Miriam at Blackwood. The river transfer is withheld until Episode 2.","state":"drawn to Blackwood"},"2":{"line":"In the opening she reaches Miriam through the paired lockets, receives the unheard request, enters the body and later opens its eyes to Alice. Kills a cat, copies Miriam's words and habits, calls Alice \"Ali\", draws a chain and whispers \"Mother\", and freezes Felix's hand to the doorframe.","state":"hiding, lying kindly"},"3":{"line":"Peels Alice an orange, the first of Miriam's memories she gives back, shatters the market's crystals and kills four, cries ice, and survives by touching Nathaniel's bare hand without freezing him.","state":"hidden, unravelling"},"4":{"line":"Makes her first snow in the orangery, tells Nathaniel in Miriam's voice that Jamie thought him the only one worth saving, offers Felix an orange and an apology, and is blamed for a murder she did not commit.","state":"hidden, blamed"},"5":{"line":"Freezes the outfall into a glass road, grabs the burning chain and for one second has every song Miriam knew, then lets the cold go until every lamp in London bursts.","state":"resolute, unrepentant"},"6":{"line":"Promises Alice an hour beside the chain would give her Mim whole (\"Yes, Ali\": the second lie), tries to tell her \"about the river\" and is told \"After\", grabs Nixon's bare wrist without frosting him, smothers flames around four trapped children, then remembers on her own the arm Alice broke at nine.","state":"filling up with Miriam"},"7":{"line":"Gives Alice the apology Miriam never could, and the confession under it: the river, and Grise's one simple task. Tells her Miriam was coming for her, and nearly didn't. Is thrown out, and her grief cracks the bridge and lets the wolves through. Commands them at the Pavilion, walks them back, and closes the crack: the Frost Witch.","state":"Frost Witch"},"8":{"line":"Plays the priest at the rehearsal, sends Alice to the wedding (\"Yes, Ali\": the third lie), and holds out her wrists when the Vykra come: the only way into the Crown's cage is as a prisoner. Leaves DON'T FOLLOW ME in frost.","state":"Taken willingly"},"9":{"line":"Hangs in the Heartglass as cracks run through it, every one her mother pulling against her own hooks. She asks nothing; her mother answers nothing.","state":"Cracking the cage"},"10":{"line":"Stands between her mother and the city, sings the hymn in the old tongue, tells Alice what Miriam asked on the bridge, the last of Miriam to come back to her, and stays. Morgana draws the White out of her like a splinter: no more snow, no more singing in the lamps, a girl shivering for the first time.","state":"Mortal, warm"}},"nixon":{"2":{"line":"Comes home from six weeks on the failing eastern lines with a crate of dull crystal, is made the youngest Lantern-Captain in history, and is given what Nathaniel never got: \"I need a son I can trust with the house.\" Takes the first secret (one of his own Wicks fired the shot) and tells the shaking boy that flashes lie. At Jamie's grave he stands at Eldgard's right hand. Nathaniel hands him a cartridge whose answer he already knows.","state":"the chosen son"},"3":{"line":"Takes Eldgard's private order to bring the frost girl in alive, with Eldgard's hand on his shoulder while Nathaniel watches; leads the market sweep and carries Cole out instead of the capture. Eldgard: \"I know what your Wick did at the core. Keep it that way.\" He remembers the charity-school blood test: \"Still good.\"","state":"disobeyed, compromised"},"4":{"line":"Tamara tells him he's started standing like Lord Harding, and he tells her the truth about Essex; leaves the study with his father's keys as Nathaniel comes in for a promise; finds Marsh (\"Marian's chin!\"); burns the log page because sons keep the house's secrets.","state":"keeping two secrets"},"5":{"line":"Goes down the core stair at Eldgard's side while Nathaniel is shown the vats; takes the Lantern Night order, whistles his brother a warning, then seals the core door on him, mouthing the oath.","state":"obedient, watched"},"6":{"line":"Sent to bring the girl back or lose his lantern; ambushes Alice and the Lost One in the conduit, where the Lost One tells him his mother didn't die of fever; carries Cole out of the fire. Cole: \"Tell Mr. Harding what I did, sir, or I will.\"","state":"cornered"},"7":{"line":"Eldgard pins his medal and calls him \"my son\" in front of the corps, with Nathaniel watching. On their roof Nathaniel asks how long; \"Since the funeral.\" \"He gave me a room full of vats. He gave you the stair.\" Nixon tells him all of it, the shot included, and loses his best friend. They fight back to back at the Pavilion an hour later; Tamara kisses him and hands him a folder with his name on it.","state":"friendless, protecting Cole"},"8":{"line":"Opens the file: not a son, a spare, fattened. Hands Tamara her ring properly, refuses Vane's order to fire, walks away with forty Lanterns, counts thirteen steps down to the Orchard, finds his mother's name, and turns on the whole Harding name.","state":"mutineer, Hargrave"},"9":{"line":"In the Orchard he shows Nathaniel the file: \"He chose me to walk down the stair so you wouldn't have to.\" \"And he told me it was me.\" Two boys raised to die for the same man, until Alice asks if they'll let him finish. He takes the hand. Frees Marsh, carries Eldgard over the Newgate roofs, and hears from the dying man that every kindness since the funeral was feed.","state":"chosen family"},"10":{"line":"Offers himself to the chain with his eyes open, kills Ajax on the core stair and clears the Guard stair, tells Cole it wasn't him (\"Did I do good, sir?\"), finds him dead at the barricade, lays Cole's diary open at Westminster, refuses the Crown's lantern, and lights a Wick lamp with a match.","state":"his own man"}},"cole":{"1":{"line":"A Wick in the core raid, all elbows and trying not to be sick; fires into the strobe and drops the saboteur, is sent to the gate, and looks back to see the man on the floor still talking.","state":"shot a man in the dark"},"2":{"line":"Tells his new Captain he hit him and saw his face; is told flashes lie; writes the truth in his diary anyway.","state":"believing his Captain"},"3":{"line":"Trained on Nathaniel's new boosters, he fires early and dangles in laundry, then freezes from the hand up and loses two fingers.","state":"maimed, still loyal"},"4":{"line":"Back on duty two fingers short, and secretly copying into his diary the discharge page Nixon burned.","state":"diary copied"},"5":{"line":"Holds a bridge barricade with flash-bursts while the Lantern Night crush kills people against the railings.","state":"holding the line"},"6":{"line":"Shows Nixon his diary and gives him until after the vote, then is carried out of the fire by the man he still believes in.","state":"burned, carried out"},"7":{"line":"Gets his dressings changed while Tamara kisses Nixon, and pretends very hard to be asleep.","state":"Discreet witness"},"8":{"line":"Walks out between the rifle lines at the gates with his hands up, and nobody fires.","state":"Peacemaker"},"9":{"line":"Asks Tamara whether married ladies are allowed to fight, and is handed a knife.","state":"Armed and grinning"},"10":{"line":"Teaches children flash-shadow rabbits, then holds the Tyburn Road barricade with his last cartridge; his line is the only reason Alice gets the Lost One to the hill. Dies at his post (\"Held the road. Nobody past who shouldn't be.\"), and his diary puts the truth of 2 November on the record.","state":"Dead at post"}},"eldgard":{"1":{"line":"Tells Jamie his \"preparation\" begins tonight, hosts the Exhibition to calm the Crown about the failing light, takes Lambrick's warning with a smile, introduces Jamie as heir, refuses Nathaniel's gauntlet in front of the room, and goes down to the core, where he kneels by his shot son and we cut away.","state":"with the wounded son; action withheld"},"2":{"line":"Alone with the chained light he says \"He was mine, and I spent him\", counts forty-seven, and drops his lamp when Morgana raises her head.","state":"face to face"},"3":{"line":"He hands Nathaniel the Guard contract, is told Nixon let the girl go, and answers: \"I know what you did at the core.\"","state":"holding the leash"},"4":{"line":"Calls Jamie melancholy and says he wanted to destroy the house, then baits Nathaniel with the whole work after the hearing.","state":"son baited"},"5":{"line":"Opens the Upper Gallery to Nathaniel, waits in the core to explain the Tithe, and answers \"cold\" with \"She told me my sister was still singing.\"","state":"son at his side"},"6":{"line":"Designs the Heartglass with Nathaniel, tells Nixon to bring the girl back alive or bring him his lantern, and loses the Works to a Crown board.","state":"works lost"},"7":{"line":"Diminished without his Works and drunk among the dead vats, he is faced with a fistful of slag from his son's coffin, says only \"I finished it\", and tells Nathaniel his mother knew what this house spends and married it anyway.","state":"Drunk confessor"},"8":{"line":"Gives Nathaniel Jamie's cufflinks, says \"I held his hand\", is held in his pew by a marshal while the attendants come for the bride, is arrested on the chapel steps for Jamie's murder on his wife's sworn word (they leave him the wolf-crest ring), and warns her in Newgate that the mother will break the glass before she lets her child hang in it.","state":"Arrested"},"9":{"line":"Leads the break-out, takes the blow of the man his son let live, owns the slag in Jamie's coffin and the wager he made on Nixon (a Hargrave raised to walk down willing), and spends his last breath on the whole truth.","state":"Dead in the snow"},"10":{"line":"Only bones and a casket now; the confession he left behind is what lets Nathaniel choose light.","state":"Dead, vindicated"}},"josephine":{"1":{"line":"Runs the Exhibition photograph with two gloved fingers (\"It's composition, not a verdict\"), bans the word Essex, catches a silver chain at Jamie's throat and doesn't forget it, watches him from the gallery (\"That boy is planning something\"); the dawn reaction to Jamie’s death now opens Episode 2.","state":"silent, keeping history"},"2":{"line":"At dawn on 3 November she studies Eldgard after the death announcement. At the funeral she clocks the girl in her son's pew: \"That girl holds her wrist like a knife-girl.\" Takes Nathaniel's face in her cold gloved hands over the coffin (\"You will stay out of that place\"), then, veiled, pays Grise in gold for the contract on her own son and doubles it now Jamie is dead.","state":"buying her son's safety"},"4":{"line":"Moves the wedding up, reads Felix's name on the witness list, hears him at the glasshouse wall and keeps the girl's hiding place from Eldgard, poisons Felix on the stand with winter's kiss, and is seen by Byron washing frost from her hands.","state":"seen by Byron"},"6":{"line":"Cold open, thirty years ago: a Vykra knife-girl on Grise's joining test, sent to kill young Eldgard, whom Byron spares and who marries the man instead. She refuses Byron's needle, then tips Eldgard.","state":"confessed, unrepentant"},"7":{"line":"Runs the table, tells Nathaniel she chose London long ago, takes his threat without stopping buttering, and sells Grise the Frost Witch: taken by hands her son can't trace to her.","state":"Chose London"},"8":{"line":"Gives Nathaniel Grise's receipt, sells Grise the glasshouse for the hour of the vows, smiles up at the Gin Lane girl in the gallery, swears her husband murdered Jamie, then hears in Newgate: \"You would.\"","state":"Husband sold"},"9":{"line":"Puts on Vykra knives she hasn't touched in thirty years, goes down alone, and bets that nobody in hooks refuses the door. Pulls the lever.","state":"Pulls lever"},"10":{"line":"Watches Morgana refuse the door, tells Nathaniel \"Go to her\", tells Morgana \"Not him\", hears from Alice that the girl she bought was the only purchase that ever worked, and walks into the White, where she finds Jamie kept in the cold and sits down beside him.","state":"Gone into White"}},"byron":{"1":{"line":"Brushes soot from Nathaniel, shares the old history with Josephine and watches the family’s Exhibition. The stable grief scene now belongs to Episode 2’s first dawn.","state":"watching"},"2":{"line":"At dawn on 3 November he sits with Nathaniel in the stable straw after the death announcement. He gently moves Nathaniel's hand off the coffin lid with shaking hands, then lets Alice out of the servants' door and only smiles.","state":"seeing everything"},"3":{"line":"\"You notice,\" he tells Nathaniel over the tea, and the ghostlight clue lands: his master is his mother's son.","state":"quiet, prompting"},"4":{"line":"Lies to Josephine about where Nathaniel goes at night, the first lie he has ever told her.","state":"first lie told"},"5":{"line":"Gives Nathaniel his old Guard key on a black ribbon, the one Jamie borrowed and copied (\"If I don't come up, give it to Nat\"), admits he heard her every night at the core, and goes back downstairs by tallow: no green lamp since.","state":"secret half-shared"},"6":{"line":"Confronts Josephine in the linen room and leaves alive, takes his old Lantern from its case and hears her again, follows Nathaniel into the conduit, finds him by its green flash, and dies under the beam: \"I let her go at the gate. Everything since came through that gate. You were always enough.\"","state":"dead, truth told"}},"lambrick":{"1":{"line":"At the Harding Exhibition he promises his daughter to the second son by private letter, admires the chandeliers like a man pricing a horse, and warns Eldgard that grass only stays green while somebody keeps paying to water it: \"Ask your Alistair.\" A footman's whisper about the Narrows tightens his hand on his glass.","state":"circling"},"2":{"line":"In the coach he tells Tamara the heir is dead so she must marry fast: \"You're a wedding, not a ledger.\"","state":"pushing marriage"},"3":{"line":"Named in his own ledger: Tamara copies six months of payments to A.F. and slips the page to Nathaniel on the ice.","state":"paid the killer"},"4":{"line":"Before the Exhibition he has paid Ajax two hundred guineas to acquire access to the Blackwood cabinet for sabotage. Ajax sells Jamie a copy for four hundred; Lambrick does not order or perform Miriam’s pilot shutdown. At the hearing he accuses the Hardings of hiding something below the Works.","state":"access bought; Crown pressure applied"},"5":{"line":"Watches the Strand with Ajax's coal-mob, then rides a coal cart through the Westminster Bridge crush: 'Remember who kept you warm!'","state":"exploiting disaster"},"6":{"line":"Says his daughter should have stayed home if she gets in the way, tells his ledger a doctor has already signed her lunacy papers while she listens behind the curtain, then takes a seat on the Crown board that seizes the Works.","state":"on the board"},"7":{"line":"Tours the Crown's new core, remembers his wife's coal-heated room, and says the girl could be bled faster.","state":"Providing"},"8":{"line":"Calls his daughter unwell, the cue for two Bethlem attendants and a lunacy order under the Chancery seal; he doesn't need a Harding son-in-law any more, only a daughter who can't read his books aloud.","state":"Nearly won"},"9":{"line":"Tells Tamara to bring her husband by midnight, because a Harding has to walk down on his own feet, and promises to burn the Bethlem order if she does.","state":"Counting hours"},"10":{"line":"Tells the marshals to take the girl Nathaniel came for, so the boy will walk; fills satchels all night with gallowglass that is dimming in his hands, and chooses the dying crystals over his daughter's hand in the last hour before dawn while, across the city, Morgana lets hers go; at Westminster his own ledger convicts him.","state":"Died clutching"}},"tamara":{"1":{"line":"Arrives at the Exhibition with a cipher wheel in her fan, promised to Nathaniel by a letter nobody announces, and agrees with him to be very polite for forty years.","state":"promised, unannounced"},"2":{"line":"Told to marry fast, she reads her father's account book upside down and spots \"2 Nov, Works gate, 200 gns, A.F.\"","state":"suspicious, reading"},"3":{"line":"She takes Nathaniel skating, slips him the ledger copy naming Ajax Fink, then finds Ajax on her bed with a warning from her father.","state":"found out, warned"},"4":{"line":"Asks Nixon to protect her, spots a Vykra knot inside the veiled woman's glove, pockets the dropped needle, and offers it to Grise for a place.","state":"new Vykra girl"},"5":{"line":"Solves the Works cipher for Grise, then recodes the inner door by ear while Alice holds her belt over the shaft, becoming Alice's equal and rival.","state":"proven, rival"},"6":{"line":"Overhears her father's conduit charges, his answer about her and the lunacy papers already signed, then warns Nathaniel in their childhood cipher, the warning that brings him into the blast.","state":"warning backfired"},"7":{"line":"Tours the core on her father's arm, reads Vessel: White-born, finds his lunacy order and asks Nathaniel to marry her before he can use it, gives Nixon his stolen file, and kisses him a week before the wedding.","state":"In love, engaged"},"8":{"line":"Asks Nixon in the vestry to say one word, sees the Vykra knot inside Josephine's glove at the chapel door, and when her father calls her unwell says \"I will\" before the attendants reach the altar.","state":"Lady Harding"},"9":{"line":"Lies to her father, takes the master key and the whole ledger from his safe, and faces Ajax down with the needle from the gallery stairs.","state":"Holds the key"},"10":{"line":"Offers her father her hand in the vault and walks out alone, opens the coal depots, sets terms with Alice at the depot gate (his name on her paper, until the coal runs out), and at Westminster lays down the folio, her father's ledger and the needle, then names her price: the Record in Hansard, or the depots close at noon. Heir to Lambrick, and the one who forces the truth out.","state":"Heir of Lambrick"}},"grise":{"1":{"line":"Counts Miriam's take twice, tells Alice she has talent, tells Miriam \"Every girl thinks she's the one who gets out, dear. It's what makes them good,\" and hands a girl at the mangle a pair of knotted gloves. Nobody walks out on the Vykra.","state":"kept one Bounds girl"},"2":{"line":"On 4 November she gives Alice the contract on the second Harding son, two mornings after the river; Josephine pays and doubles it. Alice does not know Grise ordered the murder.","state":"paid twice over"},"3":{"line":"Cold open: a younger Grise watches sixteen-year-old Miriam take a knife without flinching and offers her the knot for one simple task. In 1889 she demands a real report on the Harding son in three days or the frost girl on Gin Lane becomes her business.","state":"waiting, threatening"},"4":{"line":"Demands the frost girl, snips the Vykra knot out of Alice's glove, tells her she is no one's, and takes Tamara as the new girl.","state":"new girl found"},"5":{"line":"Tests Tamara with a Works cipher solved in four minutes, lets slip that the inner codes change on Lantern Night, and welcomes her with tea and a knife.","state":"recruiter satisfied"},"7":{"line":"Agrees a price with Josephine for the Frost Witch, delivered to Josephine and not the Crown, and learns from her where her son hides the girl.","state":"Sold the girl"},"8":{"line":"Sends her girls through the glasshouse door Josephine sold her, and the Frost Witch holds out her wrists.","state":"Collects"},"9":{"line":"Admits ordering the Blackwood interception after the three-ticket purchase exposed Miriam’s plan to leave. Alice defeats her, hears the twins identify the borrowed face and the driver, and demands their statements. Grise survives, but command and the secret are no longer hers.","state":"defeated; murder order recorded"},"10":{"line":"Pours Alice a cup of tea in the Shadwell laundry without being asked.","state":"Tea and peace"}},"felix":{"1":{"line":"Recognises Vykra work at the Narrows, sends the constable’s birds to find the charcoal coat and reaches Blackwood through the ticket-office porter’s report. He sees Miriam trying to stop her own body before she is forced over the rail.","state":"witness to coercion"},"2":{"line":"Dives in the opening, retrieves a pulseless Miriam, identifies her through the birds and sends for Alice. Records pigment before the water and frost after it. Witnesses the resurrection and morgue deaths; keeps the Blackwood notes despite Crown pressure.","state":"two methods, one missing body"},"3":{"line":"Frostbitten hand in a sling, he tells Nixon Miriam Bounds was dead, Jamie took a bullet, and slides over the Newgate visitor's slip.","state":"closing in"},"4":{"line":"Tracks Alice to the glasshouse, promises to tell the Crown that someone made the girl, and dies on the witness stand with frost on his lips.","state":"dead on stand"}},"vane":{"2":{"line":"Attends Jamie Harding's funeral at St Bride's among the great houses, the Crown's presence over a family's grief.","state":"watching the houses"},"4":{"line":"Presides over the Charter hearing, orders the Frost Killer hunted with every lamp in London, and has the vote postponed.","state":"hunt ordered"},"6":{"line":"Bleeding from the temple, announces the Charter suspended and the Works handed to a Crown board.","state":"charter suspended"},"7":{"line":"Declares martial law at dawn and hears only that the lights stay on.","state":"Order restored"},"8":{"line":"Seals the lunacy order, then sees two hundred witnesses and a wife, and lets the attendants fold the strait-coat rather than face a Chancery hearing; arrests Eldgard for his son's murder and orders the crowd cleared by any means.","state":"Crown cornered"},"9":{"line":"Carries the Crown's sealed 1689 annex in his breast pocket, the Crown's own signature on the chain, and waits on the gallery for midnight.","state":"Waiting on girl or boy"},"10":{"line":"Names Nathaniel the man who put out London and offers a pardon for silence. Unmoved by the annex, he gives way to Tamara's coal: the Record goes into Hansard at two o'clock. Then he locks the annex back in his desk and pockets the key.","state":"Forced to write"}},"otty":{"2":{"line":"Her chancel brass at St Bride's reads OTTOLINE HARDING, 1820 TO 1839, DIED ABROAD; Nathaniel asks who she was and Byron says only \"your father's sister\".","state":"brass, unexplained"}},"wren":{"2":{"line":"The bonesetter who set Alice's arm as a child hears a heart that is barely there, holds a mirror under a breath that barely fogs it, and calls it shock. Asked about the child, she tells Alice the cold took it: her second kind lie.","state":"knows, says little"},"9":{"line":"Admits she knew it wasn't Miriam the first night, and that the child is still there: the cold holds what it holds.","state":"Confesses both lies"}},"alistair":{"1":{"line":"A failed natural philosopher with a satchel of unpaid-for instruments, he opens a chained mother's wrist and fills the first lantern of his own design, while his son holds it up and her daughter slips away.","state":"inventor of the lie"},"5":{"line":"Cold open, Tyburn 1489: cuts down the girl of nineteen at the lock, ending the first attempt on the chain.","state":"raid repelled"},"10":{"line":"At the chain in 1489 he chooses sons over light, and his firstborn Edric carries the lantern down the stair.","state":"Chose sons"}},"morgana":{"1":{"line":"Chained by hooks in the iron pit below Tyburn, a woman of ice whose opened wrist lights the first gallowglass lantern; a tiny frost girl slips out and runs.","state":"chained, drained"},"5":{"line":"Seen whole, nine feet of ice and green fire, hooked and chained and singing the Weeping, she tells Nathaniel his brother is not dead, only cold.","state":"chained, screaming"},"7":{"line":"Seen on the core wall as Lambrick does his arithmetic, while the Lost One names her as mother.","state":"Being bled"},"8":{"line":"In the cold open, the woman of ice who sings the lullaby; at the core, she understands her daughter's plan and her grief brings the snow.","state":"Grieving mother"},"9":{"line":"Strains at her hooks and asks the Lost One why she came back.","state":"Chain breaking"},"10":{"line":"Refuses the door at the lever, rises nine feet tall when a Harding opens the lock and says his name the way she sang it when he was five, lets her daughter stay and draws the White out of her, demands a Harding, accepts Josephine, and tells her the White keeps what it's given.","state":"Free at last"}},"ajax":{"1":{"line":"Haggles core-cut Harding glass with an Antwerp smuggler (\"I'm just the only one honest about the price\"), waits under the last lamp while Miriam takes his men apart, pins her to the safe, and takes Alice's blade from cheekbone to jaw: \"I'll remember you.\"","state":"scarred, promising"},"3":{"line":"He sits on Tamara's bed, delivers her father's love, warns her off the safe and leaves the apple core on her pillow.","state":"warning delivered"},"4":{"line":"Before the Exhibition on 2 November, he sells Jamie a four-hundred-guinea copy of the Blackwood cabinet key Lambrick paid two hundred to acquire. At the docks he insists he sold access, not the blackout. Nathaniel drops the witness into the Thames.","state":"in the Thames"},"5":{"line":"Cut out of a barge's anchor chain by river police Lambrick paid, scarred from brow to jaw, he brings a coal-mob to the Strand and cuts the outer grid during the fireworks, darkening the East End mid-heist.","state":"sabotage done"},"6":{"line":"Plans charges on the Tyburn conduit with Lambrick; in the tunnel he sees the Guard, lights the fuse early, and the gasworks goes up.","state":"fire lit early"},"9":{"line":"Drives Nathaniel into the ground with the Black Gauntlet and steps aside for Tamara's needle.","state":"Blocked"},"10":{"line":"Fights Nixon on the core stair and dies frozen mid-laugh, his apple rolling down.","state":"Frozen dead"}},"marsh":{"4":{"line":"Newgate's prisoner 1417, picking at a string he calls his harp, pinches Nixon's cheek, says 'Marian's chin', and recites the Orchard rhyme.","state":"rhyme delivered"},"9":{"line":"Walks out of opened cell 1417, looks up at the snow, and says perfectly lucidly that they always count from the first snow.","state":"Lucid, freed"}},"twins":{"1":{"line":"Jennifer follows the stolen purse to the ticket purchase and buys the hired driver’s rendezvous. Grise orders the interception. Jennie prepares one short-lived likeness, remains silent as the false Jamie and gives Miriam the Xylon kiss; she watches her escape without stopping the carriage.","state":"one knife, one ear; the order obeyed"},"4":{"line":"They watch Grise cut the knot out of Alice's glove. Jennifer: \"Bad luck, Bounds.\" Jennie says nothing; she never says anything to Alice.","state":"watching"},"6":{"line":"Jennifer pours tea in Covent Garden, chattering, while Alice and Tamara plan the conduit, and sells every word to Grise within the hour. The note sends Nixon, and Byron, into the tunnels.","state":"listening, selling"},"8":{"line":"One at each pane, they come through the glasshouse for the Frost Witch on Josephine's directions, and she holds out her wrists.","state":"collecting"},"9":{"line":"Alice makes Grise admit the Xylon order, asks who wore Jamie’s face and who found the driver, and obtains Jennie’s and Jennifer’s admissions. She needs their knives but demands written statements; service is not forgiveness.","state":"commanded, not pardoned"},"10":{"line":"They hold Gin Lane. Alice sends Jennie in her own face to check Nathaniel’s survival. Their signed Blackwood statements enter the Record under their own names; the guild’s help does not settle criminal responsibility. They stitch Alice’s new knot without receiving absolution.","state":"serving Alice; named in the record"}}},"notes":{},"ledger":{"rows":[["The frost girl running from the pit in 1489","Ep 1, cold open","Ep 2 tag (\"My daughter is here\"), Ep 7 (\"You're not her\")"],["Miriam asks the frost girl something in the river","Ep 2, scene 1","Ep 10, scene 16: \"She asked me to go back to Ali\""],["Cole's shot in the core","Ep e shoulder\u003c/td>\u003ctd>Ep 1, scene 8 (the photograph: every heir, every father)\u003c/td>\u003ctd>Ep 2, scene 7 (Nixon at the right hand, Nathaniel at the edge); Ep 3, scene 2 (Eldgard's hand on Nixon's shoulder, and Nathaniel sees); Ep 7, scene 7 (&quot;He gave you the stair&quot;); Ep 9, scene 3 (&quot;He raised both of us to want it&quot;)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>&quot;Since the funeral&quot;\u003c/td>\u003ctd>Ep 2, scenes 4 and 7 (Eldgard: &quot;I need a son I can trust with the house&quot;)\u003c/td>\u003ctd>Ep 4, scene 10 (Nixon leaving the study with the keys); Ep 5, scene 2 (the core door shutting on his lantern); Ep 7, scene 7; Ep 8, scene 5 (&quot;fattened&quot;); Ep 9, Snow Confession II\u003c/td>\u003c/tr>\u003ctr>\u003ctd>&quot;Did I do good, sir?&quot;\u003c/td>\u003ctd>Ep 3, scene 15 (the hospital)\u003c/td>\u003ctd>Ep 10, scene 9 (&quot;It wasn't you, Wick&quot;)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lambrick: &quot;It won't stay green for ever&quot;\u003c/td>\u003ctd>Ep 1, scene 14\u003c/td>\u003ctd>Ep 6 (coal carts with LAMBRICK on the side); Ep 7, scene 5 (&quot;She could be bled faster&quot;); Ep 10, scene 14 (the crystals go dull in his hands)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The Alistair story, as the family tells it\u003c/td>\u003ctd>Ep 1, scene 16 (Jamie's speech)\u003c/td>\u003ctd>Ep 5, scene 2 (&quot;grow gallowglass from Tyburn iron&quot;); Ep 10 cold open (the lie, sold to the King's men); Ep 10, the Record (&quot;Edric Harding…&quot;)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Alice scars Ajax: &quot;I'll remember you&quot;\u003c/td>\u003ctd>Ep 1, scene 3\u003c/td>\u003ctd>Ep 4, scene 8 (&quot;Told you I'd remember you&quot;); Ep 5, scene 8; Ep 9, scene 13\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Three berths, no names\u003c/td>\u003ctd>Ep 2, scene 13\u003c/td>\u003ctd>Ep 2, scene 16 (Alice thinks the third was for the child); Ep 7, scene 2: the third berth was hers\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Miriam crying at the stepfather's grave\u003c/td>\u003ctd>The wound under the sisters\u003c/td>\u003ctd>Ep 7, scene 3: &quot;She wasn't crying for him&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>&quot;This life brings nothing but misery&quot;\u003c/td>\u003ctd>Ep 1, scene 9\u003c/td>\u003ctd>Ep 7, scene 2 (the letter); Ep 10, the Record: Alice stitches a knot nobody taught her, on her own terms\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The spare must walk down willing\u003c/td>\u003ctd>The lore (1872)\u003c/td>\u003ctd>Ep 5, scene 17 (Nixon locks the door and watches); Ep 9, Snow Confession II (&quot;I let you lock him in&quot;); Ep 10, scene 4: he volunteers with his eyes open\u003c/td>\u003c/tr>\u003ctr>\u003ctd>&quot;If anything happens to the frost girl&quot;\u003c/td>\u003ctd>Ep 7, scene 4\u003c/td>\u003ctd>Ep 7, scene 13 (&quot;hands he can't trace to me&quot;); Ep 8, scene 11: Grise's Vykra take her\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Morgana draws the White out of her daughter\u003c/td>\u003ctd>Ep 10, scene 16\u003c/td>\u003ctd>Ep 10, the Record: warm for the first time, and the heartbeat starts again\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Jamie's pocket watch, left wound on his father's desk\u003c/td>\u003ctd>Ep 1, scene 6\u003c/td>\u003ctd>Ep 2, scene 13: Eldgard winds it on his dead son's bed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>&quot;The only one of them worth saving&quot;\u003c/td>\u003ctd>Ep 4, scene 6 (the Lost One, in Miriam's voice)\u003c/td>\u003ctd>Ep 5, scene 4 (&quot;If I don't come up, give it to Nat&quot;); Ep 10, the Record: &quot;He tried to end it so I would never have to&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A man standing very still in the snow\u003c/td>\u003ctd>Ep 5, scene 15 (one frame, in the surge)\u003c/td>\u003ctd>Ep 10, final scene\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Josephine on the bank, holding his scarf\u003c/td>\u003ctd>Ep 9, cold open\u003c/td>\u003ctd>Ep 10, final scene: she sits down in the drift beside him\u003c/td>\u003c/tr>\u003ctr>\u003ctd>She sang his name\u003c/td>\u003ctd>Ep 8, cold open\u003c/td>\u003ctd>Ep 10, scene 7: &quot;Nathaniel.&quot; Then: &quot;A Harding opened it.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The wolf-crest ring left on Eldgard's hand\u003c/td>\u003ctd>Ep 8, scene 14\u003c/td>\u003ctd>Ep 9, scene 8 (&quot;I came for your ring&quot;); Ep 9, scene 15; Ep 10, scene 5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Byron, the only audience\u003c/td>\u003ctd>Ep 1, scene 5\u003c/td>\u003ctd>Ep 3, scene 7 (&quot;an audience of one&quot;); Ep 6, scene 14: &quot;You were always enough&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Nobody crying in the walls\u003c/td>\u003ctd>Ep 1, scene 19\u003c/td>\u003ctd>Ep 10, scene 6: for the first time since he was five, silence\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Xylon compulsion, not chosen death\u003c/td>\u003ctd>Ep 1, scenes 21, 25–26 (taste, discarded blades, resistance); Vykra device notes\u003c/td>\u003ctd>Ep 2, scene 1 (command ends with death); Ep 7, scene 3 (memory); Ep 9, scene 6 (order and delivery); Ep 10, the Record\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Jennie's limited face-veil\u003c/td>\u003ctd>Ep 1, scene 15 (packet), scenes 21–23 (silent likeness and failure)\u003c/td>\u003ctd>Ep 7, scene 3 (impostor, not identification); Ep 9, scene 6 (Jennie names herself); Ep 10 (own names on statements)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Blackwood return trip versus permanent darkness\u003c/td>\u003ctd>Ep 1, scenes 5, 12, 18–19\u003c/td>\u003ctd>Ep 2, scene 1 (Works reset); Ep 5 (Ajax attacks a separate outer feed); Ep 10 (chain release ends light permanently)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The poison and the cold have different origins\u003c/td>\u003ctd>Ep 1 (Xylon on lips before the fall); Ep 2, scene 1 (frost only after transfer)\u003c/td>\u003ctd>Felix's notes in Ep 2, scene 15 and testimony in Ep 4; winter's kiss remains a third, counterfeit-frost method\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>","inherit":"\u003cp>\u003cstrong>What Season 2 inherits\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>A London with no light.\u003c/strong> Coal is power now, and Tamara owns the coal. The young woman who wanted to be her father's heir has become something more dangerous.\u003c/li>\u003cli>\u003cstrong>A Harding child carried by a daughter of the White.\u003c/strong> Both worlds will want it.\u003c/li>\u003cli>\u003cstrong>Josephine, in the White\u003c/strong>, beside a son who can't answer her. She went in to end the debt and stayed for him.\u003c/li>\u003cli>\u003cstrong>Everyone the chain ever took\u003c/strong> is standing in the White exactly as they went: Edric with his lantern, Otty, the Orchard's apples, Jamie. Kept, not living. Morgana said &quot;cold, not dead&quot; and meant it to the letter. Nobody comes back. Season 2's question: what do you owe the dead when you know exactly where they are?\u003c/li>\u003cli>\u003cstrong>Nixon and Tamara\u003c/strong>: married to his cousin, holding his hand, nothing decided. Nathaniel and Alice: a kiss on Tyburn hill and no promise, because he's still Tamara's husband, and Tamara's hold on the city's coal rests on being Lady Harding. The two women have already set the terms on a Westminster bench: the paper, until the coal runs out. Three people in love, and the only marriage among them is the one keeping London warm.\u003c/li>\u003c/ul>\n\u003cul>\u003cli>\u003cstrong>The Blackwood record.\u003c/strong> Grise, Jennie and Jennifer are named for Miriam's murder. The guild's aid during the siege does not decide their legal fate or require Alice to forgive them.\u003c/li>\u003c/ul>"},"world":{"html":"\u003ch2>The world and its four rules\u003c/h2>\n\u003cp>Gallowglass is Morgana's frozen blood, and an iron chain under the Works holds her. Four binding rules govern the chain and the Lost One. The limited devices used by people—lockets, generators, poisons and disguises—are specified below; they do not change who can operate the chain.\u003c/p>\n\u003col>\u003cli>\u003cstrong>The Tithe.\u003c/strong> Every fifty years, on the night of the first snow, a Harding must walk down to the chain of their own free will before midnight, or the chain breaks.\u003c/li>\u003cli>\u003cstrong>Harding blood is the key.\u003c/strong> Only Harding blood can hold the chain, mend it or open it, and her cold can't touch it. That's how Eldgard mends the crack Jamie cut, why the Lost One can take Nathaniel's hand without freezing him, and why Nixon, a Hargrave, is Harding blood too.\u003c/li>\u003cli>\u003cstrong>Breaking it has a price.\u003c/strong> If the chain breaks, she goes free, the light goes out for good, the White comes through until dawn, and one of the house that chained her goes with her into the White. It has to be given. She won't take it.\u003c/li>\u003cli>\u003cstrong>The Lost One's cold, and Miriam coming back.\u003c/strong> The cold comes out of her when she feels too much or when she chooses to use it, and it kills by touch. It costs her nothing, which is what makes it dangerous. She came through blank, knowing only one face, Alice's, because Alice was Miriam's whole world. The longer she wears the body, the more of Miriam comes back to her, a memory at a time and never in the order she'd choose, and the heaviest comes last. While the cold is in her, it holds Miriam's body exactly as it was in the river.\u003c/li>\u003c/ol>\n\u003cp>The remaining conflicts arise from people using these powers and devices under the limits described below.\u003c/p>\n\u003cp>\u003cstrong>The three layers of the secret\u003c/strong>\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Layer\u003c/th>\u003cth>Who believes it\u003c/th>\u003cth>What it says\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Public\u003c/td>\u003ctd>London\u003c/td>\u003ctd>Gallowglass grows from iron under Tyburn. In 1489 the Hargrave rebels were hanged there for treason.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Second\u003c/td>\u003ctd>Glim addicts, old Guardsmen, the Vykra\u003c/td>\u003ctd>The light hums with a woman crying. People call it the Weeping and say it's the hanged.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Truth\u003c/td>\u003ctd>Eldgard, later Nathaniel\u003c/td>\u003ctd>Morgana, a mother from the White, has been chained under the Works since 1489. The Hargraves were a Harding cadet branch, hanged by their own cousins for trying to free her. Her daughter ran into the snow.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>What gallowglass does\u003c/strong>\u003c/p>\n\u003cul>\u003cli>Burned in lamps and furnaces, it gives a green-white light and steady heat. The Ring, London's lamp grid, carries it under every street.\u003c/li>\u003cli>Ground to dust it becomes \u003cstrong>glim\u003c/strong>, the undercity's drug. Users hear the Weeping, which is the first clue, given in Episode 1. It is Morgana's lullaby to her daughter, and London has sung it for four hundred years as the Lantern Hymn, with new words nailed over the old tune. Her daughter can hear what nobody else can under it: the names of every life the house fed her.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>The Royal Lantern Guard.\u003c/strong> Chartered in 1689 to protect the Ring, they are London's elite, armed by the Harding Works. Oath: \u003cem>Light the dark. Keep the flame.\u003c/em> Ranks run Wick (recruit), Flame (trooper), Lantern-Captain.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Lantern gauntlet:\u003c/strong> a forearm rig with a gallowglass core. It fires a \u003cstrong>flash-burst\u003c/strong>, a blinding strobe that drops a man and sends wolves of the White running.\u003c/li>\u003cli>\u003cstrong>Leap-boosters:\u003c/strong> steam and crystal thrust packs for rooftop flight, thirty seconds per charge. When the charge runs out, you fall.\u003c/li>\u003cli>\u003cstrong>Tether-hook:\u003c/strong> a grapple line for swings and quick climbs.\u003c/li>\u003cli>\u003cstrong>Quench-blade:\u003c/strong> a glass sabre that drinks heat, built for fast takedowns. One touch numbs a limb; a long cut freezes the blood.\u003c/li>\u003cli>\u003cstrong>Lantern rifle:\u003c/strong> fires crystal rounds that burst into light. Every discharge goes into a log, bound into the rifle's case and audited whenever the rifles go back to the Works. That log matters in Episodes 4 and 10.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>The Harding lockets.\u003c/strong> Two silver hearts set with halves of one piece of gallowglass, a Harding heirloom. Touched with Harding blood they fire once: whatever holds one is pulled to the other, and both burn out. Jamie gives one to Miriam on the night he runs.\u003c/p>\n\u003cp>\u003cstrong>Undercity tech.\u003c/strong> \u003cstrong>Ghostlights\u003c/strong> are bootleg gauntlets, unstable and loud. Alice builds hers from parts stolen out of Nathaniel's shop. \u003cstrong>Ajax's Black Gauntlet\u003c/strong> is Nathaniel's own abandoned prototype, stolen two years ago, which hits like a piston.\u003c/p>\n\u003cp>\u003cstrong>The Vykra.\u003c/strong> A guild of undercity women, spies and knives for hire, run by Mother Grise from a Shadwell laundry. Her best are the twins Jennie and Jennifer: one knife, one ear. Their mark is a knot stitched inside the glove. Their poison, \u003cstrong>winter's kiss\u003c/strong>, is distilled from gallowglass and kills with frost on the lips, so it looks like the Frost Killer's work. For a fight in the dark they carry \u003cstrong>snap-glass\u003c/strong>: cracked gallowglass sealed in wax, which bursts into a blinding green flash when snapped.\u003c/p>\n\u003cp>\u003cstrong>Blackwood return generator.\u003c/strong> The generator under the bridge is the Ring's main return governor. A brass service key opens its cabinet; a separate return bar trips the city circuit. Works control can reset it after inspection. Jamie buys a cabinet-key copy from Ajax and gives it to Miriam. Miriam performs the 2 November shutdown. Ajax's later attack on t
