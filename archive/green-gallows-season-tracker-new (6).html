<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Green Gallows Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
:root{
  --bg:#e6e9e6; --paper:#f6f7f5; --paper2:#eceeeb; --ink:#1d2422; --muted:#59645f; --faint:#8a948f; --line:#cbd2ce; --line2:#dde2df;
  --focus:#2c6b5c;
  --t-harding:#9a3434; --t-sisters:#1f7a6d; --t-investigation:#a8740c; --t-guard:#2d5c9c;
  --t-lambrick:#6c3f8e; --t-vykra:#a3427a; --t-city:#4a5a66; --t-white:#3f7f96;
  --tint:9%; --tint-open:5%;
  --display:'IM Fell English',Georgia,'Times New Roman',serif;
  --ui:'Public Sans','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141917; --paper:#1b2220; --paper2:#222a27; --ink:#e3e8e5; --muted:#a1aca7; --faint:#75807b; --line:#323d39; --line2:#28312e;
  --focus:#7cc7b3;
  --t-harding:#e2786d; --t-sisters:#5cc4b6; --t-investigation:#e2b04c; --t-guard:#7fa7e6;
  --t-lambrick:#b88ddc; --t-vykra:#e58cbb; --t-city:#a3b1bc; --t-white:#7fc7dd;
  --tint:14%; --tint-open:8%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --paper:#1b2220; --paper2:#222a27; --ink:#e3e8e5; --muted:#a1aca7; --faint:#75807b; --line:#323d39; --line2:#28312e;
  --focus:#7cc7b3;
  --t-harding:#e2786d; --t-sisters:#5cc4b6; --t-investigation:#e2b04c; --t-guard:#7fa7e6;
  --t-lambrick:#b88ddc; --t-vykra:#e58cbb; --t-city:#a3b1bc; --t-white:#7fc7dd;
  --tint:14%; --tint-open:8%; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:7.5rem}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:inherit}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:1480px;margin:0 auto;padding:.55rem 1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.55rem;line-height:1;margin:0;white-space:nowrap;font-weight:400}
.brand small{font-family:var(--ui);font-size:.8rem;color:var(--muted);margin-left:.5rem;letter-spacing:.01em}
nav.tabs{display:flex;gap:.15rem}
nav.tabs a{text-decoration:none;padding:.35rem .7rem;border-radius:3px;color:var(--muted);font-weight:600;font-size:.92rem}
nav.tabs a[aria-current="page"]{color:var(--ink);background:var(--paper2);box-shadow:inset 0 -2px 0 var(--ink)}
.tools{margin-left:auto;display:flex;gap:.5rem;align-items:center}
.search{width:15rem;max-width:44vw;padding:.35rem .6rem;border:1px solid var(--line);border-radius:3px;background:var(--bg)}
.iconbtn{border:1px solid var(--line);background:var(--bg);border-radius:3px;padding:.32rem .55rem;line-height:1;color:var(--muted)}
.legend{max-width:1480px;margin:0 auto;padding:0 1rem .55rem;display:flex;flex-wrap:wrap;gap:.35rem .4rem;align-items:center}
.legend[hidden]{display:none}
.legend .hint{font-size:.8rem;color:var(--faint);margin-right:.25rem}
.tchip{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:.16rem .6rem .16rem .4rem;font-size:.8rem;color:var(--ink)}
.tchip i{width:.8rem;height:.8rem;border-radius:50%;background:var(--c);flex:none}
.tchip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--paper));font-weight:600}
.legend .clear{border:0;background:none;color:var(--muted);font-size:.8rem;text-decoration:underline;padding:.1rem .3rem}

main{max-width:1480px;margin:0 auto;padding:1.25rem 1rem 4rem}
section[hidden]{display:none}
h2,h3{font-weight:400}

/* ---------- braid (scene-order strip) ---------- */
.braid{display:flex;gap:2px;height:22px;min-width:0}
.braid button{flex:var(--w) 1 0;min-width:4px;border:0;padding:0;background:var(--c);border-radius:1px;position:relative}
.braid button:hover{filter:brightness(1.15)}
.braid button.dim{opacity:.18}
.braid.big{height:44px;gap:3px}
.braid.big button{color:#fff;font-size:.72rem;font-weight:700;display:flex;align-items:flex-end;justify-content:flex-start;padding:0 0 3px 4px;overflow:hidden}
:root[data-theme="dark"] .braid.big button{color:#0f1412}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .braid.big button{color:#0f1412}}

/* ---------- season view ---------- */
.season-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:2rem;align-items:end;margin-bottom:1.5rem}
.season-head h2{font-family:var(--display);font-size:clamp(2.2rem,4.5vw,3.6rem);line-height:1;margin:0}
.season-head p{margin:.6rem 0 0;color:var(--muted);max-width:60ch}
.clock{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;font-size:.74rem}
.clock .acts{grid-column:1/-1;display:grid;grid-template-columns:6fr 1fr 3fr;gap:2px;margin-bottom:2px}
.clock .acts span{border-top:2px solid var(--ink);padding-top:.2rem;color:var(--muted);font-weight:600}
.clock .cell{background:var(--paper);border:1px solid var(--line2);padding:.35rem .4rem;min-height:3.6rem}
.clock .cell b{display:block;font-family:var(--display);font-size:1.15rem;font-weight:400;line-height:1}
.clock .cell span{color:var(--muted);line-height:1.2;display:block;margin-top:.2rem}
.clock .cell.snow{background:color-mix(in srgb,var(--t-nixon) 10%,var(--paper))}
.loom{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.lrow{display:grid;grid-template-columns:3.4rem minmax(0,15rem) minmax(0,1fr) minmax(0,16rem);gap:1rem;align-items:center;padding:.85rem 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.lrow:hover .lt{text-decoration:underline}
.ln{font-family:var(--display);font-size:2.4rem;line-height:1;color:var(--muted)}
.lt{font-family:var(--display);font-size:1.3rem;line-height:1.1}
.lrow .lg{font-size:.84rem;color:var(--muted);margin-top:.25rem}
.lrow .tn{font-size:.82rem;color:var(--muted);border-left:2px solid var(--line);padding-left:.7rem}
.lrow .bwrap{display:flex;flex-direction:column;gap:.35rem}
.lrow .bmeta{font-size:.74rem;color:var(--faint)}
.thread-key{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.6rem 1.5rem;margin:2.2rem 0 0;padding-top:1.2rem;border-top:1px solid var(--line)}
.thread-key div{display:grid;grid-template-columns:.9rem 1fr;gap:.55rem;font-size:.86rem}
.thread-key i{width:.9rem;height:.9rem;border-radius:50%;background:var(--c);margin-top:.25rem}
.thread-key b{display:block}
.thread-key span{color:var(--muted)}
.thread-key em{font-style:normal;color:var(--faint);font-size:.78rem}

/* ---------- episode view ---------- */
.epnav{display:flex;align-items:center;gap:.3rem;flex-wrap:wrap;margin-bottom:1.1rem}
.epnav a{display:inline-grid;place-items:center;min-width:2.2rem;height:2.2rem;border:1px solid var(--line);border-radius:3px;text-decoration:none;font-family:var(--display);font-size:1.1rem;background:var(--paper)}
.epnav a[aria-current="page"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.epnav .sp{flex:1}
.epnav .step{min-width:auto;padding:0 .7rem;font-family:var(--ui);font-size:.85rem;font-weight:600}
.ephead{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:1.5rem 2.5rem;margin-bottom:1.2rem}
.ephead .num{font-size:.9rem;color:var(--muted)}
.ephead h2{font-family:var(--display);font-size:clamp(2rem,4vw,3.2rem);line-height:1.02;margin:.15rem 0 .5rem}
.ephead .log{font-size:1.08rem;margin:0 0 .8rem;max-width:62ch}
.ephead .story{color:var(--muted);margin:0;max-width:68ch}
.ephead aside{background:var(--paper);border:1px solid var(--line);padding:1rem 1.1rem;align-self:start}
.ephead aside h3{font-size:.85rem;font-weight:700;margin:0 0 .3rem}
.ephead aside p{margin:0 0 1rem}
.tcount{display:flex;flex-direction:column;gap:.3rem}
.tcount button{display:grid;grid-template-columns:.75rem 1fr auto;gap:.5rem;align-items:center;border:0;background:none;padding:.1rem 0;text-align:left;font-size:.86rem}
.tcount i{width:.75rem;height:.75rem;border-radius:50%;background:var(--c)}
.tcount span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.tcount button[aria-pressed="true"]{font-weight:700}
.stripwrap{margin:0 0 1.4rem}
.stripwrap .cap{display:flex;justify-content:space-between;font-size:.76rem;color:var(--faint);margin-top:.3rem}
.filters{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem;font-size:.86rem;color:var(--muted)}
.filters select{border:1px solid var(--line);background:var(--paper);border-radius:3px;padding:.25rem .4rem}
.filters label{display:flex;gap:.4rem;align-items:center}
.filters .count{margin-left:auto}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:.8rem;align-items:start}
.actdiv{grid-column:1/-1;display:flex;align-items:baseline;gap:.8rem;margin:1rem 0 .1rem;padding-bottom:.3rem;border-bottom:1px solid var(--ink)}
.actdiv:first-child{margin-top:0}
.actdiv h3{font-family:var(--display);font-size:1.35rem;margin:0}
.actdiv span{font-size:.8rem;color:var(--muted)}
.marker{grid-column:1/-1;font-size:.84rem;color:var(--muted);padding:.35rem .7rem;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 6%,transparent)}
.marker b{color:var(--ink);font-weight:600}

.card{--c:var(--faint);position:relative;background:color-mix(in srgb,var(--c) var(--tint),var(--paper));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));border-left:5px solid var(--c);border-radius:3px;padding:.75rem .85rem .7rem;display:flex;flex-direction:column;gap:.45rem;transition:opacity .15s}
.card.dim{opacity:.22}
.card.hit{outline:2px solid var(--c);outline-offset:2px}
.card .top{display:grid;grid-template-columns:auto 1fr;gap:.55rem;align-items:start}
.card .seq{font-family:var(--display);font-size:1.6rem;line-height:.9;color:var(--c);min-width:1.3rem}
.card h4{margin:0;font-size:.95rem;font-weight:700;line-height:1.3}
.card .oref{font-size:.74rem;color:var(--faint);margin-top:.1rem}
.card .where{font-size:.8rem;color:var(--muted);display:flex;gap:.35rem;align-items:flex-start;line-height:1.3}
.card .where svg{flex:none;margin-top:.1rem;width:11px;height:13px;fill:none;stroke:currentColor;stroke-width:1.6}
.card .when{font-style:italic}
.card .sum{margin:0;font-size:.92rem;line-height:1.5}
.card .turn{margin:0;font-size:.84rem;color:var(--muted);padding-left:.6rem;border-left:2px solid color-mix(in srgb,var(--c) 55%,transparent)}
.card .turn b{color:var(--ink);font-weight:600}
.card .foot{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;margin-top:auto;padding-top:.3rem}
.cchip{font-size:.74rem;border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:.02rem .45rem;color:var(--muted);cursor:pointer}
.cchip:hover{color:var(--ink);border-color:var(--muted)}
.also{display:inline-flex;gap:.2rem;margin-left:.15rem}
.also i{width:.6rem;height:.6rem;border-radius:50%;background:var(--c);display:inline-block}
.badges{display:flex;gap:.3rem;flex-wrap:wrap}
.badge{font-size:.72rem;font-weight:600;padding:.04rem .4rem;border-radius:2px;background:var(--paper);border:1px solid var(--line);color:var(--muted)}
.badge.add{border-color:var(--focus);color:var(--focus)}
.badge.ed{border-style:dashed;color:var(--ink,inherit)}
.badge.flag{border-color:var(--t-investigation);color:var(--t-investigation)}
.readbtn{margin-left:auto;border:0;background:none;font-size:.8rem;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:2px;padding:.1rem 0}
.card.open{grid-column:1/-1;background:color-mix(in srgb,var(--c) var(--tint-open),var(--paper))}
.card.open .sum{font-size:1rem;max-width:80ch}
.full{display:none;border-top:1px solid var(--line);margin-top:.4rem;padding-top:.8rem;max-width:84ch;font-size:.95rem;line-height:1.62}
.card.open .full{display:block}
.full blockquote{margin:.5rem 0;padding:.05rem .9rem;border-left:3px solid var(--line);color:var(--ink)}
.full blockquote blockquote{border-left-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.full p{margin:.45rem 0}
.full h1,.full h2,.full h3,.full h4{font-size:1rem;font-weight:700;margin:1rem 0 .3rem}
.full table{border-collapse:collapse;font-size:.84rem;margin:.6rem 0;display:block;overflow-x:auto}
.full th,.full td{border:1px solid var(--line);padding:.3rem .5rem;vertical-align:top;text-align:left}
.full hr{border:0;border-top:1px solid var(--line)}
.full code{font-size:.85em;background:var(--paper2);padding:0 .2rem}
.refs{margin-top:2rem;display:flex;flex-direction:column;gap:.5rem}
details.ref{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:.55rem .8rem}
details.ref summary{cursor:pointer;font-weight:600;font-size:.9rem}
details.ref summary span{font-weight:400;color:var(--muted)}
details.ref .full{display:block}

/* ---------- characters ---------- */
.chars-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:1.6rem}
.matrix-wrap{overflow-x:auto;border:1px solid var(--line);background:var(--paper)}
table.matrix{border-collapse:collapse;width:100%;min-width:760px;font-size:.84rem}
.matrix th,.matrix td{border-bottom:1px solid var(--line2);padding:.3rem .4rem;text-align:center}
.matrix thead th{font-family:var(--display);font-weight:400;font-size:1.05rem;position:sticky;top:0;background:var(--paper)}
.matrix tbody th{text-align:left;font-weight:600;white-space:nowrap;padding-left:.7rem}
.matrix tbody tr{cursor:pointer}
.matrix tbody tr:hover,.matrix tbody tr[aria-selected="true"]{background:var(--paper2)}
.matrix td .pip{display:inline-block;border-radius:2px;background:var(--ink);opacity:calc(.15 + var(--v) * .85);width:calc(.45rem + var(--v) * 1.25rem);height:.7rem;vertical-align:middle}
.matrix td.none{color:var(--faint)}
.matrix td small{display:block;color:var(--muted);font-size:.7rem;line-height:1.15;margin-top:.15rem;max-width:8.5rem;margin-inline:auto}
.journey h2{font-family:var(--display);font-size:2.2rem;margin:0}
.journey .sub{color:var(--muted);margin:.2rem 0 1rem}
.jlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.7rem}
.jcard{background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--ink);padding:.7rem .8rem;display:flex;flex-direction:column;gap:.35rem}
.jcard.off{opacity:.55;border-top-color:var(--line)}
.jcard .h{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
.jcard .h b{font-family:var(--display);font-weight:400;font-size:1.15rem}
.jcard .h span{font-size:.75rem;color:var(--muted)}
.jcard .st{font-weight:600;font-size:.86rem}
.jcard p{margin:0;font-size:.88rem}
.jcard .sc{display:flex;flex-wrap:wrap;gap:3px;margin-top:.2rem}
.jcard .sc a{width:1.45rem;height:1.25rem;display:inline-grid;place-items:center;background:var(--c);color:#fff;font-size:.68rem;font-weight:700;text-decoration:none;border-radius:2px}
:root[data-theme="dark"] .jcard .sc a{color:#0f1412}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .jcard .sc a{color:#0f1412}}

/* ---------- notes ---------- */
.notes h2{font-family:var(--display);font-size:2.2rem;margin:0 0 .3rem}
.notes .sub{color:var(--muted);margin:0 0 1.2rem;max-width:70ch}
.notes h3{font-family:var(--display);font-size:1.4rem;margin:1.4rem 0 .5rem}
.note{display:grid;grid-template-columns:4.2rem minmax(0,1fr);gap:.8rem;padding:.6rem 0;border-top:1px solid var(--line2)}
.note .id{font-weight:700;font-size:.85rem}
.note .id.open{color:var(--t-nixon)}
.note .id.flag{color:var(--t-investigation)}
.note p{margin:.15rem 0 0;font-size:.9rem;max-width:90ch}
.note a{font-size:.84rem;font-weight:600}

.empty{padding:2rem;text-align:center;color:var(--muted);grid-column:1/-1}

@media (max-width:1000px){
  .lrow{grid-template-columns:2.6rem minmax(0,1fr);}
  .lrow .bwrap{grid-column:1/-1}
  .lrow .tn{grid-column:1/-1}
  .season-head,.ephead{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .bar{position:static}
  html{scroll-padding-top:1rem}
  .legend{flex-wrap:nowrap;overflow-x:auto;padding-bottom:.6rem}
  .tchip{flex:none}
  .tools{margin-left:0;width:100%}
  .search{flex:1;width:auto;max-width:none}
  .clock{grid-template-columns:repeat(5,1fr)}
  .clock .acts{display:none}
  .grid{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{.bar,.legend,.epnav,.filters{display:none}.card .full{display:block}}

/* ---------- document views (world, ledger) ---------- */
.doc{max-width:82ch}
.doc h2{font-family:var(--display);font-size:2.4rem;margin:0 0 .4rem}
.doc h3{font-family:var(--display);font-size:1.45rem;margin:1.5rem 0 .4rem}
.doc h4{font-size:.95rem;font-weight:700;margin:1.1rem 0 .3rem}
.doc p{margin:.5rem 0;line-height:1.62}
.doc ul{margin:.4rem 0 .8rem;padding-left:1.2rem}
.doc ol{margin:.4rem 0 .8rem;padding-left:1.4rem}
.doc li{margin:.2rem 0;line-height:1.55}
.doc li>strong:first-child{color:var(--ink)}
.doc table{border-collapse:collapse;font-size:.85rem;margin:.7rem 0;display:block;overflow-x:auto;max-width:100%}
.doc th,.doc td{border:1px solid var(--line);padding:.32rem .55rem;vertical-align:top;text-align:left}
.doc th{background:var(--paper2);font-weight:600}
.doc blockquote{margin:.7rem 0;padding:.1rem .9rem;border-left:3px solid var(--line);color:var(--muted)}
.doc code{font-size:.85em;background:var(--paper2);padding:0 .2rem}
.doc .lede{color:var(--muted);max-width:70ch;margin:.2rem 0 1.4rem}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <h1 class="brand">The Green Gallows<small>The showrunner’s season</small></h1>
    <nav class="tabs" aria-label="Views">
      <a href="#season" data-v="season">Season</a>
      <a href="#ep1" data-v="episode">Episodes</a>
      <a href="#characters" data-v="characters">Characters</a>
      <a href="#world" data-v="world">World</a>
      <a href="#ledger" data-v="ledger">Ledger</a>
    </nav>
    <div class="tools">
      <label class="vh" for="q">Search scenes</label>
      <input id="q" class="search" type="search" placeholder="Search every scene" title="Searches summaries and full scene text. On the Season page, matching scenes stay lit in the strips.">
      <button class="iconbtn" id="theme" type="button" title="Switch light or dark">Light/dark</button>
    </div>
  </div>
  <div class="legend" id="legend" aria-label="Storylines"></div>
</header>
<main>
  <section id="v-season" aria-label="Season overview"></section>
  <section id="v-episode" aria-label="Episode" hidden></section>
  <section id="v-characters" aria-label="Characters" hidden></section>
  <section id="v-notes" aria-label="Flags and open decisions" hidden></section>
  <section id="v-world" aria-label="The world" hidden></section>

</main>
<script type="application/json" id="data">{"title":"The Green Gallows","subtitle":"The showrunner’s season · Blackwood continuity revision, 17 November 2026","seasonIntro":"London, November 1889, and the whole city glows green. Every lamp, tram and furnace burns gallowglass, a crystal that only House Harding knows how to grow, at the Harding Works on the old gallows field at Tyburn. The Hardings say it grows from iron in the ground. In fact it grows from a woman. Can Nathaniel Harding end the bargain that lights London without becoming the father who kept it? Under it runs the sisters' question: will Alice Bounds let the thing wearing her dead sister's face choose its own life? Protection as control. Every adult in this show hurts someone to keep them safe. The young ones have to learn whether love can let go. Five more themes run underneath it: bought or given, who pays for the light, what gets written down, the spare and the heir, and where you belong. The season argues every one of them from several sides and never says which side is right.","episodesNote":"A new ten-episode season, built from scratch on the strongest bones of the original: the Harding legacy, Miriam and the Lost One, and the sister reveal.","eps":[{"n":1,"title":"The Exhibition","time":"49 DAYS TO FIRST SNOW","clock":"49 DAYS TO FIRST SNOW","act":"I","log":"On Alice's twentieth birthday, Miriam steals enough to leave the Vykra with Jamie and her sister. She shuts down the Ring under Blackwood Bridge so Jamie can reach the chain. At midnight, the carriage that should bring her lover brings Jennie wearing his face, and the Xylon kiss turns Miriam's own body against her. The pilot ends before the river possession or morgue resurrection.","sum":"Jamie left with Eldgard; Miriam forced over the rail. Rescue and resurrection open Episode 2","turn":"A Wick shoots Jamie; Jennie uses his face and Xylon to murder Miriam","focus":"the Exhibition above and two sisters below; a shared escape plan that costs both lovers their lives.","piece":"the Narrows job; Miriam's Blackwood generator shutdown; the core raid and poisoned carriage.","threads":["city","sisters","harding","guard","vykra","white","investigation"],"frame":"\u003cp>\u003cstrong>49 DAYS TO FIRST SNOW.\u003c/strong> 2 November 1889. \u003cstrong>Focus:\u003c/strong> the Exhibition above and two sisters below; a shared escape plan that costs both lovers their lives. \u003cstrong>Set pieces:\u003c/strong> the Narrows job; Miriam's Blackwood generator shutdown; the core raid and poisoned carriage. \u003cstrong>Sting:\u003c/strong> Jamie is the wounded saboteur left alone with his father, while Xylon forces Miriam from the bridge.\u003c/p>","scenes":[{"oref":"Scene 1","id":1,"seq":1,"title":"Tyburn, 1489. Night, no snow, but frost","added":false,"act":"Cold open","kind":"scene","sum":"No dialogue. A hundred empty gallows frames on a frozen field, and one old thief turning on his rope. Creak. Creak. Below the ground is a pit lined with iron, and something vast is breathing behind a lantern's glare. We never see her face. We see a hand of blue ice the size of a cartwheel, an iron hook through the palm, and we hear her singing a wordless lullaby, low and patient. ALISTAIR HARDING kneels at the wrist. He's in his forties, a threadbare scholar's gown over a nobleman's shirt, a wolf-crest ring on his finger, and a satchel of brass instruments nobody ever paid for. He's a failed natural philosopher on the one night he stops failing. He opens the ice with a brass lancet. Her blood runs green into a lantern of his own design. Fwhumph. It's the first gallowglass light. His son EDRIC, nine, holds it up for him, solemn and proud to be useful. Behind them a tiny girl made of frost slips out of the pit. Alistair sees her, and steps aside. He has what he wanted. She runs into the white dark, and the wolves run after her. At the treeline a young woman in Harding colours, nineteen, a cousin, sees all of it and backs into the trees. The singing doesn't stop. We push into the green flame of Edric's lantern until it fills the frame— MATCH CUT TO: the same green flame in a Mayfair street lamp, 1889. Every lamp on the street is burning. The camera drops through an iron grating in the pavement, down past the Ring mains glowing in their pipes, and comes up through a second grating onto Gin Lane, where only every third lamp is lit. Under the dark ones, women sell tallow candles from trays, chalked FOR ESSEX NIGHTS. A barrel organ grinds out the Lantern Hymn, and for anyone who has just heard the lullaby, it's the same tune. TITLE CARD: 49 DAYS TO FIRST SNOW.","loc":"Tyburn","when":"No dialogue.","th":"city","also":["white"],"ch":["alistair","morgana"],"turn":"TITLE CARD: 49 DAYS TO FIRST SNOW.","w":332,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>\u003cem>No dialogue.\u003c/em>\u003c/p>\n\u003cp>A hundred empty gallows frames on a frozen field, and one old thief turning on his rope. \u003cem>Creak. Creak.\u003c/em> Below the ground is a pit lined with iron, and something vast is breathing behind a lantern's glare. We never see her face. We see a hand of blue ice the size of a cartwheel, an iron hook through the palm, and we hear her singing a wordless lullaby, low and patient.\u003c/p>\n\u003cp>ALISTAIR HARDING kneels at the wrist. He's in his forties, a threadbare scholar's gown over a nobleman's shirt, a wolf-crest ring on his finger, and a satchel of brass instruments nobody ever paid for. He's a failed natural philosopher on the one night he stops failing. He opens the ice with a brass lancet. Her blood runs green into a lantern of his own design. \u003cem>Fwhumph.\u003c/em> It's the first gallowglass light. His son EDRIC, nine, holds it up for him, solemn and proud to be useful.\u003c/p>\n\u003cp>Behind them a tiny girl made of frost slips out of the pit. Alistair sees her, and steps aside. He has what he wanted. She runs into the white dark, and the wolves run after her. At the treeline a young woman in Harding colours, nineteen, a cousin, sees all of it and backs into the trees.\u003c/p>\n\u003cp>The singing doesn't stop. We push into the green flame of Edric's lantern until it fills the frame—\u003c/p>\n\u003cp>\u003cstrong>MATCH CUT TO:\u003c/strong> the same green flame in a Mayfair street lamp, 1889. Every lamp on the street is burning. The camera drops through an iron grating in the pavement, down past the Ring mains glowing in their pipes, and comes up through a second grating onto \u003cstrong>Gin Lane\u003c/strong>, where only every third lamp is lit. Under the dark ones, women sell tallow candles from trays, chalked \u003cstrong>FOR ESSEX NIGHTS\u003c/strong>. A barrel organ grinds out the Lantern Hymn, and for anyone who has just heard the lullaby, it's the same tune.\u003c/p>\n\u003cp>\u003cstrong>TITLE CARD: 49 DAYS TO FIRST SNOW.\u003c/strong>\u003c/p>"},{"oref":"Scene 2","id":2,"seq":2,"title":"The Narrows: a riverside warehouse with no sign. Dusk, rain","added":false,"act":"Act One","kind":"scene","sum":"Rain hammers the skylight. Tak-tak-tak-tak. Under it, seven green lamps light a smugglers' floor. Crates are stencilled with the Harding lantern crest, and the Works stamp has been chiselled off every one. One crate is open, packed in straw, and the crystal inside throws a cold green glow up into the faces around it: core-cut gallowglass, the kind the Works never sells. AJAX FINK, 35, sits on a crate eating an apple. Crnch. He has good teeth, a bad smile, and a camel coat too fine for the room. His right arm is cased to the elbow in black iron, all pistons and rivets, and it hisses softly whenever he flexes it. Hss. Across from him stands MR DE GRAAF, an Antwerp smuggler in sealskin with spectacles fogged by the green light, holding a jeweller's loupe to a crystal. Five of Ajax's men lean on the crates. Two more watch the doors. That's seven. DE GRAAF: Forty a pound. AJAX: Ninety. DE GRAAF: Stamped glass fetches sixty in Antwerp. This has no stamp. AJAX: No stamp, no Crown counting it. DE GRAAF: The Crown counts everything, Mr Fink. A captain caught with unstamped Harding glass, they don't hang him. They hand him to the Hardings. (a shudder he didn't mean to show) Four hundred years they've held the rope at Tyburn. You think they forgot how to tie it? AJAX: Then you're paying for my nerve and all. DE GRAAF: And whose coal pays for yours? AJAX: (smiling) My governor likes to know how a thing's made before he buys the shop. DE GRAAF: (turning the crystal in the loupe) Last crate went grey by Rotterdam. Dull as river stones. My buyer says the light dies once it's far from London. AJAX: Then don't dawdle. Seventy. DE GRAAF: Fifty. And I don't ask why your glass gets homesick. AJAX: (a bite of apple, cheerful) Everybody in London's selling Harding light, Mr de Graaf. I'm just the only one honest about the price. Above them, on the skylight, rain runs off a shape lying flat on the glass. MIRIAM BOUNDS, 24: tall and long-limbed, her dark hair braided tight under a wool cap, a charcoal coat with Vykra red stitched inside the collar, soft boots worn thin at the toe, and a knife flat against her spine. She has the calm face of a woman who has already counted the exits. Her lips move silently as she counts the men. One. Two. Three… She counts the lamps too. Seven. Behind her, two roofs back, a second, smaller shadow crouches in the rain. Miriam doesn't see it.","loc":"The Narrows: a riverside warehouse with no sign. Dusk","when":"Rain hammers the skylight.","th":"lambrick","also":["vykra","sisters"],"ch":["ajax","miriam"],"turn":"Behind her, two roofs back, a second, smaller shadow crouches in the rain. Miriam doesn't see it.","w":435,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>Rain hammers the skylight. \u003cem>Tak-tak-tak-tak.\u003c/em> Under it, seven green lamps light a smugglers' floor. Crates are stencilled with the Harding lantern crest, and the Works stamp has been chiselled off every one. One crate is open, packed in straw, and the crystal inside throws a cold green glow up into the faces around it: \u003cstrong>core-cut gallowglass\u003c/strong>, the kind the Works never sells.\u003c/p>\n\u003cp>AJAX FINK, 35, sits on a crate eating an apple. \u003cem>Crnch.\u003c/em> He has good teeth, a bad smile, and a camel coat too fine for the room. His right arm is cased to the elbow in black iron, all pistons and rivets, and it hisses softly whenever he flexes it. \u003cem>Hss.\u003c/em> Across from him stands MR DE GRAAF, an Antwerp smuggler in sealskin with spectacles fogged by the green light, holding a jeweller's loupe to a crystal. Five of Ajax's men lean on the crates. Two more watch the doors. That's seven.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>DE GRAAF:\u003c/strong> Forty a pound.\n\u003cstrong>AJAX:\u003c/strong> Ninety.\n\u003cstrong>DE GRAAF:\u003c/strong> Stamped glass fetches sixty in Antwerp. This has no stamp.\n\u003cstrong>AJAX:\u003c/strong> No stamp, no Crown counting it.\n\u003cstrong>DE GRAAF:\u003c/strong> The Crown counts everything, Mr Fink. A captain caught with unstamped Harding glass, they don't hang him. They hand him to the Hardings. \u003cem>(a shudder he didn't mean to show)\u003c/em> Four hundred years they've held the rope at Tyburn. You think they forgot how to tie it?\n\u003cstrong>AJAX:\u003c/strong> Then you're paying for my nerve and all.\n\u003cstrong>DE GRAAF:\u003c/strong> And whose coal pays for yours?\n\u003cstrong>AJAX:\u003c/strong> \u003cem>(smiling)\u003c/em> My governor likes to know how a thing's made before he buys the shop.\n\u003cstrong>DE GRAAF:\u003c/strong> \u003cem>(turning the crystal in the loupe)\u003c/em> Last crate went grey by Rotterdam. Dull as river stones. My buyer says the light \u003cem>dies\u003c/em> once it's far from London.\n\u003cstrong>AJAX:\u003c/strong> Then don't dawdle. Seventy.\n\u003cstrong>DE GRAAF:\u003c/strong> Fifty. And I don't ask why your glass gets homesick.\n\u003cstrong>AJAX:\u003c/strong> \u003cem>(a bite of apple, cheerful)\u003c/em> Everybody in London's selling Harding light, Mr de Graaf. I'm just the only one honest about the price.\u003c/p>\u003c/blockquote>\n\u003cp>Above them, on the skylight, rain runs off a shape lying flat on the glass. \u003cstrong>MIRIAM BOUNDS\u003c/strong>, 24: tall and long-limbed, her dark hair braided tight under a wool cap, a charcoal coat with Vykra red stitched inside the collar, soft boots worn thin at the toe, and a knife flat against her spine. She has the calm face of a woman who has already counted the exits. Her lips move silently as she counts the men. \u003cem>One. Two. Three…\u003c/em> She counts the lamps too. \u003cem>Seven.\u003c/em>\u003c/p>\n\u003cp>Behind her, two roofs back, a second, smaller shadow crouches in the rain. Miriam doesn't see it.\u003c/p>"},{"oref":"Scene 3","id":253,"seq":3,"title":"The takedown","added":false,"act":"Act One","kind":"scene","sum":"Almost no dialogue. This is a sequence about speed, shadow and light. Miriam pulls a slim glass vial from her sleeve, Vykra snap-glass: cracked gallowglass sealed in wax. She snaps it and drops it through a broken pane. KRAK. A burst of green-white light fills the warehouse. Seven men go blind for one second, and in that second she drops. Thud. She lands on the crate between Ajax's men and the Dutchman's loupe and is already moving. Lamp one: her gloved thumb clamps the vent and it gutters out. Guard one: an elbow to the throat, krk. Lamp two: she knocks it off its hook into a rain barrel, fsssh. The room is going dark, and the dark is hers. Every time a lamp dies, the frame changes. In the green, we see her. In the black, we only hear her. Thump. A man goes over a crate. Shhk. A belt is cut and a pistol drops. A guard fires blind, BLAM, and the muzzle flash shows her for one frame, already somewhere else, already behind him. Krk. Lamp three. Lamp four. She counts under her breath as she goes, the old count: \"Four post. Five post.\" De Graaf hides behind a crate. \"Godverdomme—\" The fifth guard has a lantern rifle, a stolen Guard piece with the regimental number filed off, and he fires it into the dark. The round doesn't hit her. It hits the open crate of core-cut glass. KA-WHOOOMPH. Cracked crystal doesn't burn, it bursts. A column of green fire lifts the crate lid into the rafters, and shadows the height of houses throw themselves across the walls. Straw rains down burning. In the green glare, three silhouettes go down one after another: kick, knee, the hilt of a knife. Lamp five. Lamp six. The last guard runs. She lets him. Then there's one lamp left, and Ajax is standing under it. He hasn't moved since the first flash. He finishes his apple and tosses the core aside. Thup. AJAX: Grise sends one girl now? I'm insulted. He flexes the gauntlet. Hssssss. The pistons draw back like a breath. The last stand is quick and ugly. She's faster, and he doesn't need to be fast. Her knife skids off the iron, KLANG, KLANG, sparking green. He punches a crate into kindling where her head was a moment ago, WHUNK. She goes under his arm, cuts his coat, and goes for the lamp to finish the dark. He's been waiting for that. The iron hand closes on her throat and slams her into the safe in the wall. Bang. Her boots leave the floor. Hssssss. The pistons tighten. AJAX: Pretty. Shame. Behind him, the second shadow drops from the skylight without a sound. ALICE BOUNDS, 20: small and wiry, her hair chopped short with a knife, a borrowed coat two sizes too big, her knuckles wrapped in rag. She has wolf's eyes. She doesn't count or plan. She just goes, and her blade opens Ajax from cheekbone to jaw. Shhk. AJAX: Aaagh—! He drops Miriam and backs toward the river window, blood running through his fingers, and looks at the girl who did it, properly, for the first time. AJAX: I'll remember you. KSHHH. He goes through the glass, and a moment later there's a splash in the black water below. The warehouse burns green around them. De Graaf crawls out from behind his crate with his hands up. DE GRAAF: Who sent you? MIRIAM: Nobody you can afford. She spins the dial on the safe. Click… click… clunk. Grise's strongbox goes into her satchel. A purse stamped with the Lambrick crest goes into her coat, not the satchel. Alice sees which pocket, and we see her see it. She says nothing. Then the sisters face each other in the firelight. MIRIAM: (hoarse) What are you doing here? ALICE: Helping. He nearly had you, Mim. MIRIAM: I had it under control. ALICE: Your feet weren't touching the floor. MIRIAM: Ughh. (she takes her by the ear) Walk. ALICE: Ow, easy— Under the broken skylight, rain coming in on them, Alice says it out of a habit older than either of them can remember: ALICE: Who goes first? MIRIAM: Me. Always me. Miriam goes up the rope first and hauls her sister after her. They go out through the skylight, black against the green fire, and behind them the second crate goes up. WHOOMPH.","loc":"The takedown","when":"Almost no dialogue.","th":"sisters","also":["vykra","lambrick"],"ch":["miriam","alice","ajax"],"turn":"Miriam goes up the rope first and hauls her sister after her. They go out through the skylight, black against the green fire, and behind them the second crate goes up. WHOOMPH.","w":735,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>\u003cem>Almost no dialogue. This is a sequence about speed, shadow and light.\u003c/em>\u003c/p>\n\u003cp>Miriam pulls a slim glass vial from her sleeve, Vykra \u003cstrong>snap-glass\u003c/strong>: cracked gallowglass sealed in wax. She snaps it and drops it through a broken pane.\u003c/p>\n\u003cp>\u003cem>KRAK.\u003c/em> A burst of green-white light fills the warehouse. Seven men go blind for one second, and in that second she drops.\u003c/p>\n\u003cp>\u003cem>Thud.\u003c/em> She lands on the crate between Ajax's men and the Dutchman's loupe and is already moving. \u003cstrong>Lamp one:\u003c/strong> her gloved thumb clamps the vent and it gutters out. \u003cstrong>Guard one:\u003c/strong> an elbow to the throat, \u003cem>krk\u003c/em>. \u003cstrong>Lamp two:\u003c/strong> she knocks it off its hook into a rain barrel, \u003cem>fsssh\u003c/em>. The room is going dark, and the dark is hers.\u003c/p>\n\u003cp>Every time a lamp dies, the frame changes. In the green, we see her. In the black, we only hear her. \u003cem>Thump.\u003c/em> A man goes over a crate. \u003cem>Shhk.\u003c/em> A belt is cut and a pistol drops. A guard fires blind, \u003cem>BLAM\u003c/em>, and the muzzle flash shows her for one frame, already somewhere else, already behind him. \u003cem>Krk.\u003c/em> \u003cstrong>Lamp three. Lamp four.\u003c/strong> She counts under her breath as she goes, the old count: \u003cem>&quot;Four post. Five post.&quot;\u003c/em>\u003c/p>\n\u003cp>De Graaf hides behind a crate. \u003cem>&quot;Godverdomme—&quot;\u003c/em>\u003c/p>\n\u003cp>The fifth guard has a lantern rifle, a stolen Guard piece with the regimental number filed off, and he fires it into the dark. The round doesn't hit her. It hits \u003cstrong>the open crate of core-cut glass\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>KA-WHOOOMPH.\u003c/strong> Cracked crystal doesn't burn, it bursts. A column of green fire lifts the crate lid into the rafters, and shadows the height of houses throw themselves across the walls. Straw rains down burning. In the green glare, three silhouettes go down one after another: kick, knee, the hilt of a knife. \u003cstrong>Lamp five. Lamp six.\u003c/strong> The last guard runs. She lets him.\u003c/p>\n\u003cp>Then there's one lamp left, and Ajax is standing under it.\u003c/p>\n\u003cp>He hasn't moved since the first flash. He finishes his apple and tosses the core aside. \u003cem>Thup.\u003c/em>\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>AJAX:\u003c/strong> Grise sends one girl now? I'm insulted.\u003c/p>\u003c/blockquote>\n\u003cp>He flexes the gauntlet. \u003cem>Hssssss.\u003c/em> The pistons draw back like a breath.\u003c/p>\n\u003cp>The last stand is quick and ugly. She's faster, and he doesn't need to be fast. Her knife skids off the iron, \u003cem>KLANG, KLANG\u003c/em>, sparking green. He punches a crate into kindling where her head was a moment ago, \u003cem>WHUNK\u003c/em>. She goes under his arm, cuts his coat, and goes for the lamp to finish the dark. He's been waiting for that. The iron hand closes on her throat and slams her into the safe in the wall. \u003cem>Bang.\u003c/em> Her boots leave the floor. \u003cem>Hssssss.\u003c/em> The pistons tighten.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>AJAX:\u003c/strong> Pretty. Shame.\u003c/p>\u003c/blockquote>\n\u003cp>Behind him, the second shadow drops from the skylight without a sound. \u003cstrong>ALICE BOUNDS\u003c/strong>, 20: small and wiry, her hair chopped short with a knife, a borrowed coat two sizes too big, her knuckles wrapped in rag. She has wolf's eyes. She doesn't count or plan. She just goes, and her blade opens Ajax from cheekbone to jaw. \u003cem>Shhk.\u003c/em>\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>AJAX:\u003c/strong> \u003cem>Aaagh\u003c/em>—!\u003c/p>\u003c/blockquote>\n\u003cp>He drops Miriam and backs toward the river window, blood running through his fingers, and looks at the girl who did it, properly, for the first time.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>AJAX:\u003c/strong> I'll remember you.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cem>KSHHH.\u003c/em> He goes through the glass, and a moment later there's a splash in the black water below.\u003c/p>\n\u003cp>The warehouse burns green around them. De Graaf crawls out from behind his crate with his hands up.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>DE GRAAF:\u003c/strong> Who \u003cem>sent\u003c/em> you?\n\u003cstrong>MIRIAM:\u003c/strong> Nobody you can afford.\u003c/p>\u003c/blockquote>\n\u003cp>She spins the dial on the safe. \u003cem>Click… click… clunk.\u003c/em> Grise's strongbox goes into her satchel. A purse stamped with the Lambrick crest goes into her coat, not the satchel. Alice sees which pocket, and we see her see it. She says nothing.\u003c/p>\n\u003cp>Then the sisters face each other in the firelight.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>MIRIAM:\u003c/strong> \u003cem>(hoarse)\u003c/em> What are you doing here?\n\u003cstrong>ALICE:\u003c/strong> Helping. He nearly \u003cem>had\u003c/em> you, Mim.\n\u003cstrong>MIRIAM:\u003c/strong> I had it under control.\n\u003cstrong>ALICE:\u003c/strong> Your feet weren't touching the floor.\n\u003cstrong>MIRIAM:\u003c/strong> \u003cem>Ughh.\u003c/em> \u003cem>(she takes her by the ear)\u003c/em> Walk.\n\u003cstrong>ALICE:\u003c/strong> Ow, \u003cem>easy\u003c/em>—\u003c/p>\u003c/blockquote>\n\u003cp>Under the broken skylight, rain coming in on them, Alice says it out of a habit older than either of them can remember:\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>ALICE:\u003c/strong> Who goes first?\n\u003cstrong>MIRIAM:\u003c/strong> Me. Always me.\u003c/p>\u003c/blockquote>\n\u003cp>Miriam goes up the rope first and hauls her sister after her. They go out through the skylight, black against the green fire, and behind them the second crate goes up. \u003cem>WHOOMPH.\u003c/em>\u003c/p>"},{"oref":"Scene 4","id":254,"seq":4,"title":"The Narrows, an hour later","added":true,"act":"Act One","kind":"scene","sum":"The constables carry wounded men into the rain. FELIX HAWKE studies the lamps in the order they were put out: closed vent, cut strap, rain barrel. Then the safe. The strongbox is gone; most of the glass remains. FELIX: I know whose work this is. A Vykra girl. CONSTABLE: Witness says two, sir. FELIX: One knew the way out. The other came after her. He lifts a red thread from the skylight frame. FELIX: Tall one. Charcoal coat, red at the collar. Tell your birds to keep an eye out. CONSTABLE: Bring her in? FELIX: Find her. Quietly. And if Fink's men find her first, I want to know. Outside, the constable passes the description and a coin to a dock runner. The runner takes the quays; another goes to the Wapping ticket offices. Felix stays with the damaged lamps. He is following a person now, not waiting for a convenient witness to appear.","loc":"The Narrows","when":"The constables carry wounded men into the rain.","th":"city","also":["harding"],"ch":["felix"],"turn":"Outside, the constable passes the description and a coin to a dock runner. The runner takes the quays; another goes to the Wapping ticket offices. Felix stays with the damaged lamps. He is following a person now, not wai","w":154,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>The constables carry wounded men into the rain. FELIX HAWKE studies the lamps in the order they were put out: closed vent, cut strap, rain barrel. Then the safe. The strongbox is gone; most of the glass remains.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>FELIX:\u003c/strong> I know whose work this is. A Vykra girl.\n\u003cstrong>CONSTABLE:\u003c/strong> Witness says two, sir.\n\u003cstrong>FELIX:\u003c/strong> One knew the way out. The other came after her.\u003c/p>\u003c/blockquote>\n\u003cp>He lifts a red thread from the skylight frame.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>FELIX:\u003c/strong> Tall one. Charcoal coat, red at the collar. Tell your birds to keep an eye out.\n\u003cstrong>CONSTABLE:\u003c/strong> Bring her in?\n\u003cstrong>FELIX:\u003c/strong> Find her. Quietly. And if Fink's men find her first, I want to know.\u003c/p>\u003c/blockquote>\n\u003cp>Outside, the constable passes the description and a coin to a dock runner. The runner takes the quays; another goes to the Wapping ticket offices. Felix stays with the damaged lamps. He is following a person now, not waiting for a convenient witness to appear.\u003c/p>"},{"oref":"Scene 5","id":3,"seq":5,"title":"Harding Works, the gauntlet shop","added":false,"act":"Act One","kind":"scene","sum":"The shop sits high in the Works, and its windows look down on the vats, rows of green crystal growing in brine under brass hoods with the Works motto cast into them: PROVIDENCE AND IRON. EST. 1489. A chalkboard on the wall lists districts with tallies of dark hours beside them: Barking 3. Ilford 2. Essex (whole) 4. Somebody has underlined Essex twice. NATHANIEL HARDING, 21, straps on his leap-gauntlet prototype. He's lanky and ink-stained, sleeves rolled, wearing goggles he has forgotten are pushed up on his head. He has a face that hasn't learned yet to hide how much it wants things. He fires the booster. Kshhhh-THOOM. He crosses the foundry in one jump and lands in the coal bin. BYRON, 64, the butler, picks soot out of his hair. He's silver-haired and straight-backed, an old soldier's moustache, white gloves somehow still white. BYRON: Very graceful, sir. The coal agrees. NATHANIEL: Tonight he sees it, Byron. In front of the Crown. He'll have to look. BYRON: Then I'll brush you twice. (a beat) And, sir, if he doesn't look— NATHANIEL: He'll look. BYRON: Yes, sir. He brushes him twice. Byron has been the only audience for these for years. As he goes, he lights himself down the servants' stair with a tallow candle, not a green lamp. Nobody in the house has ever asked why. On the wall, a maintenance diagram of the Ring marks its main return beneath Blackwood Bridge: BLACKWOOD RETURN GENERATOR — EMERGENCY ISOLATION. RESET FROM WORKS CONTROL ONLY. The apparatus beneath the bridge is part of the city circuit, not a convenient device introduced at the blackout.","loc":"Harding Works","when":"The shop sits high in the Works, and its windows look down on the vats, rows of green crystal growing in brine under brass hoods with the Works motto cast into them: PROVIDENCE AND","th":"harding","also":[],"ch":["nathaniel","byron"],"turn":"On the wall, a maintenance diagram of the Ring marks its main return beneath Blackwood Bridge: BLACKWOOD RETURN GENERATOR — EMERGENCY ISOLATION. RESET FROM WORKS CONTROL ONLY. The apparatus beneath the bridge is part of ","w":272,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>The shop sits high in the Works, and its windows look down on the vats, rows of green crystal growing in brine under brass hoods with the Works motto cast into them: \u003cstrong>PROVIDENCE AND IRON. EST. 1489.\u003c/strong> A chalkboard on the wall lists districts with tallies of dark hours beside them: \u003cem>Barking 3. Ilford 2. Essex (whole) 4.\u003c/em> Somebody has underlined Essex twice.\u003c/p>\n\u003cp>NATHANIEL HARDING, 21, straps on his leap-gauntlet prototype. He's lanky and ink-stained, sleeves rolled, wearing goggles he has forgotten are pushed up on his head. He has a face that hasn't learned yet to hide how much it wants things. He fires the booster. \u003cem>Kshhhh-THOOM.\u003c/em> He crosses the foundry in one jump and lands in the coal bin.\u003c/p>\n\u003cp>BYRON, 64, the butler, picks soot out of his hair. He's silver-haired and straight-backed, an old soldier's moustache, white gloves somehow still white.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>BYRON:\u003c/strong> Very graceful, sir. The coal agrees.\n\u003cstrong>NATHANIEL:\u003c/strong> Tonight he sees it, Byron. In front of the Crown. He'll \u003cem>have\u003c/em> to look.\n\u003cstrong>BYRON:\u003c/strong> Then I'll brush you twice. \u003cem>(a beat)\u003c/em> And, sir, if he doesn't look—\n\u003cstrong>NATHANIEL:\u003c/strong> He'll look.\n\u003cstrong>BYRON:\u003c/strong> Yes, sir.\u003c/p>\u003c/blockquote>\n\u003cp>He brushes him twice.\u003c/p>\n\u003cp>Byron has been the only audience for these for years. As he goes, he lights himself down the servants' stair with a tallow candle, not a green lamp. Nobody in the house has ever asked why.\u003c/p>\n\u003cp>On the wall, a maintenance diagram of the Ring marks its main return beneath Blackwood Bridge: \u003cstrong>BLACKWOOD RETURN GENERATOR — EMERGENCY ISOLATION. RESET FROM WORKS CONTROL ONLY.\u003c/strong> The apparatus beneath the bridge is part of the city circuit, not a convenient device introduced at the blackout.\u003c/p>"},{"oref":"Scene 6","id":4,"seq":6,"title":"Harding House, the study","added":false,"act":"Act One","kind":"scene","sum":"The room is full of the house's history. A framed print of the 1689 Charter hangs above the fireplace, the Crown's seal at the foot of it and one page conspicuously missing from the sequence. A brass model of the Ring, London's lamp grid, sits under a glass dome, its veins of green wire all running to one point at Tyburn. A telegram lies open on the blotter: EASTERN PROVINCES. FAILURE AGAIN 2 AM. CROWN ENQUIRES. ELDGARD HARDING, 58, pours two drinks. He's broad and grey and very still, in a perfectly cut black coat, with the wolf-crest ring from the cold open on his hand: four hundred years of it on one finger. JAMIE HARDING, 25, stands across the desk. He's tall and immaculate in evening black, his cravat already crooked from pulling at it, with grey eyes that haven't slept in a week. ELDGARD: After tonight your preparation begins. JAMIE: Say what it's for. ELDGARD: You know what it's for. JAMIE: I know what the Tithe is. I want to hear you call it something. ELDGARD: (a long beat) Drink with me, James. Eldgard pushes a glass across. Jamie leaves it where it is. On his way out he sets his pocket watch on his father's desk, wound and ticking, beside the telegram. Eldgard doesn't notice. He never does call it anything.","loc":"Harding House","when":"The room is full of the house's history.","th":"harding","also":[],"ch":["eldgard","jamie"],"turn":"Eldgard pushes a glass across. Jamie leaves it where it is. On his way out he sets his pocket watch on his father's desk, wound and ticking, beside the telegram. Eldgard doesn't notice. He never does call it anything.","w":224,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>The room is full of the house's history. A framed print of the 1689 Charter hangs above the fireplace, the Crown's seal at the foot of it and one page conspicuously missing from the sequence. A brass model of the Ring, London's lamp grid, sits under a glass dome, its veins of green wire all running to one point at Tyburn. A telegram lies open on the blotter: \u003cem>EASTERN PROVINCES. FAILURE AGAIN 2 AM. CROWN ENQUIRES.\u003c/em>\u003c/p>\n\u003cp>ELDGARD HARDING, 58, pours two drinks. He's broad and grey and very still, in a perfectly cut black coat, with the wolf-crest ring from the cold open on his hand: four hundred years of it on one finger. JAMIE HARDING, 25, stands across the desk. He's tall and immaculate in evening black, his cravat already crooked from pulling at it, with grey eyes that haven't slept in a week.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>ELDGARD:\u003c/strong> After tonight your preparation begins.\n\u003cstrong>JAMIE:\u003c/strong> Say what it's for.\n\u003cstrong>ELDGARD:\u003c/strong> You know what it's for.\n\u003cstrong>JAMIE:\u003c/strong> I know what the Tithe is. I want to hear you call it something.\n\u003cstrong>ELDGARD:\u003c/strong> \u003cem>(a long beat)\u003c/em> Drink with me, James.\u003c/p>\u003c/blockquote>\n\u003cp>Eldgard pushes a glass across. Jamie leaves it where it is. On his way out he sets his pocket watch on his father's desk, wound and ticking, beside the telegram. Eldgard doesn't notice. He never does call it anything.\u003c/p>"},{"oref":"Scene 7","id":5,"seq":7,"title":"The Shadwell laundry, after","added":false,"act":"Act One","kind":"scene","sum":"Steam pours from the vents. Behind the mangles, MOTHER GRISE opens the recovered strongbox and checks a folded inventory. GRISE: And the Lambrick purse? MIRIAM: Burned with the safe. GRISE: The safe didn't burn. Miriam holds her eyes. MIRIAM: The wood round it did. Alice knows which pocket the purse is in. She says nothing. Grise counts the recovered gold twice, then pays Miriam without challenging the lie. She has suspicion, not proof. In the yard a laundress slaps a wet strap onto the trestle. A buckle rings. Alice is across the yard before she knows she has moved. Miriam looks away. Grise comes to the doorway. GRISE: Ajax Fink, across the face. Nobody's touched that man in years. You have talent, girl. The Vykra would receive you. Miriam steps between them. MIRIAM: She's not interested. GRISE: I asked her. MIRIAM: And I'm answering. Keep your greasy, slimy hands off her. GRISE: Every girl thinks she's the one who gets out, dear. It's what makes them good. Miriam takes Alice into the fog. Grise beckons JENNIFER from the mangle. Mint between her teeth; hair pinned to the right. GRISE: See where she spends it. At the other mangle, JENNIE keeps working. Grise lays a pair of knotted gloves beside her. Jennie looks at the gloves, then at her sister. Jennifer stops chewing.","loc":"The Shadwell laundry","when":"Steam pours from the vents.","th":"vykra","also":["sisters"],"ch":["grise","miriam","alice","twins"],"turn":"At the other mangle, JENNIE keeps working. Grise lays a pair of knotted gloves beside her. Jennie looks at the gloves, then at her sister. Jennifer stops chewing.","w":222,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>Steam pours from the vents. Behind the mangles, MOTHER GRISE opens the recovered strongbox and checks a folded inventory.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>GRISE:\u003c/strong> And the Lambrick purse?\n\u003cstrong>MIRIAM:\u003c/strong> Burned with the safe.\n\u003cstrong>GRISE:\u003c/strong> The safe didn't burn.\u003c/p>\u003c/blockquote>\n\u003cp>Miriam holds her eyes.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>MIRIAM:\u003c/strong> The wood round it did.\u003c/p>\u003c/blockquote>\n\u003cp>Alice knows which pocket the purse is in. She says nothing. Grise counts the recovered gold twice, then pays Miriam without challenging the lie. She has suspicion, not proof.\u003c/p>\n\u003cp>In the yard a laundress slaps a wet strap onto the trestle. A buckle rings. Alice is across the yard before she knows she has moved. Miriam looks away.\u003c/p>\n\u003cp>Grise comes to the doorway.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>GRISE:\u003c/strong> Ajax Fink, across the face. Nobody's touched that man in years. You have talent, girl. The Vykra would receive you.\u003c/p>\u003c/blockquote>\n\u003cp>Miriam steps between them.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>MIRIAM:\u003c/strong> She's not interested.\n\u003cstrong>GRISE:\u003c/strong> I asked her.\n\u003cstrong>MIRIAM:\u003c/strong> And I'm answering. Keep your greasy, slimy hands off her.\n\u003cstrong>GRISE:\u003c/strong> Every girl thinks she's the one who gets out, dear. It's what makes them good.\u003c/p>\u003c/blockquote>\n\u003cp>Miriam takes Alice into the fog.\u003c/p>\n\u003cp>Grise beckons JENNIFER from the mangle. Mint between her teeth; hair pinned to the right.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>GRISE:\u003c/strong> See where she spends it.\u003c/p>\u003c/blockquote>\n\u003cp>At the other mangle, JENNIE keeps working. Grise lays a pair of knotted gloves beside her. Jennie looks at the gloves, then at her sister. Jennifer stops chewing.\u003c/p>"},{"oref":"Scene 8","id":255,"seq":8,"title":"Harding House, the long gallery: the Exhibition photograph","added":true,"act":"Act Two","kind":"scene","sum":"Four hundred years of Hardings in oil line the walls, and every portrait is the same picture: the eldest son holds up a brass lantern and his father's hand rests on his shoulder. Younger sons stand at the edges, half out of frame. One brass plate near the end has no portrait above it at all, only a pale rectangle on the silk where a painting used to hang. Under the portraits a PHOTOGRAPHER fusses beneath a black cloth, his flash-tray heaped with powdered gallowglass, \"the new process.\" JOSEPHINE HARDING runs the room. She's 50, in black silk the colour of a closed piano, grey-streaked hair coiled tight as rope, a jet brooch she has never explained, and kid gloves indoors, always. She stands like a woman who has sat with her back to a wall her whole life, and she moves furniture and family the same way, with two fingers. JOSEPHINE: James, at your father's left. Nathaniel, behind. NATHANIEL: Behind. JOSEPHINE: You're taller. It's composition, not a verdict. JAMIE: It's always a little bit of a verdict. ELDGARD: (reading a card) The Chancellor's sending three men tonight. Last year he sent flowers. JOSEPHINE: Then we give them something to write home about. ELDGARD: We give them light. JAMIE: We give them the speech. ELDGARD: You give them the speech. JAMIE: Alistair the misunderstood genius. Laughed at by the Crown. Iron into light. I could say it in my sleep. JOSEPHINE: Say it less like a joke. JAMIE: It isn't a joke, Mother. A joke has a point. ELDGARD: Essex was dark four hours on Tuesday. JOSEPHINE: Then tonight nobody says Essex. JAMIE: Essex. ELDGARD: James. JAMIE: Essex, Essex— NATHANIEL: (trying not to laugh) He's nervous. JAMIE: I'm thorough. Josephine hands Jamie the brass lantern from its stand, the one every heir on the walls is holding. JOSEPHINE: Up. JAMIE: Does it come with instructions? ELDGARD: Hold it up. Eldgard's hand settles on Jamie's shoulder, exactly where every painted father's hand rests behind them. Nathaniel, behind, looks for somewhere to put his hands and finds nowhere. Josephine straightens Jamie's collar, and her glove catches a fine silver chain at his throat. JOSEPHINE: What's this? JAMIE: A chain. JOSEPHINE: I can see it's a chain. JAMIE: Then we agree on something. She lets it go. She doesn't forget it. PHOTOGRAPHER: If the family could hold very still. The new powder wants a long exposure. JOSEPHINE: How long? PHOTOGRAPHER: A count of eight, madam. Fssshhhhh. The powder catches and burns green, and the gallery goes the colour of deep water. Four Hardings hold four smiles. One. Nobody blinks. Two. Eldgard's smile doesn't reach anything. Three. Josephine's gloved hand tightens on Jamie's sleeve. Four. In the stillness, faint, somewhere in the bones of the house, Nathaniel hears a woman crying. Five. His eyes move. Nobody else's do. Six. The lantern in Jamie's hand trembles, very slightly, and Jamie holds it higher. Seven. The crying is under the floor now, under their feet. Eight. It stops. PHOTOGRAPHER: (emerging pink from the cloth) Lovely. Very natural. Eldgard is already walking. \"Nathaniel, your toy—\" \"It isn't a toy, it's a—\" \"After.\" Josephine is already walking too. Jamie puts the lantern back on its stand like something that burns, and his eyes go to the empty rectangle on the wall, to the brass plate under it, before he follows them out.","loc":"Harding House","when":"Four hundred years of Hardings in oil line the walls, and every portrait is the same picture: the eldest son holds up a brass lantern and his father's hand rests on his shoulder.","th":"harding","also":[],"ch":["josephine","eldgard","jamie","nathaniel"],"turn":"Eldgard is already walking. \"Nathaniel, your toy—\" \"It isn't a toy, it's a—\" \"After.\" Josephine is already walking too. Jamie puts the lantern back on its stand like something that burns, and his eyes go to the empty rec","w":564,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>Four hundred years of Hardings in oil line the walls, and every portrait is the same picture: the eldest son holds up a brass lantern and his father's hand rests on his shoulder. Younger sons stand at the edges, half out of frame. One brass plate near the end has no portrait above it at all, only a pale rectangle on the silk where a painting used to hang. Under the portraits a PHOTOGRAPHER fusses beneath a black cloth, his flash-tray heaped with powdered gallowglass, &quot;the new process.&quot;\u003c/p>\n\u003cp>JOSEPHINE HARDING runs the room. S ng> Up.\n\u003cstrong>JAMIE:\u003c/strong> Does it come with instructions?\n\u003cstrong>ELDGARD:\u003c/strong> Hold it up.\u003c/p>\u003c/blockquote>\n\u003cp>Eldgard's hand settles on Jamie's shoulder, exactly where every painted father's hand rests behind them. Nathaniel, behind, looks for somewhere to put his hands and finds nowhere. Josephine straightens Jamie's collar, and her glove catches a fine silver chain at his throat.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>JOSEPHINE:\u003c/strong> What's this?\n\u003cstrong>JAMIE:\u003c/strong> A chain.\n\u003cstrong>JOSEPHINE:\u003c/strong> I can see it's a chain.\n\u003cstrong>JAMIE:\u003c/strong> Then we agree on something.\u003c/p>\u003c/blockquote>\n\u003cp>She lets it go. She doesn't forget it.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>PHOTOGRAPHER:\u003c/strong> If the family could hold very still. The new powder wants a long exposure.\n\u003cstrong>JOSEPHINE:\u003c/strong> How long?\n\u003cstrong>PHOTOGRAPHER:\u003c/strong> A count of eight, madam.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cem>Fssshhhhh.\u003c/em> The powder catches and burns green, and the gallery goes the colour of deep water. Four Hardings hold four smiles.\u003c/p>\n\u003cp>\u003cem>One.\u003c/em> Nobody blinks. \u003cem>Two.\u003c/em> Eldgard's smile doesn't reach anything. \u003cem>Three.\u003c/em> Josephine's gloved hand tightens on Jamie's sleeve. \u003cem>Four.\u003c/em> In the stillness, faint, somewhere in the bones of the house, Nathaniel hears a woman crying. \u003cem>Five.\u003c/em> His eyes move. Nobody else's do. \u003cem>Six.\u003c/em> The lantern in Jamie's hand trembles, very slightly, and Jamie holds it higher. \u003cem>Seven.\u003c/em> The crying is under the floor now, under their feet. \u003cem>Eight.\u003c/em> It stops.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>PHOTOGRAPHER:\u003c/strong> \u003cem>(emerging pink from the cloth)\u003c/em> Lovely. Very natural.\u003c/p>\u003c/blockquote>\n\u003cp>Eldgard is already walking. \u003cem>&quot;Nathaniel, your toy—&quot; &quot;It isn't a toy, it's a—&quot; &quot;After.&quot;\u003c/em> Josephine is already walking too. Jamie puts the lantern back on its stand like something that burns, and his eyes go to the empty rectangle on the wall, to the brass plate under it, before he follows them out.\u003c/p>"},{"oref":"Scene 9","id":6,"seq":9,"title":"The Bounds room, Gin Lane. Evening","added":false,"act":"Act Two","kind":"scene","sum":"One room above a chandler's: a cot, a cracked mirror, a kettle ticking on the stove. Through the window, children skip under the lane's one working lamp: Green light, green light, who's in the cellar tonight? Miriam does her hair. Alice binds a split knuckle. MIRIAM: Whatever Grise offers you, say no. ALICE: She said I had talent. MIRIAM: She says that when she's found a use for someone. ALICE: You're useful. MIRIAM: That's why I'm asking. She takes her hair down and starts again. ALICE: Third time. MIRIAM: Second. ALICE: Who is he? Some toff? Miriam smiles before she can stop herself. ALICE: You took a purse that wasn't Grise's strongbox. MIRIAM: You saw that. ALICE: You taught me. MIRIAM: Then see this. You didn't. Alice looks at her own hands. ALICE: Do you know what today is? Miriam stops. MIRIAM: ...Oh. Ali. She finds the orange she stole from a cart and tosses it over. MIRIAM: Happy birthday. Tomorrow. You choose where. ALICE: Somewhere you can't get called away from. Miriam sees her set the orange down without peeling it. She leaves her hair unfinished and sits beside her. Her hand settles over Alice's bandage. She knows an assurance will get her out of the room; she also wants to give the day she is promising. MIRIAM: Somewhere like that. ALICE: You didn't have it under control. MIRIAM: No. ALICE: At the warehouse. MIRIAM: I know what you meant. Alice looks at her. It is the first time today Miriam has admitted needing her. At the door, Miriam sees Alice reach for her coat. MIRIAM: Please, Ali. Not tonight. Alice's hand stays on the coat. Then drops. ALICE: Tomorrow. MIRIAM: Tomorrow. She goes before she has to explain anything else.","loc":"The Bounds room","when":"One room above a chandler's: a cot, a cracked mirror, a kettle ticking on the stove.","th":"sisters","also":[],"ch":["alice","miriam"],"turn":"She goes before she has to explain anything else.","w":292,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>One room above a chandler's: a cot, a cracked mirror, a kettle ticking on the stove. Through the window, children skip under the lane's one working lamp: \u003cem>Green light, green light, who's in the cellar tonight?\u003c/em>\u003c/p>\n\u003cp>Miriam does her hair. Alice binds a split knuckle.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>MIRIAM:\u003c/strong> Whatever Grise offers you, say no.\n\u003cstrong>ALICE:\u003c/strong> She said I had talent.\n\u003cstrong>MIRIAM:\u003c/strong> She says that when she's found a use for someone.\n\u003cstrong>ALICE:\u003c/strong> You're useful.\n\u003cstrong>MIRIAM:\u003c/strong> That's why I'm asking.\u003c/p>\u003c/blockquote>\n\u003cp>She takes her hair down and starts again.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>ALICE:\u003c/strong> Third time.\n\u003cstrong>MIRIAM:\u003c/strong> Second.\n\u003cstrong>ALICE:\u003c/strong> Who is he? Some toff?\u003c/p>\u003c/blockquote>\n\u003cp>Miriam smiles before she can stop herself.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>ALICE:\u003c/strong> You took a purse that wasn't Grise's strongbox.\n\u003cstrong>MIRIAM:\u003c/strong> You saw that.\n\u003cstrong>ALICE:\u003c/strong> You taught me.\n\u003cstrong>MIRIAM:\u003c/strong> Then see this. You didn't.\u003c/p>\u003c/blockquote>\n\u003cp>Alice looks at her own hands.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>ALICE:\u003c/strong> Do you know what today is?\u003c/p>\u003c/blockquote>\n\u003cp>Miriam stops.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>MIRIAM:\u003c/strong> ...Oh. Ali.\u003c/p>\u003c/blockquote>\n\u003cp>She finds the orange she stole from a cart and tosses it over.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>MIRIAM:\u003c/strong> Happy birthday. Tomorrow. You choose where.\n\u003cstrong>ALICE:\u003c/strong> Somewhere you can't get called away from.\u003c/p>\u003c/blockquote>\n\u003cp>Miriam sees her set the orange down without peeling it. She leaves her hair unfinished and sits beside her. Her hand settles over Alice's bandage. She knows an assurance will get her out of the room; she also wants to give the day she is promising.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>MIRIAM:\u003c/strong> Somewhere like that.\n\u003cstrong>ALICE:\u003c/strong> You didn't have it under control.\n\u003cstrong>MIRIAM:\u003c/strong> No.\n\u003cstrong>ALICE:\u003c/strong> At the warehouse.\n\u003cstrong>MIRIAM:\u003c/strong> I know what you meant.\u003c/p>\u003c/blockquote>\n\u003cp>Alice looks at her. It is the first time today Miriam has admitted needing her.\u003c/p>\n\u003cp>At the door, Miriam sees Alice reach for her coat.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>MIRIAM:\u003c/strong> Please, Ali. Not tonight.\u003c/p>\u003c/blockquote>\n\u003cp>Alice's hand stays on the coat. Then drops.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>ALICE:\u003c/strong> Tomorrow.\n\u003cstrong>MIRIAM:\u003c/strong> Tomorrow.\u003c/p>\u003c/blockquote>\n\u003cp>She goes before she has to explain anything else.\u003c/p>"},{"oref":"Scene 10","id":256,"seq":10,"title":"Harding House, Nathaniel's dressing room","added":true,"act":"Act Two","kind":"scene","sum":"Nathaniel is at the mirror, losing a fight with a cravat. The gauntlet schematic lies folded on the dresser like a love letter, and his own sketches of the Ring are pinned to the wall: every line runs to Tyburn, and he has written a question mark at the point where they meet. Jamie comes in, takes the cravat out of his hands and ties it for him, the way he has since Nathaniel was six. JAMIE: You're showing him tonight. NATHANIEL: If he asks. JAMIE: He won't ask. Show him anyway, in front of everyone. He can't say no in front of everyone. NATHANIEL: (laughing) You'd make a terrible Harding. JAMIE: I'm the only one who's had the training. NATHANIEL: Go on, then. The speech. JAMIE: (the family voice, flat and perfect) \"Four hundred years ago, our ancestor Alistair Harding—\" NATHANIEL: Say it like you mean it. JAMIE: I've never once meant it. (he tightens the knot) Tonight I'll say it perfectly. Jamie's eyes go to the question mark on the wall. He looks at it a long moment. JAMIE: Nat. If you could leave, would you? NATHANIEL: Leave what? The work's here. Jamie looks at him: at the schematic, at the boy who has spent his whole life trying to be useful to their father. Whatever he came to say, he doesn't say it. He pulls him into a hug that goes on a beat too long. NATHANIEL: What's that for? JAMIE: Your cravat was crooked. At the door, without turning: JAMIE: The work isn't worth you. Remember I said it. Nathaniel thinks it's a joke. It's the last thing his brother will ever say to him.","loc":"Harding House","when":"Nathaniel is at the mirror, losing a fight with a cravat.","th":"harding","also":[],"ch":["jamie","nathaniel"],"turn":"Nathaniel thinks it's a joke. It's the last thing his brother will ever say to him.","w":279,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>Nathaniel is at the mirror, losing a fight with a cravat. The gauntlet schematic lies folded on the dresser like a love letter, and his own sketches of the Ring are pinned to the wall: every line runs to Tyburn, and he has written a question mark at the point where they meet. Jamie comes in, takes the cravat out of his hands and ties it for him, the way he has since Nathaniel was six.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>JAMIE:\u003c/strong> You're showing him tonight.\n\u003cstrong>NATHANIEL:\u003c/strong> If he asks.\n\u003cstrong>JAMIE:\u003c/strong> He won't ask. Show him anyway, in front of everyone. He can't say no in front of everyone.\n\u003cstrong>NATHANIEL:\u003c/strong> \u003cem>(laughing)\u003c/em> You'd make a terrible Harding.\n\u003cstrong>JAMIE:\u003c/strong> I'm the only one who's had the training.\n\u003cstrong>NATHANIEL:\u003c/strong> Go on, then. The speech.\n\u003cstrong>JAMIE:\u003c/strong> \u003cem>(the family voice, flat and perfect)\u003c/em> &quot;Four hundred years ago, our ancestor Alistair Harding—&quot;\n\u003cstrong>NATHANIEL:\u003c/strong> Say it like you mean it.\n\u003cstrong>JAMIE:\u003c/strong> I've never once meant it. \u003cem>(he tightens the knot)\u003c/em> Tonight I'll say it perfectly.\u003c/p>\u003c/blockquote>\n\u003cp>Jamie's eyes go to the question mark on the wall. He looks at it a long moment.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>JAMIE:\u003c/strong> Nat. If you could leave, would you?\n\u003cstrong>NATHANIEL:\u003c/strong> Leave what? The work's here.\u003c/p>\u003c/blockquote>\n\u003cp>Jamie looks at him: at the schematic, at the boy who has spent his whole life trying to be useful to their father. Whatever he came to say, he doesn't say it. He pulls him into a hug that goes on a beat too long.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>NATHANIEL:\u003c/strong> What's that for?\n\u003cstrong>JAMIE:\u003c/strong> Your cravat was crooked.\u003c/p>\u003c/blockquote>\n\u003cp>At the door, without turning:\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>JAMIE:\u003c/strong> The work isn't worth you. Remember I said it.\u003c/p>\u003c/blockquote>\n\u003cp>Nathaniel thinks it's a joke. It's the last thing his brother will ever say to him.\u003c/p>"},{"oref":"Scene 11","id":7,"seq":11,"title":"The steamship office, Wapping. Night","added":false,"act":"Act Two","kind":"scene","sum":"A clerk stamps three Southampton tickets. Miriam pays with coins from the Lambrick purse and checks every date. She is buying Alice's berth as well as her own. Outside, a porter notices the charcoal coat and the red collar stitching. A dock runner has just given him Felix's description. He watches Miriam get into the waiting hired carriage, then sends word back by the runner. Across the street, Jennifer sees the purchase. She follows far enough to speak to the hired driver while Miriam waits inside. No drink is offered. Jennie does not approach Miriam here.","loc":"The steamship office","when":"A clerk stamps three Southampton tickets.","th":"vykra","also":["sisters","city"],"ch":["miriam","felix","twins"],"turn":"Across the street, Jennifer sees the purchase. She follows far enough to speak to the hired driver while Miriam waits inside. No drink is offered. Jennie does not approach Miriam here.","w":96,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>A clerk stamps three Southampton tickets. Miriam pays with coins from the Lambrick purse and checks every date. She is buying Alice's berth as well as her own.\u003c/p>\n\u003cp>Outside, a porter notices the charcoal coat and the red collar stitching. A dock runner has just given him Felix's description. He watches Miriam get into the waiting hired carriage, then sends word back by the runner.\u003c/p>\n\u003cp>Across the street, Jennifer sees the purchase. She follows far enough to speak to the hired driver while Miriam waits inside. No drink is offered. Jennie does not approach Miriam here.\u003c/p>"},{"oref":"Scene 12","id":8,"seq":12,"title":"A coach on the Blackwood Bridge stair","added":false,"act":"Act Two","kind":"scene","sum":"Rain drums on the roof. Jamie climbs in beside Miriam at the Blackwood stair and kisses her. It is the real Jamie. She lays the three tickets in his hand. JAMIE: You bought hers. MIRIAM: I'm not leaving without her. JAMIE: I know. He returns them. Takes the silver heart from his own neck and lays it in a velvet box beside its twin: the chain Josephine noticed earlier is the same heirloom, not a second unexplained locket. JAMIE: Wherever one is, the other finds it. MIRIAM: Then don't take yours anywhere stupid. He fastens one around her neck and replaces his own. From his coat he takes a generator diagram and a brass service key. The drawing shows the Ring's main return crossing beneath Blackwood Bridge. JAMIE: Quarter to twelve. This opens the cabinet. Pull the return bar and the whole Ring trips. MIRIAM: How long? JAMIE: The Works have to reset it. Long enough to get below. MIRIAM: You keep saying below. JAMIE: There's something I have to finish. MIRIAM: Before the boat. JAMIE: Before the boat. She reads the drawing for herself: the service key opens the governor housing; the return bar is a different component. She will be causing the blackout, not repairing one Ajax causes. MIRIAM: And afterward? JAMIE: The upper stair. Midnight. I'll send the carriage away and come back in it. MIRIAM: Don't send somebody for me. JAMIE: I'll be in it. MIRIAM: Then we fetch Ali. He nods. She waits. JAMIE: Then we fetch Ali. Before he goes, Jamie sees the gauntlet note protruding from his own pocket and almost laughs. JAMIE: Nat'll fly before he learns to walk. He's the only one of us worth saving. Miriam keeps the kindness in his voice; the Lost One will inherit this particular memory in Episode 4, not words spoken by the disguised assassin. A faint movement at the listening hatch behind the driver's seat. Neither lover notices. Jamie leaves for the Exhibition. Miriam folds the drawing and checks the key.","loc":"A coach on the Blackwood Bridge stair","when":"Rain drums on the roof.","th":"sisters","also":["harding"],"ch":["miriam","jamie"],"turn":"Jamie leaves for the Exhibition. Miriam folds the drawing and checks the key.","w":337,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>Rain drums on the roof. Jamie climbs in beside Miriam at the Blackwood stair and kisses her. It is the real Jamie.\u003c/p>\n\u003cp>She lays the three tickets in his hand.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>JAMIE:\u003c/strong> You bought hers.\n\u003cstrong>MIRIAM:\u003c/strong> I'm not leaving without her.\n\u003cstrong>JAMIE:\u003c/strong> I know.\u003c/p>\u003c/blockquote>\n\u003cp>He returns them. Takes the silver heart from his own neck and lays it in a velvet box beside its twin: the chain Josephine noticed earlier is the same heirloom, not a second unexplained locket.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>JAMIE:\u003c/strong> Wherever one is, the other finds it.\n\u003cstrong>MIRIAM:\u003c/strong> Then don't take yours anywhere stupid.\u003c/p>\u003c/blockquote>\n\u003cp>He fastens one around her neck and replaces his own. From his coat he takes a generator diagram and a brass service key. The drawing shows the Ring's main return crossing beneath Blackwood Bridge.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>JAMIE:\u003c/strong> Quarter to twelve. This opens the cabinet. Pull the return bar and the whole Ring trips.\n\u003cstrong>MIRIAM:\u003c/strong> How long?\n\u003cstrong>JAMIE:\u003c/strong> The Works have to reset it. Long enough to get below.\n\u003cstrong>MIRIAM:\u003c/strong> You keep saying below.\n\u003cstrong>JAMIE:\u003c/strong> There's something I have to finish.\n\u003cstrong>MIRIAM:\u003c/strong> Before the boat.\n\u003cstrong>JAMIE:\u003c/strong> Before the boat.\u003c/p>\u003c/blockquote>\n\u003cp>She reads the drawing for herself: the service key opens the governor housing; the return bar is a different component. She will be causing the blackout, not repairing one Ajax causes.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>MIRIAM:\u003c/strong> And afterward?\n\u003cstrong>JAMIE:\u003c/strong> The upper stair. Midnight. I'll send the carriage away and come back in it.\n\u003cstrong>MIRIAM:\u003c/strong> Don't send somebody for me.\n\u003cstrong>JAMIE:\u003c/strong> I'll be in it.\n\u003cstrong>MIRIAM:\u003c/strong> Then we fetch Ali.\u003c/p>\u003c/blockquote>\n\u003cp>He nods.
