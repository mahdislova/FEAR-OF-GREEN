 She waits.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>JAMIE:\u003c/strong> Then we fetch Ali.\u003c/p>\u003c/blockquote>\n\u003cp>Before he goes, Jamie sees the gauntlet note protruding from his own pocket and almost laughs.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>JAMIE:\u003c/strong> Nat'll fly before he learns to walk. He's the only one of us worth saving.\u003c/p>\u003c/blockquote>\n\u003cp>Miriam keeps the kindness in his voice; the Lost One will inherit this particular memory in Episode 4, not words spoken by the disguised assassin.\u003c/p>\n\u003cp>A faint movement at the listening hatch behind the driver's seat. Neither lover notices.\u003c/p>\n\u003cp>Jamie leaves for the Exhibition. Miriam folds the drawing and checks the key.\u003c/p>"},{"id":259,"added":true,"kind":"scene","also":[],"fl":[],"turn":"Jennifer gives him the rest of the promised coin. He will return to collect Jennie rather than Jamie. The vehicle and driver will be the ones Miriam expects.","seq":13,"oref":"Scene 13","title":"A lane off Blackwood Bridge","act":"Act Two","ch":["twins","miriam"],"th":"vykra","ed":"Revised Nov 17: Blackwood / Xylon continuity","sum":"At the next corner the driver gives Jennifer a scrap from his fare book: BLACKWOOD. UPPER STAIR. MIDNIGHT. He has overheard the rendezvous through the deliberately loosened hatch; he does not know about the chain. DRIVER: James Harding. The elder one. She wants him in the carriage, not a messenger. Jennifer gives him the rest of the promised coin. He will return to collect Jennie rather than Jamie. The vehicle and driver will be the ones Miriam expects.","html":"\u003cp>At the next corner the driver gives Jennifer a scrap from his fare book: \u003cstrong>BLACKWOOD. UPPER STAIR. MIDNIGHT.\u003c/strong> He has overheard the rendezvous through the deliberately loosened hatch; he does not know about the chain.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>DRIVER:\u003c/strong> James Harding. The elder one. She wants him in the carriage, not a messenger.\u003c/p>\u003c/blockquote>\n\u003cp>Jennifer gives him the rest of the promised coin. He will return to collect Jennie rather than Jamie. The vehicle and driver will be the ones Miriam expects.\u003c/p>","loc":"A lane off Blackwood Bridge","when":"At the next corner the driver gives Jennifer a scrap from his fare book: BLACKWOOD.","w":78},{"oref":"Scene 14","id":9,"seq":14,"title":"Harding House, the ballroom: the Exhibition","added":false,"act":"Act Three","kind":"scene","sum":"Two hundred guests under a thousand green chandeliers, and the Crown's men among them. The ballroom has been turned into a museum of the family. Glass cases line the walls, and every one tells the story the house wants told: - ALISTAIR HARDING'S LANCET, labelled \"The Instrument of Discovery, 1489.\" It's the brass lancet from the cold open. We know what it opened. - THE CHARTER OF 1689, under glass, the Crown's seal at the foot. A page is missing from the sequence, and a red ribbon marks where it should be. - A SCALE MODEL OF THE RING, its green veins running under a tiny brass London and every one of them meeting at Tyburn. - THE FIRST LANTERN, Edric's, its glass blackened with age. The light has been failing across the eastern provinces, a street at a time and an hour at a time, and the papers have started saying the end of the green. A broadsheet is passed hand to hand: ESSEX DARK AGAIN. HARDING SAYS \"A FAULT.\" Tonight the Hardings answer the rumour with a party. Under the music: Essex on Tuesday. Kent on Thursday. My cousin's mill ran on coal all week. LORD HECTOR LAMBRICK, 55, the coal baron, arrives. He's heavy and pink, with soot in the creases of his knuckles that no valet has ever got out, a diamond pin like a wet eye, and the friendliest smile in London. With him is his daughter TAMARA, 19: sharp-chinned and quick-eyed, in grey silk two seasons out of fashion on purpose, with a cipher wheel hidden inside her fan. Their fathers have promised her to Nathaniel in a private letter that nobody will announce tonight: coal and light, an alliance. TAMARA: I'm told we're to be very polite to each other. NATHANIEL: For how long? TAMARA: Forty years, I think. NATHANIEL: I can manage polite. TAMARA: (reading his soot-blackened cuff) Can you manage clean? Lambrick finds Eldgard beside the case with the lancet, and admires the chandeliers like a man pricing a horse. LAMBRICK: Lovely light, Harding. Essex had none of it Tuesday. ELDGARD: A fault in the line. LAMBRICK: My grandfather kept a lawn at Lambrick, the greenest in the county. He used to say grass only stays green while somebody keeps paying to water it. (he taps the glass over the lancet) It won't stay green for ever, Eldgard. Nothing does. Ask your Alistair. Eldgard smiles for the room and doesn't answer. Lambrick drifts away, and as he goes a footman bends to his ear. Lambrick's smile stays exactly where it is, but his hand closes on his glass. The Narrows. Fink's been cut.","loc":"Harding House","when":"Two hundred guests under a thousand green chandeliers, and the Crown's men among them.","th":"lambrick","also":["harding","city"],"ch":["nathaniel","tamara","lambrick","eldgard"],"turn":"Eldgard smiles for the room and doesn't answer. Lambrick drifts away, and as he goes a footman bends to his ear. Lambrick's smile stays exactly where it is, but his hand closes on his glass. The Narrows. Fink's been cut.","w":442,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>Two hundred guests under a thousand green chandeliers, and the Crown's men among them. The ballroom has been turned into a museum of the family. Glass cases line the walls, and every one tells the story the house wants told:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>ALISTAIR HARDING'S LANCET\u003c/strong>, labelled \u003cem>&quot;The Instrument of Discovery, 1489.&quot;\u003c/em> It's the brass lancet from the cold open. We know what it opened.\u003c/li>\u003cli>\u003cstrong>THE CHARTER OF 1689\u003c/strong>, under glass, the Crown's seal at the foot. A page is missing from the sequence, and a red ribbon marks where it should be.\u003c/li>\u003cli>\u003cstrong>A SCALE MODEL OF THE RING\u003c/strong>, its green veins running under a tiny brass London and every one of them meeting at Tyburn.\u003c/li>\u003cli>\u003cstrong>THE FIRST LANTERN\u003c/strong>, Edric's, its glass blackened with age.\u003c/li>\u003c/ul>\n\u003cp>The light has been failing across the eastern provinces, a street at a time and an hour at a time, and the papers have started saying \u003cem>the end of the green\u003c/em>. A broadsheet is passed hand to hand: \u003cstrong>ESSEX DARK AGAIN. HARDING SAYS &quot;A FAULT.&quot;\u003c/strong> Tonight the Hardings answer the rumour with a party. Under the music: \u003cem>Essex on Tuesday. Kent on Thursday. My cousin's mill ran on coal all week.\u003c/em>\u003c/p>\n\u003cp>LORD HECTOR LAMBRICK, 55, the coal baron, arrives. He's heavy and pink, with soot in the creases of his knuckles that no valet has ever got out, a diamond pin like a wet eye, and the friendliest smile in London. With him is his daughter TAMARA, 19: sharp-chinned and quick-eyed, in grey silk two seasons out of fashion on purpose, with a cipher wheel hidden inside her fan. Their fathers have promised her to Nathaniel in a private letter that nobody will announce tonight: coal and light, an alliance.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>TAMARA:\u003c/strong> I'm told we're to be very polite to each other.\n\u003cstrong>NATHANIEL:\u003c/strong> For how long?\n\u003cstrong>TAMARA:\u003c/strong> Forty years, I think.\n\u003cstrong>NATHANIEL:\u003c/strong> I can manage polite.\n\u003cstrong>TAMARA:\u003c/strong> \u003cem>(reading his soot-blackened cuff)\u003c/em> Can you manage clean?\u003c/p>\u003c/blockquote>\n\u003cp>Lambrick finds Eldgard beside the case with the lancet, and admires the chandeliers like a man pricing a horse.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>LAMBRICK:\u003c/strong> Lovely light, Harding. Essex had none of it Tuesday.\n\u003cstrong>ELDGARD:\u003c/strong> A fault in the line.\n\u003cstrong>LAMBRICK:\u003c/strong> My grandfather kept a lawn at Lambrick, the greenest in the county. He used to say grass only stays green while somebody keeps paying to water it. \u003cem>(he taps the glass over the lancet)\u003c/em> It won't stay green for ever, Eldgard. Nothing does. Ask your Alistair.\u003c/p>\u003c/blockquote>\n\u003cp>Eldgard smiles for the room and doesn't answer. Lambrick drifts away, and as he goes a footman bends to his ear. Lambrick's smile stays exactly where it is, but his hand closes on his glass. \u003cem>The Narrows. Fink's been cut.\u003c/em>\u003c/p>"},{"id":260,"added":true,"kind":"scene","also":[],"fl":[],"turn":"Jennie looks at Jennifer. Her sister does not look away. Then Jennie takes the gloves.","seq":15,"oref":"Scene 15","title":"The Shadwell laundry, a back room","act":"Act Three","ch":["grise","twins"],"th":"vykra","ed":"Revised Nov 17: Blackwood / Xylon continuity","sum":"Jennifer lays the fare-book scrap and her report of the three tickets before Grise. The money Miriam said had burned has bought passage out of London. Jennie opens an oilskin packet over a basin. A thin shaped film lies inside, its face kept out of our view. Beside it: gloves and a dark lip colour. She checks a fastening at its edge, then folds it away. The scene establishes preparation without showing whose likeness she will wear. Grise looks from the tickets' destination to Jennie. GRISE: Before they sail. Jennie looks at Jennifer. Her sister does not look away. Then Jennie takes the gloves.","html":"\u003cp>Jennifer lays the fare-book scrap and her report of the three tickets before Grise. The money Miriam said had burned has bought passage out of London.\u003c/p>\n\u003cp>Jennie opens an oilskin packet over a basin. A thin shaped film lies inside, its face kept out of our view. Beside it: gloves and a dark lip colour. She checks a fastening at its edge, then folds it away. The scene establishes preparation without showing whose likeness she will wear.\u003c/p>\n\u003cp>Grise looks from the tickets' destination to Jennie.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>GRISE:\u003c/strong> Before they sail.\u003c/p>\u003c/blockquote>\n\u003cp>Jennie looks at Jennifer. Her sister does not look away. Then Jennie takes the gloves.\u003c/p>","loc":"The Shadwell laundry","when":"Jennifer lays the fare-book scrap and her report of the three tickets before Grise.","w":104},{"oref":"Scene 16","id":10,"seq":16,"title":"The ballroom: the speech","added":false,"act":"Act Three","kind":"scene","sum":"Eldgard takes the gallery stair, and the room goes quiet. He promises new lines to the eastern provinces, a new Works, and light for another hundred years. ELDGARD: My son and heir. James. Jamie steps up beside the case with the first lantern and says what he's supposed to say, the story every Harding child learns before the alphabet: JAMIE: Four hundred years ago, our ancestor Alistair Harding, a natural philosopher the Crown laughed at, found that the iron under Tyburn could be grown into light. He gave London the first lantern. Every lamp in this room is his gift, and our promise. He says it perfectly, exactly as he promised his brother he would. We have seen the cold open; the room hasn't. The applause is the first lie of the series, and only we know it. Jamie smiles into it like a man swallowing glass. Only Nathaniel notices that his brother doesn't look at their father once. Then, on his brother's advice, Nathaniel steps forward in front of everyone with the gauntlet strapped to his arm. ELDGARD: (smiling for the room) Not tonight. Toys after supper. Laughter. Nathaniel looks for Jamie. His brother has stopped by the service door and takes one step back toward him. Nathaniel looks away first. When he looks again, Jamie is leaving. The failed advice now hurts between the brothers as well as between father and son. From the gallery, Josephine watches her elder son, whose hand keeps going to his throat. JOSEPHINE: That boy is planning something. BYRON: Then he takes after you, madam. One look between them says they share thirty years of history and agreed never to mention it. Across the floor, Jamie slips out through a service door. Nathaniel sees him go and takes a step after him. His father's hand closes on his arm. ELDGARD: The Chancellor's men, Nathaniel. One of the visitors turns. Eldgard introduces him: \"My younger son. He designs the Guard equipment.\" The visitor asks about the leap apparatus. Nathaniel looks at the service door closing behind Jamie, then answers the question. He chooses the recognition he has wanted, not merely an instruction to remain.","loc":"The ballroom: the speech","when":"Eldgard takes the gallery stair, and the room goes quiet.","th":"harding","also":[],"ch":["eldgard","jamie","nathaniel","josephine","byron"],"turn":"One of the visitors turns. Eldgard introduces him: \"My younger son. He designs the Guard equipment.\" The visitor asks about the leap apparatus. Nathaniel looks at the service door closing behind Jamie, then answers the q","w":360,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>Eldgard takes the gallery stair, and the room goes quiet. He promises new lines to the eastern provinces, a new Works, and light for another hundred years.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>ELDGARD:\u003c/strong> My son and heir. James.\u003c/p>\u003c/blockquote>\n\u003cp>Jamie steps up beside the case with the first lantern and says what he's supposed to say, the story every Harding child learns before the alphabet:\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>JAMIE:\u003c/strong> Four hundred years ago, our ancestor Alistair Harding, a natural philosopher the Crown laughed at, found that the iron under Tyburn could be grown into light. He gave London the first lantern. Every lamp in this room is his gift, and our promise.\u003c/p>\u003c/blockquote>\n\u003cp>He says it perfectly, exactly as he promised his brother he would. We have seen the cold open; the room hasn't. The applause is the first lie of the series, and only we know it. Jamie smiles into it like a man swallowing glass. Only Nathaniel notices that his brother doesn't look at their father once.\u003c/p>\n\u003cp>Then, on his brother's advice, Nathaniel steps forward in front of everyone with the gauntlet strapped to his arm.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>ELDGARD:\u003c/strong> \u003cem>(smiling for the room)\u003c/em> Not tonight. Toys after supper.\u003c/p>\u003c/blockquote>\n\u003cp>Laughter. Nathaniel looks for Jamie. His brother has stopped by the service door and takes one step back toward him. Nathaniel looks away first. When he looks again, Jamie is leaving. The failed advice now hurts between the brothers as well as between father and son.\u003c/p>\n\u003cp>From the gallery, Josephine watches her elder son, whose hand keeps going to his throat.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>JOSEPHINE:\u003c/strong> That boy is planning something.\n\u003cstrong>BYRON:\u003c/strong> Then he takes after you, madam.\u003c/p>\u003c/blockquote>\n\u003cp>One look between them says they share thirty years of history and agreed never to mention it.\u003c/p>\n\u003cp>Across the floor, Jamie slips out through a service door. Nathaniel sees him go and takes a step after him. His father's hand closes on his arm.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>ELDGARD:\u003c/strong> The Chancellor's men, Nathaniel.\u003c/p>\u003c/blockquote>\n\u003cp>One of the visitors turns. Eldgard introduces him: &quot;My younger son. He designs the Guard equipment.&quot; The visitor asks about the leap apparatus. Nathaniel looks at the service door closing behind Jamie, then answers the question. He chooses the recognition he has wanted, not merely an instruction to remain.\u003c/p>"},{"oref":"Scene 17","id":257,"seq":17,"title":"The Bounds room, Gin Lane","added":true,"act":"Act Three","kind":"scene","sum":"Alice has her coat on and her hand on the bolt. The warehouse is still with her: Miriam's boots off the floor, Ajax's iron hand. She lifts the latch. Stops on the memory of Please, Ali. Not tonight—the request after Miriam admitted she had needed saving. Following now would mean refusing the first piece of trust Alice thinks she has been given. She closes the door. Bolts it. Takes off the coat. She peels the orange, eats half and leaves the other half on Miriam's pillow. Waiting is a choice to believe in tomorrow, not sudden obedience without a reason.","loc":"The Bounds room","when":"Alice has her coat on and her hand on the bolt.","th":"sisters","also":[],"ch":["alice"],"turn":"She peels the orange, eats half and leaves the other half on Miriam's pillow. Waiting is a choice to believe in tomorrow, not sudden obedience without a reason.","w":100,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>Alice has her coat on and her hand on the bolt. The warehouse is still with her: Miriam's boots off the floor, Ajax's iron hand.\u003c/p>\n\u003cp>She lifts the latch.\u003c/p>\n\u003cp>Stops on the memory of \u003cem>Please, Ali. Not tonight\u003c/em>—the request after Miriam admitted she had needed saving. Following now would mean refusing the first piece of trust Alice thinks she has been given.\u003c/p>\n\u003cp>She closes the door. Bolts it. Takes off the coat.\u003c/p>\n\u003cp>She peels the orange, eats half and leaves the other half on Miriam's pillow. Waiting is a choice to believe in tomorrow, not sudden obedience without a reason.\u003c/p>"},{"id":261,"added":true,"kind":"scene","also":["sisters","harding"],"fl":[],"turn":"Above her, Blackwood Bridge goes dark.","seq":18,"oref":"Scene 18","title":"Beneath Blackwood Bridge, quarter to twelve","act":"Act Three","ch":["miriam"],"th":"city","ed":"Revised Nov 17: Blackwood / Xylon continuity","sum":"Quarter to twelve. Miriam climbs the maintenance ladder beneath Blackwood Bridge. The river knocks against the supports below a narrow iron platform. The return generator hums green. She checks Jamie's diagram against the housing. The brass service key fits the cabinet, but the catch is stiff. She works it with her scraped hand until it releases. Inside, the return bar sits between two green contacts. A printed warning: RING ISOLATION. RESET AT WORKS CONTROL. Miriam looks up toward the lit city. At the tickets inside her coat. She knows this is more than opening a door for her lover; she is putting London in the dark to give him his chance. She pulls the bar. One hard metallic knock. The generator's light contracts to a point. Above her, Blackwood Bridge goes dark.","html":"\u003cp>Quarter to twelve. Miriam climbs the maintenance ladder beneath Blackwood Bridge. The river knocks against the supports below a narrow iron platform. The return generator hums green.\u003c/p>\n\u003cp>She checks Jamie's diagram against the housing. The brass service key fits the cabinet, but the catch is stiff. She works it with her scraped hand until it releases.\u003c/p>\n\u003cp>Inside, the return bar sits between two green contacts. A printed warning: \u003cstrong>RING ISOLATION. RESET AT WORKS CONTROL.\u003c/strong>\u003c/p>\n\u003cp>Miriam looks up toward the lit city. At the tickets inside her coat. She knows this is more than opening a door for her lover; she is putting London in the dark to give him his chance.\u003c/p>\n\u003cp>She pulls the bar.\u003c/p>\n\u003cp>One hard metallic knock. The generator's light contracts to a point.\u003c/p>\n\u003cp>Above her, Blackwood Bridge goes dark.\u003c/p>","loc":"Beneath Blackwood Bridge","when":"Quarter to twelve.","w":132},{"oref":"Scene 19","id":258,"seq":19,"title":"London, the blackout","added":true,"act":"Act Four","kind":"scene","sum":"The blackout begins at the Blackwood return and trips the Works distribution board. Street by street, Mayfair and Gin Lane lose the same light. A tram stalls. A hospital window goes black. The tallow sellers light their trays. At the Exhibition, two hundred guests shout for lamps. Nathaniel hears a woman crying inside the walls. He turns to his father. Eldgard is already gone. On Gin Lane, Alice strikes a match and watches the stair through the crack in the door. The flame burns to her fingers. She does not flinch. Under Blackwood, Miriam hears the city react. She leaves the cabinet's service key in the tripped mechanism, takes the diagram and climbs. The shutdown can be restored from Works control; it is not the permanent loss of light that breaking the chain would cause.","loc":"London","when":"The blackout begins at the Blackwood return and trips the Works distribution board.","th":"city","also":["white"],"ch":["alice","nathaniel","eldgard","miriam"],"turn":"Under Blackwood, Miriam hears the city react. She leaves the cabinet's service key in the tripped mechanism, takes the diagram and climbs. The shutdown can be restored from Works control; it is not the permanent loss of ","w":135,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>The blackout begins at the Blackwood return and trips the Works distribution board. Street by street, Mayfair and Gin Lane lose the same light. A tram stalls. A hospital window goes black. The tallow sellers light their trays.\u003c/p>\n\u003cp>At the Exhibition, two hundred guests shout for lamps. Nathaniel hears a woman crying inside the walls. He turns to his father. Eldgard is already gone.\u003c/p>\n\u003cp>On Gin Lane, Alice strikes a match and watches the stair through the crack in the door. The flame burns to her fingers. She does not flinch.\u003c/p>\n\u003cp>Under Blackwood, Miriam hears the city react. She leaves the cabinet's service key in the tripped mechanism, takes the diagram and climbs. The shutdown can be restored from Works control; it is not the permanent loss of light that breaking the chain would cause.\u003c/p>"},{"oref":"Scene 20","id":12,"seq":20,"title":"Harding Works, the core stair","added":false,"act":"Act Four","kind":"scene","sum":"Jamie enters with the key copied from Byron's Guard key—different from the Blackwood service key he gave Miriam. With the Ring tripped, the usual inspection light is out and the shift has been sent to the distribution fault. The blackout gives him access; it does not disable the independent core alarm. Old hangmen's marks cut the stair, then two hundred years of Lantern Guard names. One line recurs: I HEARD HER. Below, the woman is crying. Jamie saws at the lock with a glass blade until it sticks. Cuts his palm and presses it against the iron. The chain shudders. Something small moves in the dark beneath it. He pulls at the blade. Above him the alarm sounds.","loc":"Harding Works","when":"Jamie enters with the key copied from Byron's Guard key—different from the Blackwood service key he gave Miriam.","th":"harding","also":["white"],"ch":["jamie","lostone"],"turn":"He pulls at the blade. Above him the alarm sounds.","w":118,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>Jamie enters with the key copied from Byron's Guard key—different from the Blackwood service key he gave Miriam. With the Ring tripped, the usual inspection light is out and the shift has been sent to the distribution fault. The blackout gives him access; it does not disable the independent core alarm.\u003c/p>\n\u003cp>Old hangmen's marks cut the stair, then two hundred years of Lantern Guard names. One line recurs: \u003cem>I HEARD HER.\u003c/em>\u003c/p>\n\u003cp>Below, the woman is crying. Jamie saws at the lock with a glass blade until it sticks. Cuts his palm and presses it against the iron.\u003c/p>\n\u003cp>The chain shudders. Something small moves in the dark beneath it.\u003c/p>\n\u003cp>He pulls at the blade. Above him the alarm sounds.\u003c/p>"},{"oref":"Scene 21","id":15,"seq":21,"title":"Blackwood Bridge, the upper stair, midnight","added":false,"act":"Act Four","kind":"scene","sum":"Midnight. Miriam waits at the upper stair, red mittens on, three tickets safe inside her coat. The familiar hired carriage turns onto the bridge and stops where Jamie promised. A single tallow lantern burns inside the hired carriage. She sees the waiting face above a high collar, not a standing figure whose height or gait could betray it. She is smiling before she gets in. MIRIAM: Jamie, my love. The man leans toward her. She kisses him. Then draws back. A dark colour marks his mouth. Its taste is on hers. She knows it. MIRIAM: Xylon. The edge of his lip has begun to lose its shape. A crease runs through a cheek that was Jamie's a moment ago. The prepared face-veil is slipping after the close contact; she has not mistaken ordinary cosmetics for poison. Miriam strikes at the door latch before her fingers cease to obey.","loc":"Blackwood Bridge","when":"Midnight.","th":"sisters","also":["vykra","city"],"ch":["miriam","twins"],"turn":"Miriam strikes at the door latch before her fingers cease to obey.","w":148,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>Midnight. Miriam waits at the upper stair, red mittens on, three tickets safe inside her coat. The familiar hired carriage turns onto the bridge and stops where Jamie promised.\u003c/p>\n\u003cp>A single tallow lantern burns inside the hired carriage. She sees the waiting face above a high collar, not a standing figure whose height or gait could betray it. She is smiling before she gets in.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>MIRIAM:\u003c/strong> Jamie, my love.\u003c/p>\u003c/blockquote>\n\u003cp>The man leans toward her. She kisses him.\u003c/p>\n\u003cp>Then draws back. A dark colour marks his mouth. Its taste is on hers.\u003c/p>\n\u003cp>She knows it.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>MIRIAM:\u003c/strong> Xylon.\u003c/p>\u003c/blockquote>\n\u003cp>The edge of his lip has begun to lose its shape. A crease runs through a cheek that was Jamie's a moment ago. The prepared face-veil is slipping after the close contact; she has not mistaken ordinary cosmetics for poison.\u003c/p>\n\u003cp>Miriam strikes at the door latch before her fingers cease to obey.\u003c/p>"},{"oref":"Scene 22","id":14,"seq":22,"title":"The Works","added":false,"act":"Act Four","kind":"scene","sum":"The alarm sounds: a saboteur in the core. A Lantern Guard squad comes down the gantries, and with them a Wick, COLE PRUETT, 17, all elbows, his uniform too big for him, trying very hard not to be sick. Flash-bursts strobe the dark, fzzt, fzzt, freezing it into snapshots: pipes, steam, a masked figure at the lock. \"Step away!\" The figure turns with something glinting in his hand. A lantern rifle fires out of the strobe. KRAK. We never see whose. The figure drops.","loc":"The Works","when":"The alarm sounds: a saboteur in the core.","th":"guard","also":["harding"],"ch":["cole"],"turn":"The alarm sounds: a saboteur in the core. A Lantern Guard squad comes down the gantries, and with them a Wick, COLE PRUETT, 17, all elbows, his uniform too big for him, trying very hard not to be sick. Flash-bursts strob","w":84,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>The alarm sounds: a saboteur in the core. A Lantern Guard squad comes down the gantries, and with them a Wick, COLE PRUETT, 17, all elbows, his uniform too big for him, trying very hard not to be sick. Flash-bursts strobe the dark, \u003cem>fzzt, fzzt\u003c/em>, freezing it into snapshots: pipes, steam, a masked figure at the lock. &quot;Step away!&quot; The figure turns with something glinting in his hand. A lantern rifle fires out of the strobe. \u003cem>KRAK.\u003c/em> We never see whose. The figure drops.\u003c/p>"},{"id":262,"added":true,"kind":"scene","also":["vykra"],"fl":[],"turn":"The carriage turns into the fog.","seq":23,"oref":"Scene 23","title":"Blackwood Bridge, the carriage door","act":"Act Four","ch":["miriam","twins"],"th":"sisters","ed":"Revised Nov 17: Blackwood / Xylon continuity","sum":"She throws herself from the carriage onto the road. Scrambles up. Tries to run toward the stair. The driver lashes the horses forward. Inside, Jamie's borrowed features sag and peel away. Jennie wipes the face-veil from one cheek. Her own face appears beneath it, the eyebrow scar clear. She watches Miriam through the open door. Her mouth trembles once. She does not order the driver to stop. The carriage turns into the fog.","html":"\u003cp>She throws herself from the carriage onto the road. Scrambles up. Tries to run toward the stair.\u003c/p>\n\u003cp>The driver lashes the horses forward.\u003c/p>\n\u003cp>Inside, Jamie's borrowed features sag and peel away. Jennie wipes the face-veil from one cheek. Her own face appears beneath it, the eyebrow scar clear.\u003c/p>\n\u003cp>She watches Miriam through the open door. Her mouth trembles once. She does not order the driver to stop.\u003c/p>\n\u003cp>The carriage turns into the fog.\u003c/p>","loc":"Blackwood Bridge","when":"She throws herself from the carriage onto the road.","w":73},{"oref":"Scene 24","id":16,"seq":24,"title":"The core","added":false,"act":"Act Four","kind":"scene","sum":"The shooter kneels beside the fallen saboteur and removes the wounded man's mask. Jamie. Alive, bleeding from the shoulder. We still do not identify the rifleman clearly enough to settle the mystery before Cole's confession. Eldgard steps from the dark. Takes in his son, the glass blade and the blood on the lock. ELDGARD: Go. Wait at the gate. Speak to no one. The shooter retreats. Halfway up, he looks back. Jamie lifts his head. JAMIE: Papa. Eldgard kneels and takes his hand. We withhold the exact action at the lock that the Snow Confession will later expose.","loc":"The core","when":"The shooter kneels beside the fallen saboteur and removes the wounded man's mask.","th":"harding","also":["guard"],"ch":["eldgard","jamie","cole"],"turn":"Eldgard kneels and takes his hand. We withhold the exact action at the lock that the Snow Confession will later expose.","w":98,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>The shooter kneels beside the fallen saboteur and removes \u003cstrong>the wounded man's\u003c/strong> mask. Jamie. Alive, bleeding from the shoulder. We still do not identify the rifleman clearly enough to settle the mystery before Cole's confession.\u003c/p>\n\u003cp>Eldgard steps from the dark. Takes in his son, the glass blade and the blood on the lock.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>ELDGARD:\u003c/strong> Go. Wait at the gate. Speak to no one.\u003c/p>\u003c/blockquote>\n\u003cp>The shooter retreats. Halfway up, he looks back. Jamie lifts his head.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>JAMIE:\u003c/strong> Papa.\u003c/p>\u003c/blockquote>\n\u003cp>Eldgard kneels and takes his hand. We withhold the exact action at the lock that the Snow Confession will later expose.\u003c/p>"},{"id":263,"added":true,"kind":"scene","also":["vykra"],"fl":[],"turn":"She braces against the movement. Xylon does not return her control because she has removed one means of hurting herself. Her body takes another step.","seq":25,"oref":"Scene 25","title":"Blackwood Bridge, the road","act":"Act Four","ch":["miriam"],"th":"sisters","ed":"Revised Nov 17: Blackwood / Xylon continuity","sum":"Miriam reaches the stair and stops so sharply she nearly falls. Her right hand has drawn a knife without her permission. The point turns inward. She catches the wrist with her other hand. For a moment she can still force a choice through the poison. She tears the blade free and throws it far out into the Thames. The second follows before her fingers can close around it. Empty hands. She backs away from the parapet. Her feet stop. One heel lifts. Sets down toward the rail. She braces against the movement. Xylon does not return her control because she has removed one means of hurting herself. Her body takes another step.","html":"\u003cp>Miriam reaches the stair and stops so sharply she nearly falls. Her right hand has drawn a knife without her permission. The point turns inward.\u003c/p>\n\u003cp>She catches the wrist with her other hand. For a moment she can still force a choice through the poison.\u003c/p>\n\u003cp>She tears the blade free and throws it far out into the Thames.\u003c/p>\n\u003cp>The second follows before her fingers can close around it.\u003c/p>\n\u003cp>Empty hands. She backs away from the parapet.\u003c/p>\n\u003cp>Her feet stop. One heel lifts. Sets down toward the rail.\u003c/p>\n\u003cp>She braces against the movement. Xylon does not return her control because she has removed one means of hurting herself. Her body takes another step.\u003c/p>","loc":"Blackwood Bridge","when":"Miriam reaches the stair and stops so sharply she nearly falls.","w":112},{"id":264,"added":true,"kind":"scene","also":["harding","white","city"],"fl":[],"turn":"The possession, rescue, declaration of death and morgue resurrection now begin Episode 2. Neither the river transfer nor the resurrection follows these closing hooks in Episode 1.","seq":26,"oref":"Scene 26","title":"Blackwood Bridge and the core, the ending","act":"Act Four","ch":["miriam","felix","jamie","eldgard","lostone"],"th":"sisters","ed":"Revised Nov 17: Blackwood / Xylon continuity","sum":"Felix reaches the upper stair with the constable behind him. The runner's message is in his fist: the Bounds girl, the hired carriage, Blackwood. The note has brought him here; he has not happened upon the bridge. Miriam turns toward him. Relief crosses her face while her feet continue toward the water. FELIX: Miss. Stay there. She tries. Her hand catches the railing. Then the grip changes and she starts to climb. MIRIAM: I can't— Felix runs. Her face is asking him to stop what her body is doing. INTERCUT — THE CORE: Behind Eldgard's lowered shoulder, the small frost child reaches the bloody locket at Jamie's throat. Snaps its chain. The two halves call across the city. The glass flares and draws her away toward Blackwood, at the same moment Miriam is going over, not a quarter-hour before. Jamie tries to breathe. His father's hand moves toward the lock. The great chain tightens. We cut away before seeing how he uses his son. BLACKWOOD: Miriam gets one last look at Felix. Her body throws itself beyond the rail. His hand closes on empty air. A splash. Felix tears off his coat. CUT TO BLACK. END OF EPISODE ONE. The possession, rescue, declaration of death and morgue resurrection now begin Episode 2. Neither the river transfer nor the resurrection follows these closing hooks in Episode 1.","html":"\u003cp>Felix reaches the upper stair with the constable behind him. The runner's message is in his fist: the Bounds girl, the hired carriage, Blackwood. The note has brought him here; he has not happened upon the bridge.\u003c/p>\n\u003cp>Miriam turns toward him. Relief crosses her face while her feet continue toward the water.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>FELIX:\u003c/strong> Miss. Stay there.\u003c/p>\u003c/blockquote>\n\u003cp>She tries. Her hand catches the railing. Then the grip changes and she starts to climb.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>MIRIAM:\u003c/strong> I can't—\u003c/p>\u003c/blockquote>\n\u003cp>Felix runs. Her face is asking him to stop what her body is doing.\u003c/p>\n\u003cp>\u003cstrong>INTERCUT — THE CORE:\u003c/strong> Behind Eldgard's lowered shoulder, the small frost child reaches the bloody locket at Jamie's throat. Snaps its chain. The two halves call across the city. The glass flares and draws her away toward Blackwood, at the same moment Miriam is going over, not a quarter-hour before.\u003c/p>\n\u003cp>Jamie tries to breathe. His father's hand moves toward the lock. The great chain tightens. We cut away before seeing how he uses his son.\u003c/p>\n\u003cp>\u003cstrong>BLACKWOOD:\u003c/strong> Miriam gets one last look at Felix. Her body throws itself beyond the rail. His hand closes on empty air.\u003c/p>\n\u003cp>A splash. Felix tears off his coat.\u003c/p>\n\u003cp>\u003cstrong>CUT TO BLACK. END OF EPISODE ONE.\u003c/strong>\u003c/p>\n\u003cp>The possession, rescue, declaration of death and morgue resurrection now begin Episode 2. Neither the river transfer nor the resurrection follows these closing hooks in Episode 1.\u003c/p>","loc":"Blackwood Bridge and the core","when":"Felix reaches the upper stair with the constable behind him.","w":226}]},{"n":2,"title":"The Wake","time":"48 → 47 DAYS TO FIRST SNOW","clock":"48 → 47 DAYS TO FIRST SNOW","act":"I","log":"Alice hides her sister, who sat up on a morgue slab and isn't quite right, and decides it's a miracle, while London buries Jamie Harding. Nathaniel finds a Lantern Guard cartridge at the scene of his brother's \"accident,\" and he asks the one man he trusts to find out who fired it: his best friend, just home from Essex, who already knows it was his own Wick.","sum":"Morgana lifts her head: \"My daughter is here.\"","turn":"Alice takes the Lost One home. Nathaniel finds a Guard cartridge at the core","focus":"what came back?","piece":"the morgue escape, which births the Frost Killer.","threads":["white","sisters","harding","guard","investigation","lambrick","vykra"],"frame":"\u003cp>\u003cstrong>OPENING: 48 DAYS TO FIRST SNOW, 3 November. MAIN STORY: 47 DAYS, 4 November.\u003c/strong> \u003cstrong>Focus:\u003c/strong> what came back? \u003cstrong>Set piece:\u003c/strong> the morgue escape, which births the Frost Killer. \u003cstrong>Sting:\u003c/strong> the opening pays off the pilot's two death hooks; Morgana's daughter is identified in the closing tag. Josephine's contract remains an audience reveal during the episode.\u003c/p>","scenes":[{"oref":"Scene 1","id":22,"seq":1,"title":"Blackwood Bridge, the riverbank and the morgue; 3 November","added":false,"act":"Cold open","kind":"scene","sum":"Blackwood Bridge, just after midnight, 3 November. Felix dives after Miriam. Beneath the bridge she sinks, fighting for a breath her body has denied her. The frost child reaches her through the paired lockets. Two silver hearts strike together, tink, and burn dull. Miriam sees the child; her lips move on a request we cannot hear. The child nods and enters her eyes and mouth. We do not hear the request until Episode 10. Felix catches her collar and hauls her to the bank. No pulse. He tries again. Nothing. The last Xylon-driven movement has ended with Miriam's heartbeat; it will not reactivate when the Lost One moves her body. The constable sees the dark pigment at her mouth, not frost. Felix records what he saw before the jump: she tried to stop, and her hands and feet would not obey. He does not know who was in the carriage. The ticket-office porter and the birds have now identified her as Miriam Bounds of Gin Lane. He sends the constable for Alice. Harding House, the same grey dawn. Works engineers have reset the Blackwood return from the control board after the chain was repaired. The lights are back; this was a reversible generator trip, not the release of Morgana. Eldgard tells Josephine and Nathaniel there was an accident in the core. Jamie is dead. His watch still ticks on the study desk. Nathaniel hears the weeping and gets as far as the stables before he breaks. Byron sits beside him. NATHANIEL: I saw him go. I stayed for the Chancellor's men. Byron puts a white-gloved hand on his neck. This grief scene is retained here, not discarded to make the new pilot ending work. The city morgue, dawn, 3 November. Felix, still wet, draws back the sheet for Alice. He does not tell her Miriam chose death. FELIX: I tried to reach her. ALICE: She wouldn't have— He cannot finish an explanation before Alice sinks beside the slab. She presses Miriam's cold hand to her forehead. ALICE: You said tomorrow. You promised tomorrow. You always go first. A drop falls from Miriam's lips. The pigment is still dark; the frost now gathering on her skin belongs to what came through in the river. Her eyes open and find Alice. MIRIAM'S BODY: Ali. Alice recognises the voice and reaches closer. The girl sits up, frightened by the room and the hands reaching for her. Her scream splits the green light, eeeeiiiKKK. Two attendants freeze. Felix's revolver falls as his hand goes numb. Alice sees the men fall and hesitates—then the girl calls her name again. The barefoot girl runs into the first daylight. Alice goes after her. No 47-day card yet. This opening continues directly from the pilot; it does not claim two days passed between the fall and the rescue.","loc":"Blackwood Bridge","when":"Blackwood Bridge, just after midnight, 3 November.","th":"white","also":["sisters"],"ch":["miriam","lostone","felix","alice","nathaniel","eldgard","josephine","byron"],"turn":"No 47-day card yet. This opening continues directly from the pilot; it does not claim two days passed between the fall and the rescue.","w":470,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>\u003cstrong>Blackwood Bridge, just after midnight, 3 November.\u003c/strong> Felix dives after Miriam. Beneath the bridge she sinks, fighting for a breath her body has denied her. The frost child reaches her through the paired lockets. Two silver hearts strike together, \u003cem>tink\u003c/em>, and burn dull. Miriam sees the child; her lips move on a request we cannot hear. The child nods and enters her eyes and mouth. We do not hear the request until Episode 10.\u003c/p>\n\u003cp>Felix catches her collar and hauls her to the bank. No pulse. He tries again. Nothing. The last Xylon-driven movement has ended with Miriam's heartbeat; it will not reactivate when the Lost One moves her body. The constable sees the dark pigment at her mouth, not frost. Felix records what he saw before the jump: she tried to stop, and her hands and feet would not obey. He does not know who was in the carriage. The ticket-office porter and the birds have now identified her as Miriam Bounds of Gin Lane. He sends the constable for Alice.\u003c/p>\n\u003cp>\u003cstrong>Harding House, the same grey dawn.\u003c/strong> Works engineers have reset the Blackwood return from the control board after the chain was repaired. The lights are back; this was a reversible generator trip, not the release of Morgana. Eldgard tells Josephine and Nathaniel there was an accident in the core. Jamie is dead. His watch still ticks on the study desk. Nathaniel hears the weeping and gets as far as the stables before he breaks. Byron sits beside him.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>NATHANIEL:\u003c/strong> I saw him go. I stayed for the Chancellor's men.\u003c/p>\u003c/blockquote>\n\u003cp>Byron puts a white-gloved hand on his neck. This grief scene is retained here, not discarded to make the new pilot ending work.\u003c/p>\n\u003cp>\u003cstrong>The city morgue, dawn, 3 November.\u003c/strong> Felix, still wet, draws back the sheet for Alice. He does not tell her Miriam chose death.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>FELIX:\u003c/strong> I tried to reach her.\n\u003cstrong>ALICE:\u003c/strong> She wouldn't have—\u003c/p>\u003c/blockquote>\n\u003cp>He cannot finish an explanation before Alice sinks beside the slab. She presses Miriam's cold hand to her forehead.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>ALICE:\u003c/strong> You said tomorrow. You promised tomorrow. You always go first.\u003c/p>\u003c/blockquote>\n\u003cp>A drop falls from Miriam's lips. The pigment is still dark; the frost now gathering on her skin belongs to what came through in the river. Her eyes open and find Alice.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>MIRIAM'S BODY:\u003c/strong> Ali.\u003c/p>\u003c/blockquote>\n\u003cp>Alice recognises the voice and reaches closer. The girl sits up, frightened by the room and the hands reaching for her. Her scream splits the green light, \u003cem>eeeeiiiKKK\u003c/em>. Two attendants freeze. Felix's revolver falls as his hand goes numb. Alice sees the men fall and hesitates—then the girl calls her name again.\u003c/p>\n\u003cp>The barefoot girl runs into the \u003cstrong>first daylight\u003c/strong>. Alice goes after her.\u003c/p>\n\u003cp>\u003cstrong>No 47-day card yet. This opening continues directly from the pilot; it does not claim two days passed between the fall and the rescue.\u003c/strong>\u003c/p>"},{"oref":"Scene 2","id":23,"seq":2,"title":"Gin Lane rooftops","added":false,"act":"Act One","kind":"scene","sum":"Alice follows a trail of frost from roof to roof. She finds her \"sister\" curled inside a lamp tower, hands cupped round the crystal, draining its light to get warm. Alice talks her down with their childhood counting game, \"one post, two post,\" and the creature counts back in Miriam's voice, because the body knows it even if she doesn't. After sunrise on 3 November, Alice hammers on OLD WREN's door. Wren, who set Alice's arm when she was nine, listens to a heart that's barely there and holds a mirror under a breath that barely fogs it. \"Ice does this. I've seen a drowned boy sit up after an hour by the fire. She's had a shock, love. The memories come back in their own time.\" She sees more than she says, and Alice's face begs her not to say it. Alice takes her sister home, and chooses to believe.","loc":"Gin Lane rooftops.","when":"Alice follows a trail of frost from roof to roof.","th":"sisters","also":["white"],"ch":["alice","lostone","wren"],"turn":"Alice follows a trail of frost from roof to roof. She finds her \"sister\" curled inside a lamp tower, hands cupped round the crystal, draining its light to get warm. Alice talks her down with their childhood counting game","w":151,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>Alice follows a trail of frost from roof to roof. She finds her &quot;sister&quot; curled inside a lamp tower, hands cupped round the crystal, draining its light to get warm. Alice talks her down with their childhood counting game, &quot;one post, two post,&quot; and the creature counts back in Miriam's voice, because the body knows it even if she doesn't. After sunrise on 3 November, Alice hammers on OLD WREN's door. Wren, who set Alice's arm when she was nine, listens to a heart that's barely there and holds a mirror under a breath that barely fogs it. &quot;Ice does this. I've seen a drowned boy sit up after an hour by the fire. She's had a shock, love. The memories come back in their own time.&quot; She sees more than she says, and Alice's face begs her not to say it. Alice takes her sister home, and chooses to believe.\u003c/p>"},{"oref":"Scene 3","id":24,"seq":3,"title":"Harding House, the parlour","added":false,"act":"Act One","kind":"scene","sum":"4 November. TITLE CARD: 47 DAYS TO FIRST SNOW. Jamie lies in a closed coffin. Nathaniel insists on seeing him; Eldgard refuses. Byron gently moves Nathaniel's hand off the lid, and Nathaniel notices that Byron's own hands are shaking. Then Josephine takes his face in her gloved hands, the only time this season she touches him without a reason: \"You're what's left. You will stay out of that place.\" It isn't a request. The kid leather is cold.","loc":"Harding House","when":"4 November.","th":"harding","also":["investigation"],"ch":["nathaniel","eldgard","byron","jamie"],"turn":"Jamie lies in a closed coffin. Nathaniel insists on seeing him; Eldgard refuses. Byron gently moves Nathaniel's hand off the lid, and Nathaniel notices that Byron's own hands are shaking. Then Josephine takes his face in","w":78,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>\u003cstrong>4 November. TITLE CARD: 47 DAYS TO FIRST SNOW.\u003c/strong>\u003c/p>\n\u003cp>Jamie lies in a closed coffin. Nathaniel insists on seeing him; Eldgard refuses. Byron gently moves Nathaniel's hand off the lid, and Nathaniel notices that Byron's own hands are shaking. Then Josephine takes his face in her gloved hands, the only time this season she touches him without a reason: &quot;You're what's left. You will stay out of that place.&quot; It isn't a request. The kid leather is cold.\u003c/p>"},{"oref":"Scene 4","id":25,"seq":4,"title":"Lantern Guard tower, Charing Cross","added":false,"act":"Act One","kind":"scene","sum":"NIXON HARGRAVE, 23, comes home from the eastern marshes with Essex mud to his knees and a crate on his shoulder. He's broad through the shoulders and narrow at the hips, a charity-school boy's cropped black hair, a Lantern's green-glass gauntlet scuffed white, and a face that keeps very still because stillness was the first thing anyone ever praised in it. For six weeks he walked the failing eastern lines and found what the Works report will call a fault: frost on the reeds in October, a drowned village iced over to the eaves, wolf tracks the width of a dinner plate, and lamps nearest the sea gone dull as river stones. He sets the crate on the table. Inside is one of those dull crystals. Then, because the corps needs a hero this week, he's made Lantern-Captain, the youngest in its history, and swears the oath with his hand on the glass: \"Light the dark. Keep the flame.\" ELDGARD, his patron since the charity school, pins the green-glass lantern to his collar: \"My family looks after its own.\" In the corridor, out of the room's hearing, Eldgard gives him the rest, and it isn't a leash; it's a place. \"I've lost a son, Captain. I need one I can trust with the house.\" He tells him the first of its secrets: one of Nixon's own Wicks fired the shot in the core, and Jamie fell. \"You'll keep it. That's what sons do here.\" Nixon, who has waited his whole life to be called that, nods. \"Yes, sir.\" Then COLE finds him in the bunk-room, two days without sleep and shaking: \"I hit him, sir. In the strobe. Flash went right through him. And then I saw his face.\" Nixon puts both hands on the boy's shoulders. \"You saw a flash, Wick. Flashes lie.\" Cole decides to believe him, because it's the only way to stand up. But that night he writes all of it in his diary anyway: the flash, the shoulder, his own rifle, and the man on the floor still talking when Mr Harding sent him to the gate.","loc":"Lantern Guard tower","when":"NIXON HARGRAVE, 23, comes home from the eastern marshes with Essex mud to his knees and a crate on his shoulder.","th":"guard","also":[],"ch":["nixon","cole"],"turn":"","w":352,"ed":"Revised Nov 15: the replacement son","fl":[],"html":"\u003cp>NIXON HARGRAVE, 23, comes home from the eastern marshes with Essex mud to his knees and a crate on his shoulder. He's broad through the shoulders and narrow at the hips, a charity-school boy's cropped black hair, a Lantern's green-glass gauntlet scuffed white, and a face that keeps very still because stillness was the first thing anyone ever praised in it. For six weeks he walked the failing eastern lines and found what the Works report will call \u003cem>a fault\u003c/em>: frost on the reeds in October, a drowned village iced over to the eaves, wolf tracks the width of a dinner plate, and lamps nearest the sea gone dull as river stones. He sets the crate on the table. Inside is one of those dull crystals. Then, because the corps needs a hero this week, he's made Lantern-Captain, the youngest in its history, and swears the oath with his hand on the glass: &quot;Light the dark. Keep the flame.&quot; ELDGARD, his patron since the charity school, pins the green-glass lantern to his collar: &quot;My family looks after its own.&quot; In the corridor, out of the room's hearing, Eldgard gives him the rest, and it isn't a leash; it's a place. &quot;I've lost a son, Captain. I need one I can trust with the house.&quot; He tells him the first of its secrets: one of Nixon's own Wicks fired the shot in the core, and Jamie fell. &quot;You'll keep it. That's what sons do here.&quot; Nixon, who has waited his whole life to be called that, nods. &quot;Yes, sir.&quot; Then COLE finds him in the bunk-room, two days without sleep and shaking: &quot;I hit him, sir. In the strobe. Flash went right through him. And then I saw his face.&quot; Nixon puts both hands on the boy's shoulders. &quot;You saw a flash, Wick. Flashes lie.&quot; Cole decides to believe him, because it's the only way to stand up. \u003cem>But\u003c/em> that night he writes all of it in his diary anyway: the flash, the shoulder, his own rifle, and the man on the floor still talking when Mr Harding sent him to the gate.\u003c/p>"},{"oref":"Scene 5","id":26,"seq":5,"title":"Gin Lane tenement","added":false,"act":"Act One","kind":"scene","sum":"Whimsy. The Lost One meets bread, a kettle (terror), and a cat (delight). She calls Alice \"Ali\" exactly the way Miriam did. Then she picks up the cat and it freezes stiff in her arms. Her face: she doesn't understand death. Alice does, and decides it's the cold still in her from the bridge, the way Wren said. Therefore rules: gloves, no touching, until it passes. Miriam's red mittens go on her hands. Alice: \"You'll be yourself again soon, Mim.\" The Lost One looks at her a long moment, a creature deciding whether to tell the truth to the only warm thing in the world. \"Yes, Ali.\" The first lie, and the first kindness.","loc":"Gin Lane tenement","when":"Whimsy.","th":"sisters","also":["white"],"ch":["lostone","alice"],"turn":"","w":114,"ed":"","fl":[],"html":"\u003cp>Whimsy. The Lost One meets bread, a kettle (terror), and a cat (delight). She calls Alice &quot;Ali&quot; exactly the way Miriam did. Then she picks up the cat and it freezes stiff in her arms. Her face: she doesn't understand death. Alice does, and decides it's the cold still in her from the bridge, the way Wren said. \u003cem>Therefore\u003c/em> rules: gloves, no touching, until it passes. Miriam's red mittens go on her hands. Alice: &quot;You'll be yourself again soon, Mim.&quot; The Lost One looks at her a long moment, a creature deciding whether to tell the truth to the only warm thing in the world. &quot;Yes, Ali.&quot; The first lie, and the first kindness.\u003c/p>"},{"oref":"Scene 6","id":28,"seq":6,"title":"Lambrick coach","added":false,"act":"Act Two","kind":"scene","sum":"Lambrick to Tamara: \"The heir is dead. Your fiancé is the heir now. Marry him fast.\" Tamara: \"Let me run the books instead.\" \"You're a wedding, not a ledger.\" On the ride she reads his account book upside down and spots a line: 2 Nov, Works gate, 200 gns, A.F.","loc":"Lambrick coach","when":"Lambrick to Tamara: \"The heir is dead.","th":"lambrick","also":["investigation"],"ch":["lambrick","tamara"],"turn":"","w":50,"ed":"","fl":[],"html":"\u003cp>Lambrick to Tamara: &quot;The heir is dead. Your fiancé is the heir now. Marry him fast.&quot; Tamara: &quot;Let me run the books instead.&quot; &quot;You're a wedding, not a ledger.&quot; On the ride she reads his account book upside down and spots a line: \u003cem>2 Nov, Works gate, 200 gns, A.F.\u003c/em>\u003c/p>"},{"oref":"Scene 7","id":29,"seq":7,"title":"St Bride's, the funeral","added":false,"act":"Act Two","kind":"scene","sum":"The Lantern Guard honour guard; Nixon carries the coffin, and it's wrong in his hands: heavier than a man, and dead-still on the steps, nothing settling. He tells himself that's what grief weighs. At the graveside Eldgard puts him at his right hand, at the head of the grave, and Nathaniel ends up at the edge of the family, half out of the frame, exactly like the younger sons in the long gallery. Lord Chancellor VANE and the great houses attend. Nathaniel gives the eulogy and breaks halfway. When the church lamps flare he hears the Weeping under the hymn, the same tune a half-step down. He turns to the girl at the end of his pew, a stranger in borrowed black: \"Do you hear that?\" She listens, honestly, and hears nothing but rich people crying. \"Hear what, sir?\" \"Someone crying.\" \"In a church? Half the room is, sir.\" He nearly laughs, and that surprises him more than the grief does. From the family pew Josephine watches the girl. To Byron: \"That girl holds her wrist like a knife-girl.\" Byron: \"You'd know, madam.\" Among the Harding brasses on the chancel wall is a girl's: OTTOLINE HARDING, 1820 TO 1839, DIED ABROAD. Nathaniel asks Byron who she was. \"Your father's sister, sir.\" Byron says no more, and Eldgard never turns his head toward it. Tamara takes his hand: kindness, nothing more. Nixon watches.","loc":"St Bride's","when":"The Lantern Guard honour guard; Nixon carries the coffin, and it's wrong in his hands: heavier than a man, and dead-still on the steps, nothing settling.","th":"guard","also":["city"],"ch":["nixon","vane","nathaniel","byron","eldgard","tamara","otty"],"turn":"","w":232,"ed":"Revised Nov 15: the replacement son","fl":[],"html":"\u003cp>The Lantern Guard honour guard; Nixon carries the coffin, and it's wrong in his hands: heavier than a man, and dead-still on the steps, nothing settling. He tells himself that's what grief weighs. At the graveside Eldgard puts him at his right hand, at the head of the grave, and Nathaniel ends up at the edge of the family, half out of the frame, exactly like the younger sons in the long gallery. Lord Chancellor VANE and the great houses attend. Nathaniel gives the eulogy and breaks halfway. When the church lamps flare he hears the Weeping under the hymn, the same tune a half-step down. He turns to the girl at the end of his pew, a stranger in borrowed black: &quot;Do you hear that?&quot; She listens, honestly, and hears nothing but rich people crying. &quot;Hear what, sir?&quot; &quot;Someone crying.&quot; &quot;In a church? Half the room is, sir.&quot; He nearly laughs, and that surprises him more than the grief does. From the family pew Josephine watches the girl. To Byron: &quot;That girl holds her wrist like a knife-girl.&quot; Byron: &quot;You'd know, madam.&quot; Among the Harding brasses on the chancel wall is a girl's: OTTOLINE HARDING, 1820 TO 1839, DIED ABROAD. Nathaniel asks Byron who she was. &quot;Your father's sister, sir.&quot; Byron says no more, and Eldgard never turns his head toward it. Tamara takes his hand: kindness, nothing more. Nixon watches.\u003c/p>"},{"oref":"Scene 8","id":30,"seq":8,"title":"The graveside","added":false,"act":"Act Two","kind":"scene","sum":"Alice is there on her first contract, taken from Grise that morning: Mim needs warmth and medicine, the Vykra pays, and the sister who always said no can't remember why. The second Harding son. Get close. Report everything. She is posing as a mourner from the Works. Nathaniel recognises the girl from the pew. Two people grieving, one of them lying. He offers his handkerchief, the only thing he has done all day that nobody told him to do; she keeps it.","loc":"The graveside","when":"Alice is there on her first contract, taken from Grise that morning: Mim needs warmth and medicine, the Vykra pays, and the sister who always said no can't remember why.","th":"sisters","also":["harding"],"ch":["alice","nathaniel"],"turn":"","w":82,"ed":"Revised Nov 14: the new pilot","fl":[],"html":"\u003cp>Alice is there on her first contract, taken from Grise that morning: Mim needs warmth and medicine, the Vykra pays, and the sister who always said no can't remember why. The second Harding son. Get close. Report everything. She is posing as a mourner from the Works. Nathaniel recognises the girl from the pew. Two people grieving, one of them lying. He offers his handkerchief, the only thing he has done all day that nobody told him to do; she keeps it.\u003c/p>"},{"oref":"Scene 9","id":31,"seq":9,"title":"Vykra laundry","added":false,"act":"Act Two","kind":"scene","sum":"Josephine, veiled, meets Grise and pays in gold for the contract she placed weeks ago on her son, and doubles it now that Jamie is dead. \"Keep him close. Keep him out of the Works. His father will use him.\" A reveal for the audience: Josephine is old Vykra, and Alice's contract came from Nathaniel's mother.","loc":"Vykra laundry","when":"Josephine, veiled, meets Grise and pays in gold for the contract she placed weeks ago on her son, and doubles it now that Jamie is dead.","th":"vykra","also":["sisters"],"ch":["josephine","grise"],"turn":"","w":56,"ed":"","fl":[],"html":"\u003cp>Josephine, veiled, meets Grise and pays in gold for the contract she placed weeks ago on her son, and doubles it now that Jamie is dead. &quot;Keep him close. Keep him out of the Works. His father will use him.&quot; A reveal for the audience: Josephine is old Vykra, and Alice's contract came from Nathaniel's mother.\u003c/p>"},{"oref":"Scene 10","id":32,"seq":10,"title":"Harding Works, core level","added":false,"act":"Act Two","kind":"scene","sum":"Nathaniel forces the outer gate. The core door is sealed and Eldgard's men turn him back, but on the stairs he finds a spent Lantern Guard rifle cartridge. Therefore his brother's death wasn't an accident.","loc":"Harding Works","when":"Nathaniel forces the outer gate.","th":"investigation","also":["harding"],"ch":["nathaniel"],"turn":"","w":35,"ed":"","fl":[],"html":"\u003cp>Nathaniel forces the outer gate. The core door is sealed and Eldgard's men turn him back, but on the stairs he finds a spent Lantern Guard rifle cartridge. \u003cem>Therefore\u003c/em> his brother's death wasn't an accident.\u003c/p>"},{"oref":"Scene 11","id":33,"seq":11,"title":"Guard tower roof","added":false,"act":"Act Two","kind":"scene","sum":"Nathaniel shows Nixon the cartridge: \"This is one of yours.\" Nixon: \"Half the corps was down there after.\" \"Then find me the one who was down there before.\" Nixon takes the case. He already knows the answer; it was the first secret his new father gave him.","loc":"Guard tower roof","when":"Nathaniel shows Nixon the cartridge: \"This is one of yours.\" Nixon: \"Half the corps was down there after.\" \"Then find me the one who was down there before.\" Nixon takes the case.","th":"investigation","also":["guard"],"ch":["nathaniel","nixon"],"turn":"","w":47,"ed":"Revised Nov 15: the replacement son","fl":[],"html":"\u003cp>Nathaniel shows Nixon the cartridge: &quot;This is one of yours.&quot; Nixon: &quot;Half the corps was down there after.&quot; &quot;Then find me the one who was down there before.&quot; Nixon takes the case. He already knows the answer; it was the first secret his new father gave him.\u003c/p>"},{"oref":"Scene 12","id":34,"seq":12,"title":"Tenement","added":false,"act":"Act Three","kind":"scene","sum":"The Lost One keeps drawing a chain on the frosted window and whispering \"Mother.\" Alice, gently, wiping it away: \"Mum's gone, Mim. Ten years.\" The Lost One lets her think that's who she meant. Round her neck Alice finds a silver locket, two hearts locked into one, the back engraved J.H. The Lost One: \"He said he would come back.\" A fragment of waiting, not an identification of the person in the later carriage. Therefore Alice needs to know why he didn't.","loc":"Tenement.","when":"The Lost One keeps drawing a chain on the frosted window and whispering \"Mother.\" Alice, gently, wiping it away: \"Mum's gone, Mim.","th":"sisters","also":["white"],"ch":["lostone","alice"],"turn":"The Lost One keeps drawing a chain on the frosted window and whispering \"Mother.\" Alice, gently, wiping it away: \"Mum's gone, Mim. Ten years.\" The Lost One lets her think that's who she meant. Round her neck Alice finds ","w":82,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>The Lost One keeps drawing a chain on the frosted window and whispering &quot;Mother.&quot; Alice, gently, wiping it away: &quot;Mum's gone, Mim. Ten years.&quot; The Lost One lets her think that's who she meant. Round her neck Alice finds a silver locket, two hearts locked into one, the back engraved J.H. The Lost One: &quot;He said he would come back.&quot; A fragment of waiting, not an identification of the person in the later carriage. \u003cem>Therefore\u003c/em> Alice needs to know why he didn't.\u003c/p>"},{"oref":"Scene 13","id":35,"seq":13,"title":"Harding House, Jamie's bedroom, night","added":false,"act":"Act Three","kind":"scene","sum":"Alice breaks in Vykra-quiet and finds Nathaniel already there, searching. A standoff in the dark ends with the truth, almost: \"My sister loved your brother. She nearly died the same night he did.\" Nathaniel didn't know Jamie loved anyone. Then the door handle turns. There's one place to go: Jamie's wardrobe, among his coats, chest to chest in the dark, his heart going against her shoulder, and under her breath, so low only he could hear it, she counts to keep still: \"One post, two post, three, four.\" He doesn't ask. He keeps it. Through the slats, ELDGARD comes in alone with a candle, sits on his dead son's bed, and winds Jamie's pocket watch. Tk-tk-tk-tk. He doesn't say a word, which is worse than anything he could say. Nathaniel's breath catches; he is about to step out and go to his father. Alice puts her hand over his mouth. The candle goes, down the back stair toward the Works. She doesn't take her hand away fast enough, and neither of them mentions it. Crouched among Jamie's shoes, they find what they came for: a letter hidden in the boot-tree, an escape plan (three berths on a Southampton steamer, and no names), and a diagram of the chain, and beside it a second stair of thirteen steps going down from a hatch marked coal. At the window, going, there's a beat where neither of them knows what to say. Then she gives him one true thing: \"Bounds.\" He asks for the rest of it. \"Ask me again when the lights come on.\" Only later, at home, does he find the folded schematic of his leap-gauntlet, brought to show a brother who'll never see it, gone from his coat. So she's Bounds to him, and it's the only name he uses for her all season, first as a joke and then as something he's afraid to change. Below the window, Byron, passing with a candle, watches her drop into the garden, says nothing and smiles.","loc":"Harding House","when":"Alice breaks in Vykra-quiet and finds Nathaniel already there, searching.","th":"investigation","also":["sisters","harding"],"ch":["alice","nathaniel","eldgard","byron"],"turn":"","w":334,"ed":"Revised Nov 14: the new pilot","fl":[],"html":"\u003cp>Alice breaks in Vykra-quiet and finds Nathaniel already there, searching. A standoff in the dark ends with the truth, almost: &quot;My sister loved your brother. She nearly died the same night he did.&quot; Nathaniel didn't know Jamie loved anyone. Then the door handle turns. There's one place to go: Jamie's wardrobe, among his coats, chest to chest in the dark, his heart going against her shoulder, and under her breath, so low only he could hear it, she counts to keep still: &quot;One post, two post, three, four.&quot; He doesn't ask. He keeps it. Through the slats, ELDGARD comes in alone with a candle, sits on his dead son's bed, and winds Jamie's pocket watch. \u003cem>Tk-tk-tk-tk.\u003c/em> He doesn't say a word, which is worse than anything he could say. Nathaniel's breath catches; he is about to step out and go to his father. Alice puts her hand over his mouth. The candle goes, down the back stair toward the Works. She doesn't take her hand away fast enough, and neither of them mentions it. Crouched among Jamie's shoes, they find what they came for: a letter hidden in the boot-tree, an escape plan (three berths on a Southampton steamer, and no names), and a diagram of the chain, and beside it a second stair of thirteen steps going down from a hatch marked coal. At the window, going, there's a beat where neither of them knows what to say. Then she gives him one true thing: &quot;Bounds.&quot; He asks for the rest of it. &quot;Ask me again when the lights come on.&quot; Only later, at home, does he find the folded schematic of his leap-gauntlet, brought to show a brother who'll never see it, gone from his coat. So she's Bounds to him, and it's the only name he uses for her all season, first as a joke and then as something he's afraid to change. Below the window, Byron, passing with a candle, watches her drop into the garden, says nothing and smiles.\u003c/p>"},{"oref":"Scene 14","id":36,"seq":14,"title":"The core","added":false,"act":"Act Three","kind":"scene","sum":"Eldgard alone with the chained light, which we still only see as green glow and a voice. \"He was mine, and I spent him.\" The chain has frayed links. He counts: \"Forty-seven.\"","loc":"The core","when":"Eldgard alone with the chained light, which we still only see as green glow and a voice.","th":"white","also":["harding"],"ch":["eldgard"],"turn":"","w":32,"ed":"","fl":[],"html":"\u003cp>Eldgard alone with the chained light, which we still only see as green glow and a voice. &quot;He was mine, and I spent him.&quot; The chain has frayed links. He counts: &quot;Forty-seven.&quot;\u003c/p>"},{"oref":"Scene 15","id":27,"seq":15,"title":"Scotland Yard, then Gin Lane","added":false,"act":"Act Three","kind":"scene","sum":"Felix has two frozen attendants, a missing corpse and his Blackwood notes: a familiar hired carriage fleeing; discarded blades not yet recovered; a woman resisting her own hands before the fall; dark pigment at her mouth. The lips were not frosted until the river. The morgue deaths are a second, different event. A Crown order tells him to drop the Blackwood inquiry as part of the Works' security case. He keeps his notes. The birds and ticket-office identification already gave him the Bounds address; no new witness conveniently supplies an address he should know. At Gin Lane Alice is out. The Lost One opens the door, sees the man from the slab, and panics. Frost closes Felix's hand against the frame. She bolts. He has now seen cold used deliberately in self-defense as well as in the morgue panic. He leaves the constable a note on the chronology: pigment before water; frost after. He cannot yet name the murderer or the substance.","loc":"Scotland Yard","when":"Felix has two frozen attendants, a missing corpse and his Blackwood notes: a familiar hired carriage fleeing; discarded blades not yet recovered; a woman resisting her own hands be","th":"investigation","also":["city","sisters","white"],"ch":["felix","lostone"],"turn":"At Gin Lane Alice is out. The Lost One opens the door, sees the man from the slab, and panics. Frost closes Felix's hand against the frame. She bolts. He has now seen cold used deliberately in self-defense as well as in ","w":162,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>Felix has two frozen attendants, a missing corpse and his Blackwood notes: a familiar hired carriage fleeing; discarded blades not yet recovered; a woman resisting her own hands before the fall; dark pigment at her mouth. The lips were not frosted until the river. The morgue deaths are a second, different event.\u003c/p>\n\u003cp>A Crown order tells him to drop the Blackwood inquiry as part of the Works' security case. He keeps his notes. The birds and ticket-office identification already gave him the Bounds address; no new witness conveniently supplies an address he should know.\u003c/p>\n\u003cp>At Gin Lane Alice is out. The Lost One opens the door, sees the man from the slab, and panics. Frost closes Felix's hand against the frame. She bolts. He has now seen cold used deliberately in self-defense as well as in the morgue panic. He leaves the constable a note on the chronology: \u003cem>pigment before water; frost after\u003c/em>. He cannot yet name the murderer or the substance.\u003c/p>"},{"oref":"Scene 16","id":40,"seq":16,"title":"Tenement","added":false,"act":"Act Three","kind":"scene","sum":"Alice comes home to a frozen door and Felix, his hand bandaged. \"Your sister was dead. I pulled her out myself. Before she fell, she tried to stop. Whatever happened on that bridge, she fought it.\" He shows Alice the pigment notation but does not pretend he has identified the poison. \"The surgeon said she was with child. Then she got up. Explain that to me.\" Alice: \"Your surgeon was wrong. The cold fools them. They pull men out of the Thames in January who sit up on the slab.\" She believes every word, which is why Felix can't tell if she's lying. He doesn't arrest her. He files the word child away, and so does she. Three berths. She thinks she knows now who the third was for. That night she asks Wren, once. Wren, who had her ear to that chest for an hour: \"If there was a child, love, the cold took it. Let it go.\" Alice cannot ask Miriam without making the apparent recovery more frightening. She puts the question away, rather than ceasing to care. It's Wren's second kind lie, and the bigger one.","loc":"Tenement.","when":"Alice comes home to a frozen door and Felix, his hand bandaged.","th":"investigation","also":["sisters"],"ch":["alice","felix"],"turn":"Alice comes home to a frozen door and Felix, his hand bandaged. \"Your sister was dead. I pulled her out myself. Before she fell, she tried to stop. Whatever happened on that bridge, she fought it.\" He shows Alice the pig","w":189,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>Alice comes home to a frozen door and Felix, his hand bandaged. &quot;Your sister was dead. I pulled her out myself. Before she fell, she tried to stop. Whatever happened on that bridge, she fought it.&quot; He shows Alice the pigment notation but does not pretend he has identified the poison. &quot;The surgeon said she was with child. Then she got up. Explain that to me.&quot; Alice: &quot;Your surgeon was wrong. The cold fools them. They pull men out of the Thames in January who sit up on the slab.&quot; She believes every word, which is why Felix can't tell if she's lying. He doesn't arrest her. He files the word \u003cem>child\u003c/em> away, and so does she. Three berths. She thinks she knows now who the third was for. That night she asks Wren, once. Wren, who had her ear to that chest for an hour: &quot;If there was a child, love, the cold took it. Let it go.&quot; Alice cannot ask Miriam without making the apparent recovery more frightening. She puts the question away, rather than ceasing to care. It's Wren's second kind lie, and the bigger one.\u003c/p>"},{"oref":"Scene 17","id":41,"seq":17,"title":"Tyburn Road","added":false,"act":"Act Three","kind":"scene","sum":"The Lost One, drawn by the Weeping, walks to the Harding Works and lays a mittened palm on the gate. Every lamp on the street bends its flame toward her. Nixon, on night watch, sees it.","loc":"Tyburn Road","when":"The Lost One, drawn by the Weeping, walks to the Harding Works and lays a mittened palm on the gate.","th":"white","also":["guard"],"ch":["lostone","nixon"],"turn":"","w":36,"ed":"","fl":[],"html":"\u003cp>The Lost One, drawn by the Weeping, walks to the Harding Works and lays a mittened palm on the gate. Every lamp on the street bends its flame toward her. Nixon, on night watch, sees it.\u003c/p>"},{"oref":"Scene 18","id":42,"seq":18,"title":"The core","added":false,"act":"Tag","kind":"scene","sum":"The chain jerks. For the first time in four hundred years the prisoner lifts her head, and we see her face: blue ice, green fire in the eyes. MORGANA: \"My daughter is here.\" Eldgard drops his lamp.","loc":"The core","when":"The chain jerks.","th":"white","also":["harding"],"ch":["morgana","eldgard"],"turn":"","w":37,"ed":"","fl":[],"html":"\u003cp>The chain jerks. For the first time in four hundred years the prisoner lifts her head, and we see her face: blue ice, green fire in the eyes. MORGANA: &quot;My daughter is here.&quot; Eldgard drops his lamp.\u003c/p>"}]},{"n":3,"title":"Lanterns","time":"42 DAYS TO FIRST SNOW","clock":"42 DAYS TO FIRST SNOW","act":"I","log":"Eldgard sets his captain on the Frost Killer, and Nathaniel, finally given a real job, arms the hunt without knowing its target is the girl Alice is hiding. When Nixon gets the creature at the end of his rifle, he has to choose between his patron's order and a frozen boy.","sum":"\"You smell like the man who keeps my mother.\"","turn":"Nixon picks Cole over the capture. Nathaniel finds Alice and the Lost One","focus":"Nixon's hunt.","piece":"a leaper chase across the Christmas crystal market.","threads":["guard","sisters","harding","lambrick","vykra","investigation","white"],"frame":"\u003cp>\u003cstrong>42 DAYS TO FIRST SNOW.\u003c/strong> \u003cstrong>Focus:\u003c/strong> Nixon's hunt. \u003cstrong>Set piece:\u003c/strong> a leaper chase across the Christmas crystal market. \u003cstrong>Sting:\u003c/strong> the creature touches Nathaniel and he doesn't freeze, and she knows what he is.\u003c/p>","scenes":[{"oref":"Scene 1","id":43,"seq":1,"title":"Gin Lane, fifteen years ago, then Shadwell","added":false,"act":"Cold open","kind":"scene","sum":"Under a bed, two girls, and boots crossing the floorboards. Creak. Creak. MIRIAM, nine, presses her mouth to ALICE's ear: \"Nothing touches you while I'm here.\" A buckle comes loose. Tnk. A hand reaches under and drags Alice out by the ankle. Miriam doesn't move. Through the slats she whispers: \"Count the posts, Ali. One post. Two post.\" Thwack. \"Eight posts and he's done.\" We never see him; we only hear him. Seven years later, a street fight behind the Shadwell laundry: Miriam, sixteen, takes a knife across the palm and keeps coming. In a doorway a younger MOTHER GRISE, black gloves and a clay pipe, watches her not flinch. After: \"There's a sisterhood could use a girl who doesn't feel it. One simple task.\" \"What task?\" Grise smiles. Cut to lamplight: Grise's needle draws the Vykra knot through the inside of Miriam's glove. Miriam pulls it on. Her hand is shaking. Grise sees it, and says nothing. Smash cut to 1889. (The task is paid off in Episode 7, scene 3.)","loc":"Gin Lane; Shadwell","when":"Under a bed, two girls, and boots crossing the floorboards.","th":"sisters","also":["vykra"],"ch":["miriam","alice","grise"],"turn":"","w":172,"ed":"Revised Nov 14: the sisters' past","fl":[],"html":"\u003cp>Under a bed, two girls, and boots crossing the floorboards. \u003cem>Creak. Creak.\u003c/em> MIRIAM, nine, presses her mouth to ALICE's ear: &quot;Nothing touches you while I'm here.&quot; A buckle comes loose. \u003cem>Tnk.\u003c/em> A hand reaches under and drags Alice out by the ankle. Miriam doesn't move. Through the slats she whispers: &quot;Count the posts, Ali. One post. Two post.&quot; \u003cem>Thwack.\u003c/em> &quot;Eight posts and he's done.&quot; We never see him; we only hear him. Seven years later, a street fight behind the Shadwell laundry: Miriam, sixteen, takes a knife across the palm and keeps coming. In a doorway a younger MOTHER GRISE, black gloves and a clay pipe, watches her not flinch. After: &quot;There's a sisterhood could use a girl who doesn't feel it. One simple task.&quot; &quot;What task?&quot; Grise smiles. \u003cem>Cut to\u003c/em> lamplight: Grise's needle draws the Vykra knot through the inside of Miriam's glove. Miriam pulls it on. Her hand is shaking. Grise sees it, and says nothing. \u003cem>Smash cut to 1889.\u003c/em> (The task is paid off in Episode 7, scene 3.)\u003c/p>"},{"oref":"Scene 2","id":44,"seq":2,"title":"Harding Works, the shop","added":false,"act":"Act One","kind":"scene","sum":"Eldgard gives Nathaniel his first real job: re-equip the Guard with leap-rigs and flash-gauntlets, and refit its lantern rifles, for the Frost Killer hunt. Nathaniel glows. Nixon is at the door for his own orders, and in the corridor, where his son can't hear, Eldgard gives them quietly: find the frost girl and bring her to the Works alive. Tell no one, not the Yard and not my son. Nixon: \"Yes, sir.\" Then, because it's the only thing he has to give: \"I've seen her, sir. At our own gate, five nights ago. I've seen frost like hers before, in the Essex reeds in Octo
