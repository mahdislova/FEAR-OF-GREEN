lasshouse","when":"Alice runs, out through the gates where the riot is starting and across the lawn, ten minutes too late.","th":"sisters","also":[],"ch":["alice"],"turn":"","w":63,"ed":"Revised Nov 14: the sisters' past","fl":[],"html":"\u003cp>Alice runs, out through the gates where the riot is starting and across the lawn, ten minutes too late. The door hangs open. The orange trees are dusted white. On the pane, in frost: DON'T FOLLOW ME. Miriam's letter said \u003cem>I'm coming for you\u003c/em>; this one says the opposite, and Alice reads both at once. Her knees go. She was watching a wedding.\u003c/p>"},{"oref":"Scene 14","id":162,"seq":14,"title":"The chapel steps","added":false,"act":"Act Two","kind":"scene","sum":"Vane's marshals arrest Eldgard for the murder of his son James, on his wife's sworn word and a coffin full of slag. A murderer can be hanged quietly. A Keeper who might stand up in court and read out the Crown's annex can't be left free, and with Eldgard in Newgate nobody is left to argue with the men who now own the core. The marshals take his watch, his cane and his collar studs. They leave the wolf-crest ring on his hand, because nobody outside the family knows what it closed. He looks at his wife and understands. \"Josie.\" She doesn't look away.","loc":"The chapel steps","when":"Vane's marshals arrest Eldgard for the murder of his son James, on his wife's sworn word and a coffin full of slag.","th":"harding","also":["city"],"ch":["vane","eldgard","josephine"],"turn":"","w":104,"ed":"Revised Oct 14: polish pass","fl":[],"html":"\u003cp>Vane's marshals arrest Eldgard for the murder of his son James, on his wife's sworn word and a coffin full of slag. A murderer can be hanged quietly. A Keeper who might stand up in court and read out the Crown's annex can't be left free, and with Eldgard in Newgate nobody is left to argue with the men who now own the core. The marshals take his watch, his cane and his collar studs. They leave the wolf-crest ring on his hand, because nobody outside the family knows what it closed. He looks at his wife and understands. &quot;Josie.&quot; She doesn't look away.\u003c/p>"},{"oref":"Scene 15","id":163,"seq":15,"title":"The gates, set piece","added":false,"act":"Act Three","kind":"scene","sum":"Nixon walks out of the chapel still holding the empty ring box. The crowd sees Eldgard in irons and surges. Coal-men and Frost Witch believers clash. Vane: \"Lanterns, fire.\" Nixon: \"Lanterns, stand down.\" Vane's second company raises their rifles, and Nixon's company raises theirs back. Cole walks out between the lines with his hands up. Nobody fires. Vane rips the lantern from Nixon's collar: \"Keep the flame, Captain.\" Nixon: \"I am.\" Forty Lanterns tear off their own, drop them in the snowless gutter, and walk away with their captain.","loc":"The gates","when":"Nixon walks out of the chapel still holding the empty ring box.","th":"guard","also":["city"],"ch":["nixon","vane","cole"],"turn":"","w":89,"ed":"","fl":[],"html":"\u003cp>Nixon walks out of the chapel still holding the empty ring box. The crowd sees Eldgard in irons and surges. Coal-men and Frost Witch believers clash. Vane: &quot;Lanterns, fire.&quot; Nixon: &quot;Lanterns, stand down.&quot; Vane's second company raises their rifles, and Nixon's company raises theirs back. Cole walks out between the lines with his hands up. Nobody fires. Vane rips the lantern from Nixon's collar: &quot;Keep the flame, Captain.&quot; Nixon: &quot;I am.&quot; Forty Lanterns tear off their own, drop them in the snowless gutter, and walk away with their captain.\u003c/p>"},{"oref":"Scene 16","id":165,"seq":16,"title":"Harding House, the old nursery","added":false,"act":"Act Three","kind":"scene","sum":"The newlyweds sit alone with the wedding breakfast. \"We said forty years of politeness.\" \"We managed four minutes.\" Tamara: \"Thank you.\" \"Don't.\" She tells him she loves Nixon. \"I know. I watched him hand me the ring.\" One unsaid thing, finally said. At the door he finds her own shawl already laid over the chair he will sleep in. Neither mentions it. Across the lawn, a lamp comes on in the glasshouse. He stands at the window and watches it until the candle in his hand burns down to his fingers, and then he goes.","loc":"Harding House","when":"The newlyweds sit alone with the wedding breakfast.","th":"lambrick","also":["harding"],"ch":["nathaniel","tamara"],"turn":"","w":95,"ed":"","fl":[],"html":"\u003cp>The newlyweds sit alone with the wedding breakfast. &quot;We said forty years of politeness.&quot; &quot;We managed four minutes.&quot; Tamara: &quot;Thank you.&quot; &quot;Don't.&quot; She tells him she loves Nixon. &quot;I know. I watched him hand me the ring.&quot; One unsaid thing, finally said. At the door he finds her own shawl already laid over the chair he will sleep in. Neither mentions it. Across the lawn, a lamp comes on in the glasshouse. He stands at the window and watches it until the candle in his hand burns down to his fingers, and then he goes.\u003c/p>"},{"oref":"Scene 17","id":228,"seq":17,"title":"The glasshouse","added":false,"act":"Act Three","kind":"scene","sum":"Nathaniel finds Alice on the floor under the frosted pane. \"What did you see up there?\" he asks. \"You, being brave,\" she says, before either of them has to say what it cost. He reads the glass. Alice: \"She heard me say cage in this room. She's gone to get in it.\" Nathaniel: \"Then it fails. No mother lets her child hang in her place.\" Alice: \"She went because she wanted to. She thinks she can make her.\" It's Alice's own lie, love as holding on, coming back at her from the other side of the glass.","loc":"The glasshouse","when":"Nathaniel finds Alice on the floor under the frosted pane.","th":"sisters","also":["harding"],"ch":["alice","nathaniel"],"turn":"","w":97,"ed":"Revised Oct 13: four rules, new Ep 8","fl":[],"html":"\u003cp>Nathaniel finds Alice on the floor under the frosted pane. &quot;What did you see up there?&quot; he asks. &quot;You, being brave,&quot; she says, before either of them has to say what it cost. He reads the glass. Alice: &quot;She heard me say \u003cem>cage\u003c/em> in this room. She's gone to get in it.&quot; Nathaniel: &quot;Then it fails. No mother lets her child hang in her place.&quot; Alice: &quot;She went because she wanted to. She thinks she can make her.&quot; It's Alice's own lie, love as holding on, coming back at her from the other side of the glass.\u003c/p>"},{"oref":"Scene 18","id":167,"seq":18,"title":"The Works, thirteen steps","added":false,"act":"Act Three","kind":"scene","sum":"Nixon, stripped of his rank an hour ago, alone, in the dark, with the old man's rhyme going round his head. He finds the coal-hatch stair behind the Works and counts down. Thirteen. Behind the last stone is a door, and behind the door is the Orchard: a long low gallery of iron-barred bunks, child-sized shackles, a wall scratched with names and tally marks. Each name is a Hargrave. The first, cut deep and worn almost smooth, is MARIAN, 1489. The tallies beside the names are a keeper's count, and over them, in a keeper's chalk, one word: APPLES. Count the apples. The children were the apples. A skipping rhyme every London child knows goes through his head, Green light, green light, who's in the cellar tonight?, and he is standing in the cellar. The last name on the wall is MARIAN too, with a date four years after he was told his mother died of fever. For four hundred years the Orchard named its girls after the first one who tried. He sits on her bunk. Creak. A wooden spoon is still under the pillow. Over the lintel, in old chalk, are two initials: J.H. Jamie was here first. Nixon understands what he was picked out of, and who kept it from him. By nightfall his forty are camped on these bunks: the one place in London nobody will look for them.","loc":"The Works","when":"Nixon, stripped of his rank an hour ago, alone, in the dark, with the old man's rhyme going round his head.","th":"guard","also":["white"],"ch":["nixon"],"turn":"","w":233,"ed":"Revised Nov 15: Nixon","fl":[],"html":"\u003cp>Nixon, stripped of his rank an hour ago, alone, in the dark, with the old man's rhyme going round his head. He finds the coal-hatch stair behind the Works and counts down. Thirteen. Behind the last stone is a door, and behind the door is the Orchard: a long low gallery of iron-barred bunks, child-sized shackles, a wall scratched with names and tally marks. Each name is a Hargrave. The first, cut deep and worn almost smooth, is MARIAN, 1489. The tallies beside the names are a keeper's count, and over them, in a keeper's chalk, one word: APPLES. \u003cem>Count the apples.\u003c/em> The children were the apples. A skipping rhyme every London child knows goes through his head, \u003cem>Green light, green light, who's in the cellar tonight?\u003c/em>, and he is standing in the cellar. The last name on the wall is MARIAN too, with a date four years after he was told his mother died of fever. For four hundred years the Orchard named its girls after the first one who tried. He sits on her bunk. \u003cem>Creak.\u003c/em> A wooden spoon is still under the pillow. Over the lintel, in old chalk, are two initials: J.H. Jamie was here first. Nixon understands what he was picked out of, and who kept it from him. By nightfall his forty are camped on these bunks: the one place in London nobody will look for them.\u003c/p>"},{"oref":"Scene 19","id":168,"seq":19,"title":"Newgate","added":false,"act":"Act Three","kind":"scene","sum":"Josephine visits Eldgard through the bars. \"You made a deal with Lambrick,\" he says. \"The girl to the chain, our son kept out of it, and me to Newgate.\" \"Yes.\" \"You sold me.\" \"I sold the man who sold our son.\" He asks one thing: \"Was any of it real?\" \"Thirty years. All of it.\" It's the first time in a generation neither of them lies. \"Our son lives.\" Eldgard: \"You've killed him. I've stood in front of her for forty years, and she's never once given a Harding anything he could keep. She'll break that glass before she lets her child hang in it, and when it breaks they'll need a Harding anyway.\" Josephine: \"Four hundred years in hooks. Nobody refuses the door.\" Eldgard: \"You would.\" It lands. Josephine's face: she may have made a mistake, and it's too late to unmake it.","loc":"Newgate","when":"Josephine visits Eldgard through the bars.","th":"harding","also":["city"],"ch":["josephine","eldgard"],"turn":"","w":144,"ed":"Revised Oct 13: four rules, new Ep 8","fl":[],"html":"\u003cp>Josephine visits Eldgard through the bars. &quot;You made a deal with Lambrick,&quot; he says. &quot;The girl to the chain, our son kept out of it, and me to Newgate.&quot; &quot;Yes.&quot; &quot;You sold me.&quot; &quot;I sold the man who sold our son.&quot; He asks one thing: &quot;Was any of it real?&quot; &quot;Thirty years. All of it.&quot; It's the first time in a generation neither of them lies. &quot;Our son lives.&quot; Eldgard: &quot;You've killed him. I've stood in front of her for forty years, and she's never once given a Harding anything he could keep. She'll break that glass before she lets her child hang in it, and when it breaks they'll need a Harding anyway.&quot; Josephine: &quot;Four hundred years in hooks. Nobody refuses the door.&quot; Eldgard: &quot;You would.&quot; It lands. Josephine's face: she may have made a mistake, and it's too late to unmake it.\u003c/p>"},{"oref":"Scene 20","id":169,"seq":20,"title":"The core","added":false,"act":"Act Three","kind":"scene","sum":"Lambrick and Vane watch the Heartglass, Nathaniel's design, close around the Lost One beside her mother. She speaks to Morgana in the language of the White: \"I've come to take your place.\" Morgana understands. For four hundred years she has wanted the door, and here it is, held open by her own child. She screams. It's grief, not rage, and it's no.","loc":"The core","when":"Lambrick and Vane watch the Heartglass, Nathaniel's design, close around the Lost One beside her mother.","th":"white","also":["city"],"ch":["lambrick","vane","lostone","morgana"],"turn":"","w":62,"ed":"","fl":[],"html":"\u003cp>Lambrick and Vane watch the Heartglass, Nathaniel's design, close around the Lost One beside her mother. She speaks to Morgana in the language of the White: &quot;I've come to take your place.&quot; Morgana understands. For four hundred years she has wanted the door, and here it is, held open by her own child. She screams. It's grief, not rage, and it's no.\u003c/p>"},{"oref":"Scene 21","id":170,"seq":21,"title":"London","added":false,"act":"Tag","kind":"scene","sum":"The scream rises through the Works and into the sky, and it begins to snow, two weeks early. Alice in the glasshouse door. Nixon and his forty on a rooftop. Tamara at a window in her wedding dress. Josephine on the Newgate steps. Eldgard at his cell window, flakes on his face. He has counted to the solstice like every Keeper before him, and in four hundred years of ledgers she has never once been early. \"First snow.\" Whatever is owed is owed by midnight. Card: 0 DAYS.","loc":"London","when":"The scream rises through the Works and into the sky, and it begins to snow, two weeks early.","th":"city","also":["white"],"ch":["alice","nixon","tamara","josephine","eldgard"],"turn":"","w":88,"ed":"Revised in the Oct 10 pass","fl":[],"html":"\u003cp>The scream rises through the Works and into the sky, and it begins to snow, two weeks early. Alice in the glasshouse door. Nixon and his forty on a rooftop. Tamara at a window in her wedding dress. Josephine on the Newgate steps. Eldgard at his cell window, flakes on his face. He has counted to the solstice like every Keeper before him, and in four hundred years of ledgers she has never once been early. &quot;First snow.&quot; Whatever is owed is owed by midnight. Card: \u003cstrong>0 DAYS.\u003c/strong>\u003c/p>"}]},{"n":9,"title":"The Snow Confession","time":"FIRST SNOW","clock":"FIRST SNOW","act":"III","log":"With the snow falling and the binding set for midnight, Nathaniel breaks his father out of Newgate with Nixon's mutineers, Alice takes the Vykra from Mother Grise, and Tamara steals her father's keys. At the Works gate, Eldgard takes a blow meant for his son and spends his last breath on everything he did.","sum":"Josephine pulls the lever","turn":"Eldgard dies and tells everything","focus":"the assault. Everyone's plan runs toward one room.","piece":"the Newgate break-out, then storming the Works through snow and wolves.","threads":["harding","investigation","lambrick","vykra","guard","city","white"],"frame":"\u003cp>\u003cstrong>FIRST SNOW.\u003c/strong> Dusk to midnight. \u003cstrong>Focus:\u003c/strong> the assault. Everyone's plan runs toward one room. \u003cstrong>Set pieces:\u003c/strong> the Newgate break-out, then storming the Works through snow and wolves. \u003cstrong>Sting:\u003c/strong> Eldgard dies telling the truth, and it's worse than the lies.\u003c/p>","scenes":[{"oref":"Scene 1","id":216,"seq":1,"title":"The Serpentine, twenty years ago","added":false,"act":"Cold open","kind":"scene","sum":"Eldgard teaches five-year-old JAMIE to skate, both of them laughing as he falls and falls. Then, kneeling on the ice: \"One day the city will need you to be very brave.\" \"I'll be brave, Papa.\" Eldgard's face as he hears it. On the bank, JOSEPHINE holds the boy's scarf and doesn't take her eyes off him. (The season's last image rhymes with this one.)","loc":"The Serpentine","when":"Eldgard teaches five-year-old JAMIE to skate, both of them laughing as he falls and falls.","th":"harding","also":[],"ch":["eldgard","jamie"],"turn":"","w":64,"ed":"Revised Oct 14: polish pass","fl":[],"html":"\u003cp>Eldgard teaches five-year-old JAMIE to skate, both of them laughing as he falls and falls. Then, kneeling on the ice: &quot;One day the city will need you to be very brave.&quot; &quot;I'll be brave, Papa.&quot; Eldgard's face as he hears it. On the bank, JOSEPHINE holds the boy's scarf and doesn't take her eyes off him. (The season's last image rhymes with this one.)\u003c/p>"},{"oref":"Scene 2","id":172,"seq":2,"title":"The glasshouse, snow falling through the broken panes","added":false,"act":"Act One","kind":"scene","sum":"Nathaniel says it first, because he has had all afternoon to see that frost on the pane: \"You nodded, and I said it, and while we were saying it they took her.\" Alice: \"She'd have been in Bethlem by supper.\" \"Your sister—\" \"Sent me up there. She'd already decided. She was going, Nathaniel. I only chose who got saved on the way.\" He owes her something he can never pay back, and both of them know it, and it makes him cruel for exactly one line: \"My mother's receipt had your name on it. That's where I learned it. On a bill.\" Alice doesn't flinch, which is how he knows it went in. Then she gives him the rest of the sentence from this morning, all of it, the way she gave her sister fifteen years in one breath: \"At first I was paid. Then you flew across that foundry into a coal bin for an audience of one, and you looked at me like I was the first person who'd ever watched. After that I'd have done it for nothing. I did do it for nothing. Grise cut me loose a month ago, and I kept coming.\" Snow ticks on the broken glass. \"I'm married.\" \"I know. I nodded.\" He reaches for her across the workbench. She lets him get halfway, then stands. \"Midnight. The core. After that, we'll see what either of us is allowed.\" For the first time it's her plan and he follows it: midnight at the core. They need the wolf-crest ring, the one Alistair closed the chain with, and it's on Eldgard's hand in a Crown cell. And they need Nixon.","loc":"The glasshouse","when":"Nathaniel says it first, because he has had all afternoon to see that frost on the pane: \"You nodded, and I said it, and while we were saying it they took her.\" Alice: \"She'd have been in Bethlem by supper.\" \"Your sister—\" \"Sent me up there.","th":"harding","also":["sisters"],"ch":["alice","nathaniel"],"turn":"","w":277,"ed":"Revised Oct 14: polish pass","fl":[],"html":"\u003cp>Nathaniel says it first, because he has had all afternoon to see that frost on the pane: &quot;You nodded, and I said it, and while we were saying it they took her.&quot; Alice: &quot;She'd have been in Bethlem by supper.&quot; &quot;Your sister—&quot; &quot;Sent me up there. She'd already decided. She was going, Nathaniel. I only chose who got saved on the way.&quot; He owes her something he can never pay back, and both of them know it, and it makes him cruel for exactly one line: &quot;My mother's receipt had your name on it. That's where I learned it. On a bill.&quot; Alice doesn't flinch, which is how he knows it went in. Then she gives him the rest of the sentence from this morning, all of it, the way she gave her sister fifteen years in one breath: &quot;At first I was paid. Then you flew across that foundry into a coal bin for an audience of one, and you looked at me like I was the first person who'd ever watched. After that I'd have done it for nothing. I did do it for nothing. Grise cut me loose a month ago, and I kept coming.&quot; Snow ticks on the broken glass. &quot;I'm married.&quot; &quot;I know. I nodded.&quot; He reaches for her across the workbench. She lets him get halfway, then stands. &quot;Midnight. The core. After that, we'll see what either of us is allowed.&quot; For the first time it's her plan and he follows it: midnight at the core. They need the wolf-crest ring, the one Alistair closed the chain with, and it's on Eldgard's hand in a Crown cell. And they need Nixon.\u003c/p>"},{"oref":"Scene 3","id":173,"seq":3,"title":"The Orchard, thirteen steps under the Works","added":false,"act":"Act One","kind":"scene","sum":"The one place in London nobody will look for forty mutineers: under the Crown's own core. Whimsy first: forty disgraced Lanterns cook sausages on flash-gauntlets set to low among the child-sized shackles, because a man has to eat, and Cole has hung his Wick lamp on the hook where a keeper's lantern hung for four hundred years. Then Nathaniel comes down the thirteen steps with Alice behind him, and the whimsy stops. Nathaniel reads the wall: the names, the tallies, APPLES, MARIAN at the top and MARIAN at the bottom, J.H. in chalk over the door. Nixon, from the bunk where his mother slept, holds out the file: Reserve. Blood suitable. \"He didn't choose me to be his son, Nat. He chose me to walk down the stair so you wouldn't have to.\" Nathaniel reads it twice. \"And he told me it was me. 'Now it's you.' He raised both of us for it.\" \"He raised both of us to want it.\" Two boys who spent their lives competing for one man's hand on their shoulder, standing in the cellar where he kept the spares. Alice, from the stair, the first words she has ever said to Nixon: \"So he grew two of you to die for him. Are you going to let him finish?\" Nixon looks at her a long time. \"What do you need?\" Nathaniel: \"Newgate, then the Works.\" Nixon: \"You know we're cousins? Cadet line.\" \"Then you're family. God help you.\" Nixon takes the hand he's offered, in front of his mother's name.","loc":"The Orchard","when":"The one place in London nobody will look for forty mutineers: under the Crown's own core.","th":"guard","also":["harding","sisters"],"ch":["nixon","nathaniel","alice","cole"],"turn":"","w":256,"ed":"Revised Nov 15: the replacement son","fl":[],"html":"\u003cp>The one place in London nobody will look for forty mutineers: under the Crown's own core. Whimsy first: forty disgraced Lanterns cook sausages on flash-gauntlets set to low among the child-sized shackles, because a man has to eat, and Cole has hung his Wick lamp on the hook where a keeper's lantern hung for four hundred years. Then Nathaniel comes down the thirteen steps with Alice behind him, and the whimsy stops. Nathaniel reads the wall: the names, the tallies, APPLES, MARIAN at the top and MARIAN at the bottom, J.H. in chalk over the door. Nixon, from the bunk where his mother slept, holds out the file: \u003cem>Reserve. Blood suitable.\u003c/em> &quot;He didn't choose me to be his son, Nat. He chose me to walk down the stair so you wouldn't have to.&quot; Nathaniel reads it twice. &quot;And he told me it was me. 'Now it's you.' He raised both of us for it.&quot; &quot;He raised both of us to \u003cem>want\u003c/em> it.&quot; Two boys who spent their lives competing for one man's hand on their shoulder, standing in the cellar where he kept the spares. Alice, from the stair, the first words she has ever said to Nixon: &quot;So he grew two of you to die for him. Are you going to let him finish?&quot; Nixon looks at her a long time. &quot;What do you need?&quot; Nathaniel: &quot;Newgate, then the Works.&quot; Nixon: &quot;You know we're cousins? Cadet line.&quot; &quot;Then you're family. God help you.&quot; Nixon takes the hand he's offered, in front of his mother's name.\u003c/p>"},{"oref":"Scene 4","id":174,"seq":4,"title":"Lambrick House","added":false,"act":"Act One","kind":"scene","sum":"Lambrick: \"If the girl fails, the Crown needs a Harding by midnight, and it has to walk down on its own feet. Your father-in-law would hang first. The boy will walk if he thinks it saves somebody. You'll bring your husband.\" Then, kindly: \"Bring him, and I'll burn the order at Bethlem. Don't, and remember that a widow's nearest relative is her father again.\" Tamara: \"Yes, Father.\" He believes her, because he has never once looked at her. In the study an hour later, she opens the safe one last time and takes the Works master key, and this time the ledger itself, every page: six months of payments to A.F., down to the night of the Charter vote. A.F., Pimlico, 300 gns. Ajax is in the doorway with an apple. This time she holds up a winter's kiss needle, Vykra issue: \"Try it.\" He steps aside, then goes to tell her father.","loc":"Lambrick House","when":"Lambrick: \"If the girl fails, the Crown needs a Harding by midnight, and it has to walk down on its own feet.","th":"lambrick","also":["harding","guard"],"ch":["lambrick","tamara","ajax"],"turn":"","w":153,"ed":"Revised in the Oct 10 pass","fl":[],"html":"\u003cp>Lambrick: &quot;If the girl fails, the Crown needs a Harding by midnight, and it has to walk down on its own feet. Your father-in-law would hang first. The boy will walk if he thinks it saves somebody. You'll bring your husband.&quot; Then, kindly: &quot;Bring him, and I'll burn the order at Bethlem. Don't, and remember that a widow's nearest relative is her father again.&quot; Tamara: &quot;Yes, Father.&quot; He believes her, because he has never once looked at her. In the study an hour later, she opens the safe one last time and takes the Works master key, and this time the ledger itself, every page: six months of payments to A.F., down to the night of the Charter vote. \u003cem>A.F., Pimlico, 300 gns.\u003c/em> Ajax is in the doorway with an apple. This time she holds up a winter's kiss needle, Vykra issue: &quot;Try it.&quot; He steps aside, then goes to tell her father.\u003c/p>"},{"oref":"Scene 5","id":241,"seq":5,"title":"Gin Lane, Old Wren's door, dusk","added":true,"act":"Act One","kind":"scene","sum":"Snow on Gin Lane. On her way to take the Vykra, Alice stops at OLD WREN's door, because there may not be another chance. \"You knew. The first night. You held the mirror under her mouth, and you knew.\" Wren doesn't deny it. \"I knew you couldn't hear it yet. Five weeks you had a sister. I'd give them to you again.\" Alice: \"And the child?\" Wren: \"Still there. Cold holds what it holds. It held her heart still in that river, and it's holding the baby the same way. I didn't know if either would ever start again, so I told you it was gone.\" Alice can't decide whether to thank her or hate her, and there isn't time to decide. Wren touches the arm she set when Alice was nine: \"Nobody stood in front of you then, either. Go on.\" Alice goes.","loc":"Gin Lane","when":"Snow on Gin Lane.","th":"sisters","also":[],"ch":["alice","wren"],"turn":"","w":144,"ed":"Revised Nov 14: the new pilot","fl":[],"html":"\u003cp>Snow on Gin Lane. On her way to take the Vykra, Alice stops at OLD WREN's door, because there may not be another chance. &quot;You knew. The first night. You held the mirror under her mouth, and you knew.&quot; Wren doesn't deny it. &quot;I knew you couldn't hear it yet. Five weeks you had a sister. I'd give them to you again.&quot; Alice: &quot;And the child?&quot; Wren: &quot;Still there. Cold holds what it holds. It held her heart still in that river, and it's holding the baby the same way. I didn't know if either would ever start again, so I told you it was gone.&quot; Alice can't decide whether to thank her or hate her, and there isn't time to decide. Wren touches the arm she set when Alice was nine: &quot;Nobody stood in front of you then, either. Go on.&quot; Alice goes.\u003c/p>"},{"oref":"Scene 6","id":176,"seq":6,"title":"Vykra laundry","added":false,"act":"Act One","kind":"scene","sum":"Grise faces Alice across the counting table. GRISE: I sold your sister because she's worth more than you. Alice calls the challenge. The knife fight runs among wet sheets and moving shadows. At eight she does not stop; on nine she moves. Grise is on the floor with Alice's blade at her throat. GRISE: Your sister passed my test in the river. The Harding boy's mother failed hers and married the man. You never even took it. ALICE: Blackwood. GRISE: Three tickets. My gold. She was leaving, and she meant to take you. So I sent his carriage back with somebody else in it. Alice holds the blade still. ALICE: Xylon. GRISE: She knew the taste. Clever girl. Just late. Grise's admission confirms the order; it does not retcon the poison into a drink at Wapping. Alice spares her because she needs the guild before midnight, not because the admission has settled anything. By Vykra law command is hers. She turns to the twins. ALICE: Which of you wore his face? Jennifer looks at Jennie. JENNIE: Me. ALICE: And you knew where she'd be? Jennifer stops chewing. JENNIFER: I found the driver. Alice looks from one sister to the other. Jennie does not hide behind Grise's order. JENNIE: I could have stopped the carriage. I didn't. There is no forgiveness in the room. Alice needs their knives. She makes them give her their names and parts in the killing in writing, to be delivered into the public record if they survive. Serving tonight is not a pardon. ALICE: No borrowed faces. You'll walk in front of me tonight. Jennie nods. Jennifer takes her hand. The other women pick up their knives. JENNIFER: Where? ALICE: Tyburn.","loc":"Vykra laundry.","when":"Grise faces Alice across the counting table.","th":"vykra","also":["sisters"],"ch":["grise","alice","twins"],"turn":"JENNIFER: Where? ALICE: Tyburn.","w":285,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>Grise faces Alice across the counting table.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>GRISE:\u003c/strong> I sold your sister because she's worth more than you.\u003c/p>\u003c/blockquote>\n\u003cp>Alice calls the challenge. The knife fight runs among wet sheets and moving shadows. At eight she does not stop; on nine she moves. Grise is on the floor with Alice's blade at her throat.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>GRISE:\u003c/strong> Your sister passed my test in the river. The Harding boy's mother failed hers and married the man. You never even took it.\n\u003cstrong>ALICE:\u003c/strong> Blackwood.\n\u003cstrong>GRISE:\u003c/strong> Three tickets. My gold. She was leaving, and she meant to take you. So I sent his carriage back with somebody else in it.\u003c/p>\u003c/blockquote>\n\u003cp>Alice holds the blade still.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>ALICE:\u003c/strong> Xylon.\n\u003cstrong>GRISE:\u003c/strong> She knew the taste. Clever girl. Just late.\u003c/p>\u003c/blockquote>\n\u003cp>Grise's admission confirms the order; it does not retcon the poison into a drink at Wapping. Alice spares her because she needs the guild before midnight, not because the admission has settled anything.\u003c/p>\n\u003cp>By Vykra law command is hers. She turns to the twins.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>ALICE:\u003c/strong> Which of you wore his face?\u003c/p>\u003c/blockquote>\n\u003cp>Jennifer looks at Jennie.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>JENNIE:\u003c/strong> Me.\n\u003cstrong>ALICE:\u003c/strong> And you knew where she'd be?\u003c/p>\u003c/blockquote>\n\u003cp>Jennifer stops chewing.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>JENNIFER:\u003c/strong> I found the driver.\u003c/p>\u003c/blockquote>\n\u003cp>Alice looks from one sister to the other. Jennie does not hide behind Grise's order.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>JENNIE:\u003c/strong> I could have stopped the carriage. I didn't.\u003c/p>\u003c/blockquote>\n\u003cp>There is no forgiveness in the room. Alice needs their knives. She makes them give her their names and parts in the killing in writing, to be delivered into the public record if they survive. Serving tonight is not a pardon.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>ALICE:\u003c/strong> No borrowed faces. You'll walk in front of me tonight.\u003c/p>\u003c/blockquote>\n\u003cp>Jennie nods. Jennifer takes her hand. The other women pick up their knives.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>JENNIFER:\u003c/strong> Where?\n\u003cstrong>ALICE:\u003c/strong> Tyburn.\u003c/p>\u003c/blockquote>"},{"oref":"Scene 7","id":177,"seq":7,"title":"Harding House, the snowlit hall","added":false,"act":"Act One","kind":"scene","sum":"Josephine alone beside Byron's empty chair. She opens a hidden box of Vykra knives she hasn't touched in thirty years and puts them on.","loc":"Harding House","when":"Josephine alone beside Byron's empty chair.","th":"harding","also":["vykra"],"ch":["josephine"],"turn":"","w":24,"ed":"","fl":[],"html":"\u003cp>Josephine alone beside Byron's empty chair. She opens a hidden box of Vykra knives she hasn't touched in thirty years and puts them on.\u003c/p>"},{"oref":"Scene 8","id":178,"seq":8,"title":"Newgate yard, set piece","added":false,"act":"Act Two","kind":"scene","sum":"Nixon's forty come over the walls on leap-boosters, kshhh-THOOM in the snow. Flash-bursts strobe the yard. Nathaniel cuts the cell bars with his gauntlet. Eldgard: \"You came for me.\" \"I came for your ring.\" Two cells down, Nixon quietly opens 1417 as well. Old Marsh shuffles out into the yard, looks up at the snow, and says, perfectly lucid, \"They always count from the first snow.\" Cole persuades a turnkey to unlock the gate with extreme politeness and a lantern rifle.","loc":"Newgate yard","when":"Nixon's forty come over the walls on leap-boosters, kshhh-THOOM in the snow.","th":"guard","also":["harding"],"ch":["nixon","nathaniel","eldgard","marsh","cole"],"turn":"","w":81,"ed":"Revised Oct 14: polish pass","fl":[],"html":"\u003cp>Nixon's forty come over the walls on leap-boosters, \u003cem>kshhh-THOOM\u003c/em> in the snow. Flash-bursts strobe the yard. Nathaniel cuts the cell bars with his gauntlet. Eldgard: &quot;You came for me.&quot; &quot;I came for your ring.&quot; Two cells down, Nixon quietly opens 1417 as well. Old Marsh shuffles out into the yard, looks up at the snow, and says, perfectly lucid, &quot;They always count from the first snow.&quot; Cole persuades a turnkey to unlock the gate with extreme politeness and a lantern rifle.\u003c/p>"},{"oref":"Scene 9","id":179,"seq":9,"title":"Newgate rooftops","added":false,"act":"Act Two","kind":"scene","sum":"Crown guards on the roofs. Eldgard can't leap, so Nixon carries him: the spare carrying the man who bred him. Eldgard: \"Thank you, Captain.\" Nixon: \"Don't.\"","loc":"Newgate rooftops","when":"Crown guards on the roofs.","th":"guard","also":["harding"],"ch":["nixon","eldgard"],"turn":"","w":26,"ed":"","fl":[],"html":"\u003cp>Crown guards on the roofs. Eldgard can't leap, so Nixon carries him: the spare carrying the man who bred him. Eldgard: &quot;Thank you, Captain.&quot; Nixon: &quot;Don't.&quot;\u003c/p>"},{"oref":"Scene 10","id":180,"seq":10,"title":"The Works, the gallery and the core below","added":false,"act":"Act Two","kind":"scene","sum":"Snow thickens over Tyburn. Where it lies deep, wolves start to shape themselves out of the drifts. Vane is nervous. In his breast pocket is the sealed 1689 annex to the Harding Charter, the Crown's own signature on the chain; every Lord Chancellor has kept it locked in his desk, and tonight he took it out. Lambrick: \"Midnight. The girl, or the boy.\" Below them, cracks spread through the Heartglass around the Lost One: every time the glass hums toward the trade, her mother pulls against her own hooks, and another crack runs. Tik. Tik. Morgana, hoarse: \"You were free. Why did you come back?\" The Lost One: \"Because you're my mother.\" Morgana doesn't answer. Another crack runs. Footsteps on Byron's old Guard stair: Josephine is coming down.","loc":"The Works","when":"Snow thickens over Tyburn.","th":"city","also":["lambrick","white","harding"],"ch":["vane","lambrick","lostone","morgana","josephine"],"turn":"","w":128,"ed":"","fl":[],"html":"\u003cp>Snow thickens over Tyburn. Where it lies deep, wolves start to shape themselves out of the drifts. Vane is nervous. In his breast pocket is the sealed 1689 annex to the Harding Charter, the Crown's own signature on the chain; every Lord Chancellor has kept it locked in his desk, and tonight he took it out. Lambrick: &quot;Midnight. The girl, or the boy.&quot; Below them, cracks spread through the Heartglass around the Lost One: every time the glass hums toward the trade, her mother pulls against her own hooks, and another crack runs. \u003cem>Tik. Tik.\u003c/em> Morgana, hoarse: &quot;You were free. Why did you come back?&quot; The Lost One: &quot;Because you're my mother.&quot; Morgana doesn't answer. Another crack runs. Footsteps on Byron's old Guard stair: Josephine is coming down.\u003c/p>"},{"oref":"Scene 11","id":182,"seq":11,"title":"The outfall, outside the Works","added":false,"act":"Act Two","kind":"scene","sum":"The whole young alliance stands together for the first time: Alice's Vykra, Nixon's Lanterns, Tamara with the key, Nathaniel, and Eldgard leaning on a rifle. Whimsy before the storm. Cole asks Tamara if married ladies are allowed to fight. She hands him a knife. Then Tamara's key turns. The Lanterns go over the walls and the Vykra go up the outfall.","loc":"The outfall","when":"The whole young alliance stands together for the first time: Alice's Vykra, Nixon's Lanterns, Tamara with the key, Nathaniel, and Eldgard leaning on a rifle.","th":"harding","also":["guard","lambrick"],"ch":["alice","nixon","tamara","nathaniel","eldgard","cole"],"turn":"","w":61,"ed":"","fl":[],"html":"\u003cp>The whole young alliance stands together for the first time: Alice's Vykra, Nixon's Lanterns, Tamara with the key, Nathaniel, and Eldgard leaning on a rifle. Whimsy before the storm. Cole asks Tamara if married ladies are allowed to fight. She hands him a knife. Then Tamara's key turns. The Lanterns go over the walls and the Vykra go up the outfall.\u003c/p>"},{"oref":"Scene 12","id":184,"seq":12,"title":"The courtyard, set piece","added":false,"act":"Act Two","kind":"scene","sum":"A three-way battle in the snow: Crown troops, mutineers, Lambrick's coal-men. Then the wolves come out of the drifts and attack everyone. Flash-bursts turn the snow green.","loc":"The courtyard","when":"A three-way battle in the snow: Crown troops, mutineers, Lambrick's coal-men.","th":"city","also":["white"],"ch":[],"turn":"","w":27,"ed":"","fl":[],"html":"\u003cp>A three-way battle in the snow: Crown troops, mutineers, Lambrick's coal-men. Then the wolves come out of the drifts and attack everyone. Flash-bursts turn the snow green.\u003c/p>"},{"oref":"Scene 13","id":185,"seq":13,"title":"The courtyard","added":false,"act":"Act Three","kind":"scene","sum":"Ajax and the Black Gauntlet, WHUNK, drive Nathaniel into the ground. Ajax grins down at him, the scar Alice gave him white in the cold: \"You should've pulled me up, Harding.\" The fist goes up for the killing blow, and Eldgard steps under it. His ribs give way. Alice, who told him to pull Ajax up, drives the man off with flash after flash, and he retreats inside. Inside is the core, and her sister, and the clock on the Works tower says twenty to twelve. She has the charge left to chase him. She looks at the door. She looks at Nathaniel on his knees in the snow with his father across his lap. She stays.","loc":"The courtyard","when":"Ajax and the Black Gauntlet, WHUNK, drive Nathaniel into the ground.","th":"guard","also":["harding"],"ch":["ajax","nathaniel","eldgard","alice"],"turn":"","w":117,"ed":"Revised Nov 14: the new pilot","fl":[],"html":"\u003cp>Ajax and the Black Gauntlet, \u003cem>WHUNK\u003c/em>, drive Nathaniel into the ground. Ajax grins down at him, the scar Alice gave him white in the cold: &quot;You should've pulled me up, Harding.&quot; The fist goes up for the killing blow, and Eldgard steps under it. His ribs give way. Alice, who told him to pull Ajax up, drives the man off with flash after flash, and he retreats inside. Inside is the core, and her sister, and the clock on the Works tower says twenty to twelve. She has the charge left to chase him. She looks at the door. She looks at Nathaniel on his knees in the snow with his father across his lap. She stays.\u003c/p>"},{"oref":"Scene 14","id":186,"seq":14,"title":"The Snow Confession, I","added":false,"act":"Act Three","kind":"scene","sum":"Alice kneels at Nathaniel's back with her forehead against his shoulder blade, out of the conversation, spending minutes her sister doesn't have. Nathaniel holds his father in the snow, and asks the question from the dressing room again, because this time there's no wedding to get through. \"Did you hold his hand?\" Eldgard: \"I held his hand.\" A breath. \"Over the lock. The boy's round went through his shoulder. He would have lived. I held his hand on the iron until the crack he'd cut closed over.\" Nathaniel doesn't let go of him. That's the cruelty of the scene: he can't. \"It took all of him to mend it. I spent your brother on a crack in a lock.\" Nathaniel: \"And then you filled his coffin with slag. I opened it.\" \"The chain leaves nothing to bury. It left nothing of Otty. The Captain carried it for me.\" Nathaniel: \"She says he's cold. Not dead.\" On his father's other side, Nixon remembers the weight on the steps of St Bride's. \"Don't go looking for him, Nathaniel. That's how she gets a Harding to the lock. Hoping.\"","loc":"The Snow Confession","when":"Alice kneels at Nathaniel's back with her forehead against his shoulder blade, out of the conversation, spending minutes her sister doesn't have.","th":"harding","also":["investigation"],"ch":["nathaniel","eldgard","otty","alice"],"turn":"","w":186,"ed":"Revised Nov 15: Nixon","fl":[],"html":"\u003cp>Alice kneels at Nathaniel's back with her forehead against his shoulder blade, out of the conversation, spending minutes her sister doesn't have. Nathaniel holds his father in the snow, and asks the question from the dressing room again, because this time there's no wedding to get through. &quot;Did you hold his hand?&quot; Eldgard: &quot;I held his hand.&quot; A breath. &quot;Over the lock. The boy's round went through his shoulder. He would have lived. I held his hand on the iron until the crack he'd cut closed over.&quot; Nathaniel doesn't let go of him. That's the cruelty of the scene: he can't. &quot;It took all of him to mend it. I spent your brother on a crack in a lock.&quot; Nathaniel: &quot;And then you filled his coffin with slag. I opened it.&quot; &quot;The chain leaves nothing to bury. It left nothing of Otty. The Captain carried it for me.&quot; Nathaniel: &quot;She says he's cold. Not dead.&quot; On his father's other side, Nixon remembers the weight on the steps of St Bride's. &quot;Don't go looking for him, Nathaniel. That's how she gets a Harding to the lock. Hoping.&quot;\u003c/p>"},{"oref":"Scene 15","id":187,"seq":15,"title":"The Snow Confession, II","added":false,"act":"Act Three","kind":"scene","sum":"Eldgard: \"When you were five—\" Nathaniel: \"I know. She told me I'd been down the stairs. I remembered the lantern on my own.\" Eldgard almost laughs, blood in it: \"Then she was kinder than I was.\" He turns his head to Nixon, kneeling at his other side. \"Cadet line. My spare. I took you from the Orchard at six. Your mother asked after you every day for four years, and I told her you were learning your letters.\" Nixon: \"I was.\" \"I know. I checked.\" He means it as love. \"The Orchard's children stopped walking in 'thirty-nine, so I raised one outside it. A Hargrave with a name and a rank and a family to love, who would walk down that stair for my son one night without being asked. I couldn't order it. An order would have spoiled you. I gave you my right hand at Jamie's grave and my keys and my stair, so you'd love this house enough to go down it. I let you lock him in on Lantern Night so you'd see what he was for.\" Then, to his son: \"And I let you watch me do it, so you'd hate him for it, and never ask why.\" It's the worst thing he says all night. \"Forgive me, or don't.\" Nixon learns in one breath that every kindness since the funeral was feed, that the boy's shot didn't kill Jamie, and what he himself was raised for, and does neither. \"Jamie found your mother's bunk, Captain. He chalked his initials over that door so the next one down would know somebody had seen it. Then he came up and asked me how many. I told him the truth, once. That was the night he stopped being my son and started being his own.\" To Nathaniel: \"There was always a way out. Free her, and pay in light. Alistair chose sons. My father chose my sister Otty. She was nineteen. She walked down the stair singing, and Byron held her ribbon. I was eight. They told me Switzerland, and they cut it in brass. And the Crown knew. Every Lord Chancellor since 1689 has signed the annex and locked it in his desk. Vane signed it in my study and asked me to spare him the details.\" The thing he's never said: \"I could have gone down that stair myself. I raised a boy for it instead.\" He presses the wolf-crest ring into Nathaniel's palm. \"Don't be me. The lock opens with what closed it: Harding blood, this ring, and a blade that's already in it.\" Nathaniel's other hand goes behind him without looking, and finds Alice's. He dies. Snow settles on his open eyes and doesn't melt.","loc":"The Snow Confession","when":"Eldgard: \"When you were five—\" Nathaniel: \"I know.","th":"harding","also":["guard","white"],"ch":["eldgard","nixon","nathaniel","jamie","alistair","alice"],"turn":"","w":452,"ed":"Revised Nov 15: the replacement son","fl":[],"html":"\u003cp>Eldgard: &quot;When you were five—&quot; Nathaniel: &quot;I know. She told me I'd been down the stairs. I remembered the lantern on my own.&quot; Eldgard almost laughs, blood in it: &quot;Then she was kinder than I was.&quot; He turns his head to Nixon, kneeling at his other side. &quot;Cadet line. My spare. I took you from the Orchard at six. Your mother asked after you every day for four years, and I told her you were learning your letters.&quot; Nixon: &quot;I was.&quot; &quot;I know. I checked.&quot; He means it as love. &quot;The Orchard's children stopped walking in 'thirty-nine, so I raised one outside it. A Hargrave with a name and a rank and a family to love, who would walk down that stair for my son one night without being asked. I couldn't order it. An order would have spoiled you. I gave you my right hand at Jamie's grave and my keys and my stair, so you'd love this house enough to go down it. I let you lock him in on Lantern Night so you'd see what he was for.&quot; Then, to his son: &quot;And I let you watch me do it, so you'd hate him for it, and never ask why.&quot; It's the worst thing he says all night. &quot;Forgive me, or don't.&quot; Nixon learns in one breath that every kindness since the funeral was feed, that the boy's shot didn't kill Jamie, and what he himself was raised for, and does neither. &quot;Jamie found your mother's bunk, Captain. He chalked his initials over that door so the next one down would know somebody had seen it. Then he came up and asked me how many. I told him the truth, once. That was the night he stopped being my son and started being his own.&quot; To Nathaniel: &quot;There was always a way out. Free her, and pay in light. Alistair chose sons. My father chose my sister Otty. She was nineteen. She walked down the stair singing, and Byron held her ribbon. I was eight. They told me Switzerland, and they cut it in brass. And the Crown knew. Every Lord Chancellor since 1689 has signed the annex and locked it in his desk. Vane signed it in my study and asked me to spare him the details.&quot; The thing he's never said: &quot;I could have gone down that stair myself. I raised a boy for it instead.&quot; He presses the wolf-crest ring into Nathaniel's palm. &quot;Don't be me. The lock opens with what closed it: Harding blood, this ring, and a blade that's already in it.&quot; Nathaniel's other hand goes behind him without looking, and finds Alice's. He dies. Snow settles on his open eyes and doesn't melt.\u003c/p>"},{"oref":"Scene 16","id":189,"seq":16,"title":"The courtyard, then the core stair","added":false,"act":"Act Three","kind":"scene","sum":"Nathaniel stands. He doesn't put the ring on. He pockets it. From the same pocket he takes Jamie's key on its black ribbon, the one that opens Byron's old Guard stair. Alice is at his side, and Nixon is at the other. They go in. On the core stair, Tamara and Nixon hold it against Crown troops so the others can get down. Under fire, she says: \"If we die, I want it on record I was married for twelve hours.\" Nixon: \"Noted.\" Flash. Flash.","loc":"The courtyard","when":"Nathaniel stands.","th":"harding","also":["guard","city"],"ch":["nathaniel","alice","nixon","tamara"],"turn":"","w":85,"ed":"","fl":[],"html":"\u003cp>Nathaniel stands. He doesn't put the ring on. He pockets it. From the same pocket he takes Jamie's key on its black ribbon, the one that opens Byron's old Guard stair. Alice is at his side, and Nixon is at the other. They go in. On the core stair, Tamara and Nixon hold it against Crown troops so the others can get down. Under fire, she says: &quot;If we die, I want it on record I was married for twelve hours.&quot; Nixon: &quot;Noted.&quot; Flash. Flash.\u003c/p>"},{"oref":"Scene 17","id":191,"seq":17,"title":"The core floor","added":false,"act":"Act Three","kind":"scene","sum":"Nathaniel and Alice reach the bottom. The Lost One is screaming inside the cracking Heartglass, Morgana is straining at her hooks, Lambrick and Vane are on the gallery, and Josephine is at the lever.","loc":"The core floor","when":"Nathaniel and Alice reach the bottom.","th":"white","also":["city"],"ch":["nathaniel","alice","lostone","morgana","lambrick","vane","josephine"],"turn":"","w":34,"ed":"","fl":[],"html":"\u003cp>Nathaniel and Alice reach the bottom. The Lost One is screaming inside the cracking Heartglass, Morgana is straining at her hooks, Lambrick and Vane are on the gallery, and Josephine is at the lever.\u003c/p>"},{"oref":"Scene 18","id":192,"seq":18,"title":"The core","added":false,"act":"Tag","kind":"scene","sum":"Nathaniel: \"Mother. Step away.\" Alice: \"That's my sister.\" Josephine, gently, to neither of them: \"Your father said her mother would never allow it.\" Nathaniel: \"Then don't.\" \"Four hundred years in hooks, Nathaniel. Nobody refuses the door.\" It's the choice she made at breakfast in Episode 7, between her son and everything else, made one last time with her hand on iron. If the girl holds, no Harding dies tonight, and Josephine can live with what it cost. She pulls the lever. Cut to black.","loc":"The core","when":"Nathaniel: \"Mother.","th":"harding","also":["white"],"ch":["nathaniel","alice","josephine"],"turn":"","w":84,"ed":"","fl":[],"html":"\u003cp>Nathaniel: &quot;Mother. Step away.&quot; Alice: &quot;That's my sister.&quot; Josephine, gently, to neither of them: &quot;Your father said her mother would never allow it.&quot; Nathaniel: &quot;Then don't.&quot; &quot;Four hundred years in hooks, Nathaniel. Nobody refuses the door.&quot; It's the choice she made at breakfast in Episode 7, between her son and everything else, made one last time with her hand on iron. If the girl holds, no Harding dies tonight, and Josephine can live with what it cost. She pulls the lever. Cut to black.\u003c/p>"}]},{"n":10,"title":"The Tithe","time":"THE LAST NIGHT","clock":"THE LAST NIGHT","act":"III","log":"The Heartglass cracks, the Crown comes for the last Harding son, and Nixon offers himself instead. Nathaniel does what no Harding has done in four hundred years. He opens the lock, and London pays in light.","sum":"The Record: every climax under Nathaniel's voice, a heartbeat, then Jamie, kept in the White. DAY ONE","turn":"Nathaniel frees Morgana. Josephine goes into the White. The Lost One stays. At dawn, he says Alice's name","focus":"the choice Alistair refused.","piece":"London goes dark for good, and the White comes through.","threads":["white","harding","guard","city","lambrick"],"frame":"\u003cp>\u003cstrong>THE LAST NIGHT.\u003c/strong> Midnight to dawn, two weeks before the longest one. \u003cstrong>Focus:\u003c/strong> the choice Alistair refused. \u003cstrong>Set piece:\u003c/strong> London goes dark for good, and the White comes through. \u003cstrong>Double twist:\u003c/strong> Nathaniel refuses every sacrifice offered to him, Morgana still demands a Harding, and Josephine goes in his place. \u003cstrong>Final image:\u003c/strong> &quot;The Record,&quot; a montage of the season's climaxes under Nathaniel's voice, ending on a heartbeat, then a hard cut to Jamie, kept in the White.\u003c/p>","scenes":[{"oref":"Scene 1","id":193,"seq":1,"title":"The core, 1489, an hour before the pilot's cold open","added":false,"act":"Cold open","kind":"scene","sum":"Alistair at the chain, his net still wet with frost; the child is in it. Morgana, fresh in her hooks, makes him an offer: \"Free me, and pay in light. Keep me, and pay in sons.\" Then the part no Harding ever wrote down: \"Either way, my child goes free tonight.\" He slides the wolf-crest ring onto his finger. \"Sons.\" He cuts the net. In the doorway behind him, his firstborn, Edric, nine years old, the boy with the lantern from the pilot, holds it up for his father, then carries it down the stair ahead of him, alone. At dawn, on the gallows field, Alistair holds the first lantern up before the King's men: \"Light from Tyburn iron, by my own art.\" The lie the house is built on. The same choice Nathaniel faces tonight.","loc":"The core","when":"Alistair at the chain, his net still wet with frost; the child is in it.","th":"white","also":["harding"],"ch":["alistair","morgana"],"turn":"","w":136,"ed":"Revised Nov 14: the new pilot","fl":[],"html":"\u003cp>Alistair at the chain, his net still wet with frost; the child is in it. Morgana, fresh in her hooks, makes him an offer: &quot;Free me, and pay in light. Keep me, and pay in sons.&quot; Then the part no Harding ever wrote down: &quot;Either way, my child goes free tonight.&quot; He slides the wolf-crest ring onto his finger. &quot;Sons.&quot; He cuts the net. In the doorway behind him, his firstborn, Edric, nine years old, the boy with the lantern from the pilot, holds it up for his father, then carries it down the stair ahead of him, alone. At dawn, on the gallows field, Alistair holds the first lantern up before the King's men: &quot;Light from Tyburn iron, by my own art.&quot; The lie the house is built on. The same choice Nathaniel faces tonight.\u003c/p>"},{"oref":"Scene 2","id":194,"seq":2,"title":"The core, ten minutes to midnight","added":false,"act":"Act One","kind":"scene","sum":"The lever drops. The Heartglass floods the Lost One with green fire, and she screams, and the door swings open for her mother: the hooks loosen, and for the first time in four hundred years Morgana could step out. She doesn't. She takes the chain in both hands and drags herself back onto the iron, hooks tearing deeper, pulling against the trade until the glass around her daughter cracks from her side. Krrrrk. \"Not her.\" The chain shudders and doesn't take. At the lever, Josephine watches a mother refuse the door and hears her husband in Newgate: You would. Lambrick, from the gallery: \"Then the boy. He'll walk if it saves somebody. Take the girl he came for.\" Vane's marshals start down the stairs, for Alice.","loc":"The core","when":"The lever drops.","th":"harding","also":["white"],"ch":["lostone","lambrick","vane","josephine","morgana"],"turn":"","w":126,"ed":"Revised in the Oct 10 pass","fl":[],"html":"\u003cp>The lever drops. The Heartglass floods the Lost One with green fire, and she screams, and the door swings open for her mother: the hooks loosen, and for the first time in four hundred years Morgana could step out. She doesn't. She takes the chain in both hands and drags herself back onto the iron, hooks tearing deeper, pulling against the trade until the glass around her daughter cracks from her side. \u003cem>Krrrrk.\u003c/em> &quot;Not her.&quot; The chain shudders and doesn't take. At the lever, Josephine watches a mother refuse the door and hears her husband in Newgate: \u003cem>You would.\u003c/em> Lambrick, from the gallery: &quot;Then the boy. He'll walk if it saves somebody. Take the girl he came for.&quot; Vane's marshals start down the stairs, for Alice.\u003c/p>"},{"oref":"Scene 3","id":195,"seq":3,"title":"The core floor","added":false,"act":"Act One","kind":"scene","sum":"Alice smashes the Heartglass with her gauntlet, KSSHHH, and drags the Lost One out, half turned to crystal. Josephine draws her knives to put the girl back in the cracked glass, because the marshals are already on the stairs to make her son walk, and a broken cage is still a cage until midnight. She fights like a woman who has just been shown she's wrong, and they fight, Vykra against Vykra, the mother against the girl she paid to love her son. Josephine is better. Nathaniel steps between them: \"Mother.\"","loc":"The core floor","when":"Alice smashes the Heartglass with her gauntlet, KSSHHH, and drags the Lost One out, half turned to crystal.","th":"harding","also":["sisters","guard"],"ch":["alice","lostone","josephine","nathaniel","nixon","tamara","cole"],"turn":"","w":91,"ed":"Revised in the Oct 10 pass","fl":[],"html":"\u003cp>Alice smashes the Heartglass with her gauntlet, \u003cem>KSSHHH\u003c/em>, and drags the Lost One out, half turned to crystal. Josephine draws her knives to put the girl back in the cracked glass, because the marshals are already on the stairs to make her son walk, and a broken cage is still a cage until midnight. She fights like a woman who has just been shown she's wrong, and they fight, Vykra against Vykra, the mother against the girl she paid to love her son. Josephine is better. Nathaniel steps between them: &quot;Mother.&quot;\u003c/p>"},{"oref":"Scene 4","id":249,"seq":4,"title":"The core floor","added":false,"act":"Act One","kind":"scene","sum":"Nixon comes down the stair bleeding, with Tamara behind him. \"I'm Harding blood. Take me. They grew me for this the way they grew my mother. Let me be something on purpose.\" He knows he's doing exactly what Eldgard grew him to do, and he does it with his eyes open. Cole: \"Sir, no.\" Lambrick, from the gallery: \"Harding blood is Harding blood. Let him.\" The marshals turn for the captain.","loc":"The core floor","when":"Nixon comes down the stair bleeding, with Tamara behind him.","th":"guard","also":["harding"],"ch":["nixon","tamara","cole","lambrick","nathaniel"],"turn":"","w":71,"ed":"Revised in the Oct 10 pass","fl":[],"html":"\u003cp>Nixon comes down the stair bleeding, with Tamara behind him. &quot;I'm Harding blood. Take me. They grew me for this the way they grew my mother. Let me be something on purpose.&quot; He knows he's doing exactly what Eldgard grew him to do, and he does it with his eyes open. Cole: &quot;Sir, no.&quot; Lambrick, from the gallery: &quot;Harding blood is Harding blood. Let him.&quot; The marshals turn for the captain.\u003c/p>"},{"oref":"Scene 5","id":197,"seq":5,"title":"The lock","added":false,"act":"Act One","kind":"scene","sum":"Nathaniel: \"No one goes in the chain again.\" Jamie's glass blade is still in the lock where he left it on the first night, frozen into the iron by the cold that has leaked out of it for four hundred years. Nathaniel pulls, and it doesn't move. Krrk. His hands slip on it. Alice is beside him before he asks, and the gauntlet he built for her in the glasshouse, strap by strap, is already whining up to overload, eeeeeeee, the way he told her never to run it. He knows what she's about to do. \"If this works, every light in London goes out. They'll hate me for a hundred years.\" \"Us,\" she says, and puts the gauntlet's core against the iron. The heat comes back through the plate into her palm and she holds it there, the smell of her own glove burning, until the ice round the blade lets go. He pulls it free, cuts his palm on it, and presses his blood and his father's wolf ring into the iron, knowing what his father told him on Lantern Night it costs: when the chain breaks, one of the house goes with her. His father's warning is in his ear: hoping. He can't swear his brother isn't part of why his hand is steady. Harding blood closed it, and Harding blood opens it, but it took an undercity girl's burned hand to get the blade out. Somewhere above, a church bell strikes twelve.","loc":"The lock","when":"Nathaniel: \"No one goes in the chain again.\" Jamie's glass blade is still in the lock where he left it on the first night, frozen into the iron by the cold that has leaked out of it for four hundred years.","th":"white","also":["harding"],"ch":["nathaniel","alice"],"turn":"","w":246,"ed":"Revised Oct 13: four rules, new Ep 8","fl":[],"html":"\u003cp>Nathaniel: &quot;No one goes in the chain again.&quot; Jamie's glass blade is still in the lock where he left it on the first night, frozen into the iron by the cold that has leaked out of it for four hundred years. Nathaniel pulls, and it doesn't move. \u003cem>Krrk.\u003c/em> His hands slip on it. Alice is beside him before he asks, and the gauntlet he built for her in the glasshouse, strap by strap, is already whining up to overload, \u003cem>eeeeeeee\u003c/em>, the way he told her never to run it. He knows what she's about to do. &quot;If this works, every light in London goes out. They'll hate me for a hundred years.&quot; &quot;Us,&quot; she says, and puts the gauntlet's core against the iron. The heat comes back through the plate into her palm and she holds it there, the smell of her own glove burning, until the ice round the blade lets go. He pulls it free, cuts his palm on it, and presses his blood and his father's wolf ring into the iron, knowing what his father told him on Lantern Night it costs: when the chain breaks, one of the house goes with her. His father's warning is in his ear: \u003cem>hoping\u003c/em>. He can't swear his brother isn't part of why his hand is steady. Harding blood closed it, and Harding blood opens it, but it took an undercity girl's burned hand to get the blade out. Somewhere above, a church bell strikes twelve.\u003c/p>"},{"oref":"Scene 6","id":198,"seq":6,"title":"London","added":false,"act":"Act One","kind":"scene","sum":"The chain falls. The last time London went dark, the light came back within the hour. This time the green dies street by street, the same wave as the pilot, and nothing comes back. One wordless shot after another: a tram dying in the snow, a hospital ward going black, a mother on Gin Lane lighting a tallow candle with shaking hands. Under the Works, Nathaniel listens, and for the first time since he was five, nothing is crying in the walls.","loc":"London","when":"The chain falls.","th":"city","also":["white"],"ch":[],"turn":"","w":82,"ed":"Revised Oct 14: polish pass","fl":[],"html":"\u003cp>The chain falls. The last time London went dark, the light came back within the hour. This time the green dies street by street, the same wave as the pilot, and nothing comes back. One wordless shot after another: a tram dying in the snow, a hospital ward going black, a mother on Gin Lane lighting a tallow candle with shaking hands. Under the Works, Nathaniel listens, and for the first time since he was five, nothing is crying in the walls.\u003c/p>"},{"oref":"Scene 7","id":199,"seq":7,"title":"The core","added":false,"act":"Act Two","kind":"scene","sum":"Morgana rises out of the pit as her wounds close, nine feet tall. She looks down at Nathaniel and says his name, the way she sang it to a five-year-old on the stair: \"Nathaniel.\" Then: \"A Harding opened it.\" She doesn't thank him. The White pours through behind her, with wind, snow and wolves, and she goes up through the Works roof toward Tyburn hill. Where the chain was anchored, the core floor splits, and the White comes up through the crack in a wall of wind: Alice and the half-crystal girl on the outfall side, Nathaniel and his mother on the other. Alice can't see across it. The girl in her arms is going colder by the minute, the outfall is the only way open, and the only fire Alice can count on tonight is on Gin Lane, where the Vykra are holding. She takes it.","loc":"The core","when":"Morgana rises out of the pit as her wounds close, nine feet tall.","th":"white","also":["city"],"ch":["morgana","nathaniel"],"turn":"","w":147,"ed":"Revised Oct 14: polish pass","fl":[],"html":"\u003cp>Morgana rises out of the pit as her wounds close, nine feet tall. She looks down at Nathaniel and says his name, the way she sang it to a five-year-old on the stair: &quot;Nathaniel.&quot; Then: &quot;A Harding opened it.&quot; She doesn't thank him. The White pours through behind her, with wind, snow and wolves, and she goes up through the Works roof toward Tyburn hill. Where the chain was anchored, the core floor splits, and the White comes up through the crack in a wall of wind: Alice and the half-crystal girl on the outfall side, Nathaniel and his mother on the other. Alice can't see across it. The girl in her arms is going colder by the minute, the outfall is the only way open, and the only fire Alice can count on tonight is on Gin Lane, where the Vykra are holding. She takes it.\u003c/p>"},{"oref":"Scene 8","id":201,"seq":8,"title":"The core stair","added":false,"act":"Act Two","kind":"scene","sum":"Nixon against Ajax: quench-blade against Black Gauntlet. Nixon takes the quick-takedown: blade into the gauntlet's crystal, which freezes the piston, then into Ajax. He dies frozen mid-laugh, his apple rolling down the stairs. With Ajax dead, the Guard stair is clear: the one way out of the Works the wolves haven't found. Nixon whistles down it the third signal they made up at nine, the one they never once needed: come on.","loc":"The core stair","when":"Nixon against Ajax: quench-blade against Black Gauntlet.","th":"guard","also":[],"ch":["nixon","ajax"],"turn":"","w":72,"ed":"","fl":[],"html":"\u003cp>Nixon against Ajax: quench-blade against Black Gauntlet. Nixon takes the quick-takedown: blade into the gauntlet's crystal, which freezes the piston, then into Ajax. He dies frozen mid-laugh, his apple rolling down the stairs. With Ajax dead, the Guard stair is clear: the one way out of the Works the wolves haven't found. Nixon whistles down it the third signal they made up at nine, the one they never once needed: \u003cem>come on\u003c/em>.\u003c/p>"},{"oref":"Scene 9","id":202,"seq":9,"title":"London, the night the snow came early","added":false,"act":"Act Two","kind":"scene","sum":"Nixon's forty and every loyal Lantern form flash-lines across the bridges to keep the wolves off the tenements. Before Cole takes the Tyburn Road barricade, Nixon tells him the thing he has carried since the Snow Confession: \"It wasn't you, Wick. He'd have lived. The old man finished it.\" Cole stares at him, then: \"Did I do good, sir?\" \"You did good.\" The Vykra hold Gin Lane with knives and candles. Alice holds the lane with the Lost One wrapped in coats in a doorway behind her, as close to the coal as Alice can get her, and between wolves she grabs Jennie, the twin who wore Jamie's face and delivered the Xylon kiss and has walked in front of her all night. \"Go to the Works. Find out if he's alive. Don't tell him I asked.\" The girl goes. Alice is three steps after her before she knows she's moving; behind her a child starts to scream, aaaAAH, and she turns back to her knife. Every time a flash lights the sky over Tyburn, she looks. Tamara throws open every Lambrick coal depot free to the city, and there are fires in every street. On Gin Lane the Vykra hold the wolves at a ring of Lambrick coal; without it, the lane would have frozen before the wolves ever reached it. Whimsy in the dark: Cole teaches a crowd of children to make flash-shadow rabbits on the walls.","loc":"London","when":"Nixon's forty and every loyal Lantern form flash-lines across the bridges to keep the wolves off the tenements.","th":"city","also":["guard"],"ch":["nixon","tamara","cole","nathaniel","twins"],"turn":"Nixon's forty and every loyal Lantern form flash-lines across the bridges to keep the wolves off the tenements. Before Cole takes the Tyburn Road barricade, Nixon tells him the thing he has carried since the Snow Confess","w":239,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>Nixon's forty and every loyal Lantern form flash-lines across the bridges to keep the wolves off the tenements. Before Cole takes the Tyburn Road barricade, Nixon tells him the thing he has carried since the Snow Confession: &quot;It wasn't you, Wick. He'd have lived. The old man finished it.&quot; Cole stares at him, then: &quot;Did I do good, sir?&quot; &quot;You did good.&quot; The Vykra hold Gin Lane with knives and candles. Alice holds the lane with the Lost One wrapped in coats in a doorway behind her, as close to the coal as Alice can get her, and between wolves she grabs Jennie, the twin who wore Jamie's face and delivered the Xylon kiss and has walked in front of her all night. &quot;Go to the Works. Find out if he's alive. Don't tell him I asked.&quot; The girl goes. Alice is three steps after her before she knows she's moving; behind her a child starts to scream, \u003cem>aaaAAH\u003c/em>, and she turns back to her knife. Every time a flash lights the sky over Tyburn, she looks. Tamara throws open every Lambrick coal depot free to the city, and there are fires in every street. On Gin Lane the Vykra hold the wolves at a ring of Lambrick coal; without it, the lane would have frozen before the wolves ever reached it. Whimsy in the dark: Cole teaches a crowd of children to make flash-shadow rabbits on the walls.\u003c/p>"},{"oref":"Scene 10","id":203,"seq":10,"title":"The Tyburn Road barricade","added":false,"act":"Act Two","kind":"scene","sum":"The charges run out along Cole's line, a barricade of overturned trams across Tyburn Road, the last thing between Gin Lane's fires and the hill. He holds it with his last cartridge, two fingers short and seventeen years old, until it's empty. Behind his line, a girl in a Vykra glove comes up the road with another girl in her arms, half crystal, heading for Tyburn, because an hour before dawn the girl woke by the fire and asked for her mother. He knows her: the ghostlight girl from the market, who fought beside him at the Works gate. He doesn't know why she's carrying the Frost Witch toward the hill, and he doesn't ask. He holds the road until she's past it. Nixon finds him in the last dark before dawn, sitting up against an overturned tram as if he were resting, his diary open in his lap. Under the burned log page, two last lines in pencil: Capt. says it wasn't me. And under that: Held the road. Nobody past who shouldn't be.","loc":"Tyburn Road","when":"The charges run out along Cole's line, a barricade of overturned trams across Tyburn Road, the last thing between Gin Lane's fires and the hill.","th":"guard","also":["city"],"ch":["cole","nixon"],"turn":"","w":175,"ed":"Revised Nov 15: Nixon","fl":[],"html":"\u003cp>The charges run out along Cole's line, a barricade of overturned trams across Tyburn Road, the last thing between Gin Lane's fires and the hill. He holds it with his last cartridge, two fingers short and seventeen years old, until it's empty. Behind his line, a girl in a Vykra glove comes up the road with another girl in her arms, half crystal, heading for Tyburn, because an hour before dawn the girl woke by the fire and asked for her mother. He knows her: the ghostlight girl from the market, who fought beside him at the Works gate. He doesn't know why she's carrying the Frost Witch toward the hill, and he doesn't ask. He holds the road until she's past it. Nixon finds him in the last dark before dawn, sitting up against an overturned tram as if he were resting, his diary open in his lap. Under the burned log page, two last lines in pencil: \u003cem>Capt. says it wasn't me.\u003c/em> And under that: \u003cem>Held the road. Nobody past who shouldn't be.\u003c/em>\u003c/p>"},{"oref":"Scene 11","id":204,"seq":11,"title":"The core, empty","added":false,"act":"Act Two","kind":"scene","sum":"Nathaniel and Josephine alone, the hooks hanging empty. \"I'd do it all again.\" \"I know. That's why I can't be you.\" At the foot of the stair she stops. \"I paid for that girl.\" \"You paid for a week, Mother. You couldn't afford the rest.\" Josephine almost smiles. It's the first thing about her son she has ever failed to buy. Boots on the stair: Jennie, bleeding from the scalp. \"Gin Lane's holding. Just. She said not to tell you she asked.\" Nathaniel is at the stair before she has finished. And Josephine, who has controlled every door in his life, says: \"Go to her.\" It's so unlike her that he stops with his hand on the rail and looks at her, really looks, and sees a woman who has already decided something. \"Not until you tell me where you're going.\" She won't. So he stays, and doesn't go to the girl he loves, because he's watching his mother the way she taught him to watch everyone. He's still watching when she starts up the hill, by the Guard stair Nixon cleared.","loc":"The core","when":"Nathaniel and Josephine alone, the hooks hanging empty.","th":"harding","also":[],"ch":["nathaniel","josephine","jamie","alice","twins"],"turn":"","w":182,"ed":"Revised Nov 14: the twins","fl":[],"html":"\u003cp>Nathaniel and Josephine alone, the hooks hanging empty. &quot;I'd do it all again.&quot; &quot;I know. That's why I can't be you.&quot; At the foot of the stair she stops. &quot;I paid for that girl.&quot; &quot;You paid for a week, Mother. You couldn't afford the rest.&quot; Josephine almost smiles. It's the first thing about her son she has ever failed to buy. Boots on the stair: Jennie, bleeding from the scalp. &quot;Gin Lane's holding. Just. She said not to tell you she asked.&quot; Nathaniel is at the stair before she has finished. And Josephine, who has controlled every door in his life, says: &quot;Go to her.&quot; It's so unlike her that he stops with his hand on the rail and looks at her, really looks, and sees a woman who has already decided something. &quot;Not until you tell me where you're going.&quot; She won't. So he stays, and doesn't go to the girl he loves, because he's watching his mother the way she taught him to watch everyone. He's still watching when she starts up the hill, by the Guard stair Nixon cleared.\u003c/p>"},{"oref":"Scene 12","id":205,"seq":12,"title":"Tyburn hill, set piece","added":false,"act":"Act Three","kind":"scene","sum":"Morgana stands over London in the storm, with wolves in a ring around her. Four hundred years of grievance. Josephine climbs, and Nathaniel climbs after her. Up Tyburn Road, past the barricade a seventeen-year-old held to his last cartridge, Alice comes up the hill carrying the Lost One. Across the snow they see each other for the first time since the lock, alive, and there's no time for any of it.","loc":"Tyburn hill","when":"Morgana stands over London in the storm, with wolves in a ring around her.","th":"white","also":["harding"],"ch":["morgana","nathaniel","alice","lostone","josephine"],"turn":"","w":71,"ed":"Revised Oct 14: polish pass","fl":[],"html":"\u003cp>Morgana stands over London in the storm, with wolves in a ring around her. Four hundred years of grievance. Josephine climbs, and Nathaniel climbs after her. Up Tyburn Road, past the barricade a seventeen-year-old held to his last cartridge, Alice comes up the hill carrying the Lost One. Across the snow they see each other for the first time since the lock, alive, and there's no time for any of it.\u003c/p>"},{"oref":"Scene 13","id":206,"seq":13,"title":"Tyburn hill","added":false,"act":"Act Three","kind":"scene","sum":"The Lost One sets herself down in front of Alice, between her mother and the city, the place Alice had needed Miriam to stand when they were children. Alice sees it, and her breath goes. The Lost One sings the hymn back to her mother in the old tongue, the way it was before it had words. The wolves stop circling. \"They let you go. Let them go.\" Morgana: \"They bled me for four hundred years.\" \"One of them let you go.\"","loc":"Tyburn hill.","when":"The Lost One sets herself down in front of Alice, between her mother and the city, the place Alice had needed Miriam to stand when they were children.","th":"white","also":["sisters"],"ch":["lostone","alice","morgana"],"turn":"The Lost One sets herself down in front of Alice, between her mother and the city, the place Alice had needed Miriam to stand when they were children. Alice sees it, and her breath goes. The Lost One sings the hymn back ","w":82,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>The Lost One sets herself down in front of Alice, between her mother and the city, the place Alice had needed Miriam to stand when they were children. Alice sees it, and her breath goes. The Lost One sings the hymn back to her mother in the old tongue, the way it was before it had words. The wolves stop circling. &quot;They let you go. Let them go.&quot; Morgana: &quot;They bled me for four hundred years.&quot; &quot;One of them let you go.&quot;\u003c/p>"},{"oref":"Scene 14","id":243,"seq":14,"title":"The Works vault, intercut with Tyburn hill","added":false,"act":"Act Three","kind":"scene","sum":"The last hour before dawn. Lambrick has been filling satchels with the last gallowglass all night. Cut off from the chain, it dies slowly: every crystal in the vault is a shade dimmer than it was at midnight, and he's packing them as if he can outrun the dawn. Tamara finds him and offers her hand: \"Come out, Father.\" He holds up a satchel to her, almost pleading, and in his hands the glow is going out while they talk: \"This is for you. All of it. It was always for you.\" \"Then leave it.\" He looks at the crystals. He looks at her. He can't put them down; he never could. She walks out. Behind her the wolves come into the vault. Cut back to the hill, where a mother is being asked the same question.","loc":"The Works vault","when":"The last hour before dawn.","th":"lambrick","also":["white"],"ch":["tamara","lambrick"],"turn":"","w":137,"ed":"Revised Oct 14: polish pass","fl":[],"html":"\u003cp>The last hour before dawn. Lambrick has been filling satchels with the last gallowglass all night. Cut off from the chain, it dies slowly: every crystal in the vault is a shade dimmer than it was at midnight, and he's packing them as if he can outrun the dawn. Tamara finds him and offers her hand: &quot;Come out, Father.&quot; He holds up a satchel to her, almost pleading, and in his hands the glow is going out while they talk: &quot;This is for you. All of it. It was always for you.&quot; &quot;Then leave it.&quot; He looks at the crystals. He looks at her. He can't put them down; he never could. She walks out. Behind her the wolves come into the vault. Cut back to the hill, where a mother is being asked the same question.\u003c/p>"},{"oref":"Scene 15","id":250,"seq":15,"title":"Tyburn hill","added":false,"act":"Act Three","kind":"scene","sum":"Morgana: \"Then come home, little frost.\" The Lost One looks at Alice. Alice, who has spent the season holding on, lets go: \"Go, if you want to. I'll be all right.\" She means it. She has done this once before, with a nod, at an altar.","loc":"Tyburn hill","when":"Morgana: \"Then come home, little frost.\" The Lost One looks at Alice.","th":"white","also":["sisters"],"ch":["morgana","lostone","alice"],"turn":"","w":46,"ed":"","fl":[],"html":"\u003cp>Morgana: &quot;Then come home, little frost.&quot; The Lost One looks at Alice. Alice, who has spent the season holding on, lets go: &quot;Go, if you want to. I'll be all right.&quot; She means it. She has done this once before, with a nod, at an altar.\u003c/p>"},{"oref":"Scene 16","id":231,"seq":16,"title":"Tyburn hill","added":false,"act":"Act Three","kind":"scene","sum":"The Lost One tells her the last thing: \"I have all of her now. The birthdays, the songs, the river. This came last, because it was the last thing she ever thought. In the river she was still alive. She asked me something. 'Go back to Ali. Stand in front of her. When we were
