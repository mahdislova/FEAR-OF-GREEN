father's hand on his shoulder, the Heartglass half-built between them. It's everything he has wanted his whole life, and she can see that it is. She doesn't knock. Her breath fogs the pane. She wipes it clean with her glove, the one with his handkerchief folded inside it, and goes back down the wall. A second later Nathaniel looks up, at a window with nobody in it.\u003c/p>"},{"oref":"Scene 6","id":112,"seq":6,"title":"Lambrick House, the gun room","added":false,"act":"Act One","kind":"scene","sum":"Tamara, behind a curtain, hears her father and Ajax: charges along the Tyburn conduit where it meets his Pimlico gas main, set to blow on the night of the vote so Harding's Works look rotten to the Crown. Ajax: \"And if your daughter gets in the way?\" Lambrick, after a pause: \"Then my daughter should have stayed home.\" Then, to the ledger, not to Ajax: \"And if she comes home and talks, Dr Cutler has signed the papers. I only need a second doctor.\" Behind the curtain, Tamara learns her price twice in one breath.","loc":"Lambrick House","when":"Tamara, behind a curtain, hears her father and Ajax: charges along the Tyburn conduit where it meets his Pimlico gas main, set to blow on the night of the vote so Harding's Works look rotten to the Crown.","th":"lambrick","also":[],"ch":["tamara","lambrick","ajax"],"turn":"","w":95,"ed":"Revised Oct 14: polish pass","fl":[],"html":"\u003cp>Tamara, behind a curtain, hears her father and Ajax: charges along the Tyburn conduit where it meets his Pimlico gas main, set to blow on the night of the vote so Harding's Works look rotten to the Crown. Ajax: &quot;And if your daughter gets in the way?&quot; Lambrick, after a pause: &quot;Then my daughter should have stayed home.&quot; Then, to the ledger, not to Ajax: &quot;And if she comes home and talks, Dr Cutler has signed the papers. I only need a second doctor.&quot; Behind the curtain, Tamara learns her price twice in one breath.\u003c/p>"},{"oref":"Scene 7","id":114,"seq":7,"title":"A Covent Garden tea shop","added":false,"act":"Act Two","kind":"scene","sum":"Alice swallows her pride and asks Tamara, the new Vykra with a coal baron's maps, for a way into the core. Tamara tells her about the charges. The only route in runs through Ajax's tunnels. Tamara: \"Then go another night.\" Alice: \"There isn't one. She's half Mim and half something else, and I want all of Mim before the something else wins.\" Two girls who dislike each other, starting to understand each other. The girl who pours their tea is JENNIFER, chewing mint, chattering about the weather, with a knot stitched inside her glove, and neither of them looks at her hands.","loc":"A Covent Garden tea shop","when":"Alice swallows her pride and asks Tamara, the new Vykra with a coal baron's maps, for a way into the core.","th":"sisters","also":["lambrick"],"ch":["alice","tamara"],"turn":"","w":102,"ed":"Revised Nov 14: the twins","fl":[],"html":"\u003cp>Alice swallows her pride and asks Tamara, the new Vykra with a coal baron's maps, for a way into the core. Tamara tells her about the charges. The only route in runs through Ajax's tunnels. Tamara: &quot;Then go another night.&quot; Alice: &quot;There isn't one. She's half Mim and half something else, and I want all of Mim before the something else wins.&quot; Two girls who dislike each other, starting to understand each other. The girl who pours their tea is JENNIFER, chewing mint, chattering about the weather, with a knot stitched inside her glove, and neither of them looks at her hands.\u003c/p>"},{"oref":"Scene 8","id":115,"seq":8,"title":"The frozen canal at Little Venice","added":false,"act":"Act Two","kind":"scene","sum":"They meet in secret under a bridge, snowless cold, their breath smoking between them. He tells her about the Heartglass: \"We can save both of them.\" She tells him the Lost One is remembering, and not the right things. When she pulls off a glove to warm her hands, something falls out of it into the frost: his handkerchief, folded small, kept where a Vykra keeps the thing that says whose she is. He picks it up. \"You kept it.\" \"Bounds keeps things.\" For once in his life he doesn't wait to be reached for. He kisses her, and finds out she has been waiting since the ballroom. Tik. Tik. Ice ticking off the bridge above them. Then both of them use the kiss to hide the dangerous part: she's going in tonight, and he still doesn't know what the Heartglass is for.","loc":"The frozen canal at Little Venice","when":"They meet in secret under a bridge, snowless cold, their breath smoking between them.","th":"investigation","also":["sisters"],"ch":["nathaniel","alice"],"turn":"","w":143,"ed":"Revised Nov 14: the sisters' past","fl":[],"html":"\u003cp>They meet in secret under a bridge, snowless cold, their breath smoking between them. He tells her about the Heartglass: &quot;We can save both of them.&quot; She tells him the Lost One is remembering, and not the right things. When she pulls off a glove to warm her hands, something falls out of it into the frost: his handkerchief, folded small, kept where a Vykra keeps the thing that says whose she is. He picks it up. &quot;You kept it.&quot; &quot;Bounds keeps things.&quot; For once in his life he doesn't wait to be reached for. He kisses her, and finds out she has been waiting since the ballroom. \u003cem>Tik. Tik.\u003c/em> Ice ticking off the bridge above them. Then both of them use the kiss to hide the dangerous part: she's going in tonight, and he still doesn't know what the Heartglass is for.\u003c/p>"},{"oref":"Scene 9","id":113,"seq":9,"title":"Harding House, the linen room, then the study","added":false,"act":"Act Two","kind":"scene","sum":"Byron confronts Josephine. \"I saw your hands.\" \"I did it for Nathaniel.\" \"You always say that.\" She has a needle in her sleeve, and she doesn't use it. \"Thirty years, Josie.\" He leaves. She sits on the linen and doesn't cry. Then a maid brings her a folded note in Grise's hand, bought an hour ago from Jennifer, the tea-girl in Covent Garden: Tyburn conduit. Vote night. The girl. Josephine takes it straight down to her husband's study. \"How do you know?\" \"I'm your wife.\" Eldgard sends for Nixon. \"You stood at my core door and let her walk out of it. Bring her back alive, or bring me your lantern.\" The Heartglass needs her. The woman who has just spared Byron's life has set the trap he will die in, and neither of them knows it.","loc":"Harding House","when":"Byron confronts Josephine.","th":"harding","also":["vykra"],"ch":["byron","josephine","eldgard","twins"],"turn":"","w":137,"ed":"Revised Nov 14: the twins","fl":[],"html":"\u003cp>Byron confronts Josephine. &quot;I saw your hands.&quot; &quot;I did it for Nathaniel.&quot; &quot;You always say that.&quot; She has a needle in her sleeve, and she doesn't use it. &quot;Thirty years, Josie.&quot; He leaves. She sits on the linen and doesn't cry. Then a maid brings her a folded note in Grise's hand, bought an hour ago from Jennifer, the tea-girl in Covent Garden: \u003cem>Tyburn conduit. Vote night. The girl.\u003c/em> Josephine takes it straight down to her husband's study. &quot;How do you know?&quot; &quot;I'm your wife.&quot; Eldgard sends for Nixon. &quot;You stood at my core door and let her walk out of it. Bring her back alive, or bring me your lantern.&quot; The Heartglass needs her. The woman who has just spared Byron's life has set the trap he will die in, and neither of them knows it.\u003c/p>"},{"oref":"Scene 10","id":118,"seq":10,"title":"Harding Works, then the Harding House hall","added":false,"act":"Act Two","kind":"scene","sum":"A cipher note from Tamara in their childhood code reaches Nathaniel: The conduit. Charges. She's going in. He runs, grabbing the leap-gauntlet as he goes. In the hall, Byron sees him tear out of the yard. He hasn't carried a green lamp since the core. He takes his old Lantern down from its glass case on the wall, still charged after thirty years, and when it lights he hears her again, as clearly as he did on night watch. He follows anyway.","loc":"Harding Works","when":"A cipher note from Tamara in their childhood code reaches Nathaniel: The conduit.","th":"lambrick","also":["harding","guard"],"ch":["nathaniel","byron"],"turn":"","w":82,"ed":"Revised in the Oct 10 pass","fl":[],"html":"\u003cp>A cipher note from Tamara in their childhood code reaches Nathaniel: \u003cem>The conduit. Charges. She's going in.\u003c/em> He runs, grabbing the leap-gauntlet as he goes. In the hall, Byron sees him tear out of the yard. He hasn't carried a green lamp since the core. He takes his old Lantern down from its glass case on the wall, still charged after thirty years, and when it lights he hears her again, as clearly as he did on night watch. He follows anyway.\u003c/p>"},{"oref":"Scene 11","id":120,"seq":11,"title":"The Tyburn conduit, set piece","added":false,"act":"Act Three","kind":"scene","sum":"Alice and the Lost One go down. Ajax's men are lighting fuses in a side drain. Four tunnel children are sleeping in the warm pipe-nook beyond it. Nixon's squad waits in the dark ahead, Cole among them. In the dark, Cole holds up his diary: \"Tell Mr. Harding what I did, sir, or I will.\" Nixon: \"After the vote.\" Cole agrees, because he still believes in him.","loc":"The Tyburn conduit","when":"Alice and the Lost One go down.","th":"lambrick","also":["guard"],"ch":["alice","lostone","nixon","cole"],"turn":"","w":67,"ed":"Revised Nov 15: Nixon","fl":[],"html":"\u003cp>Alice and the Lost One go down. Ajax's men are lighting fuses in a side drain. Four tunnel children are sleeping in the warm pipe-nook beyond it. Nixon's squad waits in the dark ahead, Cole among them. In the dark, Cole holds up his diary: &quot;Tell Mr. Harding what I did, sir, or I will.&quot; Nixon: &quot;After the vote.&quot; Cole agrees, because he still believes in him.\u003c/p>"},{"oref":"Scene 12","id":121,"seq":12,"title":"The ambush","added":false,"act":"Act Three","kind":"scene","sum":"Flash-bursts. Nixon corners the Lost One, and she grabs his bare wrist. No frost. He doesn't freeze, the way Nathaniel didn't, and in the strobe and the shouting nobody sees it but the camera. She goes white anyway. She can smell Harding on him the way she smelled it on Nathaniel, and under it the cellar beneath her mother; and one of the names in the song she has heard in every lamp since the bridge belongs to the same blood: \"They told you your mother had a fever. She didn't.\" He lets go as if burned. Alice fights Nixon, gauntlet to gauntlet, in a tunnel too narrow to swing in: the two leads' first real clash. Neither of them wants to win. Then Nathaniel arrives screaming \"Gas!\" Ajax, seeing the Guard, lights early. The Lost One's cold meets a flash-burst in the main.","loc":"The ambush","when":"Flash-bursts.","th":"guard","also":["white","lambrick"],"ch":["nixon","lostone","alice","nathaniel","ajax"],"turn":"","w":144,"ed":"","fl":[],"html":"\u003cp>Flash-bursts. Nixon corners the Lost One, and she grabs his bare wrist. No frost. He doesn't freeze, the way Nathaniel didn't, and in the strobe and the shouting nobody sees it but the camera. She goes white anyway. She can smell Harding on him the way she smelled it on Nathaniel, and under it the cellar beneath her mother; and one of the names in the song she has heard in every lamp since the bridge belongs to the same blood: &quot;They told you your mother had a fever. She didn't.&quot; He lets go as if burned. Alice fights Nixon, gauntlet to gauntlet, in a tunnel too narrow to swing in: the two leads' first real clash. Neither of them wants to win. Then Nathaniel arrives screaming &quot;Gas!&quot; Ajax, seeing the Guard, lights early. The Lost One's cold meets a flash-burst in the main.\u003c/p>"},{"oref":"Scene 13","id":123,"seq":13,"title":"Pimlico, then Parliament","added":false,"act":"Act Three","kind":"scene","sum":"The gasworks erupts. WHOOOM. Fire rolls along the river. A mile downriver the Charter vote is three names from done: Eldgard, Lambrick and Vane in their places, Nathaniel's chair empty, and Josephine looking at it when the windows blow in on the voting lords.","loc":"Pimlico","when":"The gasworks erupts.","th":"lambrick","also":["city","harding"],"ch":["eldgard","lambrick","vane","josephine"],"turn":"","w":44,"ed":"","fl":[],"html":"\u003cp>The gasworks erupts. \u003cem>WHOOOM.\u003c/em> Fire rolls along the river. A mile downriver the Charter vote is three names from done: Eldgard, Lambrick and Vane in their places, Nathaniel's chair empty, and Josephine looking at it when the windows blow in on the voting lords.\u003c/p>"},{"oref":"Scene 14","id":124,"seq":14,"title":"The rubble","added":false,"act":"Act Three","kind":"scene","sum":"In the smoke, a green flash, then another: Byron's Lantern, finding the boy under the rubble. Byron lifts the beam off Nathaniel and takes its weight himself, and it crushes him. Dying, he says: \"Your mother killed the inspector. She does it for you. Don't let her.\" A breath, and the thing he has known for thirty years: \"I let her go at the gate. Everything since came through that gate.\" Then: \"You were always enough.\" He dies with his hand on the boy's face. In his other fist is the blue ribbon.","loc":"The rubble","when":"In the smoke, a green flash, then another: Byron's Lantern, finding the boy under the rubble.","th":"harding","also":["investigation"],"ch":["byron","nathaniel"],"turn":"","w":93,"ed":"Revised Oct 13: four rules, new Ep 8","fl":[],"html":"\u003cp>In the smoke, a green flash, then another: Byron's Lantern, finding the boy under the rubble. Byron lifts the beam off Nathaniel and takes its weight himself, and it crushes him. Dying, he says: &quot;Your mother killed the inspector. She does it for you. Don't let her.&quot; A breath, and the thing he has known for thirty years: &quot;I let her go at the gate. Everything since came through that gate.&quot; Then: &quot;You were always enough.&quot; He dies with his hand on the boy's face. In his other fist is the blue ribbon.\u003c/p>"},{"oref":"Scene 15","id":125,"seq":15,"title":"The river stair","added":false,"act":"Act Three","kind":"scene","sum":"Nixon carries Cole out of the fire. Alice comes up with the Lost One, who uses the last of her cold to smother the flames around four trapped children. Then, shaking, she looks at Alice, and a memory comes up on its own: \"You broke your arm when you were nine. I told Wren you fell off the wall.\" Alice goes still. Nobody has said that out loud in eleven years. It's the most like Mim she has ever sounded, and Alice lets herself believe it completely. It's the last time she'll manage to.","loc":"The river stair","when":"Nixon carries Cole out of the fire.","th":"sisters","also":["guard"],"ch":["nixon","cole","alice","lostone"],"turn":"","w":94,"ed":"Revised Nov 14: the sisters' past","fl":[],"html":"\u003cp>Nixon carries Cole out of the fire. Alice comes up with the Lost One, who uses the last of her cold to smother the flames around four trapped children. Then, shaking, she looks at Alice, and a memory comes up on its own: &quot;You broke your arm when you were nine. I told Wren you fell off the wall.&quot; Alice goes still. Nobody has said that out loud in eleven years. It's the most like Mim she has ever sounded, and Alice lets herself believe it completely. It's the last time she'll manage to.\u003c/p>"},{"oref":"Scene 16","id":126,"seq":16,"title":"Parliament, broken glass","added":false,"act":"Act Three","kind":"scene","sum":"Vane, bleeding from the temple, announces that the Charter is suspended and the Works pass to a Crown board. Lambrick takes a seat on it. Eldgard has lost the Works.","loc":"Parliament","when":"Vane, bleeding from the temple, announces that the Charter is suspended and the Works pass to a Crown board.","th":"city","also":["lambrick"],"ch":["vane","lambrick","eldgard"],"turn":"","w":30,"ed":"","fl":[],"html":"\u003cp>Vane, bleeding from the temple, announces that the Charter is suspended and the Works pass to a Crown board. Lambrick takes a seat on it. Eldgard has lost the Works.\u003c/p>"},{"oref":"Scene 17","id":127,"seq":17,"title":"Harding House, the music room","added":false,"act":"Tag","kind":"scene","sum":"Nathaniel walks in covered in ash. Josephine is at the piano. \"Byron's dead.\" She weeps, really. \"He told me about Inspector Hawke.\" The music stops. A long beat. \"Then you know I love you.\"","loc":"Harding House","when":"Nathaniel walks in covered in ash.","th":"harding","also":["investigation"],"ch":["nathaniel","josephine"],"turn":"","w":34,"ed":"","fl":[],"html":"\u003cp>Nathaniel walks in covered in ash. Josephine is at the piano. &quot;Byron's dead.&quot; She weeps, really. &quot;He told me about Inspector Hawke.&quot; The music stops. A long beat. &quot;Then you know I love you.&quot;\u003c/p>"}]},{"n":7,"title":"The Girl Who Isn't","time":"21 DAYS TO FIRST SNOW","clock":"21 DAYS TO FIRST SNOW","act":"II","log":"Alice finds the letter Miriam never left her and learns that the thing she has been protecting is not her sister. Nixon finally tells Nathaniel who fired the shot. Then the chain thins enough for the White to come through, and the only way through the night is together.","sum":"Tamara kisses Nixon and gives him a folder with his name on it. He can't open it","turn":"\"You're not her.\" Then Alice chooses her anyway. Nixon confesses","focus":"two reveals on one day: the sister and the best friend.","piece":"wolves of the White run through Whitechapel, and Nathaniel and Nixon fight side by side an hour after the friendship breaks.","threads":["sisters","harding","lambrick","guard","white","investigation","city","vykra"],"frame":"\u003cp>\u003cstrong>21 DAYS TO FIRST SNOW.\u003c/strong> \u003cstrong>Focus:\u003c/strong> two reveals on one day: the sister and the best friend. \u003cstrong>Set piece:\u003c/strong> wolves of the White run through Whitechapel, and Nathaniel and Nixon fight side by side an hour after the friendship breaks. \u003cstrong>Sting:\u003c/strong> Alice chooses the creature anyway, and Tamara hands Nixon a folder with his name on it that he cannot make himself open.\u003c/p>","scenes":[{"oref":"Scene 1","id":215,"seq":1,"title":"Gin Lane, 2 November, morning","added":false,"act":"Cold open","kind":"scene","sum":"Miriam's last day, from Miriam's side. She is radiant, sick in a basin, and hand on her belly. Alice is asleep on the other side of the bed. Miriam starts a letter: Ali, about him, when we were small— She stares at it a long time. She scores it out until the paper tears. She starts again, and this time writes it fast: three short lines we don't get to read. She means to leave it on Alice's pillow, then thinks of Grise's girls, who come and go in this room, and sews it into her coat lining to give her by hand tonight. She stands at the door a long time, looking at her sleeping sister, before she goes. Then she pulls on the red mittens.","loc":"Gin Lane","when":"Miriam's last day, from Miriam's side.","th":"sisters","also":[],"ch":["miriam"],"turn":"","w":127,"ed":"Revised Nov 14: the sisters' past","fl":[],"html":"\u003cp>Miriam's last day, from Miriam's side. She is radiant, sick in a basin, and hand on her belly. Alice is asleep on the other side of the bed. Miriam starts a letter: \u003cem>Ali, about him, when we were small—\u003c/em> She stares at it a long time. She scores it out until the paper tears. She starts again, and this time writes it fast: three short lines we don't get to read. She means to leave it on Alice's pillow, then thinks of Grise's girls, who come and go in this room, and sews it into her coat lining to give her by hand tonight. She stands at the door a long time, looking at her sleeping sister, before she goes. Then she pulls on the red mittens.\u003c/p>"},{"oref":"Scene 2","id":129,"seq":2,"title":"Gin Lane, a borrowed room","added":false,"act":"Act One","kind":"scene","sum":"Afternoon. Alice mends the Lost One's coat, burned in the gasworks, and her needle catches on something in the lining. Folded paper, Miriam's hand. She reads it twice. Ali. Tonight, after the bridge, I'm coming for you. Whatever Grise offers, say no. The third berth was hers. Miriam was coming back for her, and two mornings after the river, Alice said yes to Grise. Then the door bangs. The Lost One, home from the market with an armful of oranges she is enormously proud of, chattering about a man who sells hot chestnuts out of a drum. She calls her Ali now in exactly Miriam's voice; there's more of Miriam in her every day. Alice puts the letter in her apron pocket, smiles, and peels her an orange. She says nothing. She says nothing all evening, and we watch her not say it.","loc":"Gin Lane","when":"Afternoon.","th":"sisters","also":[],"ch":["alice","lostone"],"turn":"Afternoon. Alice mends the Lost One's coat, burned in the gasworks, and her needle catches on something in the lining. Folded paper, Miriam's hand. She reads it twice. Ali. Tonight, after the bridge, I'm coming for you. ","w":143,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>Afternoon. Alice mends the Lost One's coat, burned in the gasworks, and her needle catches on something in the lining. Folded paper, Miriam's hand. She reads it twice. \u003cem>Ali. Tonight, after the bridge, I'm coming for you. Whatever Grise offers, say no.\u003c/em> The third berth was hers. Miriam was coming back for her, and two mornings after the river, Alice said yes to Grise. Then the door bangs. The Lost One, home from the market with an armful of oranges she is enormously proud of, chattering about a man who sells hot chestnuts out of a drum. She calls her Ali now in exactly Miriam's voice; there's more of Miriam in her every day. Alice puts the letter in her apron pocket, smiles, and peels her an orange. She says nothing. She says nothing all evening, and we watch her not say it.\u003c/p>"},{"oref":"Scene 3","id":130,"seq":3,"title":"The same room. The peak of the sisters' story","added":false,"act":"Act One","kind":"scene","sum":"Late, one candle. Alice holds out the letter. \"You were coming for me.\" The Lost One, who has more of Miriam in her every day, knows this face and knows this hurt. \"Yes.\" And the fence comes down, because Alice is too angry to hold it up: \"Now? Fifteen years too late. You always left. You left me under that bed. Every time. You promised nothing would touch me, and then you counted fence posts while he—\" She can't finish. Fifteen years, and she has finally said it out loud, to the only person who was there. The Lost One has been waiting four weeks to be let in. Miriam came back to her a piece at a time, the laugh and the songs and the birthday, and the guilt came heaviest and last. She kneels on the floor so she's lower than Alice, the way you'd kneel to a child under a bed. Ice runs down her face, tink, tink, the way it did in the tunnel. \"I should have stood in front of you. Every time. I'm sorry. I was so frightened of him that I let you be frightened alone, and I've hated myself every day since.\" Then the thing Miriam carried furthest, which she can't put down: \"He didn't fall in the river, Ali.\" Flashback: the Thames stairs, winter, eight years ago. Miriam, sixteen, her knee in his back, his head under the black water, her red mittens on the mooring ring. Blub. Blub. No rage in her face. Under her breath, she's counting. One post. Two post. At eight she lets go. Back in the room: \"Grise said one simple task. I told myself it was for you. I've never known if that was true.\" Alice, barely able to get it out: \"I saw you crying on his grave.\" \"She wasn't crying for him.\" It is the apology Alice has wanted her whole life, and the confession under it, and both of them are perfect. That's how she knows. Miriam would have taken the river to her grave. Miriam could face a knife in a warehouse and still could not say this. That is the difference Alice recognises; it is not a verdict that her sister lacked courage. Alice, barely a breath: \"You're not her.\" \"No.\" Plainly: Morgana's daughter, who came through in the river empty except for one face, and has been filling up with Miriam ever since, like a coat that remembers who wore it. Alice has known since the core that something else came back in her sister. What she built her whole theory to avoid knowing is whether Miriam is still under it. \"Is she in there? Under you?\" \"No. She was gone before I opened her eyes. I only have what she carried. There was a carriage. She thought it was Jamie. His mouth came away when she kissed him. She knew what was on it. She threw the knives where she couldn't reach them, Ali. She fought it. She was coming for you.\" The fragment identifies an impostor and resistance, not Jennie, whose uncovered face Miriam never saw. The exact request in the river is still the last memory withheld until Episode 10. \"She nearly didn't. She stood at your door that morning a long time, and it was the last thing she was ashamed of.\" Then the real horror, said gently, as a gift: \"I'm not sorry for her. I'm sorry for me. I love you. I don't know whose that is anymore. I think it's mine.\" Alice looks at the thing that has been her sister for four weeks, the one that remembered her birthday, peeled her an orange, and has just given her the only apology and the only truth she has ever been given, and receives an apology her real sister could never bring herself to say. It does not prove the old love was less; it makes the loss impossible to avoid. \"Get out.\" The door closes on her.","loc":"The same room. The peak of the sisters' story.","when":"Late, one candle.","th":"sisters","also":[],"ch":["alice","lostone"],"turn":"Alice looks at the thing that has been her sister for four weeks, the one that remembered her birthday, peeled her an orange, and has just given her the only apology and the only truth she has ever been given, and receiv","w":665,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>Late, one candle. Alice holds out the letter. &quot;You were coming for me.&quot; The Lost One, who has more of Miriam in her every day, knows this face and knows this hurt. &quot;Yes.&quot; And the fence comes down, because Alice is too angry to hold it up: &quot;\u003cem>Now?\u003c/em> Fifteen years too late. You always left. You left me under that bed. Every time. You promised nothing would touch me, and then you counted fence posts while he—&quot; She can't finish. Fifteen years, and she has finally said it out loud, to the only person who was there.\u003c/p>\n\u003cp>The Lost One has been waiting four weeks to be let in. Miriam came back to her a piece at a time, the laugh and the songs and the birthday, and the guilt came heaviest and last. She kneels on the floor so she's lower than Alice, the way you'd kneel to a child under a bed. Ice runs down her face, \u003cem>tink, tink\u003c/em>, the way it did in the tunnel. &quot;I should have stood in front of you. Every time. I'm sorry. I was so frightened of him that I let you be frightened alone, and I've hated myself every day since.&quot; Then the thing Miriam carried furthest, which she can't put down: &quot;He didn't fall in the river, Ali.&quot;\u003c/p>\n\u003cp>\u003cstrong>Flashback: the Thames stairs, winter, eight years ago.\u003c/strong> Miriam, sixteen, her knee in his back, his head under the black water, her red mittens on the mooring ring. \u003cem>Blub. Blub.\u003c/em> No rage in her face. Under her breath, she's counting. One post. Two post. At eight she lets go.\u003c/p>\n\u003cp>Back in the room: &quot;Grise said one simple task. I told myself it was for you. I've never known if that was true.&quot;\u003c/p>\n\u003cp>Alice, barely able to get it out: &quot;I saw you crying on his grave.&quot; &quot;She wasn't crying for him.&quot;\u003c/p>\n\u003cp>It is the apology Alice has wanted her whole life, and the confession under it, and both of them are perfect. That's how she knows. Miriam would have taken the river to her grave. Miriam could face a knife in a warehouse and still could not say this. That is the difference Alice recognises; it is not a verdict that her sister lacked courage. Alice, barely a breath: &quot;You're not her.&quot;\u003c/p>\n\u003cp>&quot;No.&quot; Plainly: Morgana's daughter, who came through in the river empty except for one face, and has been filling up with Miriam ever since, like a coat that remembers who wore it. Alice has known since the core that something else came back in her sister. What she built her whole theory to avoid knowing is whether Miriam is still under it. &quot;Is she in there? Under you?&quot; &quot;No. She was gone before I opened her eyes. I only have what she carried. There was a carriage. She thought it was Jamie. His mouth came away when she kissed him. She knew what was on it. She threw the knives where she couldn't reach them, Ali. She fought it. She was coming for you.&quot; The fragment identifies an impostor and resistance, not Jennie, whose uncovered face Miriam never saw. The exact request in the river is still the last memory withheld until Episode 10. &quot;She nearly didn't. She stood at your door that morning a long time, and it was the last thing she was ashamed of.&quot; Then the real horror, said gently, as a gift: &quot;I'm not sorry for her. I'm sorry for me. I love you. I don't know whose that is anymore. I think it's mine.&quot;\u003c/p>\n\u003cp>Alice looks at the thing that has been her sister for four weeks, the one that remembered her birthday, peeled her an orange, and has just given her the only apology and the only truth she has ever been given, and receives an apology her real sister could never bring herself to say. It does not prove the old love was less; it makes the loss impossible to avoid. &quot;Get out.&quot; The door closes on her.\u003c/p>"},{"oref":"Scene 4","id":131,"seq":4,"title":"Harding House, breakfast","added":false,"act":"Act One","kind":"scene","sum":"Eldgard sits silent and diminished without his Works. Josephine runs the table now: the wedding is in seven days, and the Lambrick money will buy the Works back. Nathaniel: \"Or what, Mother? You'll poison me?\" Josephine, buttering toast: \"If I had to choose between you and London, I chose a long time ago.\" Nathaniel stands. \"If anything happens to the frost girl, I'll stand up in Parliament and say who poisoned Felix Hawke.\" She doesn't stop buttering. \"Then it had better not happen from my hands.\"","loc":"Harding House","when":"Eldgard sits silent and diminished without his Works.","th":"harding","also":[],"ch":["eldgard","josephine","nathaniel"],"turn":"","w":86,"ed":"Revised in the Oct 10 pass","fl":[],"html":"\u003cp>Eldgard sits silent and diminished without his Works. Josephine runs the table now: the wedding is in seven days, and the Lambrick money will buy the Works back. Nathaniel: &quot;Or what, Mother? You'll poison me?&quot; Josephine, buttering toast: &quot;If I had to choose between you and London, I chose a long time ago.&quot; Nathaniel stands. &quot;If anything happens to the frost girl, I'll stand up in Parliament and say who poisoned Felix Hawke.&quot; She doesn't stop buttering. &quot;Then it had better not happen from my hands.&quot;\u003c/p>"},{"oref":"Scene 5","id":132,"seq":5,"title":"The core, under Crown control","added":false,"act":"Act One","kind":"scene","sum":"Vane and Lambrick tour it with Tamara on her father's arm. On the stair down, Lambrick, quietly, the only time he talks to her as if she were a person: \"Your mother hated the green. Said it made everyone at dinner look drowned. I kept her room on coal till the end.\" Then he looks up at Morgana. There's no horror in his face, only arithmetic: \"She could be bled faster.\" The man who kept one room warm out of love would freeze a city for the same reason, and calls both of them providing. On the clerk's desk sits Eldgard's seized Heartglass folio. Tamara reads one line: Vessel: White-born.","loc":"The core","when":"Vane and Lambrick tour it with Tamara on her father's arm.","th":"lambrick","also":["city"],"ch":["lambrick","vane","tamara","morgana"],"turn":"","w":110,"ed":"","fl":[],"html":"\u003cp>Vane and Lambrick tour it with Tamara on her father's arm. On the stair down, Lambrick, quietly, the only time he talks to her as if she were a person: &quot;Your mother hated the green. Said it made everyone at dinner look drowned. I kept her room on coal till the end.&quot; Then he looks up at Morgana. There's no horror in his face, only arithmetic: &quot;She could be bled faster.&quot; The man who kept one room warm out of love would freeze a city for the same reason, and calls both of them providing. On the clerk's desk sits Eldgard's seized Heartglass folio. Tamara reads one line: \u003cem>Vessel: White-born.\u003c/em>\u003c/p>"},{"oref":"Scene 6","id":134,"seq":6,"title":"Blackwood Bridge, fog","added":false,"act":"Act Two","kind":"scene","sum":"The Lost One, thrown out, walks to the place she first came through, and does the only thing her body knows how to do with being sent away: she cries. This time the tears don't freeze on her face. They freeze the air. Tink. Tink. Krrrk. The thin place on the bridge cracks like a pane of glass, and Alice's \"Get out\" has opened a door. Howls in the fog. Wolves of the White, white-furred and blue-eyed, pad out of nothing and bow to her. That's the most dangerous thing that could happen.","loc":"Blackwood Bridge","when":"The Lost One, thrown out, walks to the place she first came through, and does the only thing her body knows how to do with being sent away: she cries.","th":"white","also":[],"ch":["lostone"],"turn":"","w":93,"ed":"","fl":[],"html":"\u003cp>The Lost One, thrown out, walks to the place she first came through, and does the only thing her body knows how to do with being sent away: she cries. This time the tears don't freeze on her face. They freeze the air. \u003cem>Tink. Tink. Krrrk.\u003c/em> The thin place on the bridge cracks like a pane of glass, and Alice's &quot;Get out&quot; has opened a door. Howls in the fog. Wolves of the White, white-furred and blue-eyed, pad out of nothing and bow to her. That's the most dangerous thing that could happen.\u003c/p>"},{"oref":"Scene 7","id":133,"seq":7,"title":"Guard tower roof, their boyhood spot","added":false,"act":"Act Two","kind":"scene","sum":"This morning Nixon got a medal for carrying Cole out of the gasworks, and Eldgard, broken by the loss of his Works, pinned it on him himself in front of the whole corps and called him \"my son.\" Nathaniel was there. So this afternoon, at the spot they've had since they were nine, Nathaniel is waiting for him. \"How long has he been taking you below?\" \"Since the funeral.\" \"He gave me a room full of vats. He gave you the stair.\" \"Nat—\" \"I built his rifles. I built his cage. I'd have built him anything, and he gave you the keys.\" \"He chose me for something. I don't know what yet.\" \"Did you know how Jamie died?\" A long beat. \"One of my Wicks fired. Your father told me the night I came home. I kept it, because he asked me to.\" Nathaniel hits him once, hard. Nixon lets him. \"Was Jamie alive after the shot?\" \"The boy says he was still talking. Your father sent him away and stayed.\" Nathaniel walks away without a word. A friendship of fifteen years ends on a roof, over a father they were both trying to be good enough for.","loc":"Guard tower roof","when":"This morning Nixon got a medal for carrying Cole out of the gasworks, and Eldgard, broken by the loss of his Works, pinned it on him himself in front of the whole corps and called him \"my son.\"","th":"guard","also":["investigation"],"ch":["nixon","cole","nathaniel"],"turn":"","w":198,"ed":"Revised Nov 15: the replacement son","fl":[],"html":"\u003cp>This morning Nixon got a medal for carrying Cole out of the gasworks, and Eldgard, broken by the loss of his Works, pinned it on him himself in front of the whole corps and called him &quot;my son.&quot; Nathaniel was there. So this afternoon, at the spot they've had since they were nine, Nathaniel is waiting for him. &quot;How long has he been taking you below?&quot; &quot;Since the funeral.&quot; &quot;He gave me a room full of vats. He gave you the stair.&quot; &quot;Nat—&quot; &quot;I built his rifles. I built his cage. I'd have built him anything, and he gave you the keys.&quot; &quot;He chose me for something. I don't know what yet.&quot; &quot;Did you know how Jamie died?&quot; A long beat. &quot;One of my Wicks fired. Your father told me the night I came home. I kept it, because he asked me to.&quot; Nathaniel hits him once, hard. Nixon lets him. &quot;Was Jamie alive after the shot?&quot; &quot;The boy says he was still talking. Your father sent him away and stayed.&quot; Nathaniel walks away without a word. A friendship of fifteen years ends on a roof, over a father they were both trying to be good enough for.\u003c/p>"},{"oref":"Scene 8","id":136,"seq":8,"title":"A Gin Lane gin shop","added":false,"act":"Act Two","kind":"scene","sum":"Tamara finds Alice drunk. She tells her about Lambrick's arithmetic and the line in the folio. Alice: \"Why would I care? She's not my sister.\" Tamara: \"She put out a fire around four children with the last of her cold. Did Miriam ever do that?\" Alice, after a long time: \"When we were small, she couldn't stand in front of him.\" The accusation belongs to their childhood wound, not to a claim that Miriam never protected anyone or willingly chose her own death. She stops drinking.","loc":"A Gin Lane gin shop.","when":"Tamara finds Alice drunk.","th":"sisters","also":["lambrick"],"ch":["tamara","alice"],"turn":"Tamara finds Alice drunk. She tells her about Lambrick's arithmetic and the line in the folio. Alice: \"Why would I care? She's not my sister.\" Tamara: \"She put out a fire around four children with the last of her cold. D","w":86,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>Tamara finds Alice drunk. She tells her about Lambrick's arithmetic and the line in the folio. Alice: &quot;Why would I care? She's not my sister.&quot; Tamara: &quot;She put out a fire around four children with the last of her cold. Did Miriam ever do that?&quot; Alice, after a long time: &quot;When we were small, she couldn't stand in front of him.&quot; The accusation belongs to their childhood wound, not to a claim that Miriam never protected anyone or willingly chose her own death. She stops drinking.\u003c/p>"},{"oref":"Scene 9","id":137,"seq":9,"title":"Whitechapel, set piece","added":false,"act":"Act Two","kind":"scene","sum":"The wolves that came through on Blackwood Bridge don't stay there. Where the chain is thinnest, over the old Hargrave plague pits, where the hanged were dumped, the fog splits. Wolves pour into the gaslit streets. Gas lamps freeze and burst, tink, tink, tink. Bodies in the snowless street.","loc":"Whitechapel","when":"The wolves that came through on Blackwood Bridge don't stay there.","th":"white","also":["city"],"ch":[],"turn":"","w":49,"ed":"","fl":[],"html":"\u003cp>The wolves that came through on Blackwood Bridge don't stay there. Where the chain is thinnest, over the old Hargrave plague pits, where the hanged were dumped, the fog splits. Wolves pour into the gaslit streets. Gas lamps freeze and burst, \u003cem>tink, tink, tink\u003c/em>. Bodies in the snowless street.\u003c/p>"},{"oref":"Scene 10","id":138,"seq":10,"title":"Commercial Road, set piece","added":false,"act":"Act Two","kind":"scene","sum":"Nixon's Lanterns respond: leapers on the rooftops, flash-bursts (the wolves scatter from the light), quench-blades. Shot the way the pilot's core raid was: black, then a strobe frame, then black. Every flash shows us a wolf somewhere new and closer. We see them only in the frames the Lanterns light, which is scarier than a wide shot and costs a tenth as much. Nixon fights like a man trying to get himself killed. Cole fights beside him with his two-finger grip.","loc":"Commercial Road","when":"Nixon's Lanterns respond: leapers on the rooftops, flash-bursts (the wolves scatter from the light), quench-blades.","th":"guard","also":[],"ch":["nixon","cole"],"turn":"","w":81,"ed":"","fl":[],"html":"\u003cp>Nixon's Lanterns respond: leapers on the rooftops, flash-bursts (the wolves scatter from the light), quench-blades. Shot the way the pilot's core raid was: black, then a strobe frame, then black. Every flash shows us a wolf somewhere new and closer. We see them only in the frames the Lanterns light, which is scarier than a wide shot and costs a tenth as much. Nixon fights like a man trying to get himself killed. Cole fights beside him with his two-finger grip.\u003c/p>"},{"oref":"Scene 11","id":139,"seq":11,"title":"The Pavilion music hall, set piece","added":false,"act":"Act Two","kind":"scene","sum":"Whimsy into grim. We stay inside. A comic singer keeps a hundred people singing \"Daisy Bell\" to drown out the scratching at the doors, and the song gets louder every time the scratching does. A door panel bows inward. A child stops singing, and her mother starts her again. Nathaniel arrives on leap-boosters with a bag of flash-cartridges, and Nixon arrives from the other roof. No words. They fight back to back the way they did at nine years old, perfectly in sync, an hour after the friendship ended.","loc":"The Pavilion music hall","when":"Whimsy into grim.","th":"guard","also":["harding"],"ch":["nathaniel","nixon"],"turn":"","w":89,"ed":"","fl":[],"html":"\u003cp>Whimsy into grim. We stay inside. A comic singer keeps a hundred people singing &quot;Daisy Bell&quot; to drown out the scratching at the doors, and the song gets louder every time the scratching does. A door panel bows inward. A child stops singing, and her mother starts her again. Nathaniel arrives on leap-boosters with a bag of flash-cartridges, and Nixon arrives from the other roof. No words. They fight back to back the way they did at nine years old, perfectly in sync, an hour after the friendship ended.\u003c/p>"},{"oref":"Scene 12","id":140,"seq":12,"title":"The Pavilion stage door, and the street","added":false,"act":"Act Two","kind":"scene","sum":"The Lost One walks into the street of wolves and says one word in a language of wind. They stop, every one of them, except the biggest. She kills it with cold. Then she turns the rest, every one, and walks them back through the fog to the bridge, and the crack in the air closes behind the last of them. Tik. A hundred people watch a girl command wolves. By morning she'll be the Frost Witch, the one creature in London who can open the White and shut it again. Then Alice, sober now, reaches her through the street of wolves. The Lost One looks at her the way you'd look at a door that has already shut on you once. Alice: \"I'm Alice. I'm your sister.\" The sisters' scene: chosen, not inherited.","loc":"The Pavilion stage door","when":"The Lost One walks into the street of wolves and says one word in a language of wind.","th":"white","also":["sisters"],"ch":["lostone","alice"],"turn":"","w":134,"ed":"Revised Nov 14: the sisters' past","fl":[],"html":"\u003cp>The Lost One walks into the street of wolves and says one word in a language of wind. They stop, every one of them, except the biggest. She kills it with cold. Then she turns the rest, every one, and walks them back through the fog to the bridge, and the crack in the air closes behind the last of them. \u003cem>Tik.\u003c/em> A hundred people watch a girl command wolves. By morning she'll be the Frost Witch, the one creature in London who can open the White and shut it again. Then Alice, sober now, reaches her through the street of wolves. The Lost One looks at her the way you'd look at a door that has already shut on you once. Alice: &quot;I'm Alice. I'm your sister.&quot; The sisters' scene: chosen, not inherited.\u003c/p>"},{"oref":"Scene 13","id":142,"seq":13,"title":"Whitehall, then Shadwell, dawn","added":false,"act":"Act Three","kind":"scene","sum":"Two buyers for one girl. In his office, Vane declares martial law: the Frost Witch is to be captured. Lambrick has read the folio: \"Put her in the chain and the Crown never needs a Harding again. The light becomes ours.\" Vane hears only \"the lights stay on.\" Neither man says the other thing out loud: a girl who can open the White and shut it is worth more than the Works. Across the river, in the steam of the Shadwell laundry, Josephine and Grise agree a price for the Frost Witch, delivered to Josephine, not the Crown. Grise: \"Where is she?\" Josephine: \"Wherever my son puts her when the city gets too hot for her. Before Lantern Night that was my glasshouse, and after last night it will be again. I want her taken by hands he can't trace to me.\" Josephine: \"She's not a girl, Grise.\" Grise: \"None of us were, by the time we came here.\"","loc":"Whitehall","when":"Two buyers for one girl.","th":"city","also":["lambrick","vykra","harding"],"ch":["vane","lambrick","josephine","grise"],"turn":"","w":159,"ed":"Revised in the Oct 10 pass","fl":[],"html":"\u003cp>Two buyers for one girl. In his office, Vane declares martial law: the Frost Witch is to be captured. Lambrick has read the folio: &quot;Put her in the chain and the Crown never needs a Harding again. The light becomes ours.&quot; Vane hears only &quot;the lights stay on.&quot; Neither man says the other thing out loud: a girl who can open the White and shut it is worth more than the Works. Across the river, in the steam of the Shadwell laundry, Josephine and Grise agree a price for the Frost Witch, delivered to Josephine, not the Crown. Grise: &quot;Where is she?&quot; Josephine: &quot;Wherever my son puts her when the city gets too hot for her. Before Lantern Night that was my glasshouse, and after last night it will be again. I want her taken by hands he can't trace to me.&quot; Josephine: &quot;She's not a girl, Grise.&quot; Grise: &quot;None of us were, by the time we came here.&quot;\u003c/p>"},{"oref":"Scene 14","id":214,"seq":14,"title":"St Bride's, the Harding vault, dawn","added":true,"act":"Act Three","kind":"scene","sum":"All night Nathaniel fought beside the man who buried his brother's shooter, and one sentence from the roof has gone round his head the whole time: still talking. Jamie was alive after the shot. At dawn he goes to see his brother. Crowbar, lantern, the Harding vault under St Bride's. He breaks the seal on the coffin his best friend carried down these steps. Krrk-CRACK. Inside, laid out in Jamie's burial coat, are three sacks of grey slag from the Works vats and a family Bible for weight. No body. Nathaniel stands in the candle-dark with a fistful of slag, and Morgana's voice from Lantern Night comes back to him: He is cold. Above him, on the chancel wall, the brass plate still says DIED ABROAD.","loc":"St Bride's","when":"All night Nathaniel fought beside the man who buried his brother's shooter, and one sentence from the roof has gone round his head the whole time: still talking.","th":"investigation","also":["harding"],"ch":["nathaniel"],"turn":"","w":126,"ed":"Revised Nov 15: Nixon","fl":[],"html":"\u003cp>All night Nathaniel fought beside the man who buried his brother's shooter, and one sentence from the roof has gone round his head the whole time: \u003cem>still talking.\u003c/em> Jamie was alive after the shot. At dawn he goes to see his brother. Crowbar, lantern, the Harding vault under St Bride's. He breaks the seal on the coffin his best friend carried down these steps. \u003cem>Krrk-CRACK.\u003c/em> Inside, laid out in Jamie's burial coat, are three sacks of grey slag from the Works vats and a family Bible for weight. No body. Nathaniel stands in the candle-dark with a fistful of slag, and Morgana's voice from Lantern Night comes back to him: \u003cem>He is cold.\u003c/em> Above him, on the chancel wall, the brass plate still says DIED ABROAD.\u003c/p>"},{"oref":"Scene 15","id":143,"seq":15,"title":"Harding Works, Eldgard's old gallery, empty","added":false,"act":"Act Three","kind":"scene","sum":"Eldgard is drunk among the dead vats. Nathaniel drops a fistful of slag on the bench in front of him, the same grey as the dead vats all around them. \"What did you do after the shot?\" \"Ask me at the solstice.\" \"Now.\" \"I finished it.\" Then, almost to himself: \"Your mother knew what this house spends. She found it out at my gate with a knife in her hand, and she married it anyway.\" He doesn't ask about the Heartglass. He doesn't yet know there is anything to ask.","loc":"Harding Works","when":"Eldgard is drunk among the dead vats.","th":"harding","also":["white"],"ch":["eldgard","nathaniel"],"turn":"","w":90,"ed":"Revised Nov 15: Nixon","fl":[],"html":"\u003cp>Eldgard is drunk among the dead vats. Nathaniel drops a fistful of slag on the bench in front of him, the same grey as the dead vats all around them. &quot;What did you do after the shot?&quot; &quot;Ask me at the solstice.&quot; &quot;Now.&quot; &quot;I finished it.&quot; Then, almost to himself: &quot;Your mother knew what this house spends. She found it out at my gate with a knife in her hand, and she married it anyway.&quot; He doesn't ask about the Heartglass. He doesn't yet know there is anything to ask.\u003c/p>"},{"oref":"Scene 16","id":146,"seq":16,"title":"Harding House, the long gallery, then the glasshouse","added":false,"act":"Act Three","kind":"scene","sum":"Alice brings the Lost One in by the servants' door, and they cross the gallery of Harding portraits in the half-dark. The Lost One stops at Jamie's: twenty-five, laughing at something outside the frame, a skate-blade over his shoulder. Her hand goes to her belly without her knowing it. Her breath catches on a feeling that isn't hers, the whole of Miriam's love for him arriving in her body at once. Alice: \"What's wrong?\" \"Nothing.\" Alice looks at the portrait, then at her, and decides not to ask. In the glasshouse, Nathaniel is waiting, slag still grey in the creases of his hands. Alice doesn't let him start. Tamara read her the line in the folio: Vessel: White-born. \"You built a cage for my sister.\" He didn't know. She watches him not know, and hits him anyway, harder than Nathaniel hit Nixon. Then: \"So you know how to break it.\" Before he can answer, TAMARA comes in out of the rain with the rest of what she read on her father's desk: a lunacy order, two doctors' signatures, waiting for the day she opens her mouth about his books. \"A spinster's nearest relative is her father,\" she says. \"A wife's is her husband. The wedding is in seven days. I'd rather it were you than Bethlem.\" Nathaniel looks at Alice. Alice: \"Marry her.\" \"Bounds—\" \"Marry her.\" Both of them mean it, and both of them hate that they do. Later, at the stove, Nathaniel tells Alice about the coffin full of slag, and what Morgana said on Lantern Night: Jamie isn't dead, he's cold. Alice, hours after losing her sister for good: \"Don't live in it. I lived in it four weeks. It's warm, and then it isn't.\" From the dark under the orange trees, the Lost One, who isn't supposed to be listening: \"My mother doesn't lie.\" Two answers, and Nathaniel can only believe one of them. Twenty-one days, and everyone wants her in the chain.","loc":"Harding House","when":"Alice brings the Lost One in by the servants' door, and they cross the gallery of Harding portraits in the half-dark.","th":"harding","also":["sisters"],"ch":["alice","lostone","nathaniel","jamie","morgana"],"turn":"","w":327,"ed":"Revised Oct 13: four rules, new Ep 8","fl":[],"html":"\u003cp>Alice brings the Lost One in by the servants' door, and they cross the gallery of Harding portraits in the half-dark. The Lost One stops at Jamie's: twenty-five, laughing at something outside the frame, a skate-blade over his shoulder. Her hand goes to her belly without her knowing it. Her breath catches on a feeling that isn't hers, the whole of Miriam's love for him arriving in her body at once. Alice: &quot;What's wrong?&quot; &quot;Nothing.&quot; Alice looks at the portrait, then at her, and decides not to ask. In the glasshouse, Nathaniel is waiting, slag still grey in the creases of his hands. Alice doesn't let him start. Tamara read her the line in the folio: \u003cem>Vessel: White-born.\u003c/em> &quot;You built a cage for my sister.&quot; He didn't know. She watches him not know, and hits him anyway, harder than Nathaniel hit Nixon. Then: &quot;So you know how to break it.&quot; Before he can answer, TAMARA comes in out of the rain with the rest of what she read on her father's desk: a lunacy order, two doctors' signatures, waiting for the day she opens her mouth about his books. &quot;A spinster's nearest relative is her father,&quot; she says. &quot;A wife's is her husband. The wedding is in seven days. I'd rather it were you than Bethlem.&quot; Nathaniel looks at Alice. Alice: &quot;Marry her.&quot; &quot;Bounds—&quot; &quot;Marry her.&quot; Both of them mean it, and both of them hate that they do. Later, at the stove, Nathaniel tells Alice about the coffin full of slag, and what Morgana said on Lantern Night: Jamie isn't dead, he's cold. Alice, hours after losing her sister for good: &quot;Don't live in it. I lived in it four weeks. It's warm, and then it isn't.&quot; From the dark under the orange trees, the Lost One, who isn't supposed to be listening: &quot;My mother doesn't lie.&quot; Two answers, and Nathaniel can only believe one of them. Twenty-one days, and everyone wants her in the chain.\u003c/p>"},{"oref":"Scene 17","id":148,"seq":17,"title":"Gin Lane rooftop","added":false,"act":"Act Three","kind":"scene","sum":"Whimsy and grief. The Lost One has the count in her body and the bed in her memory, and asks Alice to count with her. For the first time Alice tells it in her own words, from the floor up: the fence outside the window, eight posts, and he's done. The Lost One listens, then counts them with her, and at eight she keeps going. \"Nine.\" Alice: \"There's no nine.\" \"There is now. Nine is the one where we get up.\" She gets it wrong on purpose, nine, ten, eleven, to make Alice laugh. It works. The game born under a bed has a new ending.","loc":"Gin Lane rooftop","when":"Whimsy and grief.","th":"sisters","also":[],"ch":["alice","lostone"],"turn":"","w":106,"ed":"Revised Nov 14: the sisters' past","fl":[],"html":"\u003cp>Whimsy and grief. The Lost One has the count in her body and the bed in her memory, and asks Alice to count with her. For the first time Alice tells it in her own words, from the floor up: the fence outside the window, eight posts, and he's done. The Lost One listens, then counts them with her, and at eight she keeps going. &quot;Nine.&quot; Alice: &quot;There's no nine.&quot; &quot;There is now. Nine is the one where we get up.&quot; She gets it wrong on purpose, nine, ten, eleven, to make Alice laugh. It works. The game born under a bed has a new ending.\u003c/p>"},{"oref":"Scene 18","id":145,"seq":18,"title":"Guard barracks, the infirmary","added":false,"act":"Tag","kind":"scene","sum":"Tamara comes in while Nixon is changing Cole's dressings. She gives Nixon a folder copied from her father's seized Harding papers: \"It has your name on it.\" Then, a week before her wedding, she kisses him. Cole pretends very hard to be asleep. Nixon doesn't open the folder. He puts it inside his coat, against his chest, and he doesn't sleep.","loc":"Guard barracks","when":"Tamara comes in while Nixon is changing Cole's dressings.","th":"guard","also":["lambrick"],"ch":["tamara","nixon","cole"],"turn":"","w":61,"ed":"","fl":[],"html":"\u003cp>Tamara comes in while Nixon is changing Cole's dressings. She gives Nixon a folder copied from her father's seized Harding papers: &quot;It has your name on it.&quot; Then, a week before her wedding, she kisses him. Cole pretends very hard to be asleep. Nixon doesn't open the folder. He puts it inside his coat, against his chest, and he doesn't sleep.\u003c/p>"}]},{"n":8,"title":"The Wedding","time":"14 DAYS TO FIRST SNOW","clock":"14 DAYS TO FIRST SNOW","act":"II","log":"Nathaniel marries Tamara to keep her out of Bethlem, with Alice watching from the gallery. While the vows run, the Vykra come for the girl in the glasshouse, Nixon refuses an order to fire on a crowd and finds the cellar he was grown in, and the snow comes tonight.","sum":"Morgana makes it snow, two weeks early","turn":"Nathaniel marries Tamara to save her, and while Alice watches, the Vykra take her sister. Nixon finds the Orchard","focus":"one morning, one chapel, and the girl left alone across the lawn.","piece":"the wedding, the taking and the mutiny at the gates.","threads":["harding","guard","sisters","city","lambrick","white"],"frame":"\u003cp>\u003cstrong>14 DAYS TO FIRST SNOW.\u003c/strong> 7 December. \u003cstrong>Focus:\u003c/strong> one morning, one chapel, and the girl left alone across the lawn. \u003cstrong>Set pieces:\u003c/strong> the wedding, the taking and the mutiny at the gates. \u003cstrong>Sting:\u003c/strong> the Lost One lets herself be taken while Alice watches the wedding, and her mother's grief brings the snow two weeks early.\u003c/p>","scenes":[{"oref":"Scene 1","id":150,"seq":1,"title":"The core, sixteen years ago","added":false,"act":"Cold open","kind":"scene","sum":"NATHANIEL, five, follows a lullaby down the forbidden stairs and finds a huge, gentle woman of ice who asks his name, and sings it back to him. Eldgard snatches him up and swings a lantern slowly before his eyes. \"You had a dream. You never heard anything.\" The boy, glassy: \"I had a dream. I never heard anything.\" It's the \"nightmare\" Nathaniel has had all his life, and the reason that, of everyone in his house, he's the one who hears her cry.","loc":"The core","when":"NATHANIEL, five, follows a lullaby down the forbidden stairs and finds a huge, gentle woman of ice who asks his name, and sings it back to him.","th":"harding","also":["white"],"ch":["nathaniel","morgana","eldgard"],"turn":"","w":83,"ed":"Revised Oct 13: four rules, new Ep 8","fl":[],"html":"\u003cp>NATHANIEL, five, follows a lullaby down the forbidden stairs and finds a huge, gentle woman of ice who asks his name, and sings it back to him. Eldgard snatches him up and swings a lantern slowly before his eyes. &quot;You had a dream. You never heard anything.&quot; The boy, glassy: &quot;I had a dream. I never heard anything.&quot; It's the &quot;nightmare&quot; Nathaniel has had all his life, and the reason that, of everyone in his house, he's the one who hears her cry.\u003c/p>"},{"oref":"Scene 2","id":234,"seq":2,"title":"The glasshouse, the night before","added":true,"act":"Act One","kind":"scene","sum":"He marries Tamara in the morning, and nobody has said a word about it all evening. Whimsy: the Lost One, who has never seen a wedding, insists on practising one. She plays the priest, reading with enormous solemnity from a prayer book held upside down, and makes Alice stand in for the bride. They say every word to each other, slowly, and both of them mean every word, and both of them know it. \"Wilt thou have this woman…\" \"I will.\" The Lost One turns the page: \"You may now kiss the—\" Alice: \"That part isn't ours.\" They stand there not stopping, and not moving either. The Lost One looks from one to the other, sincerely: \"You both look sad when you look at each other. Is that what weddings are for?\" Nobody answers. In the morning his mother will have a piece of paper for him.","loc":"The glasshouse","when":"He marries Tamara in the morning, and nobody has said a word about it all evening.","th":"sisters","also":["harding"],"ch":["nathaniel","alice","lostone"],"turn":"","w":147,"ed":"Revised Oct 13: four rules, new Ep 8","fl":[],"html":"\u003cp>He marries Tamara in the morning, and nobody has said a word about it all evening. Whimsy: the Lost One, who has never seen a wedding, insists on practising one. She plays the priest, reading with enormous solemnity from a prayer book held upside down, and makes Alice stand in for the bride. They say every word to each other, slowly, and both of them mean every word, and both of them know it. &quot;Wilt thou have this woman…&quot; &quot;I will.&quot; The Lost One turns the page: &quot;You may now kiss the—&quot; Alice: &quot;That part isn't ours.&quot; They stand there not stopping, and not moving either. The Lost One looks from one to the other, sincerely: &quot;You both look sad when you look at each other. Is that what weddings are for?&quot; Nobody answers. In the morning his mother will have a piece of paper for him.\u003c/p>"},{"oref":"Scene 3","id":151,"seq":3,"title":"Harding House, the groom's dressing room","added":false,"act":"Act One","kind":"scene","sum":"Josephine straightens his tie and gives him Grise's receipt for the contract on her own son, in a clerk's hand: The second Harding son. Agent: Alice Bounds. It's the first time he has ever seen her first name, and it's on a bill. \"She was paid to get close to you. By me. Whatever she's felt, I bought it.\" Nathaniel can't breathe. She wants his eyes on the altar today, and the Gin Lane girl's eyes on him, and nobody's on the glasshouse. Grise already knows the hour. Josephine leaves, and Eldgard takes her place at the door with Jamie's cufflinks in his palm. Nathaniel: \"Did you hold his hand?\" Eldgard: \"I held his hand.\" It's the half-truth he lies in. Nathaniel takes the cufflinks and puts them on, smiling, because he knows what today is for.","loc":"Harding House","when":"Josephine straightens his tie and gives him Grise's receipt for the contract on her own son, in a clerk's hand: The second Harding son.","th":"harding","also":[],"ch":["josephine","nathaniel","eldgard","grise"],"turn":"","w":137,"ed":"Revised Nov 14: the new pilot","fl":[],"html":"\u003cp>Josephine straightens his tie and gives him Grise's receipt for the contract on her own son, in a clerk's hand: \u003cem>The second Harding son. Agent: Alice Bounds.\u003c/em> It's the first time he has ever seen her first name, and it's on a bill. &quot;She was paid to get close to you. By me. Whatever she's felt, I bought it.&quot; Nathaniel can't breathe. She wants his eyes on the altar today, and the Gin Lane girl's eyes on him, and nobody's on the glasshouse. Grise already knows the hour. Josephine leaves, and Eldgard takes her place at the door with Jamie's cufflinks in his palm. Nathaniel: &quot;Did you hold his hand?&quot; Eldgard: &quot;I held his hand.&quot; It's the half-truth he lies in. Nathaniel takes the cufflinks and puts them on, smiling, because he knows what today is for.\u003c/p>"},{"oref":"Scene 4","id":152,"seq":4,"title":"The glasshouse","added":false,"act":"Act One","kind":"scene","sum":"Nathaniel arrives with the receipt in his fist: \"Were you paid?\" Alice: \"At first.\" She starts to say the rest, and he is already gone. He didn't call her Bounds. He didn't call her anything. Alice stands in the doorway with her coat half on, and the Lost One, who heard her say cage in this room a week ago and has thought about nothing else since, makes it easy for her: \"Go. Watch him. If you don't, you'll hate yourself, and then you'll hate me. I'll be here.\" \"Mittens on. Door locked.\" \"Yes, Ali.\" The third lie. Alice goes.","loc":"The glasshouse","when":"Nathaniel arrives with the receipt in his fist: \"Were you paid?\" Alice: \"At first.\" She starts to say the rest, and he is already gone.","th":"sisters","also":["harding"],"ch":["alice","lostone","nathaniel"],"turn":"","w":100,"ed":"Revised Oct 13: four rules, new Ep 8","fl":[],"html":"\u003cp>Nathaniel arrives with the receipt in his fist: &quot;Were you paid?&quot; Alice: &quot;At first.&quot; She starts to say the rest, and he is already gone. He didn't call her Bounds. He didn't call her anything. Alice stands in the doorway with her coat half on, and the Lost One, who heard her say \u003cem>cage\u003c/em> in this room a week ago and has thought about nothing else since, makes it easy for her: &quot;Go. Watch him. If you don't, you'll hate yourself, and then you'll hate me. I'll be here.&quot; &quot;Mittens on. Door locked.&quot; &quot;Yes, Ali.&quot; The third lie. Alice goes.\u003c/p>"},{"oref":"Scene 5","id":153,"seq":5,"title":"Guard tower","added":false,"act":"Act One","kind":"scene","sum":"Dawn on the wedding day. Nixon finally opens the folder he has carried against his chest for a week. His charity-school blood test, the green sliver, Eldgard's hand: Hargrave, N. Cadet line of Harding. Reserve. Blood suitable. He was never a charity case. He was never a son, either. He was a spare, being fattened: everything Eldgard gave him since the funeral was to make him love the house enough to walk down its stair. Vane's orders arrive while it's still open on his knee: arrest Eldgard Harding after the vows, then clear the crowd at the gates \"by any means.\" Nixon folds the file away: \"I'm done being anybody's reserve, Cole.\"","loc":"Guard tower","when":"Dawn on the wedding day.","th":"guard","also":["city"],"ch":["vane","nixon","cole"],"turn":"","w":112,"ed":"Revised Nov 15: the replacement son","fl":[],"html":"\u003cp>Dawn on the wedding day. Nixon finally opens the folder he has carried against his chest for a week. His charity-school blood test, the green sliver, Eldgard's hand: \u003cem>Hargrave, N. Cadet line of Harding. Reserve. Blood suitable.\u003c/em> He was never a charity case. He was never a son, either. He was a spare, being fattened: everything Eldgard gave him since the funeral was to make him love the house enough to walk down its stair. Vane's orders arrive while it's still open on his knee: arrest Eldgard Harding after the vows, then clear the crowd at the gates &quot;by any means.&quot; Nixon folds the file away: &quot;I'm done being anybody's reserve, Cole.&quot;\u003c/p>"},{"oref":"Scene 6","id":171,"seq":6,"title":"The Harding chapel, the vestry","added":true,"act":"Act One","kind":"scene","sum":"Before the guests. Tamara, in white, comes looking for somewhere to be sick and finds Nixon, uninvited, in his captain's coat, standing over a ring box on the vestry table that is waiting for a best man nobody has named. She shuts the door. \"Say one word and I'll walk out of this church with you.\" His file is in his coat; he can feel its corners. \"This morning I found out I'm on Eldgard's books. Like the coal. I can't give you something that belongs to somebody else.\" She picks up the ring box, opens it, closes it, and puts it in his hand. \"Then hand it to me properly.\" She goes out to be married. At the chapel door Josephine is waiting to settle her veil, and peels off one glove to do it. Stitched inside the glove is a Vykra knot. Tamara has carried a needle with that knot's poison on it since the gallery stairs at the hearing. Her mother-in-law's fingers settle the lace. Both women know; neither says a word. Within the hour, this room will hold a strait-coat.","loc":"The Harding chapel","when":"Before the guests.","th":"guard","also":["lambrick"],"ch":["nixon","tamara","josephine"],"turn":"","w":184,"ed":"","fl":[],"html":"\u003cp>Before the guests. Tamara, in white, comes looking for somewhere to be sick and finds Nixon, uninvited, in his captain's coat, standing over a ring box on the vestry table that is waiting for a best man nobody has named. She shuts the door. &quot;Say one word and I'll walk out of this church with you.&quot; His file is in his coat; he can feel its corners. &quot;This morning I found out I'm on Eldgard's books. Like the coal. I can't give you something that belongs to somebody else.&quot; She picks up the ring box, opens it, closes it, and puts it in his hand. &quot;Then hand it to me properly.&quot; She goes out to be married. At the chapel door Josephine is waiting to settle her veil, and peels off one glove to do it. Stitched inside the glove is a Vykra knot. Tamara has carried a needle with that knot's poison on it since the gallery stairs at the hearing. Her mother-in-law's fingers settle the lace. Both women know; neither says a word. Within the hour, this room will hold a strait-coat.\u003c/p>"},{"oref":"Scene 7","id":154,"seq":7,"title":"The Harding chapel","added":false,"act":"Act One","kind":"scene","sum":"Guests, lilies, the Crown. Eldgard sits alone, unaware. Nixon walks in uninvited and stops behind the groom he hasn't spoken to since the roof. Nathaniel, not turning: \"Stand where I can see you.\" Nixon steps up beside him. A whisper: \"You look terrible.\" \"I haven't slept.\" \"Neither have I.\" He waits for the bride he kissed a week ago. Up in the gallery, at the back, where a servant would stand, is Alice in a borrowed hat.","loc":"The Harding chapel","when":"Guests, lilies, the Crown.","th":"harding","also":["guard"],"ch":["eldgard","nixon","nathaniel","tamara","alice"],"turn":"","w":77,"ed":"Revised Nov 14: the new pilot","fl":[],"html":"\u003cp>Guests, lilies, the Crown. Eldgard sits alone, unaware. Nixon walks in uninvited and stops behind the groom he hasn't spoken to since the roof. Nathaniel, not turning: &quot;Stand where I can see you.&quot; Nixon steps up beside him. A whisper: &quot;You look terrible.&quot; &quot;I haven't slept.&quot; &quot;Neither have I.&quot; He waits for the bride he kissed a week ago. Up in the gallery, at the back, where a servant would stand, is Alice in a borrowed hat.\u003c/p>"},{"oref":"Scene 8","id":251,"seq":8,"title":"The gallery","added":true,"act":"Act One","kind":"scene","sum":"Josephine turns in her pew, finds the Gin Lane girl at the gallery rail, and smiles at her, the first time she ever has. Alice doesn't know what it's for. She'll know in an hour.","loc":"The Harding chapel","when":"Josephine turns in her pew, finds the Gin Lane girl at the gallery rail, and smiles at her, the first time she ever has.","th":"vykra","also":["harding"],"ch":["josephine","alice"],"turn":"","w":35,"ed":"Revised Nov 14: the new pilot","fl":[],"html":"\u003cp>Josephine turns in her pew, finds the Gin Lane girl at the gallery rail, and smiles at her, the first time she ever has. Alice doesn't know what it's for. She'll know in an hour.\u003c/p>"},{"oref":"Scene 9","id":156,"seq":9,"title":"The gates","added":false,"act":"Act One","kind":"scene","sum":"An undercity crowd has gathered. Some carry candles for the Frost Witch who stopped the wolves; others are coal-men with clubs who want her burned. Lanterns form a line.","loc":"The gates","when":"An undercity crowd has gathered.","th":"city","also":["guard"],"ch":[],"turn":"","w":29,"ed":"","fl":[],"html":"\u003cp>An undercity crowd has gathered. Some carry candles for the Frost Witch who stopped the wolves; others are coal-men with clubs who want her burned. Lanterns form a line.\u003c/p>"},{"oref":"Scene 10","id":158,"seq":10,"title":"The vestry door","added":false,"act":"Act Two","kind":"scene","sum":"At the groom's shoulder, Nixon sees the vestry door ease open: AJAX, in the room where Tamara asked him an hour ago, with two Bethlem attendants, a strait-coat and a lunacy order for Tamara Lambrick, spinster: her father's signature as nearest relative, two doctors', and the Chancery seal, because lunatics are the Lord Chancellor's wards and Vane is sitting in the front pew. Lambrick doesn't need a Harding son-in-law any more. Since the gasworks he sits on the Crown's board, and the Works are half his. What he needs is a daughter who can't read his books aloud, and he has waited for the one room where the Lord Chancellor can seal her mad in front of everyone. Nixon whistles their old signal, danger. Nathaniel looks, sees Ajax, and understands they have the length of one question. In the front pew Eldgard sees it too and half rises; a marshal's hand settles on his shoulder, and he sits.","loc":"The Harding chapel","when":"At the groom's shoulder, Nixon sees the vestry door ease open: AJAX, in the room where Tamara asked him an hour ago, with two Bethlem attendants, a strait-coat and a lunacy order for Tamara Lambrick, spinster: her father's signature as nearest relative, two doctors', and the Chancery seal, because lunatics are the Lord Chancellor's wards and Vane is sitting in the front pew.","th":"lambrick","also":["guard"],"ch":["nixon","ajax","nathaniel","tamara","lambrick","eldgard","vane"],"turn":"","w":158,"ed":"Revised Oct 13: four rules, new Ep 8","fl":[],"html":"\u003cp>At the groom's shoulder, Nixon sees the vestry door ease open: AJAX, in the room where Tamara asked him an hour ago, with two Bethlem attendants, a strait-coat and a lunacy order for \u003cem>Tamara Lambrick, spinster\u003c/em>: her father's signature as nearest relative, two doctors', and the Chancery seal, because lunatics are the Lord Chancellor's wards and Vane is sitting in the front pew. Lambrick doesn't need a Harding son-in-law any more. Since the gasworks he sits on the Crown's board, and the Works are half his. What he needs is a daughter who can't read his books aloud, and he has waited for the one room where the Lord Chancellor can seal her mad in front of everyone. Nixon whistles their old signal, \u003cem>danger\u003c/em>. Nathaniel looks, sees Ajax, and understands they have the length of one question. In the front pew Eldgard sees it too and half rises; a marshal's hand settles on his shoulder, and he sits.\u003c/p>"},{"oref":"Scene 11","id":161,"seq":11,"title":"The glasshouse","added":true,"act":"Act Two","kind":"scene","sum":"Across the lawn, nobody is watching. The Lost One sits under the orange trees with her mittens off, humming the Lantern Hymn to them in a key no church uses, and waits. When Grise's girls come through the glass, Jennie and Jennifer, one at each pane, with Josephine's directions, she doesn't fight. She stands, holds out her wrists, and breathes once on the pane by the door. Frost writes itself across it. She couldn't have walked to the core: it's Crown iron now, and the cage that can put her in her mother's place is in Crown hands, so the only way in is as somebody's prisoner. And if she'd gone with Alice in the room, Alice would have followed. She goes to the cage deliberately. Miriam chose to help Jamie at Blackwood, but never chose the leap that killed her. This is a different choice: the Lost One is offering the life Miriam fought to keep, and does not tell Alice goodbye.","loc":"The glasshouse.","when":"Across the lawn, nobody is watching.","th":"white","also":["vykra"],"ch":["lostone","grise","josephine","twins"],"turn":"Across the lawn, nobody is watching. The Lost One sits under the orange trees with her mittens off, humming the Lantern Hymn to them in a key no church uses, and waits. When Grise's girls come through the glass, Jennie a","w":163,"ed":"Revised Nov 17: Blackwood / Xylon continuity","fl":[],"html":"\u003cp>Across the lawn, nobody is watching. The Lost One sits under the orange trees with her mittens off, humming the Lantern Hymn to them in a key no church uses, and waits. When Grise's girls come through the glass, Jennie and Jennifer, one at each pane, with Josephine's directions, she doesn't fight. She stands, holds out her wrists, and breathes once on the pane by the door. Frost writes itself across it. She couldn't have walked to the core: it's Crown iron now, and the cage that can put her in her mother's place is in Crown hands, so the only way in is as somebody's prisoner. And if she'd gone with Alice in the room, Alice would have followed. She goes to the cage deliberately. Miriam chose to help Jamie at Blackwood, but never chose the leap that killed her. This is a different choice: the Lost One is offering the life Miriam fought to keep, and does not tell Alice goodbye.\u003c/p>"},{"oref":"Scene 12","id":160,"seq":12,"title":"The chapel, the vows","added":false,"act":"Act Two","kind":"scene","sum":"\"If any man knows cause…\" Lambrick stands. Gently, to the room: \"My daughter is unwell.\" The attendants come up the aisle with the strait-coat, and the priest stops with his mouth open, looking to Vane. Nixon's hand is on his rifle and his company is at the gates; he could carry her out of this chapel in a minute. Nathaniel sees him think it and shakes his head once: carry her out and she's a runaway lunatic with a Chancery seal on her for the rest of her life. The order names a spinster. Make her a wife and it names nobody, and her nearest relative is her husband. It was always the plan. It just has to happen in the next thirty seconds. Nathaniel looks up and finds Alice at the gallery rail. She nods once, small, like a permission. She is letting him go. \"Go on,\" he tells the priest, and doesn't wait for him: \"I will.\" He says it the way he said it last night among the orange trees, and at the rail Alice's lips move with his. Tamara: \"I will.\" Nixon steps into the aisle, square in the attendants' path, and is very slow and very polite about getting out of it. Then he hands over the ring, properly. \"Congratulations, miss.\" \"Thank you, Captain.\" The ring goes on. Vane looks at the order, then at the bride, then at two hundred witnesses. Voiding a marriage in front of them means a Chancery hearing, and a Chancery hearing goes on the record. \"This is addressed to a spinster. I see a wife.\" The attendants fold the strait-coat. When Nathaniel looks up again, the gallery rail is empty.","loc":"The Harding chapel","when":"\"If any man knows cause…\" Lambrick stands.","th":"harding","also":["lambrick","sisters","guard"],"ch":["nathaniel","tamara","nixon","alice","lambrick","vane"],"turn":"","w":281,"ed":"Revised Oct 13: four rules, new Ep 8","fl":[],"html":"\u003cp>&quot;If any man knows cause…&quot; Lambrick stands. Gently, to the room: &quot;My daughter is unwell.&quot; The attendants come up the aisle with the strait-coat, and the priest stops with his mouth open, looking to Vane. Nixon's hand is on his rifle and his company is at the gates; he could carry her out of this chapel in a minute. Nathaniel sees him think it and shakes his head once: carry her out and she's a runaway lunatic with a Chancery seal on her for the rest of her life. The order names a spinster. Make her a wife and it names nobody, and her nearest relative is her husband. It was always the plan. It just has to happen in the next thirty seconds. Nathaniel looks up and finds Alice at the gallery rail. She nods once, small, like a permission. She is letting him go. &quot;Go on,&quot; he tells the priest, and doesn't wait for him: &quot;I will.&quot; He says it the way he said it last night among the orange trees, and at the rail Alice's lips move with his. Tamara: &quot;I will.&quot; Nixon steps into the aisle, square in the attendants' path, and is very slow and very polite about getting out of it. Then he hands over the ring, properly. &quot;Congratulations, miss.&quot; &quot;Thank you, Captain.&quot; The ring goes on. Vane looks at the order, then at the bride, then at two hundred witnesses. Voiding a marriage in front of them means a Chancery hearing, and a Chancery hearing goes on the record. &quot;This is addressed to a spinster. I see a wife.&quot; The attendants fold the strait-coat. When Nathaniel looks up again, the gallery rail is empty.\u003c/p>"},{"oref":"Scene 13","id":159,"seq":13,"title":"The glasshouse, after","added":true,"act":"Act Two","kind":"scene","sum":"Alice runs, out through the gates where the riot is starting and across the lawn, ten minutes too late. The door hangs open. The orange trees are dusted white. On the pane, in frost: DON'T FOLLOW ME. Miriam's letter said I'm coming for you; this one says the opposite, and Alice reads both at once. Her knees go. She was watching a wedding.","loc":"The g
